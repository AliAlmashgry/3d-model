function DiscoverScreen({ urlParams, onSearch }) {
  const defaults = useMemo(() => ({
    cat: null,
    brand: null,
    q: null,
    term: null,
    collection: null,
    kind: null,
    type: "all",
    origins: [],
    expressOnly: false,
    position: null,
  }), []);

  // Restore filter + sort state from FILTER_CACHE on back nav (PDP → back
   // returns to Discover with the user's facets still applied). On forward
   // navs (_isForwardNav true) start clean from URL + defaults.
  const cachedDiscover = !_isForwardNav ? FILTER_CACHE.get(currentHashKey()) : null;

  const [filters, setFilters] = useState(() => ({
    ...defaults,
    ...(cachedDiscover?.filters || {}),
    // URL params win for page-context fields — they reflect the current page
    cat: urlParams.get("cat") || null,
    brand: urlParams.get("brand") || null,
    q: urlParams.get("q") || null,
    term: urlParams.get("term") || null,
    collection: urlParams.get("collection") || null,
  }));

  // If the URL params change (back nav, deep-link, search commit), re-seed
  // the URL-derived filters. Two paths:
  //   - Search commit (_searchCommitReset === true): full reset — drop all
  //     user-applied facets (type, origins, expressOnly, position). Search
  //     is fresh intent: cat changes AND preferences clear, so the user
  //     starts from defaults in the new scope.
  //   - Any other nav (cat-chip, term-chip, back nav, deep-link): smart
  //     prune — keep user-applied facets that are still valid in the new
  //     scope, drop the ones that resolve to zero.
  // The flag is consumed unconditionally so a subsequent non-search nav
  // can't accidentally inherit reset semantics.
  // Tracks the cat across urlParams changes so the effect below can tell
  // a cat-change from a within-cat nav (term-chip, filter, back) — used to
  // clear searchedAs when the user moves to a different cat (the search
  // context no longer applies).
  const prevCatRef = useRef(urlParams.get("cat") || null);
  useEffect(() => {
    const nextCollection = urlParams.get("collection") || null;
    const newCat = urlParams.get("cat") || null;
    const urlSeed = {
      cat: newCat,
      brand: urlParams.get("brand") || null,
      q: urlParams.get("q") || null,
      term: urlParams.get("term") || null,
      collection: nextCollection,
    };
    const wasSearchCommit = _searchCommitReset;
    _searchCommitReset = false;
    if (wasSearchCommit) {
      setFilters({ ...defaults, ...urlSeed });
      setSort("popular");
      // Capture the term the user typed/tapped so we can label the
      // results — works the same whether routing resolved recognized
      // (cat URL, filters.q dropped) or free-text (/search?q=).
      setSearchedAs(_lastSearchQuery);
      _lastSearchQuery = null;
    } else {
      setFilters((f) => pruneInvalidFacets({
        ...f,
        ...urlSeed,
        kind: f.collection === nextCollection ? f.kind : null,
      }));
      // Non-search nav: cat-change → clear searchedAs (user moved beyond
      // the search context). Term/filter/back navs preserve it because
      // they're refinements within the same search-scoped page.
      if (newCat !== prevCatRef.current) {
        setSearchedAs(null);
      }
    }
    prevCatRef.current = newCat;
  }, [urlParams.toString()]);

  // Same-URL navigateReplace safety net. Without this, when a recognized
  // search re-targets the cat the user is already on, the urlParams effect
  // above doesn't fire (its dep urlParams.toString() is unchanged), so the
  // search-commit flags pile up and never reach state — no filter reset,
  // no searchedAs, no indicator, no hero CTA in the empty state. This
  // listener runs on every navigateReplace and consumes the flags if
  // they're still set. Idempotent: the urlParams effect above clears the
  // flag in the URL-actually-changed case before this listener runs (the
  // pulse is deferred to next tick), so we never double-consume.
  useEffect(() => {
    const onPulse = () => {
      if (!_searchCommitReset) return;
      _searchCommitReset = false;
      const nextCollection = urlParams.get("collection") || null;
      const newCat = urlParams.get("cat") || null;
      setFilters({
        ...defaults,
        cat: newCat,
        brand: urlParams.get("brand") || null,
        q: urlParams.get("q") || null,
        term: urlParams.get("term") || null,
        collection: nextCollection,
      });
      setSort("popular");
      setSearchedAs(_lastSearchQuery);
      _lastSearchQuery = null;
      prevCatRef.current = newCat;
    };
    window.addEventListener("speero:nav-pulse", onPulse);
    return () => window.removeEventListener("speero:nav-pulse", onPulse);
  }, [urlParams, defaults]);

  const [sort, setSort] = useState(() => cachedDiscover?.sort || "popular");

  // The literal term the user searched (typed or chip-tapped), independent
  // of routing. On free-text /search?q= it's redundant with filters.q. On
  // recognized cat routes (/spare-parts/{cat}) it's the only carrier of the
  // user's typed intent — see _lastSearchQuery module note. Persists across
  // back-from-PDP via FILTER_CACHE; cleared on cat-change (user moved
  // beyond the search context — see urlParams effect above) and on
  // search-bar X tap.
  const [searchedAs, setSearchedAs] = useState(() => cachedDiscover?.searchedAs || null);

  // Save filters + sort + searchedAs to FILTER_CACHE on every change so a
  // subsequent PDP-or-other navigate-away → back returns with everything
  // intact. Keyed by full hash (path + query) so different cats /
  // collections / search routes don't collide on the same cache entry.
  useEffect(() => {
    FILTER_CACHE.set(currentHashKey(), { filters, sort, searchedAs });
  }, [filters, sort, searchedAs]);
  const [viewMode, setViewMode] = useState("grid");
  const [filterOpen, setFilterOpen] = useState(false);
  const [positionOpen, setPositionOpen] = useState(false);
  // FAQ accordion — single-open: index of the currently open item (or null).
  const [openFaq, setOpenFaq] = useState(null);

  /* Term-chip ordering: when a search committed, reorder the cat's term
     chips so the chip whose products best match the query sits closest to
     الكل. Without a search, terms keep their default array order (stable
     browse hierarchy). Reorder model: for each chip, count products in the
     cat scope that match BOTH the chip predicate AND the typed query;
     sort descending; tiebreak with the original order. Production this
     mirrors Typesense's facet-counts-weighted-by-query. */
  const sortedActiveCat = useMemo(() => {
    if (!filters.cat) return null;
    const cat = findCategory(filters.cat);
    if (!cat || !cat.terms || cat.terms.length === 0) return cat;
    if (!searchedAs) return cat;
    const qNorm = normalizeArabic(searchedAs);
    if (!qNorm) return cat;
    const scope = CATALOG.filter((p) =>
      p.cat === "part" &&
      cat.kinds.includes(p.kind) &&
      normalizeArabic(p.title).includes(qNorm)
    );
    const ranked = cat.terms.map((t, i) => ({
      term: t,
      count: scope.filter((p) => t.match(p)).length,
      orig: i,
    }));
    ranked.sort((a, b) => (b.count - a.count) || (a.orig - b.orig));
    return { ...cat, terms: ranked.map((r) => r.term) };
  }, [filters.cat, searchedAs]);

  const results = useMemo(() => {
    const base = CATALOG.filter((p) => p.cat === "part" && matchesFilters(p, filters));
    // When the user committed a search (searchedAs set) and hasn't manually
    // changed sort away from the default, swap to "relevance" so titles that
    // contain the typed query bubble up. Manual price-asc / price-desc is
    // respected. searchedAs unset → default popular sort.
    const effectiveSort = searchedAs && sort === "popular" ? "relevance" : sort;
    return sortResults(base, effectiveSort, searchedAs);
  }, [filters, sort, searchedAs]);

  /* Available positions in the current refinement (cat + term + brand + q +
     non-position facets). We deliberately ignore filters.position itself so
     re-opening the picker after a selection still shows the full set the user
     can switch between. The picker hides codes with zero — keeps the surface
     honest about what's actually shoppable here. */
  const availablePositions = useMemo(() => {
    const without = { ...filters, position: null };
    const counts = {};
    for (const p of CATALOG) {
      if (p.cat !== "part") continue;
      if (!p.pos) continue;
      if (!matchesFilters(p, without)) continue;
      counts[p.pos] = (counts[p.pos] || 0) + 1;
    }
    return counts;
  }, [filters]);
  /* Show the position button whenever any positioned product is in scope —
     consistency-over-noise. Single-position scopes (one bumper available,
     or a query already pinned position) still get the drawer; it acts as a
     passive read-out of "this is the position you're looking at" with one
     extra tap to confirm. Only the truly position-less cats (oils, plugs,
     batteries — availablePositions is empty) drop the button entirely.
     The user-selected fallback covers an edge case: when filters narrow
     availablePositions to 0 but `filters.position` is non-null, the user
     still needs the drawer to clear/change their pick. */
  const showPositionButton =
    Object.keys(availablePositions).length >= 1 || filters.position != null;

  // Pagination
  const [page, setPage] = useState(1);
  const totalPages = Math.max(1, Math.ceil(results.length / DSC_PAGE_SIZE));
  const pagedResults = useMemo(
    () => results.slice((page - 1) * DSC_PAGE_SIZE, page * DSC_PAGE_SIZE),
    [results, page]
  );
  // Reset to page 1 whenever filters/sort change so the user doesn't land on
  // page 7 of a tiny result set.
  useEffect(() => { setPage(1); }, [filters, sort]);
  // Instant jump to top on page change — paired with the skeleton flash, this
  // reads as "the new page just loaded" rather than a smooth slide that feels
  // like the same page reorganizing itself.
  const onPageChange = (next) => {
    setPage(next);
    window.scrollTo(0, 0);
  };

  // Brief "loading" state on any filter/sort/page change so the UI feels like
  // it's hitting a server. Production this is real Typesense latency; here it's
  // a 320ms wait so users don't see a jarring instant-swap.
  // Skeleton policy — show it when the result set is genuinely (re)fetched:
  //   • a fresh FORWARD entry into Discover (freshEntry),
  //   • a forward nav to a new cat/search (urlParams change while forward),
  //   • a user facet/sort/page change.
  // NEVER on a back-nav restore — that must bring the grid + cards back
  // instantly. The wrinkle: navigation re-seeds `filters` via the urlParams
  // effect (setFilters → new object identity), so a plain [filters] watcher
  // can't tell a back-restore from a real change. We capture the nav
  // direction at each urlParams change (child effects run BEFORE App resets
  // _isForwardNav) and suppress the skeleton for backward navigations.
  const [freshEntry] = useState(() => _isForwardNav);
  const [loading, setLoading] = useState(freshEntry);
  // navPendingRef: this render cycle's filters/page change came from a
  // navigation (vs a user facet tap). navForwardRef: was that nav forward?
  const navPendingRef = useRef(false);
  const navForwardRef = useRef(false);
  useEffect(() => {
    navForwardRef.current = _isForwardNav;
    navPendingRef.current = true;
    // Clear after the synchronous filters+page cascade settles, so a real
    // user action on a later tick is never mistaken for a navigation.
    const id = setTimeout(() => { navPendingRef.current = false; }, 0);
    return () => clearTimeout(id);
  }, [urlParams.toString()]);
  // Clear the fresh-entry skeleton after 320ms (no-op on a back-nav mount,
  // where loading starts false).
  useEffect(() => {
    if (!loading) return;
    const t = setTimeout(() => setLoading(false), 320);
    return () => clearTimeout(t);
  }, []);
  // Re-fetch skeleton on filter/sort/page changes — but skip the initial
  // mount (handled above) and any backward-nav-induced change.
  const didInteractRef = useRef(false);
  useEffect(() => {
    if (!didInteractRef.current) { didInteractRef.current = true; return; }
    if (navPendingRef.current && !navForwardRef.current) return; // back-nav restore
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 320);
    return () => clearTimeout(t);
  }, [filters, sort, page]);

  // Fire search_no_results when a search-context render has zero results
  // (so prod analytics can find the long-tail queries we should be wiring
  // into Typesense aliases or the term→category map). Search-context is
  // `searchedAs || filters.q` so recognized-cat routes count too.
  useEffect(() => {
    const q = searchedAs || filters.q;
    if (!loading && q && results.length === 0) {
      analytics.track("search_no_results", { q });
    }
  }, [loading, searchedAs, filters.q, results.length]);

  // Scroll on Discover mount is owned by the App-level SCROLL_CACHE restore:
  // fresh entry → top; backward nav from PDP/blog → previous position.

  // Sticky anchor — car bar + search + category rail collapse/pin once the
  // user scrolls past the cluster, same pattern as AnchoredHome. The sentinel
  // sits above the cluster; when it scrolls out of view, we set `stuck`.
  // Initialize from SCROLL_CACHE so back-nav to a mid-scrolled Discover paints
  // the cluster in its stuck state on the first frame (no bounce).
  const [stuck, setStuck] = useState(() => !_isForwardNav && (SCROLL_CACHE.get(currentHashPath()) || 0) > 0);
  const sentinelRef = useRef(null);
  const stuckLockedUntilRef = useRef(0);
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => {
      // Same protection as AnchoredHome — skip stuck updates while body
      // is locked (modal route active) so Chromium's IO doesn't spuriously
      // flip the state during the layout shift.
      if (document.body.dataset.scrollY != null) return;
      // Skip during rubber-band overscroll (iOS Safari).
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (y < 0 || y > max) return;
      // Hysteresis: after any stuck change, lock the state for 400ms.
      // Heavy iOS overscroll can still flip the sentinel intersection a
      // few times despite the boundary guard above; the lock absorbs
      // those subsequent flips so the user sees one transition, not a
      // flicker. Long enough that real direction changes aren't blocked
      // (a deliberate scroll up from the bottom takes >400ms).
      const now = performance.now();
      if (now < stuckLockedUntilRef.current) return;
      const next = !e.isIntersecting;
      setStuck((prev) => {
        if (prev === next) return prev;
        stuckLockedUntilRef.current = now + 400;
        return next;
      });
    }, {
      threshold: 0,
      // Shrink the IO's "viewport" by 50px from the top so the sentinel
      // counts as "out of view" the moment it reaches viewport-y:50 — the
      // same point where .dsc-anchor's sticky pin engages (top: 50px,
      // pushed below the global header). Without this rootMargin, the
      // stuck class would lag the visual pin by 50px of scroll.
      rootMargin: "-50px 0px 0px 0px",
    });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  // Track scroll direction so the cluster can hide breadcrumb + chips when
  // pinned and the user is scrolling DOWN (give them screen real-estate for
  // results), and expand them back when they scroll UP (so the breadcrumb
  // and category-section chips are reachable without scrolling all the way
  // back to the top of the page). rAF-throttled; 8px hysteresis to avoid
  // jitter from tiny scroll wobble. Starts as "up" so the first paint is
  // expanded — important for back-nav to a mid-scrolled page where stuck=true
  // is the initial state.
  const [scrollDir, setScrollDir] = useState("up");
  useEffect(() => {
    let lastY = window.scrollY;
    let frame = null;
    // Two-frame confirmation: a candidate direction only commits if two
    // consecutive rAF samples agree. Single-frame anomalies (rubber-band
    // stretch-then-snap, sticky un-stick-then-re-stick during overscroll,
    // momentum jitter near boundaries) get filtered out. Real user
    // direction changes survive — a deliberate scroll spans many frames.
    let pendingDir = null;
    let pendingCount = 0;
    const update = () => {
      frame = null;
      const y = window.scrollY;
      const dy = y - lastY;
      if (Math.abs(dy) >= 8) {
        // Boundary guard — skip when outside legitimate scrollable range
        // (rubber-band can push scrollY past max on iOS Safari).
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (y > 10 && y < max - 10) {
          const candidate = dy > 0 ? "down" : "up";
          // Short-page guard — only ever gates ENTERING the collapse.
          // Collapsing reclaims the cluster's foldable height (~carbar +
          // crumb + chips + controls); on a page that barely scrolls that
          // shrink clamps scrollY and can strand the sticky state (the
          // un-stick may land inside the stuck hysteresis lock, leaving the
          // cluster collapsed with no scroll room to reverse it). So only
          // collapse when there's still comfortable headroom AFTER the fold.
          // "up" is never gated, so any page can always un-collapse.
          let allow = true;
          if (candidate === "down") {
            const foldable = Array.prototype.reduce.call(
              document.querySelectorAll(".dsc-anchor .dsc-cluster-collapse"),
              (s, el) => s + el.getBoundingClientRect().height, 0
            );
            allow = max - foldable > 120;
          }
          if (allow) {
            if (candidate === pendingDir) {
              if (++pendingCount >= 2) setScrollDir(candidate);
            } else {
              pendingDir = candidate;
              pendingCount = 1;
            }
          }
        }
        lastY = y;
      }
    };
    const onScroll = () => {
      if (frame == null) frame = requestAnimationFrame(update);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (frame != null) cancelAnimationFrame(frame);
    };
  }, []);

  // Track the sticky cluster's height as a CSS custom property on :root so
  // body-rendered controls (collection mode) can stick BELOW it via
  // `top: var(--dsc-cluster-h)`. ResizeObserver fires on every layout change
  // including during the cluster's collapse transition, so controls track
  // smoothly as the cluster shrinks/grows. Cleared on unmount so the var
  // doesn't leak to other screens.
  const clusterRef = useRef(null);
  useEffect(() => {
    const el = clusterRef.current;
    if (!el || !("ResizeObserver" in window)) return;
    const setH = () => {
      document.documentElement.style.setProperty("--dsc-cluster-h", el.offsetHeight + "px");
    };
    setH();
    const ro = new ResizeObserver(setH);
    ro.observe(el);
    return () => {
      ro.disconnect();
      document.documentElement.style.removeProperty("--dsc-cluster-h");
    };
  }, []);

  // Track the car-bar's actual rendered height so the side drawer can land
  // its top edge flush with the car-bar's bottom (no hardcoded pixel value —
  // photo aspect ratio + padding can shift the bar's height across cars).
  // Exposed as --dsc-carbar-h on :root, consumed by .side-sheet's top calc.
  const carbarRef = useRef(null);
  useEffect(() => {
    const el = carbarRef.current;
    if (!el || !("ResizeObserver" in window)) return;
    const setH = () => {
      document.documentElement.style.setProperty("--dsc-carbar-h", el.offsetHeight + "px");
    };
    setH();
    const ro = new ResizeObserver(setH);
    ro.observe(el);
    return () => {
      ro.disconnect();
      document.documentElement.style.removeProperty("--dsc-carbar-h");
    };
  }, []);

  // The number of filter facets actively narrowing the result (excluding the
  // URL-pre-applied cat/brand/q — those show in the chips row but don't count
  // as "filter sheet" facets here).
  // Position is EXCLUDED from this count — it has its own dedicated pill
  // in the controls row, not a section inside the Filter sheet. Counting it
  // here would put "(1)" on فلتر while the sheet itself has nothing to show
  // for that 1, which is confusing.
  // Sort IS counted (when not "popular" default) since it lives inside the
  // sheet under الترتيب — picking "السعر من الأقل" should reflect on the
  // pill so the user gets feedback that the sheet did something.
  const activeFacetCount = (
    (filters.type !== "all" ? 1 : 0) +
    filters.origins.length +
    (filters.expressOnly ? 1 : 0) +
    (sort !== "popular" ? 1 : 0)
  );

  // Empty-state on Discover: no category, no query, no filters. The user
  // landed here to browse — show the category tiles as the primary affordance
  // instead of an all-products feed under a narrow 7-chip strip. The moment
  // any refinement exists (a category, a search, a filter, a collection),
  // we switch to the product flow.
  const showCategoryTiles = (
    !filters.cat && !filters.collection && !filters.q && !filters.brand && !filters.term && activeFacetCount === 0
  );
  const activeCollection = filters.collection ? findCollection(filters.collection) : null;

  // Tap the search input on Discover → re-open the suggestions overlay with
  // the current query pre-filled for editing. Routes through the App-owned
  // openSearch so the iOS keyboard opens inside the tap gesture (a
  // route-driven mount after the gesture ends would leave the keyboard
  // down). openSearch also uses `?prefill=` (not `?q=`) so the overlay
  // shows instead of re-rendering Discover. Prefers searchedAs over
  // filters.q so the recognized-route case still seeds the overlay with
  // the user's original term (filters.q is null there).
  const onSearchTap = () => onSearch(searchedAs || filters.q || "");

  // Filter / sort changes scroll the list back to the top — the user's
  // scrollY before the change has no meaning relative to the new result set
  // (different items, or the same items reordered). Top is the natural
  // landing spot, and matches the paginator's behaviour on page change.
  // Applies to: TermsRail / CollectionKindRail chip taps, active-filter chip
  // dismissal, FilterSheet apply (which now also commits the sort selection).
  const setFiltersAndScrollTop = (next) => {
    setFilters(next);
    window.scrollTo(0, 0);
  };

  return (
    <div className="dsc">
      {/* Sentinel above the sticky anchor — when this scrolls out of view,
          IntersectionObserver flips `stuck` and the cluster compacts. */}
      <div ref={sentinelRef} aria-hidden="true" style={{ height: 1 }} />

      <div ref={clusterRef} className={"stick-anchor dsc-anchor" + (stuck ? " stuck" : "") + (scrollDir === "down" ? " scrolled-down" : "")}>
        {/* Car bar — folds away on scroll-down (only the search pill survives
            a pinned scroll). Wrapped in the same grid-collapse used below the
            search so both groups fold on one coordinated signal. carbarRef
            still measures the .car-bar's natural height (the wrapper clips it,
            the element keeps its offsetHeight) so --dsc-carbar-h stays stable
            for the side drawer. */}
        <div className="dsc-cluster-collapse">
         <div className="dsc-cluster-inner">
          <div ref={carbarRef} className="car-bar dsc-carbar">
            <img className="car-bar-photo" src={CURRENT_CAR.image} alt={CURRENT_CAR.name} />
            <div className="car-bar-body">
                <div className="car-bar-name">{CURRENT_CAR.name}</div>
            </div>
          </div>
         </div>
        </div>

        {/* Search input — tap-to-suggestions, not an inline editor. The
            displayed text prefers searchedAs over filters.q so the
            recognized-route case (filters.q dropped during reset) still
            shows the user's typed term. */}
        <button className="dsc-search" onClick={onSearchTap}>
          <IconSearch />
          <span className={"dsc-search-text" + ((searchedAs || filters.q) ? "" : " is-placeholder")}>
            {searchedAs || filters.q || "ابحث باسم القطعة أو رقمها"}
            {/* Typing-dots cue when pinned — same crisp step-cycle as the home
                hero search (§MOTION 3.7). Only in the placeholder state: with a
                live query the term already fills the bar, and dots after it
                would read as a loading spinner rather than a "type here" cue. */}
            {!(searchedAs || filters.q) && (
              <span className="bs-dots" aria-hidden="true"><span></span><span></span><span></span></span>
            )}
          </span>
          {/* No X — the bar is a tap-target that opens the overlay, not an
              editable field. "Clear" intent is covered by: tap-bar → إلغاء
              from the overlay (explicit "I'm done"), nav-away (cat-chip
              tap clears searchedAs per the lifecycle), or commit a new
              search (replaces). Removing the X matches mobile Amazon /
              Noon and reads as more shipped, less prototype. */}
        </button>

        {/* Everything below the search folds together on scroll-down: the
            breadcrumb, the results heading, the chip rail, and the sort/filter
            controls. One grid-collapse wrapper = one coordinated fold, so the
            eye reads it as "the search stayed, the rest tucked away". Scroll up
            brings it all back. */}
        <div className="dsc-cluster-collapse">
         <div className="dsc-cluster-inner">

        {/* Breadcrumb — top-level wayfinding, ABOVE the results heading (matches
            the PDP + cold landers, where the crumb leads the title). For a
            category it terminates at the category; for a free-text search it
            terminates at "نتائج البحث" (there is no category to land on). */}
        <nav className="dsc-crumb" aria-label="breadcrumb">
          <a className="dsc-crumb-link" onClick={() => navigate("/car")}>الرئيسية</a>
          <span className="dsc-crumb-sep">/</span>
          {(activeCollection || filters.cat) ? (
            <>
              <a className="dsc-crumb-link" onClick={() => navigate("/spare-parts/all")}>أقسام القطع</a>
              <span className="dsc-crumb-sep">/</span>
              <span className="dsc-crumb-current">
                {activeCollection
                  ? activeCollection.label
                  : (findCategory(filters.cat)?.label || "كل الأقسام")}
              </span>
            </>
          ) : (searchedAs || filters.q) ? (
            <span className="dsc-crumb-current">نتائج البحث</span>
          ) : (
            <span className="dsc-crumb-current">كل الأقسام</span>
          )}
        </nav>

        {/* "Results for {q}" heading — the page's H1. Folds with the rest of
            the cluster on scroll-down (search is the only survivor). Renders
            whenever the user searched, independent of whether routing resolved
            to a canonical cat URL or to /search?q=. */}
        {(searchedAs || filters.q) && (
          <div className="dsc-results-for">
            نتائج البحث عن "<b>{searchedAs || filters.q}</b>"
          </div>
        )}

          {/* Chip rail — folds with the rest of the cluster on scroll-down. */}
          {/* Rail logic: when the user is browsing a category, swap the main-
              category rail for the section-nav of that category's terms. When
              no category is active, show the main-category rail. The terms rail
              auto-hides when the category has too few items (< 6) so the rail
              doesn't feel sparse. Switching between main categories is implicit
              here — back-button / home is the path, not in-rail navigation. */}
          {(() => {
            // Collection mode: no rail in the sticky anchor. The kind-chip
            // rail belongs to the page body (under the banner), not the
            // persistent page chrome.
            if (activeCollection) return null;
            if (!sortedActiveCat) {
              // In the pure empty state the tiles below ARE the category picker —
              // the rail would just be a smaller, redundant version of the same.
              if (showCategoryTiles) return null;
              return (
                <CategoryRail
                  active={null}
                  onSelect={(catId) => navigate(catId ? "/spare-parts/" + catId : "/spare-parts/all")}
                />
              );
            }
            const categoryItemCount = CATALOG.filter(
              (p) => p.cat === "part" && sortedActiveCat.kinds.includes(p.kind)
            ).length;
            const hasMeaningfulTerms = sortedActiveCat.terms && sortedActiveCat.terms.length > 0 && categoryItemCount >= 6;
            if (!hasMeaningfulTerms) return null;
            return (
              <TermsRail
                category={sortedActiveCat}
                activeTerm={filters.term}
                onSelect={(termId) => setFiltersAndScrollTop(
                  pruneInvalidFacets({ ...filters, term: termId })
                )}
              />
            );
          })()}

        {/* Sort / Filter / View — folds with the cluster on scroll-down; a
            scroll up brings the controls back. Standard e-commerce mobile
            pattern keeps them one small gesture away.
            EXCLUDED on collection pages: their banner + kind-rail sit
            between the cluster and the products, so having controls in the
            sticky cluster puts them ABOVE the banner — wrong reading order.
            Collection mode renders these in the body (below the banner +
            kind rail, right above the products) — see below. */}
        {!showCategoryTiles && !activeCollection && (
          <>
            <div className="dsc-controls">
              {/* Order = user-priority order (RTL leading = first source child):
                  Position (top concern) → Filter (OEM/aft) → Sort (price). */}
              {showPositionButton && (
                <button
                  className={"dsc-control dsc-pos-control" + (filters.position ? " is-active" : "")}
                  onClick={() => setPositionOpen(true)}
                  aria-label={filters.position ? "الجهة: " + POSITION_LABELS[filters.position] : "تصفية حسب الجهة على السيارة"}
                >
                  <span className="dsc-pos-glyph"><PositionGlyph pos={filters.position} /></span>
                  {!filters.position && <span>الجهة</span>}
                </button>
              )}
              <button className={"dsc-control" + (activeFacetCount > 0 ? " is-active" : "")} onClick={() => setFilterOpen(true)}>
                <IconFunnel /> <span>الفلتر{activeFacetCount > 0 ? " (" + activeFacetCount + ")" : ""}</span>
              </button>
              <div className="dsc-view-spacer" />
              <div className="view-toggle">
                <button data-active={viewMode === "grid" || undefined} onClick={() => setViewMode("grid")} aria-label="عرض كشبكة"><IconGrid /></button>
                <button data-active={viewMode === "row" || undefined} onClick={() => setViewMode("row")} aria-label="عرض كقائمة"><IconRows /></button>
              </div>
            </div>
            <AppliedFiltersText
              filters={filters}
              sort={sort}
              onClear={() => {
                setFiltersAndScrollTop({
                  ...filters, type: "all", origins: [], expressOnly: false,
                });
                setSort("popular");
              }}
              onOpenSheet={() => setFilterOpen(true)}
            />
          </>
        )}

         </div>
        </div>
      </div>

      {showCategoryTiles ? (
        <>
          {/* SEO intro — page H1 + 1-line tagline. Adapts to car-state:
              the "thousands" claim is correct at catalog scale (cold SEO
              landers) but wrong for a warm user whose scoped catalog
              targets ~400 parts/model. Cold state stays SEO-shaped for
              Google; warm state pivots to fit/completeness language and
              names the user's car. In real prod this is SSR'd in the cold
              shape (what Google indexes), then client-hydrates to warm. */}
          <header className="dsc-seo-intro">
            {CURRENT_CAR ? (
              <>
                <h1 className="dsc-seo-h1">قطع غيار سيارتك</h1>
                <p className="dsc-seo-lede">
                  كل ما تحتاجه لسيارتك: أصلية وبديلة، مع شحن سريع وضمان على كل قطعة.
                </p>
              </>
            ) : (
              <>
                <h1 className="dsc-seo-h1">قطع غيار السيارات</h1>
                <p className="dsc-seo-lede">
                  آلاف القطع الأصلية والبديلة لجميع السيارات في السعودية، مع شحن سريع وضمان على كل قطعة.
                </p>
              </>
            )}
          </header>

          {/* Trust strip — 3 quiet chips. Cold landers don't know Speero yet;
              this answers the "should I trust this?" question before the
              merchandising rail below tries to sell them anything. */}
          <div className="dsc-trust">
            {TRUST_ITEMS.map((t, i) => (
              <div key={i} className="dsc-trust-item">
                <span className="dsc-trust-icon"><t.icon /></span>
                <span className="dsc-trust-body">
                  <span className="dsc-trust-label">{t.label}</span>
                  <span className="dsc-trust-sub">{t.sub}</span>
                </span>
              </div>
            ))}
          </div>

          {/* Collections — editorial use-case bundles, horizontally scrollable
              so they read as a featured row rather than another grid. */}
          <div className="dsc-collections">
            <h2 className="dsc-collections-title">تسوّق حسب الموقف</h2>
            <div className="dsc-collections-rail">
              {loading && freshEntry
                ? COLLECTIONS.map((c) => <SkeletonCollectionCard key={c.id} />)
                : COLLECTIONS.map((c) => (
                <button
                  key={c.id}
                  className="dsc-collection-card"
                  style={{ background: c.accent }}
                  onClick={() => navigate("/spare-parts/collections/" + c.id)}
                >
                  <span className="dsc-collection-icon"><c.icon /></span>
                  <span className="dsc-collection-body">
                    <span className="dsc-collection-label">{c.label}</span>
                    <span className="dsc-collection-sub">{c.sub}</span>
                  </span>
                </button>
              ))}
            </div>
          </div>

          <div className="dsc-cat-tiles">
            <h2 className="dsc-cat-tiles-title">حسب القسم</h2>
            <div className="cat-grid">
              {DISCOVER_CATEGORIES.map((c) => (
                <button
                  key={c.id}
                  className="cat-card"
                  onClick={() => navigate("/spare-parts/" + c.id)}
                >
                  <span className="cat-icon"><c.icon /></span>
                  <span className="cat-label">{c.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Symptom shortcuts — dark cards, vertical stack. Frame is
              "tap your problem → see the parts that fix it" — different
              mental frame from the pastel collections rail above. */}
          <section className="dsc-symptoms">
            <h2 className="dsc-symptoms-title">حلول لمشاكل شائعة</h2>
            <p className="dsc-symptoms-lede">اضغط على المشكلة وشوف القطع اللي ممكن تكون السبب.</p>
            <div className="dsc-symptoms-list">
              {SYMPTOMS.map((s) => (
                <button
                  key={s.id}
                  className="dsc-symptom-card"
                  onClick={() => navigate("/blog/" + s.slug)}
                >
                  <span className="dsc-symptom-stripe" style={{ background: s.accent }} />
                  <span className="dsc-symptom-icon" style={{ background: s.accent + "26", color: s.accent }}>
                    <s.icon />
                  </span>
                  <span className="dsc-symptom-body">
                    <span className="dsc-symptom-q">{s.q}</span>
                    <span className="dsc-symptom-sub">{s.sub}</span>
                  </span>
                  <span className="dsc-symptom-chev"><IconChevron /></span>
                </button>
              ))}
            </div>
          </section>

          {/* FAQ — collapsible accordion. Same content fills the prod
              schema.org FAQPage markup target (ARCHITECTURE.md flags this
              as one of three outputs). Helps cold landers AND search-engine
              indexing in one shot. */}
          <section className="dsc-faq">
            <h2 className="dsc-faq-title">الأسئلة الشائعة</h2>
            <div className="dsc-faq-list">
              {SPARE_PARTS_FAQ.map((f, i) => (
                <FaqItem
                  key={i}
                  q={f.q}
                  a={f.a}
                  open={openFaq === i}
                  onToggle={() => setOpenFaq(openFaq === i ? null : i)}
                />
              ))}
            </div>
          </section>
        </>
      ) : (
        <>
          {/* Collection hero — only on collection pages, gives the page the
              editorial presence the rail card promised on the tap. */}
          {activeCollection && (
            <>
              <div className="dsc-collection-hero" style={{ background: activeCollection.accent }}>
                <span className="dsc-collection-hero-icon"><activeCollection.icon /></span>
                <div>
                  <h1 className="dsc-collection-hero-title">{activeCollection.label}</h1>
                  <p className="dsc-collection-hero-sub">{activeCollection.sub}</p>
                </div>
              </div>
              <CollectionKindRail
                collection={activeCollection}
                activeKind={filters.kind}
                onSelect={(kind) => setFiltersAndScrollTop(
                  pruneInvalidFacets({ ...filters, kind })
                )}
              />
              {/* Sort / Filter / View — rendered in the body for collection
                  mode so it sits below the hero banner + kind rail, right
                  above the products (proper reading order). Cat pages have
                  no banner between cluster and products, so they keep
                  controls in the sticky cluster above. */}
              <div className="dsc-controls">
                {/* Same priority order as cat-page controls — Position first,
                    Filter (OEM/aft inside), Sort (price-asc/desc inside). */}
                {showPositionButton && (
                  <button
                    className={"dsc-control dsc-pos-control" + (filters.position ? " is-active" : "")}
                    onClick={() => setPositionOpen(true)}
                    aria-label={filters.position ? "الجهة: " + POSITION_LABELS[filters.position] : "تصفية حسب الجهة على السيارة"}
                  >
                    <span className="dsc-pos-glyph"><PositionGlyph pos={filters.position} /></span>
                    {!filters.position && <span>الجهة</span>}
                  </button>
                )}
                <button className={"dsc-control" + (activeFacetCount > 0 ? " is-active" : "")} onClick={() => setFilterOpen(true)}>
                  <IconFunnel /> <span>الفلتر{activeFacetCount > 0 ? " (" + activeFacetCount + ")" : ""}</span>
                </button>
                <div className="dsc-view-spacer" />
                <div className="view-toggle">
                  <button data-active={viewMode === "grid" || undefined} onClick={() => setViewMode("grid")} aria-label="عرض كشبكة"><IconGrid /></button>
                  <button data-active={viewMode === "row" || undefined} onClick={() => setViewMode("row")} aria-label="عرض كقائمة"><IconRows /></button>
                </div>
              </div>
              <AppliedFiltersText
                filters={filters}
                sort={sort}
                onClear={() => {
                  setFiltersAndScrollTop({
                    ...filters, type: "all", origins: [], expressOnly: false,
                  });
                  setSort("popular");
                }}
                onOpenSheet={() => setFilterOpen(true)}
              />
            </>
          )}

          {loading ? (
            viewMode === "grid" ? (
              <div className="dsc-grid">
                {[0, 1, 2, 3, 4, 5].map((i) => <SkeletonCard key={i} />)}
              </div>
            ) : (
              <div className="dsc-list">
                {[0, 1, 2, 3, 4, 5, 6].map((i) => <SkeletonRow key={i} />)}
              </div>
            )
          ) : results.length === 0 ? (
            (searchedAs || filters.q) ? (
              /* Search-context zero results: quote CTA is the hero. The
                 search-context signal is `searchedAs || filters.q` so the
                 recognized-cat route (where filters.q is null but the user
                 just searched) still gets the right CTA — same source-of-
                 truth as the indicator and the search-bar text.
                 Copy stays colloquial — "ما لقينا" matches the some-results
                 line below ("ما لقيت اللي تبيه") for a single voice. The car
                 is named in scope so the user sees the gap as fitment-specific,
                 not "we don't carry this." */
              <div className="dsc-empty">
                <div className="dsc-empty-title">
                  ما لقينا "{searchedAs || filters.q}" لـ {CURRENT_CAR.short}
                </div>
                <button
                  className="dsc-empty-btn"
                  onClick={() => {
                    analytics.track("search_quote_intent", { q: searchedAs || filters.q, scope: "zero" });
                  }}
                >اطلب عرض سعر</button>
              </div>
            ) : (
              <div className="dsc-empty">
                <div className="dsc-empty-title">لم نجد قطعة بهذه الفلاتر</div>
                <button
                  className="dsc-empty-btn"
                  onClick={() => setFilters({
                    ...filters, type: "all", origins: [], expressOnly: false,
                  })}
                >إعادة ضبط الفلاتر</button>
              </div>
            )
          ) : viewMode === "grid" ? (
            <div className="dsc-grid">
              {pagedResults.map((p) => (
                <ProductCard key={p.key} p={p} onClick={() => navigate("/p/" + p.key)} />
              ))}
            </div>
          ) : (
            <div className="dsc-list">
              {pagedResults.map((p) => (
                <SearchResultRow key={p.key} p={p} onClick={() => navigate("/p/" + p.key)} />
              ))}
            </div>
          )}

          <Paginator page={page} totalPages={totalPages} onChange={onPageChange} />
        </>
      )}

      <FilterSheet
        open={filterOpen}
        current={filters}
        currentSort={sort}
        defaults={defaults}
        onApply={(nextFilters, nextSort) => {
          setFiltersAndScrollTop(nextFilters);
          setSort(nextSort);
          setFilterOpen(false);
        }}
        onClose={() => setFilterOpen(false)}
      />
      <PositionPickerSheet
        open={positionOpen}
        current={filters.position}
        available={availablePositions}
        onSelect={(code) => setFiltersAndScrollTop({ ...filters, position: code })}
        onClose={() => setPositionOpen(false)}
        showClearRow={true}
      />
    </div>
  );
}

/* ============================================================================
   STANDALONE APP (replaces the prototype's full router-based App)
   ----------------------------------------------------------------------------
   A minimal shell for the Visual Search handoff:
     - a clean Home with a single "Visual Search" launcher card
     - the full LocateScreen (parts sheet, zones, engine/interior, drag orbit)
     - a stubbed cart so add-to-part works and the header count updates
   Everything above this point is copied verbatim from the prototype's single
   <script type="text/babel"> block; only unused definitions come along for the
   ride (harmless at module scope).
   ============================================================================ */

/* Minimal Home: cards that open Visual Search (2D) and Advanced Visual Search (3D). */
function VssHome({ cars, carId, onPickCar, onOpen, onOpen3D }) {
  const car = cars.find((c) => c.id === carId) || cars[0];
  const has3D = !!car.model;
  return (
    <div className="vss-home">
      {/* Logo + wordmark side by side, the same pair the prototype's header
          shows, centred as one unit by .vss-home's align-items. */}
      <div className="vss-home-brand">
        <img className="vss-home-logo" src="assets/speero logo.jpg" alt="" />
        <span className="vss-home-name">سبيرو</span>
      </div>

      {/* The one control that decides which car every screen below is about.
          Options come straight from the CARS registry, so a car added there
          shows up here with no change to this component. */}
      <div className="vss-carpick">
        <label className="vss-carpick-label" htmlFor="vss-car">سيارتك</label>
        <div className="vss-carpick-box">
          <select id="vss-car" value={car.id} onChange={(e) => onPickCar(e.target.value)}>
            {cars.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </div>
      </div>
      <div className="vss-card" role="button" tabIndex={0} onClick={onOpen}
           onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") onOpen(); }}>
        <div className="vss-card-icon"><IconLocate /></div>
        <div className="vss-card-body">
          <h1 className="vss-card-title">بحث 2d</h1>
        </div>
        {/* Last flex child — in this RTL row that is the card's physical LEFT
            end, and the arrow points the way the page reads: forward. */}
        <span className="vss-card-arrow" aria-hidden="true"><IconArrowLeft /></span>
      </div>
      {/* A car with no GLB still gets the 2D screen above — those faces are
          generic line art, not per-car — so only this card goes inert, saying
          why, rather than opening an empty stage. */}
      <div
        className={"vss-card" + (has3D ? "" : " is-unavailable")}
        role={has3D ? "button" : undefined}
        tabIndex={has3D ? 0 : undefined}
        aria-disabled={has3D ? undefined : "true"}
        onClick={has3D ? onOpen3D : undefined}
        onKeyDown={(e) => { if (has3D && (e.key === "Enter" || e.key === " ")) onOpen3D(); }}
      >
        <div className="vss-card-icon"><IconCube /></div>
        <div className="vss-card-body">
          <h1 className="vss-card-title">بحث 3d</h1>
          {!has3D && <span className="vss-card-note">النموذج ثلاثي الأبعاد غير متوفر لهذه السيارة بعد</span>}
        </div>
        {/* No "go" arrow on an inert card — the note above says why. */}
        {has3D && <span className="vss-card-arrow" aria-hidden="true"><IconArrowLeft /></span>}
      </div>
    </div>
  );
}

function App() {
  // isOpen drives the LocateScreen (2D) slide-up; isOpen3D drives Locate3DScreen.
  // No hash router here — just state, BUT opening a screen still pushes a
  // history entry so the phone's hardware/gesture back button closes it
  // instead of leaving the app or showing a blank page. The X button and the
  // drag-to-close gesture close screens through the exact same path
  // (history.back()) rather than setting state directly, so a physical back
  // press and the X button are literally the same function, not two
  // implementations that could drift out of sync.
  const [isOpen, setIsOpen] = useState(false);
  const [isOpen3D, setIsOpen3D] = useState(false);
  // Stubbed cart: an array of { key, qty } items, same shape the prototype uses.
  const [cart, setCart] = useState([]);

  /* Which car every screen is about. Held here (not inside a screen) because
     both locate screens and the home picker have to agree on it, and it is
     persisted by id so a reload reopens on the same car. */
  const [carId, setCarId] = useState(loadCarId);
  const activeCar = CARS.find((c) => c.id === carId) || CARS[0];
  const pickCar = (id) => { setCarId(id); saveCarId(id); };
  /* Keep the module-level CURRENT_CAR — still read by screens carried over
     from the full app — pointing at the selected car. Assigned during render
     rather than in an effect so the very first paint is already consistent. */
  CURRENT_CAR.name = activeCar.name;
  CURRENT_CAR.short = activeCar.short || activeCar.name;
  CURRENT_CAR.image = resolveCarImage(activeCar.name);

  useEffect(() => {
    const onPopState = () => {
      // Close only when the entry we landed on is no longer one of ours.
      // Nested levels (the expanded parts sheet) push their own entry carrying
      // the same `vss` key — popping one of those belongs to the sheet, so the
      // screen has to stay up, otherwise a back press with the parts list open
      // would drop the user straight out to the home card.
      const st = window.history.state;
      const level = st && st.vss;
      setIsOpen(level === "locate");
      setIsOpen3D(level === "locate3d");
    };
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);

  // `depth` counts the entries this screen owns so closing can unwind them all.
  const openLocate = () => { window.history.pushState({ vss: "locate", depth: 1 }, ""); setIsOpen(true); };
  // Belt-and-braces: the home card is already inert without a model, but a
  // stale history entry could otherwise reopen the screen onto nothing.
  const openLocate3D = () => {
    if (!activeCar.model) return;
    window.history.pushState({ vss: "locate3d", depth: 1 }, "");
    setIsOpen3D(true);
  };
  // Closing always goes through the history entry the open* functions pushed
  // — popstate (above) is what actually flips the state back to closed.
  const closeScreen = () => {
    // Unwind every entry the screen owns in one step. A plain back() from
    // inside an expanded sheet would only pop the sheet's entry and leave the
    // screen standing, so the X button would need two presses to get out.
    const st = window.history.state;
    if (st && st.vss) window.history.go(-(st.depth || 1));
    else { setIsOpen(false); setIsOpen3D(false); }
  };

  const addToCart = (key) => setCart((c) => {
    const exists = c.find((it) => it.key === key);
    if (exists) return c.map((it) => (it.key === key ? { ...it, qty: it.qty + 1 } : it));
    return [{ key, qty: 1 }, ...c];
  });
  const removeFromCart = (key) => setCart((c) => c.filter((it) => it.key !== key));

  return (
    <>
      <VssHome
        cars={CARS}
        carId={activeCar.id}
        onPickCar={pickCar}
        onOpen={openLocate}
        onOpen3D={openLocate3D}
      />
      <LocateScreen
        car={activeCar}
        isOpen={isOpen}
        onClose={closeScreen}
        onCart={() => {}}            /* no cart drawer in this standalone build */
        cartCount={cart.length}
        drawerOpen={false}
        cart={cart}
        onAddToCart={addToCart}
        onRemoveFromCart={removeFromCart}
      />
      <Locate3DScreen
        car={activeCar}
        isOpen={isOpen3D}
        onClose={closeScreen}
        onCart={() => {}}
        cartCount={cart.length}
        drawerOpen={false}
        cart={cart}
        onAddToCart={addToCart}
        onRemoveFromCart={removeFromCart}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
