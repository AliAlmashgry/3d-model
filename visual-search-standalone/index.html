function ProductDetailScreen({ productKey, cart, onCart, onSearch, onMenu, onAddToCart, cartCount = 0 }) {
  const raw = findProduct(productKey);
  const p = enrichProduct(raw);
  // Reflects how many of this product are in the cart right now. Drives
  // PdpCta's render: 0 = red Add-to-Cart button, >0 = qty stepper so
  // subsequent taps give visible feedback (qty++) instead of an inert
  // re-tap. Filters out items pending removal so an undo-able remove
  // doesn't ghost the stepper.
  const cartQty = (cart && p && cart.find((it) => it.key === p.key && !it.pending)?.qty) || 0;
  const [makeInfoOpen, setMakeInfoOpen] = useState(false);
  const [photoInfoOpen, setPhotoInfoOpen] = useState(false);
  const [installOpen, setInstallOpen] = useState(false);
  const [deliverCity, setDeliverCity] = useState("الرياض");
  const [cityOpen, setCityOpen] = useState(false);
  const [confidenceInfoOpen, setConfidenceInfoOpen] = useState(false);
  const [vinOpen, setVinOpen] = useState(false);
  // Once a VIN is confirmed for this PDP, store the last-5 mask. Resets on
  // PDP unmount — production would key this by (productKey, carKey) so the
  // verified state survives a navigate-back.
  const [verifiedVin, setVerifiedVin] = useState(null);
  // Mismatch state — set when the VIN check resolves to "this part doesn't
  // fit, but here's the alt." Prototype trigger: products with a
  // `mismatchAltKey` enter this state on VIN entry instead of verified.
  const [mismatchAlt, setMismatchAlt] = useState(null);
  // Out-of-stock reminder feedback — ephemeral, mirrors the added-to-cart
  // confirmation pattern. Production would register interest server-side.
  const [reminderSet, setReminderSet] = useState(false);
  // Scroll on /p/{key} entry is owned by the App-level SCROLL_CACHE restore.

  // Brief skeleton on a fresh product entry — the product block reads as
  // "fetched", same model as home + Discover. Triggers on a forward nav
  // (_isForwardNav): landing here from search/cards/sheet/related, including
  // PDP→PDP (the screen is keyed by productKey at the router, so it remounts
  // and re-runs this). A back-nav restore hits false → no flash, scroll intact.
  const [loading, setLoading] = useState(() => _isForwardNav);
  useEffect(() => {
    if (!loading) return;
    const t = setTimeout(() => setLoading(false), 360);
    return () => clearTimeout(t);
  }, []);

  // The inline add-to-cart promotes to a sticky bar once it scrolls out of
  // view, so the action is always reachable (same pattern as the services PDP).
  const ctaRef = useRef(null);
  const [showBuyBar, setShowBuyBar] = useState(false);
  useEffect(() => {
    const el = ctaRef.current;
    if (!el || !("IntersectionObserver" in window)) return;
    // Only when scrolled PAST the inline CTA (it's above the viewport), not
    // when it's still below (not reached yet) — both are "not intersecting".
    const io = new IntersectionObserver(([e]) => setShowBuyBar(!e.isIntersecting && e.boundingClientRect.top < 0), { threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  /* Drive the SEARCH PILL'S hide-progress from scrollY directly. Each
     scroll frame nudges a 0→1 value by (dy / FADE) and writes it to the
     wrapper's --pill-hide CSS variable; CSS calc()s on max-height /
     margin / opacity interpolate from it without any CSS transition. So
     the pill literally moves at the user's drag speed — no jitter, no
     mismatched animation pace.
     FADE = 80 → 80px of net downscroll fully hides; same upscroll fully
     restores. Reading-style micro-scrolls move the pill by tiny amounts
     proportional to the scroll, so the effect reads as "pill drifts with
     content" rather than "pill triggers an animation."
     Snap to 0 below scrollY=100 so the top of the PDP always lands with
     the pill fully visible regardless of where prior scrolls left it. */
  const stickRef = useRef(null);
  useEffect(() => {
    let lastY = window.scrollY;
    let progress = 0;
    let frame = null;
    const FADE = 80;
    const apply = (v) => {
      if (stickRef.current) {
        stickRef.current.style.setProperty("--pill-hide", String(v));
      }
    };
    const onScroll = () => {
      if (frame != null) return;
      frame = requestAnimationFrame(() => {
        frame = null;
        // Body-lock guard: while a drawer/menu/modal route locks the body
        // (position: fixed), window.scrollY resets to 0 and the document
        // height drops. The scroll event still fires during the transition,
        // which would un-hide the pill (because y < 100) — the user reads
        // that as "the cluster expanded when I opened the cart, then
        // collapsed when I closed it." Freeze progress while locked.
        if (document.body.dataset.scrollY != null) return;
        // Clamp scrollY to [0, document max] so iOS Safari rubber-band
        // overscroll (top OR bottom) doesn't show up as a real delta.
        // Without this clamp, bottom-overscroll's snap-back produces a
        // negative dy that visibly un-hides the pill mid-bounce — reads
        // as a "severe bounce" right at the end of the page.
        const docMax = Math.max(
          0,
          document.documentElement.scrollHeight - window.innerHeight
        );
        const y = Math.max(0, Math.min(window.scrollY, docMax));
        let next;
        if (y < 100) {
          next = 0;
        } else {
          const dy = y - lastY;
          next = Math.max(0, Math.min(1, progress + dy / FADE));
        }
        lastY = y;
        if (next !== progress) {
          progress = next;
          apply(progress);
        }
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (frame != null) cancelAnimationFrame(frame);
    };
  }, []);

  // Resolve alternative offers: prefer the explicit altKey, then synthesize one
  // or two extra competing offers with deterministic varied pricing.
  const alts = useMemo(() => {
    if (!p) return [];
    const out = [];
    if (p.altKey && PRODUCTS[p.altKey]) out.push({ key: p.altKey, ...PRODUCTS[p.altKey] });
    if (p.oemKey && PRODUCTS[p.oemKey]) out.push({ key: p.oemKey, ...PRODUCTS[p.oemKey] });
    // Add one synthesized competing offer so the section never feels empty
    if (p.make !== "alt") {
      const competing = {
        key: p.key + "_alt2",
        kind: p.kind,
        title: p.title,
        make: "alt",
        origin: "صيني",
        price: fmtPrice(Math.round(priceNum(p.price) * 0.62)),
      };
      out.push(competing);
    }
    return out;
  }, [p && p.key]);

  // Related parts: 4 other PRODUCTS items, skipping the current one and its alts.
  const related = useMemo(() => {
    if (!p) return [];
    const skip = new Set([p.key, p.altKey, p.oemKey].filter(Boolean));
    return Object.keys(PRODUCTS)
      .filter((k) => !skip.has(k) && PRODUCTS[k].cat === "part")
      .slice(0, 4)
      .map((k) => ({ key: k, ...PRODUCTS[k] }));
  }, [p && p.key]);

  if (!p) {
    return (
      <div className="pdp-empty">
        <p>القطعة غير موجودة</p>
        <button className="pdp-link" onClick={() => window.history.back()}>عودة</button>
      </div>
    );
  }

  // Compatibility confidence (backlog #8a). In the prototype, each product
  // can carry a `confidence` of 'high' / 'medium' / 'low'; absent = 'high'.
  // Production reads this from the real fitment service per OEM × car.
  const confidence = p.confidence || "high";

  const onPickAlt = (k) => navigate("/p/" + k);
  const onAdd = () => {
    if (onAddToCart) onAddToCart(p.key);
  };
  const onRemind = () => { setReminderSet(true); setTimeout(() => setReminderSet(false), 1800); };
  const onVinConfirm = (rawVin) => {
    // Store the full 17-char VIN for display. In production this should
    // be masked (last 5 chars only) for privacy — the prototype shows
    // the full chassis number per Zeyad's call so testers see a complete
    // VIN-verified state. Revisit when the verified-state lifecycle is
    // designed for production (BACKLOG #34).
    setVerifiedVin(rawVin);
    // Mismatch trigger: if this product is wired to a mismatch alternative,
    // resolve the alt product details and enter mismatch state instead of
    // a clean "verified" upgrade. In production this comes from the real
    // fitment lookup against the VIN.
    if (p.mismatchAltKey && PRODUCTS[p.mismatchAltKey]) {
      const alt = PRODUCTS[p.mismatchAltKey];
      setMismatchAlt({ key: p.mismatchAltKey, kind: alt.kind, title: alt.title, price: alt.price });
    }
    setVinOpen(false);
  };
  const onSwitchAlt = () => {
    if (mismatchAlt && mismatchAlt.key) navigate("/p/" + mismatchAlt.key);
  };

  // Derive the part's category from its kind so the breadcrumb has a
  // meaningful middle segment ("Home / Parts sections / [Category] / [Product]").
  // Falls through to a 3-segment crumb if no category matches the kind.
  const pdpCategory = DISCOVER_CATEGORIES.find((c) => c.kinds.includes(p.kind));

  return (
    <div className="pdp">
      {/* Sticky header — back chevron + clickable car context + cart, with
          auto-hiding search pill below. After testing, the back chevron beat
          the hamburger menu on PDP because users on a product page have a
          stronger "go back to the list" mental model than "open the menu".
          The car region (photo + name) takes over the menu slot — tap to
          open the side drawer where the garage + car-change live. */}
      <div ref={stickRef} className="pdp-stick">
        <div className="car-bar car-bar-collapsed">
          <button className="car-bar-back" onClick={() => window.history.back()} aria-label="رجوع">
            <IconChevron />
          </button>
          <button className="car-bar-info" onClick={onMenu} aria-label="القائمة">
            <img className="car-bar-photo" src={CURRENT_CAR.image} alt={CURRENT_CAR.name} />
            <div className="car-bar-body">
              {/* Model + year only (drop the manufacturer) so the name stays on
                  one line in this tight collapsed header — see carModelYear. */}
              <div className="car-bar-name">{carModelYear(CURRENT_CAR.name)}</div>
            </div>
          </button>
          <button className="car-bar-cart" onClick={onCart} aria-label="السلة">
            <IconCart />
            {cartCount > 0 && <span className="car-bar-cart-badge">{cartCount}</span>}
          </button>
        </div>
        {/* Search pill — same shape and tap behaviour as Discover's search bar.
            Routes through App-owned onSearch so the iOS keyboard opens inside
            the tap gesture (route-driven mount alone leaves it down on iOS). */}
        <button className="dsc-search pdp-search" onClick={() => onSearch && onSearch("")}>
          <IconSearch />
          <span className="dsc-search-text is-placeholder">ابحث باسم القطعة أو رقمها</span>
        </button>
      </div>
      {/* Page order — conversion-first.
          1 title  → 2 thumbnail  → 3 price  → 4 trust  → 5 buy
          → 6 details  → 7 VIN verification (full meter, deep content)
          → 8 reviews. A compact confidence strip sits near the title so
          buyers see their fit-status quickly; tapping it scrolls to the
          full VIN section for buyers who want to engage. */}

      {/* 1. Title section */}
      <div className="pdp-pad pdp-pad-top">
        <nav className="pdp-crumb" aria-label="breadcrumb">
          <a className="pdp-crumb-link" onClick={() => navigate("/car")}>الرئيسية</a>
          <span className="pdp-crumb-sep">/</span>
          <a className="pdp-crumb-link" onClick={() => navigate("/spare-parts/all")}>أقسام القطع</a>
          {pdpCategory && (
            <>
              <span className="pdp-crumb-sep">/</span>
              <a className="pdp-crumb-link" onClick={() => navigate("/spare-parts/" + pdpCategory.id)}>{pdpCategory.label}</a>
            </>
          )}
        </nav>
        <PdpHeader p={p} onShowMakeInfo={() => setMakeInfoOpen(true)} />
      </div>

      {/* 2. Thumbnail */}
      {loading ? <PdpGallerySkeleton /> : <PdpGallery p={p} onShowPhotoInfo={() => setPhotoInfoOpen(true)} />}

      {/* 3. Price + delivery block */}
      <div className="pdp-pad">
        {loading ? <PdpPriceSkeleton /> : <PdpPrice p={p} onInstallments={() => setInstallOpen(true)} city={deliverCity} onCityClick={() => setCityOpen(true)} />}
      </div>

      {/* 4. Trust signals */}
      <PdpTrustStrip />

      {/* 5. Add to cart (inline; promotes to the sticky buybar on scroll) */}
      <div className="pdp-pad" ref={ctaRef}>
        <PdpCta qty={cartQty} inStock={p.inStock} reminderSet={reminderSet} onAdd={onAdd} onRemind={onRemind} onCart={onCart} />
      </div>

      {/* Seller — the marketplace merchant, right under the buy CTA. */}
      {!loading && p.vendor && <PdpSeller vendor={p.vendor} />}

      {/* 6. Details */}
      <PdpDetails p={p} cart={cart} onAddToCart={onAddToCart} onShowMakeInfo={() => setMakeInfoOpen(true)} />

      {/* 7. VIN verification — full meter, scroll target from the strip. */}
      <div className="pdp-pad" id="pdp-vin-section">
        <PdpFitGuarantee
          confidence={confidence}
          carShort={CURRENT_CAR.short}
          verifiedVin={verifiedVin}
          mismatchAlt={mismatchAlt}
          onOpenVin={() => setVinOpen(true)}
          onSwitchAlt={onSwitchAlt}
          onShowConfidenceInfo={() => setConfidenceInfoOpen(true)}
        />
      </div>

      {/* Compatibility list — cars this part fits. STASHED — Zeyad
          flagged that this section sitting right under the VIN block reads
          as confusing (two "what fits your car" surfaces back-to-back).
          A/B testing without it before production decides whether the
          fitment list earns its slot. See BACKLOG #33. To restore:
          uncomment the JSX line below. PdpFitment component stays in the
          codebase. */}
      {/* <PdpFitment fitment={p.fitment} carShort={CURRENT_CAR.short} /> */}

      {/* "أسئلة قد تخطر لك" — trust-building Q&A. Sits right after the VIN
          section so the buyer's "anything else I should know?" question
          gets answered before they scroll to alternatives/reviews. */}
      <PdpFAQ kind={p.kind} />

      {/* Other offers for the same part */}
      <PdpAlternatives alts={alts} onPick={onPickAlt} />

      {/* 8. Reviews */}
      <PdpReviews rating={p.rating} reviewCount={p.reviewCount} reviews={p.reviews} />

      {/* Related parts rail (bottom) */}
      <PdpRelated items={related} onPick={onPickAlt} />

      <PdpMakeInfoSheet open={makeInfoOpen} onClose={() => setMakeInfoOpen(false)} />
      <PdpPhotoInfoSheet open={photoInfoOpen} onClose={() => setPhotoInfoOpen(false)} />
      <PdpInstallmentSheet
        open={installOpen}
        onClose={() => setInstallOpen(false)}
        priceStr={p.price}
        product={{ thumb: <ProductImage kind={p.kind} />, title: p.title, meta: p.oem ? "#" + p.oem : null, metaMono: true }}
        cartQty={cartQty}
        inStock={p.inStock}
        onAdd={onAdd}
        onCart={onCart}
      />
      <PdpCitySheet open={cityOpen} city={deliverCity} onSelect={setDeliverCity} onClose={() => setCityOpen(false)} />
      <PdpConfidenceInfoSheet open={confidenceInfoOpen} onClose={() => setConfidenceInfoOpen(false)} />
      <PdpVinSheet
        open={vinOpen}
        onClose={() => setVinOpen(false)}
        onConfirm={onVinConfirm}
      />

      {/* Sticky buy bar — slides up once the inline CTA scrolls away */}
      <div className={"buybar" + (showBuyBar ? " is-visible" : "")}>
        {p.inStock && (
          <div className="buybar-price">
            <span className="buybar-now mono">{p.price}<Riyal /></span>
            {p.oldPrice && <span className="buybar-was mono">{p.oldPrice}</span>}
          </div>
        )}
        <PdpCta qty={cartQty} inStock={p.inStock} reminderSet={reminderSet} onAdd={onAdd} onRemind={onRemind} onCart={onCart} />
      </div>
    </div>
  );
}

function CtaAddAnimCard({ variant }) {
  const [phase, setPhase] = useState("idle"); // idle | loading | success | settled
  const timersRef = useRef([]);
  useEffect(() => {
    return () => { timersRef.current.forEach(clearTimeout); timersRef.current = []; };
  }, []);

  const onTap = () => {
    if (phase !== "idle") return;
    setPhase("loading");
    const t1 = setTimeout(() => {
      setPhase("success");
      const t2 = setTimeout(() => setPhase("settled"), 900);
      timersRef.current.push(t2);
    }, 300);
    timersRef.current.push(t1);
  };

  const onReplay = () => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
    setPhase("idle");
  };

  const showInlineSpinner = variant.id === "B" && phase === "loading";
  const showCenterSpinner = variant.id !== "B" && phase === "loading";

  let btnLabel = null;
  if (phase === "idle") btnLabel = "أضف للسلة";
  else if (phase === "loading") {
    btnLabel = variant.id === "B"
      ? (<>أضف للسلة <span className="caa-spinner-inline" aria-label="جاري" /></>)
      : (<span className="caa-spinner" aria-label="جاري" />);
  } else if (phase === "success") {
    btnLabel = variant.id === "B"
      ? (<>في السلة <IconCheckSmall /></>)
      : (<>تمت الإضافة <IconCheckSmall /></>);
  } else if (phase === "settled") {
    btnLabel = (<>في السلة <IconCheckSmall /></>);
  }

  return (
    <div className="cad-card">
      <div className="cad-card-head">
        <h3 className="cad-card-name">{variant.id}. {variant.name}</h3>
        <p className="cad-card-desc">{variant.desc}</p>
      </div>
      <div className="cad-card-body">
        <div className={"caa-btn-wrap caa-v" + variant.id + " is-" + phase}>
          <button
            type="button"
            className="caa-btn"
            onClick={onTap}
            disabled={phase === "loading"}
            aria-live="polite"
          >
            {btnLabel}
          </button>
        </div>
        {variant.id === "B" && phase === "success" && (
          <div className="caa-toast-row">
            <div className="caa-toast" role="status">تمت الإضافة <IconCheckSmall /></div>
          </div>
        )}
        <button
          type="button"
          className="caa-replay"
          onClick={onReplay}
          disabled={phase === "idle"}
        >إعادة</button>
      </div>
    </div>
  );
}


function CtaAddMaskCard({ variant }) {
  const [phase, setPhase] = useState("idle"); // idle, sweeping/morphing/pending/success/flying, settled
  const [cartBadge, setCartBadge] = useState(0);
  const [cartPulsing, setCartPulsing] = useState(false);
  const [flyStyle, setFlyStyle] = useState(null);
  const timersRef = useRef([]);
  const frameRef = useRef(null);
  const buttonRef = useRef(null);
  const cartRef = useRef(null);

  useEffect(() => {
    return () => { timersRef.current.forEach(clearTimeout); timersRef.current = []; };
  }, []);

  const runOptimistic = () => {
    setPhase("success");
    const t = setTimeout(() => setPhase("settled"), 700);
    timersRef.current.push(t);
  };

  const runFly = () => {
    const frame = frameRef.current;
    const btn = buttonRef.current;
    const cart = cartRef.current;
    if (!frame || !btn || !cart) { runOptimistic(); return; }
    const frameRect = frame.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    const cartRect = cart.getBoundingClientRect();
    const startX = btnRect.left + btnRect.width / 2 - frameRect.left;
    const startY = btnRect.top + btnRect.height / 2 - frameRect.top;
    const endX = cartRect.left + cartRect.width / 2 - frameRect.left;
    const endY = cartRect.top + cartRect.height / 2 - frameRect.top;
    setFlyStyle({
      top: startY + "px",
      left: startX + "px",
      "--cam-fly-dx": (endX - startX) + "px",
      "--cam-fly-dy": (endY - startY) + "px",
    });
    setPhase("flying");
    const t1 = setTimeout(() => {
      setCartPulsing(true);
      setCartBadge((b) => b + 1);
    }, 550);
    const t2 = setTimeout(() => setCartPulsing(false), 950);
    const t3 = setTimeout(() => { setPhase("settled"); setFlyStyle(null); }, 720);
    timersRef.current.push(t1, t2, t3);
  };

  const runMorph = () => {
    setPhase("morphing");
    const t = setTimeout(() => setPhase("settled"), 700);
    timersRef.current.push(t);
  };

  const runSweep = () => {
    setPhase("sweeping");
    const t = setTimeout(() => setPhase("settled"), 850);
    timersRef.current.push(t);
  };

  const runPending = () => {
    setPhase("pending");
    const t = setTimeout(() => setPhase("settled"), 800);
    timersRef.current.push(t);
  };

  const onTap = () => {
    if (phase !== "idle") return;
    if (variant.id === "1") runOptimistic();
    else if (variant.id === "2") runFly();
    else if (variant.id === "3") runMorph();
    else if (variant.id === "4") runSweep();
    else if (variant.id === "5") runPending();
  };

  const onReplay = () => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
    setPhase("idle");
    setCartBadge(0);
    setCartPulsing(false);
    setFlyStyle(null);
  };

  let btnLabel = null;
  if (phase === "idle") btnLabel = "أضف للسلة";
  else if (phase === "settled") btnLabel = (<>في السلة <IconCheckSmall /></>);
  else if (variant.id === "1" && phase === "success") {
    btnLabel = (<>تمت الإضافة <IconCheckSmall /></>);
  } else if (variant.id === "2" && phase === "flying") {
    btnLabel = (<>في السلة <IconCheckSmall /></>);
  } else if (variant.id === "3" && phase === "morphing") {
    btnLabel = (<IconCheckSmall />);
  } else if (variant.id === "4" && phase === "sweeping") {
    btnLabel = "أضف للسلة";
  } else if (variant.id === "5" && phase === "pending") {
    btnLabel = (<>جاري الإضافة<span className="cam-v5-dots" aria-hidden="true" /></>);
  }

  const morphWrap = variant.id === "3";

  return (
    <div className="cad-card">
      <div className="cad-card-head">
        <h3 className="cad-card-name">{variant.id}. {variant.name}</h3>
        <p className="cad-card-desc">{variant.desc}</p>
      </div>
      <div className="cad-card-body">
        <div
          className={"cam-frame cam-v" + variant.id + " is-" + phase}
          ref={frameRef}
        >
          <div className="cam-cart-row">
            <span
              className={"cam-cart" + (cartPulsing ? " is-pulsing" : "")}
              ref={cartRef}
              aria-label="السلة"
            >
              <IconCart />
              {cartBadge > 0 && <span className="cam-cart-badge">{cartBadge}</span>}
            </span>
          </div>
          {morphWrap ? (
            <div className="cam-morph-wrap">
              <button
                type="button"
                ref={buttonRef}
                className="cam-btn"
                onClick={onTap}
                disabled={phase !== "idle" && phase !== "settled"}
                aria-live="polite"
              >{btnLabel}</button>
            </div>
          ) : (
            <button
              type="button"
              ref={buttonRef}
              className="cam-btn"
              onClick={onTap}
              disabled={phase !== "idle" && phase !== "settled"}
              aria-live="polite"
            >{btnLabel}</button>
          )}
          {variant.id === "2" && phase === "flying" && flyStyle && (
            <span className="cam-v2-fly" style={flyStyle} aria-hidden="true" />
          )}
        </div>
        <button
          type="button"
          className="cam-replay"
          onClick={onReplay}
          disabled={phase === "idle"}
        >إعادة</button>
      </div>
    </div>
  );
}

/* ============================================================================
   Discover Screen — #/spare-parts/{cat|all}?brand=...&q=...
   ============================================================================
   The unified results-and-filters surface. Every URL that's not a single
   product (category tile, brand letter, search submit) lands here with
   pre-applied filters from the URL. Category is a path segment (mirrors
   prod's /spare-parts/{category}/); brand/q/term ride in query for now.
   The "all" segment is prod's no-category landing — currently prod's 6th
   most-visited page (cold SEO traffic with no specific intent) — and renders
   the category-tile picker instead of a product grid. Architecture target:
   many URLs, one component. See ARCHITECTURE.md.

   Search input on Discover is tap-to-suggestions: tapping re-opens the
   suggestions screen at #/search?q=<current>; the user submits there to
   come back with a new query. Discover itself does not type live.
   ============================================================================ */

/* Pure functions for filter/sort, kept outside the component so they're easy
   to reason about + memoize against. */
const matchesFilters = (p, filters) => {
  if (filters.collection) {
    const col = findCollection(filters.collection);
    if (!col || !col.kinds.includes(p.kind)) return false;
    if (filters.kind && p.kind !== filters.kind) return false;
  }
  if (filters.cat) {
    const cat = findCategory(filters.cat);
    if (!cat || !cat.kinds.includes(p.kind)) return false;
    if (filters.term) {
      const term = cat.terms && cat.terms.find((t) => t.id === filters.term);
      if (term && !term.match(p)) return false;
    }
  }
  if (filters.q) {
    const q = filters.q.trim().toLowerCase();
    if (q && !p.title.toLowerCase().includes(q)) return false;
  }
  if (filters.type && filters.type !== "all" && p.make !== filters.type) return false;
  if (filters.origins && filters.origins.length > 0) {
    if (!filters.origins.includes(p.origin)) return false;
  }
  if (filters.expressOnly && !isTwoDay(p)) return false;
  if (filters.position && p.pos !== filters.position) return false;
  return true;
};

/* After a scope-changing action (term / cat / collection / brand / q
   change), check each user-applied facet and drop the ones that now
   resolve to zero in the new scope. Standard faceted-search behavior —
   matches Typesense's facet-counts model server-side in prod. Keeps the
   user out of guaranteed-empty result states without surprise-resetting
   facets that ARE still valid in the new scope. */
const pruneInvalidFacets = (filters) => {
  let next = { ...filters };
  const isPart = (p) => p.cat === "part";

  // Position — drop if no products in the new scope have this position.
  if (next.position) {
    const ok = CATALOG.some((p) =>
      isPart(p) &&
      p.pos === next.position &&
      matchesFilters(p, { ...next, position: null })
    );
    if (!ok) next.position = null;
  }

  // Type — drop to "all" (and clear origins) if no products in scope
  // match the selected make. Origins are alt-only so they go with it.
  if (next.type && next.type !== "all") {
    const ok = CATALOG.some((p) =>
      isPart(p) &&
      p.make === next.type &&
      matchesFilters(p, { ...next, type: "all", origins: [] })
    );
    if (!ok) {
      next.type = "all";
      next.origins = [];
    }
  }

  // Origins (only meaningful when type stays "alt") — filter out the ones
  // with zero matches in the new scope; keep the rest.
  if (next.type === "alt" && next.origins.length > 0) {
    next.origins = next.origins.filter((origin) =>
      CATALOG.some((p) =>
        isPart(p) &&
        p.origin === origin &&
        matchesFilters(p, { ...next, origins: [] })
      )
    );
  }

  // Express — drop if no express-eligible items in scope.
  if (next.expressOnly) {
    const ok = CATALOG.some((p) =>
      isPart(p) &&
      isTwoDay(p) &&
      matchesFilters(p, { ...next, expressOnly: false })
    );
    if (!ok) next.expressOnly = false;
  }

  return next;
};

const sortResults = (arr, sortId, q) => {
  const out = arr.slice();
  switch (sortId) {
    case "price-asc":  out.sort((a, b) => priceNum(a.price) - priceNum(b.price)); break;
    case "price-desc": out.sort((a, b) => priceNum(b.price) - priceNum(a.price)); break;
    case "relevance": {
      /* When the user committed a search, sort by where the query lands in
         each title — earlier position = higher relevance. Items that don't
         contain the query at all sink to the bottom (NO_MATCH sentinel) but
         still render, because the cat scope already filtered to a relevant
         kind. Catalog order (popularity proxy) breaks ties. Production this
         is Typesense's BM25 + popularity weighting; this is the prototype's
         stand-in. */
      const qNorm = normalizeArabic(q || "");
      if (!qNorm) {
        return sortResults(arr, "popular");
      }
      const NO_MATCH = Number.MAX_SAFE_INTEGER;
      const score = (p) => {
        const idx = normalizeArabic(p.title).indexOf(qNorm);
        return idx < 0 ? NO_MATCH : idx;
      };
      const catalogIndex = new Map();
      out.forEach((p, i) => { if (!catalogIndex.has(p)) catalogIndex.set(p, i); });
      out.sort((a, b) => {
        const sa = score(a), sb = score(b);
        if (sa !== sb) return sa - sb;
        return catalogIndex.get(a) - catalogIndex.get(b);
      });
      break;
    }
    case "popular":
    default: {
      /* Catalog order is the popularity proxy, but within multi-offer groups
         of the same Core Part (same title across OEM + alts), lift the OEM
         version to the top of the group. Reflects Saudi buyer intent: the
         canonical part is the trust anchor; alts sit behind it as the budget
         option. Without this, the extra vendor offers (tpV*) that are
         appended at the end of CATALOG end up at the bottom of the kind list
         even when they're the OEM — surfacing the alt as "first شيء أرى"
         which buries the canonical part. Stable sort preserves catalog order
         for unrelated items and for ties within a group.
         PRODUCTION: replace with Core/Stock grouping — one card per Core
         Part with offers stacked, OEM offer pinned first. */
      const titleFirstSeen = new Map();
      out.forEach((p, i) => {
        if (!titleFirstSeen.has(p.title)) titleFirstSeen.set(p.title, i);
      });
      out.sort((a, b) => {
        const groupA = titleFirstSeen.get(a.title);
        const groupB = titleFirstSeen.get(b.title);
        if (groupA !== groupB) return groupA - groupB;
        const oemA = a.make === "oem" ? 0 : 1;
        const oemB = b.make === "oem" ? 0 : 1;
        return oemA - oemB;
      });
      break;
    }
  }
  return out;
};

/* When a finger lands on a horizontal chip rail while the page is mid-
   momentum, both Safari and Brave fail to start a horizontal scroll until
   the page's vertical momentum settles. The CSS containment (`touch-action:
   pan-x` + `contain: paint`) helps but doesn't fully fix it — the surest
   way is to actively kill momentum on touchstart by re-asserting the
   current scroll position. After that, the new touch on the rail has a
   stationary page to scroll against, and horizontal panning starts
   immediately. */
function useFreezePageOnTouch(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onTouchStart = () => {
      // Re-assert current scrollY — instantly halts any kinetic scroll
      // on the page so the new gesture on the rail can take the compositor.
      window.scrollTo(window.scrollX, window.scrollY);
    };
    el.addEventListener("touchstart", onTouchStart, { passive: true });
    return () => el.removeEventListener("touchstart", onTouchStart);
  }, []);
}

/* Horizontal scrollable category chip rail. Always rendered; "الكل" is the
   active state when no category is filtered. Auto-scrolls the active chip
   into view on landing so users can see where they are without scrolling. */
function CategoryRail({ active, onSelect }) {
  const railRef = useRef(null);
  useFreezePageOnTouch(railRef);
  // Keep the selected chip visible whenever active changes — scroll it into
  // view rather than always snapping back to the start, so a tap on a chip
  // mid-rail doesn't push your selection off-screen.
  useEffect(() => {
    const node = railRef.current;
    if (!node) return;
    const target = node.querySelector(".dsc-cat-chip.is-active") || node.firstElementChild;
    if (target && target.scrollIntoView) {
      target.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }
  }, [active]);

  return (
    <div className="dsc-cat-rail" ref={railRef}>
      {/* "الكل" pinned to the start — it's the root/default and reads as the
          home-base before the category-specific chips. */}
      <button
        className={"dsc-cat-chip" + (!active ? " is-active" : "")}
        onClick={() => onSelect(null)}
      >
        <span>الكل</span>
      </button>
      {DISCOVER_CATEGORIES.map((c) => (
        <button
          key={c.id}
          className={"dsc-cat-chip" + (active === c.id ? " is-active" : "")}
          onClick={() => onSelect(c.id)}
        >
          <c.icon />
          <span>{c.label}</span>
        </button>
      ))}
    </div>
  );
}

/* Terms rail — section-nav for subcategories within a main category. Shown
   instead of the main-category rail when the user is browsing a category and
   that category has enough items to make the breakdown meaningful. Layout
   mirrors CategoryRail (text-only, no icons, "All" chip first). */
function TermsRail({ category, activeTerm, onSelect }) {

    }
  }, [category.id, activeTerm]);

/* Collection-kind rail — slices a collection's mixed product set by what
   kind of item it is ("Accident parts" → الكل / صدامات / شبوك / أضواء /

/* Quiet text summary of the user's applied filter-sheet facets — sits below
   the controls row so the user can scan "what's narrowing my results" at a
   glance without the visual weight of chip pills. Position is intentionally
   excluded — it has its own pill that already shows the selected glyph;
   summary lists what's hidden inside the Filter sheet. Single "مسح" link
   clears all the listed facets at once (does NOT touch cat / term / position). */
function AppliedFiltersText({ filters, sort, onClear, onOpenSheet }) {
  const parts = [];
  // Order mirrors the فلتر sheet top-to-bottom — النوع (+ origins as a
  // single combined string, since origins are an attribute OF the type),
  // then الترتيب, then إكسبرس. Reads in the same sequence the user just
  // configured in the sheet.
  if (filters.type === "oem") parts.push("أصلي وكالة");
  else if (filters.type === "alt") {
    parts.push(filters.origins.length > 0
      ? "بديل (" + filters.origins.join("، ") + ")"
      : "بديل");
  }
  if (sort === "price-asc")       parts.push("السعر: من الأقل");
  else if (sort === "price-desc") parts.push("السعر: من الأعلى");
  if (filters.expressOnly) parts.push("إكسبرس");
  if (parts.length === 0) return null;
  return (
    <div
      className="dsc-applied dsc-applied--underline is-tappable"
      onClick={onOpenSheet}
      role="button"
      tabIndex={0}
    >
      <span className="dsc-applied-label">الفلاتر:</span>
      <span className="dsc-applied-text">
        {parts.map((p, i) => (
          <React.Fragment key={i}>
            {i > 0 && <span className="dsc-applied-dot"> · </span>}
            <span className="dsc-applied-uline">{p}</span>
          </React.Fragment>
        ))}
      </span>
      <button
        className="dsc-applied-clear"
        onClick={(e) => { e.stopPropagation(); onClear(); }}
      >مسح</button>
    </div>
  );
}

/* Side drawer shell — slides in from the right edge (RTL leading side) +
   shared scrim. Used by the position picker. Different motion vocabulary
   from BottomSheet so a "focused side filter" reads distinctly from the
   full-screen Sort/Filter sheets. `variant` toggles a shape modifier class
   (float / sweep / capsule / tab) for the position-shape demo screen. */
function SideSheet({ open, onClose, title, children, variant }) {
  const variantCls = variant ? " side-sheet--" + variant : "";
  // Same body-scroll-lock logic as BottomSheet — same iOS bug, same fix.
  useEffect(() => {
    if (!open) return;
    if (document.body.dataset.scrollY != null) return;
    const scrollY = window.scrollY;
    document.body.style.position = "fixed";
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = "100%";
    document.body.dataset.scrollY = String(scrollY);
    document.body.dataset.scrollLockOwner = "sidesheet";
    return () => {
      if (document.body.dataset.scrollLockOwner !== "sidesheet") return;
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.width = "";
      delete document.body.dataset.scrollY;
      delete document.body.dataset.scrollLockOwner;
      window.scrollTo(0, scrollY);
    };
  }, [open]);
  return (
    <>
      <div className={"bs-scrim" + (open ? " is-open" : "")} onClick={onClose} />
      <div className={"side-sheet" + variantCls + (open ? " is-open" : "")} role="dialog" aria-modal={open || undefined}>
        {variant === "tab" && <span className="side-sheet-handle" aria-hidden="true" />}
        <div className="bs-head">
          <div className="bs-title">{title}</div>
          <button className="bs-close" onClick={onClose} aria-label="إغلاق"><IconClose /></button>
        </div>
        <div className="bs-body">{children}</div>
      </div>
    </>
  );
}

/* Shared bottom sheet shell — slides up + scrim. Used by both Filter and Sort. */
function BottomSheet({ open, onClose, title, children, footer, variant }) {
  // Lock body scroll while the sheet is open. Without this, iOS Safari holds
  // off tap delivery on the sheet's children until any residual scroll
  // momentum on the page settles — symptom: user has to flick the page once
  // before chips/buttons become tappable. Skip if the App-level lock
  // (menu/cart/modal route) is already active so we don't double-toggle and
  // strand the scroll position.
  useEffect(() => {
    if (!open) return;
    if (document.body.dataset.scrollY != null) return; // already locked by App
    const scrollY = window.scrollY;
    document.body.style.position = "fixed";
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = "100%";
    document.body.dataset.scrollY = String(scrollY);
    document.body.dataset.scrollLockOwner = "bottomsheet";
    return () => {
      if (document.body.dataset.scrollLockOwner !== "bottomsheet") return;
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.width = "";
      delete document.body.dataset.scrollY;
      delete document.body.dataset.scrollLockOwner;
      window.scrollTo(0, scrollY);
    };
  }, [open]);

  const variantCls = variant ? " bs-sheet--" + variant : "";
  const showHandle = !variant || variant === "compact"; // drag handle is bottom-sheet vocabulary
  return (
    <>
      <div className={"bs-scrim" + (open ? " is-open" : "")} onClick={onClose} />
      <div className={"bs-sheet" + variantCls + (open ? " is-open" : "")} role="dialog" aria-modal={open || undefined}>
        {showHandle && <div className="bs-handle" />}
        <div className="bs-head">
          <div className="bs-title">{title}</div>
          <button className="bs-close" onClick={onClose} aria-label="إغلاق"><IconClose /></button>
        </div>
        <div className="bs-body">{children}</div>
        {footer && <div className="bs-foot">{footer}</div>}
      </div>
    </>
  );
}

function FilterSheet({ open, current, currentSort, defaults, onApply, onClose, variant }) {
  // Local draft so changes don't apply until "عرض N نتيجة" is tapped — the
  // live count lets the user see what they're about to commit to. Sort is
  // drafted here too (sheet hosts both filter + sort under one entry point).
  const [draft, setDraft] = useState(current);
  const [draftSort, setDraftSort] = useState(currentSort);
  useEffect(() => {
    if (open) {
      setDraft(current);
      setDraftSort(currentSort);
    }
  }, [open, current, currentSort]);

  const liveCount = useMemo(
    () => CATALOG.filter((p) => p.cat === "part" && matchesFilters(p, draft)).length,
    [draft]
  );

  // Context-aware facet counts — for each chip option, compute how many
  // products would match if THAT option were toggled, holding all OTHER
  // facets at their current draft value. Standard faceted-search behavior
  // (Typesense returns this server-side in prod). Used to disable chips
  // whose option resolves to zero in the current scope so the user can't
  // tap into a guaranteed-empty result. The currently-active chip stays
  // enabled even at zero so the user can always clear it.
  const facetCounts = useMemo(() => {
    const isPart = (p) => p.cat === "part";
    // Type: scope = draft minus type + origins (origins are alt-only).
    const noType = { ...draft, type: "all", origins: [] };
    const typeBase = CATALOG.filter((p) => isPart(p) && matchesFilters(p, noType));
    // Origins: scope = draft minus origins (keeps type=alt context).
    const noOrigins = { ...draft, origins: [] };
    const originsBase = CATALOG.filter((p) => isPart(p) && matchesFilters(p, noOrigins));
    // Express: scope = draft minus expressOnly.
    const noExpress = { ...draft, expressOnly: false };
    const expressBase = CATALOG.filter((p) => isPart(p) && matchesFilters(p, noExpress));
    return {
      typeOem: typeBase.filter((p) => p.make === "oem").length,
      typeAlt: typeBase.filter((p) => p.make === "alt").length,
      origins: Object.fromEntries(
        DISCOVER_ORIGINS.map((o) => [o, originsBase.filter((p) => p.origin === o).length])
      ),
      express: expressBase.filter(isTwoDay).length,
    };
  }, [draft]);

  const setType = (t) => setDraft({ ...draft, type: t, origins: t === "alt" ? draft.origins : [] });
  const toggleOrigin = (o) => {
    const has = draft.origins.includes(o);
    setDraft({ ...draft, origins: has ? draft.origins.filter((x) => x !== o) : [...draft.origins, o] });
  };

  return (
    <BottomSheet
      open={open}
      onClose={onClose}
      variant={variant}
      title="فلتر وترتيب"
      footer={
        <div className="dsc-filter-foot">
          <button
            className="dsc-foot-reset"
            onClick={() => {
              // Reset ONLY the facets shown in this sheet (type / origins /
              // expressOnly + sort). Preserve cat / brand / q / term /
              // collection / position — those are URL-driven context or
              // controlled by other surfaces, and wiping them would yank the
              // user out of their current category / sub-term / position
              // selection without warning. Symptom of the bug: tapping
              // إعادة ضبط on /spare-parts/bumpers-grilles dropped the
              // user into the /spare-parts/all tile picker.
              setDraft({
                ...draft,
                type: "all",
                origins: [],
                expressOnly: false,
              });
              setDraftSort("popular");
            }}
          >إعادة ضبط</button>
          <button className="dsc-foot-apply" onClick={() => onApply(draft, draftSort)}>
            عرض <span className="mono">{liveCount}</span> نتيجة
          </button>
        </div>
      }
    >
      {/* 1. Part Make — top because OEM/aftermarket is the #2 user-priority
          concern after position; users land on this before refining further.
          Chips disable when their option resolves to zero in the current
          scope (e.g. a term-chip with no aftermarket items disables بديل).
          Active chip stays enabled at zero so the user can always clear.
          Section auto-hides when the query already pinned the type (one of
          OEM/Alt has zero) AND the user hasn't actively chosen — keeping the
          section visible whenever it carries an active user choice. */}
      {(() => {
        const onlyOneType = facetCounts.typeOem === 0 || facetCounts.typeAlt === 0;
        const userPicked = draft.type !== "all";
        if (onlyOneType && !userPicked) return null;
        return (
      <div className="dsc-filter-section">
        <div className="dsc-filter-label">النوع</div>
        <div className="dsc-filter-chips">
          {[
            { id: "all", label: "الكل",       count: null /* wildcard — never disabled */ },
            { id: "oem", label: "أصلي وكالة", count: facetCounts.typeOem },
            { id: "alt", label: "بديل",       count: facetCounts.typeAlt },
          ].map((t) => {
            const active = draft.type === t.id;
            const disabled = t.count === 0 && !active;
            return (
              <button
                key={t.id}
                className={"dsc-pick" + (active ? " is-active" : "")}
                disabled={disabled}
                onClick={() => setType(t.id)}
              >{t.label}</button>
            );
          })}
        </div>
        {draft.type === "alt" && (
          <div className="dsc-filter-sub-block">
            <div className="dsc-filter-sublabel">بلد المنشأ</div>
            <div className="dsc-filter-chips">
              {DISCOVER_ORIGINS.map((o) => {
                const active = draft.origins.includes(o);
                const disabled = (facetCounts.origins[o] || 0) === 0 && !active;
                return (
                  <button
                    key={o}
                    className={"dsc-pick" + (active ? " is-active" : "")}
                    disabled={disabled}
                    onClick={() => toggleOrigin(o)}
                  >{o}</button>
                );
              })}
            </div>
          </div>
        )}
      </div>
        );
      })()}

      {/* 2. Sort — الأكثر مبيعاً (default) + price asc/desc. Single-select
          chip group: tapping any chip sets it as the active sort, including
          tapping back to "الأكثر مبيعاً" to reset. */}
      <div className="dsc-filter-section">
        <div className="dsc-filter-label">الترتيب</div>
        <div className="dsc-filter-chips">
          {[
            { id: "popular",    label: "الأكثر مبيعاً" },
            { id: "price-asc",  label: "السعر: من الأقل" },
            { id: "price-desc", label: "السعر: من الأعلى" },
          ].map((s) => (
            <button
              key={s.id}
              className={"dsc-pick" + (draftSort === s.id ? " is-active" : "")}
              onClick={() => setDraftSort(s.id)}
            >{s.label}</button>
          ))}
        </div>
      </div>

      {/* 3. Express — disables when no products in the current scope are
          express-eligible. Active toggle stays enabled at zero so the user
          can always uncheck it. */}
      <div className="dsc-filter-section">
        {(() => {
          const expressDisabled = facetCounts.express === 0 && !draft.expressOnly;
          return (
            <label className={"dsc-toggle-row" + (expressDisabled ? " is-disabled" : "")}>
              <input
                type="checkbox"
                checked={draft.expressOnly}
                disabled={expressDisabled}
                onChange={(e) => setDraft({ ...draft, expressOnly: e.target.checked })}
              />
              <span>إكسبرس · استلمها خلال 3 ساعات!</span>
            </label>
          );
        })()}
      </div>
    </BottomSheet>
  );
}

/* Numbered paginator + arrow controls. Shows up to 5 page numbers around the
   current page; ellipses when there are more than 5. Hidden when totalPages
   ≤ 1. The "after 4 pages" behavior: paginator hides when total ≤ 4 so short
   result sets stay flat — only longer lists get a paginator. */
function Paginator({ page, totalPages, onChange }) {
  if (totalPages <= 4) return null;
  const window = 5;
  let start = Math.max(1, page - Math.floor(window / 2));
  let end = Math.min(totalPages, start + window - 1);
  if (end - start + 1 < window) start = Math.max(1, end - window + 1);
  const pages = [];
  for (let i = start; i <= end; i++) pages.push(i);
  return (
    <div className="dsc-pager">
      <button
        className="dsc-pager-arrow"
        disabled={page === 1}
        onClick={() => onChange(page - 1)}
        aria-label="السابق"
      ><IconChevron /></button>
      {start > 1 && (
        <>
          <button className="dsc-pager-num" onClick={() => onChange(1)}>1</button>
          {start > 2 && <span className="dsc-pager-gap">…</span>}
        </>
      )}
      {pages.map((p) => (
        <button
          key={p}
          className={"dsc-pager-num" + (p === page ? " is-active" : "")}
          onClick={() => onChange(p)}
        >{p}</button>
      ))}
      {end < totalPages && (
        <>
          {end < totalPages - 1 && <span className="dsc-pager-gap">…</span>}
          <button className="dsc-pager-num" onClick={() => onChange(totalPages)}>{totalPages}</button>
        </>
      )}
      <button
        className="dsc-pager-arrow"
        disabled={page === totalPages}
        onClick={() => onChange(page + 1)}
        aria-label="التالي"
      >{/* IconChevron ignores props, so flip via a wrapper (RTL: next points left) */}
        <span style={{ display: "inline-flex", transform: "scaleX(-1)" }}><IconChevron /></span></button>
    </div>
  );
}

const DSC_PAGE_SIZE = 12;

/* Position picker — side drawer that doubles as the user's first lesson in
   what the small car-silhouette glyph on every product card means. Lists
   ONLY positions present in the current result set (excluding the position
   filter itself so deselecting via the same sheet stays possible). Each row
   pairs the EXACT glyph from the card with its Arabic label + count, so the
   visual vocabulary stays consistent between thumbnail and filter. */
function PositionPickerSheet({ open, current, available, onSelect, onClose, variant, showClearRow }) {
  return (
    <SideSheet open={open} onClose={onClose} title="الجهة" variant={variant}>
      <div className="pos-pick-list">
        {showClearRow && current && (
          <button
            className="pos-pick-row pos-pick-clear"
            onClick={() => { onSelect(null); onClose(); }}
          >
            <span className="pos-pick-clear-icon" aria-hidden="true"><IconReset /></span>
            <span className="pos-pick-label">عرض كل الجهات</span>
          </button>
        )}
        {POSITION_ORDER.map((code) => {
          const count = available[code] || 0;
          if (count === 0) return null;
          const isSel = current === code;
          return (
            <button
              key={code}
              className={"pos-pick-row" + (isSel ? " is-selected" : "")}
              onClick={() => { onSelect(isSel ? null : code); onClose(); }}
            >
              <span className="pos-pick-glyph"><PositionGlyph pos={code} /></span>
              <span className="pos-pick-label">{POSITION_LABELS[code]}</span>
              <span className="pos-pick-count">({count})</span>
            </button>
          );
        })}
      </div>
    </SideSheet>
  );
}

// Skeleton placeholders — match the shape of SearchResultRow / ProductCard so
// the visual swap from skeleton → real content doesn't shift layout.
/* variant="part" is the 3D locate screen's parts sheet, whose rows are a good
   deal taller than the discover list's: they always render a make tag AND a
   delivery badge under the title, and they are the only rows given an
   onAddToCart, so they also carry the round + button. Measured, the default
   shape stands 81px against their 116px — enough that the skeleton→content swap
   visibly reflowed the list. This variant adds the fourth body line and the
   button, and sizes the bars to land within ~1px.
   The default shape is untouched, so the discover list is unaffected. */
function SkeletonRow({ variant }) {
  const part = variant === "part";
  return (
    <div className="sk-row">
      <div className="sk-thumb sk-shimmer" />
      <div className="sk-body">
        <div className="sk-line sk-shimmer" style={{ width: "70%", height: part ? 18 : undefined }} />
        <div className="sk-line sk-shimmer" style={{ width: "40%", height: part ? 14 : undefined }} />
        <div className="sk-tag sk-shimmer" style={part ? { height: 20 } : undefined} />
        {part && <div className="sk-line sk-shimmer" style={{ width: "52%", height: 20 }} />}
      </div>
      <div className="sk-side">
        <div className="sk-price sk-shimmer" />
        <div className="sk-stock sk-shimmer" />
      </div>
      {part && <div className="sk-add sk-shimmer" />}
    </div>
  );
}

function SkeletonCard() {
  return (

// Collection-card skeleton — matches a .dsc-collection-card (200×116) in the

      <div className="dsc-collection-body">

        <div className="sk-line sk-shimmer" style={{ width: "50%", height: 12, marginTop: 4 }} />
      </div>

// Rail-card skeleton — one shimmering placeholder sized to a home rail card.
function SkeletonRailCard() {
  return (
    <div className="sk-railcard">
      <div className="sk-railcard-img sk-shimmer" />
      <div className="sk-railcard-body">
        <div className="sk-line sk-shimmer" style={{ width: "85%" }} />
        <div className="sk-line sk-shimmer" style={{ width: "55%" }} />
        <div className="sk-tag sk-shimmer" />
        <div className="sk-line sk-shimmer" style={{ width: "45%", height: 16 }} />
