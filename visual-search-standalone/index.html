         - on the car box itself: now. dragging hides the hotspots from the
           first touch, so they are gone before the car visibly turns and the
           ring's transitions are off so it can follow 1:1 — the immediate
           grab CarOrbit gives the 2D cube.
         - anywhere else in the band — the hint line, the ring's gaps, the
           pill, the edges — and above all on one of the zone ring's LABELS:
           deferred. A plain tap there must not flash every dot off and back
           on for a camera that never moves, nor snap a ring transition that
           is still running from the last pick. The labels matter most: they
           are about half of the ring band, so a swipe that begins on one has
           to turn the car like a swipe that begins beside it, while a tap on
           one stays the label's — its click picks the zone as ever. The ring
           is pointer-events: none apart from its buttons, so "inside
           .zone-ring" can only mean "on a button". */
    const onRingLabel = !!e.target.closest(".zone-ring");
    const deferArm = onRingLabel || !e.target.closest(".car-stage-3d");
    ringDragMovedRef.current = false; // fresh press — nothing has moved yet
    if (!deferArm) setDragging(true);

    if (zoomRef.current > 1) {
      // Zoomed in: the finger arms a swipe-to-unzoom (measured on release),
      // never a rotate — spinning a magnified close-up reads as the car
      // lurching, and the presets are the only angles hotspots exist for.
      swipeRef.current = { x: e.clientX, y: e.clientY, fromLabel: onRingLabel };
      return;
    }

    // 1:1 drag-follow from the very first pixel of movement — the same
    // immediate grab CarOrbit gives the 2D cube. Captures the CURRENT ring
    // angle as the starting point rather than viewIndex * 90 directly — same
    // value once settled, but this stays correct when a new grab lands
    // mid-settle (state already holds the target; the CSS/camera ease is
    // what lags).
    swipeRef.current = null;
    freeDragRef.current = {
      startX: e.clientX,
      startAngle: ringAngle,
      lastAngle: ringAngle,
      lastT: performance.now(),
      // Rolling velocity in deg/ms — same exponential smoothing as CarOrbit,
      // so a single laggy frame doesn't tank the release projection.
      vel: 0,
      // Deferred arm (see above): nothing hides or moves until the finger
      // leaves the dead band. fromLabel additionally makes that crossing
      // swallow the label's click — see onPointerMove.
      hideOnMove: deferArm,
      fromLabel: onRingLabel,
    };
    if (!deferArm) setFreeRotating(true);
  };

  const onPointerMove = (e) => {
    if (!pointersRef.current.has(e.pointerId)) return;
    /* Self-heal a release we were never told about. The window listeners below
       catch a mouse-up anywhere on the page, but a button released OUTSIDE the
       browser window fires no pointerup at all — and without that, freeDragRef
       stays armed and the car would follow the bare cursor forever on the way
       back in (the original bug, in its last remaining form). A move with no
       button held is proof the release already happened, so end the gesture
       here as if it had arrived. Mouse only: touch reports buttons:1 for the
       whole contact and a hovering pen reports 0, so this test only means
       "released" for a mouse. */
    if (e.pointerType === "mouse" && e.buttons === 0) { onPointerUp(e); return; }
    pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

    const pinch = pinchRef.current;
    if (pinch && pointersRef.current.size >= 2) {
      const dist = pointerDistance();
      if (!dist || Math.abs(dist - pinch.startDist) < CAR3D_PINCH_MIN_DISTANCE) return;
      // Clamped to [1, CAR3D_ZOOM_MAX]: the floor is what makes this zoom-in only.
      const next = Math.min(CAR3D_ZOOM_MAX, Math.max(1, pinch.startZoom * (dist / pinch.startDist)));
      applyZoom(next, true, pinch.anchor); // snap, so the zoom tracks the fingers 1:1
      return;
    }

    const d = freeDragRef.current;
    if (d) {
      if (d.hideOnMove) {
        // A deferred arm — a press that began off the car box, see
        // onPointerDown. Inside the dead band NOTHING moves. It is sized to
        // the browser's own tap slop (CAR3D_SWIPE_SLOP), because on a ring
        // label the two have to agree: a touch that wobbles less than the
        // slop still gets a click from the browser, and that click has to
        // pick the label — so this code must not have called it a drag. And
        // it is a true dead band, not just a deferred hide, because
        // releaseFreeRotate skips its settle only when the angle never
        // changed (0.5°, under a pixel at this gain) — a settle would hide
        // the hotspots for its whole ease, the very blink this is for.
        if (Math.abs(e.clientX - d.startX) <= CAR3D_SWIPE_SLOP) return;
        d.hideOnMove = false;
        // Intent shown: the drag is measured from here rather than jumping
        // the ~9° the dead band swallowed …
        d.startX = e.clientX;
        // … and this press is a DRAG now: hotspots go, the ring's transitions
        // go so it can follow 1:1 (both as an on-the-car press does at
        // pointerdown) …
        setDragging(true);
        setFreeRotating(true);
        // … and if it began on a label, the click the browser fires when the
        // mouse comes up over that same label (it rides the cursor almost
        // 1:1) must not also pick it and undo the settle — see onClickCapture
        // on .car-swipe and the reset in onPointerUp.
        if (d.fromLabel) ringDragMovedRef.current = true;
      }
      // 1:1 drag-follow — same gain-times-delta shape as CarOrbit's
      // onPointerMove, just driving the model-viewer camera instead of a CSS
      // rotateY. The velocity blend (0.35 = how reactive vs. how smooth) is
      // CarOrbit's too; it's read at release to project a flick past the
      // finger.
      const angle = d.startAngle - (e.clientX - d.startX) * CAR3D_FREE_ROTATE_GAIN;
      const now = performance.now();
      const dt = Math.max(1, now - d.lastT);
      d.vel = d.vel * 0.65 + ((angle - d.lastAngle) / dt) * 0.35;
      d.lastAngle = angle;
      d.lastT = now;
      applyFreeAngle(angle);
      setRingAngle(angle);
    }
  };

  const endPointer = (e) => {
    pointersRef.current.delete(e.pointerId);
    if (pointersRef.current.size < 2) pinchRef.current = null;
    // Only once EVERY finger is up is the gesture really over. Clearing this on
    // the first lift would let the second finger coming off read as a swipe.
    if (pointersRef.current.size === 0) {
      const wasPinch = pinchedRef.current;
      pinchedRef.current = false;
      return wasPinch;
    }
    return true; // fingers still down — treat as mid-gesture, not a swipe
  };

  /* Drag release: project momentum forward exactly like CarOrbit's pointerup
     — a quick flick carries past the finger to the next preset, a gentle
     release just snaps to whichever of the four sides is nearest. The
     projection cap keeps a wild flick from spinning more than one face away.
     Always settles even when that's the zone the drag started from — see
     settleAtIndex's comment for why. */
  const releaseFreeRotate = () => {
    const d = freeDragRef.current;
    freeDragRef.current = null;
    setFreeRotating(false);
    if (!d) return;
    // A touch that never actually moved the camera — e.g. a plain tap on a
    // hotspot dot, whose pointerdown bubbles up here and arms the drag (see
    // the swipe-surface comment above onPointerDown) — needs no settle cycle: the camera never
    // left its preset, so running one would flash the hotspots hidden and
    // back for zero visual change and could step on the dot's own click.
    if (Math.abs(d.lastAngle - d.startAngle) < 0.5) return;
    const projection = Math.max(-CAR3D_MAX_PROJECTION,
      Math.min(CAR3D_MAX_PROJECTION, d.vel * CAR3D_PROJECT_MS));
    settleAtIndex(nearestPresetIndex(d.lastAngle + projection));
  };

  const onPointerUp = (e) => {
    /* Now that this listens on window it sees EVERY release on the page — ring
       taps, sheet drags, the home screen behind the closed overlay. Bail on the
       ones that were never ours rather than churning through the settle path:
       an untracked pointer with nothing armed has nothing to end. */
    if (!pointersRef.current.has(e.pointerId) && !freeDragRef.current && !swipeRef.current) return;
    const suppress = endPointer(e);
    setDragging(false);
    /* A label press that became a drag: the click the browser may fire for
       this same release is dispatched in this very task, so the flag stays up
       for it (onClickCapture on .car-swipe swallows that click) and drops
       right after — a later click on a label, from the keyboard or the next
       tap, is the label's again. */
    if (ringDragMovedRef.current) setTimeout(() => { ringDragMovedRef.current = false; }, 0);
    if (freeDragRef.current) {
      swipeRef.current = null;
      releaseFreeRotate();
      return;
    }
    if (!swipeRef.current) return;
    const sw = swipeRef.current;
    const dx = e.clientX - sw.x;
    const dy = e.clientY - sw.y;
    swipeRef.current = null;
    if (suppress) return; // this gesture was (part of) a pinch
    /* Zoomed in — the only state that arms swipeRef: a swipe in ANY direction
       just zooms back out and hands drag-to-rotate back. It deliberately does
       NOT also rotate — the user stays on the side they were inspecting.
       Hence max(|dx|,|dy|) here rather than a horizontal-dominance test. */
    if (Math.max(Math.abs(dx), Math.abs(dy)) > CAR3D_SWIPE_MIN_DISTANCE) {
      resetZoom(false);
      // Begun on a ring label: the mouse click that follows must not also
      // pick that label's zone — same swallow as a label drag when not zoomed.
      if (sw.fromLabel) {
        ringDragMovedRef.current = true;
        setTimeout(() => { ringDragMovedRef.current = false; }, 0);
      }
    }
  };

  const onPointerCancel = (e) => {
    endPointer(e);
    if (freeDragRef.current) releaseFreeRotate(); // still snap back rather than stranding the camera mid-drag
    swipeRef.current = null;
    ringDragMovedRef.current = false; // no click follows a cancel
    setDragging(false);
  };

  /* Only pointerDOWN is bound to .car-swipe (see the JSX). Everything after
     it listens on WINDOW, the same split index.js uses for the demo page's
     swipe.

     Why: one 90° face of rotation needs ~164px of travel, and a drag can leave
     the surface — into the car bar, the sheet, or clean off the browser window
     (when it was the 440px car box alone, it left constantly). A touch
     pointer doesn't care (the browser gives it implicit capture, which
     retargets every later event back to the element the press landed on), but a
     MOUSE gets no implicit capture. Bound to the element, its pointermove
     stopped firing the moment the cursor left the box and its pointerup was
     dropped entirely if the button came up out there — leaving freeDragRef,
     freeRotating, dragging and the pointersRef entry all armed, so the model
     then tracked the buttonless cursor until the next press-and-release inside
     the stage. That is the "clicking the model makes it follow the mouse" bug.

     setPointerCapture would also fix delivery, and is what CarOrbit/PartsSheet/
     the header drags use — but NOT here: capture retargets the sequence away
     from the hotspot dots, and those open the parts sheet from a synthesized
     onClick (see renderHotspot) with no pointer handlers of their own, so
     capturing on the stage would silently kill hotspot taps. Window listeners
     fix delivery without touching click targeting.

     Cost when idle is one Map.has() per mouse move: pointersRef is only
     populated between a pointerdown and its release, and it is the first line
     of onPointerMove.

     The listeners are registered ONCE and dispatch through a ref refreshed on
     every render, because these closures go stale fast — releaseFreeRotate ->
     settleAtIndex reads the viewIndex STATE, and a stale one would settle onto
     the wrong zone. Re-registering per render would work too, but the drag
     re-renders on every move (setRingAngle), i.e. ~60 add/removes a second. */
  const handlersRef = useRef(null);
  handlersRef.current = { onPointerMove, onPointerUp, onPointerCancel };
  useEffect(() => {
    const move = (e) => handlersRef.current.onPointerMove(e);
    const up = (e) => handlersRef.current.onPointerUp(e);
    const cancel = (e) => handlersRef.current.onPointerCancel(e);
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
    return () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancel);
    };
  }, []);

  /* Native model-viewer hotspot: a slotted child of <model-viewer> carrying a
     3D anchor, rather than an HTML dot positioned by percentage over the canvas.
     model-viewer projects data-position every frame, so these track the car by
     themselves instead of needing a per-zone percentage table.

     The slot name is zone-qualified because it's the identity model-viewer keys
     each hotspot by, and brake-pad-f / brake-pad-r appear in BOTH side zones with
     different anchors — a bare id would collide and one side would render at the
     other's point. The React key matches for the same reason. */
  const renderHotspot = (h) => {
    const anchor = hotspots3D[visibleZone] && hotspots3D[visibleZone][h.id];
    if (!anchor) return null;
    const slotId = visibleZone + "-" + h.id;
    return (
      <button
        key={slotId}
        slot={"hotspot-" + slotId}
        data-position={anchor.position}
        data-normal={anchor.normal}
        className="hotspot hotspot-3d"
        onClick={(e) => {
          e.stopPropagation();
          // A pinch that happens to start on a dot must not open the parts
          // sheet when the fingers lift.
          if (pinchedRef.current || pinchRef.current) return;
          onPickHotspot(visibleZone, h.id);
        }}
        aria-label={h.label}
      >
        <span className="hotspot-pulse" />
        <span className="hotspot-dot" />
        <span className="hotspot-label">{h.label}</span>
      </button>
    );
  };

  /* ?anchors=1 only (CAR3D_ANCHOR_DEV) — see that constant. Lives on
     .car-stage-3d, not <model-viewer>: the viewer is pointer-events: none (see
     its CSS), so a click on the car really targets .car-stage-3d itself.
     Hotspot dots stop their own click, so they never log. A MOUSE drag
     that stays inside the stage also ends in a click — pinchedRef/freeDragRef
     are already cleared by then (pointerup runs before click), so travel since
     pointerdown is the tell; touch drags never produce a click. With the parts
     sheet expanded the .ps-scrim takes the click, so author with the sheet in
     peek. Zoomed in is fine, and more precise. */
  const onAnchorClick = (e) => {
    const mv = viewerRef.current;
    const start = anchorTapRef.current;
    anchorTapRef.current = null;
    if (!mv || !mv.positionAndNormalFromPoint) return;
    if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 4) return;
    // Viewport coordinates, exactly as anchorFromPoint passes them.
    const hit = mv.positionAndNormalFromPoint(e.clientX, e.clientY);
    if (!hit) { console.log("[anchors] " + visibleZone + ": missed the model"); return; }
    // Same shape as the table: 4 decimals, integers bare ("0", "-1", "-0.2290").
    const fmt = (v) => car3dParseVec(v).map((n) => {
      const f = n.toFixed(4);
      return Number.isInteger(+f) ? String(+f) : f;
    }).join(" ");
    const have = hotspots3D[visibleZone] || {};
    const todo = LOC_ZONES[visibleZone].hotspots.map((p) => p.id).filter((id) => !have[id]);
    // The material under the tap too: that is how a car's look slots get
    // filled, and how you learn whether its seat has a material of its own.
    let matName = null;
    try { const m = mv.materialFromPoint && mv.materialFromPoint(e.clientX, e.clientY); matName = m ? m.name : null; } catch (err) {}
    console.log(
      "[anchors] " + visibleZone + ' -> "<part-id>": { position: "' + fmt(hit.position) + '", normal: "' + fmt(hit.normal) + '" },'
      + '   material: "' + (matName || "?") + '"'
      + (todo.length ? "   still unanchored in this zone: " + todo.join(", ") : "")
    );
  };

  return (
    /* The swipe surface — pointerdown ONLY, and it has to be here, on the
       ancestor of everything a gesture may start on: the hint block the screen
       passes in, the ring's gaps, the car, its hotspot dots (they target the
       dot and bubble up through model-viewer) and the pill under it.
       move/up/cancel are on window instead; see their useEffect for why.
       The CSS on .car-swipe has the history of how this surface got this big. */
    <div
      className="car-swipe"
      onPointerDown={onPointerDown}
      /* A mouse drag that began on a ring label and came up over that same
         label (it rides the cursor almost 1:1) ends in a click on it, which
         would pick the label's zone and undo the settle the drag just began.
         Capture phase, so this runs before the label's own onClick and can
         stop it. Only a press that really moved sets the flag (see
         onPointerMove); a plain tap on a label picks its zone as ever. */
      onClickCapture={(e) => {
        if (ringDragMovedRef.current && e.target.closest(".zone-ring")) {
          ringDragMovedRef.current = false;
          e.stopPropagation();
        }
      }}
    >
      {/* The screen's hint block (.loc-head). Rendered here, inside the
          surface, so a swipe that starts on the hint line rotates the car —
          its height still positions the ring and the car below it exactly as
          it did as the screen's own child (see the .car-swipe layout note). */}
      {children}
      <div className="orbit-stage">
      {/* Zone ring — a SIBLING of .car-stage-3d (the old .view-label slot),
          positioned off .orbit-stage, which puts it inside the swipe surface:
          a press on a label bubbles to onPointerDown like any other, so a
          swipe that begins on a label turns the car, while a tap on one is
          recognised there and hides no hotspots (the label's click still picks
          the zone) — no stopPropagation needed here, and pointersRef sees
          every press. Local viewIndex stays the source of truth;
          goTo already ends with onPickZone so the parent sheet follows the
          same path a drag uses. No isOrbitZone guard: this screen only has
          the four orbit zones. dragging={freeRotating}, not the hardcoded
          false this used to be: a live drag needs the ring to track the
          finger 1:1 (transitions killed, same as CarOrbit's own ring), then
          get its transition back the instant it settles on release.
          showTrack draws the solid orbit ellipse the labels ride on — once
          that's visible, tapping a step arrow and tapping the zone label
          itself were two ways to do the exact same onPick(zid), so
          showArrows={false} drops the redundant one. Stepping still works
          two other ways: tap a zone label directly, or drag the car.
          CarOrbit passes the same pair now so both screens present one
          identical dial — see its call site.

          Held back until hotspotsReady, the same flag the hotspot dots, the
          header hint and the drag hint wait on, so the whole navigation layer
          arrives on one beat once the car is actually there. It used to show
          immediately, which put a full-opacity orbit ellipse and four live zone
          labels over an empty stage for the whole download — next to a loader
          saying the model had not arrived — and let a zone be picked before
          there was a car to orbit. On a failed load it stays hidden for good,
          which is right: the retry button is the only useful control when there
          is no model.

          ready= is an opacity fade, NOT a conditional render, matching the two
          hints and for a reason of its own: this component's own docs say to
          mount it without a key because remounting destroys its transitions —
          so unmounting it for the whole download is exactly what it asks you
          not to do. The one remount it does get is the whole stage's, on a
          car switch (key={car.id} at Locate3DScreen's call site), which only
          ever happens with the screen closed.

          CarOrbit's call site deliberately omits ready: the 2D cube screen has
          no model to wait for. */}
      <ZoneRing
        angle={ringAngle}
        dragging={freeRotating}
        settleMs={CAR3D_ROTATION_SETTLE_MS}
        onPick={(zid) => goTo(CAR3D_VIEW_ZONES.indexOf(zid))}
        showTrack
        showArrows={false}
        ready={hotspotsReady}
      />
      {/* The hide flag moved here from .hotspots-overlay — the hotspots are
          slotted inside <model-viewer> now, so there's no overlay wrapper left
          to fade. Same inputs, same 0.15s fade, just driven from the stage. */}
      <div
        className="car-stage-3d"
        data-hotspots-hidden={rotating || dragging || !hotspotsReady}
        /* Cross-fades model-viewer in as the loader leaves. modelLoaded, not
           hotspotsReady — the car arrives on the beat the cube goes, the dots
           follow 300ms later. */
        data-model-ready={modelLoaded ? "true" : "false"}
        /* No pointer handler here any more — the swipe surface is .car-swipe
           above. Dev-only anchor authoring stays on this box: undefined (no
           listener at all) without ?anchors=1. See onAnchorClick. */
        onClick={CAR3D_ANCHOR_DEV ? onAnchorClick : undefined}
      >
        <model-viewer
          ref={viewerRef}
          /* The url comes from the CARS registry (bump its ?v= there). No src
             at all until the first open: React omits the attribute while
             `armed` is false, and model-viewer loads nothing without one. */
          src={armed ? model.src : undefined}
          /* No `poster` attribute on purpose: the stage shows nothing but the
             cube and its caption while loading. A still of the car was tried
             here and dropped — between it, a progress bar and a percentage,
             the same fact was being reported three ways at once. */
          /* eager, not the default "auto": fetch the moment src is set. "auto"
             also waits for the element to be near the viewport, and this
             screen is parked one viewport below, so the load would sit out the
             slide-up for nothing. The gating is `armed`, not this attribute. */
          loading="eager"
          alt="نموذج ثلاثي الأبعاد للسيارة"
          camera-orbit={car3dOrbitAt(camera, 0)}
          shadow-intensity="1"
          /* 0.45, not model-viewer's softer default look: at 0.75 the blur is
             wide enough to leak light through a dense underbody, and the
             Maxima's ground shadow came out with bright holes around the
             exhaust tips and a patchy middle. The other three barely change
             between the two values -- their shadow just sits a little
             tighter. */
          shadow-softness="0.45"
          exposure="0.9"
        >
          {/* Replaces model-viewer's built-in progress bar (part=
              "default-progress-bar") — a 5px gray bar pinned across the top of
              the model box that reads as a stray horizontal scrollbar and
              collides with the zone title above it. Slotting an empty div is
              the documented way to drop it. */}
          <div slot="progress-bar"></div>
          {/* Native hotspots live INSIDE model-viewer — that's what lets it
              project them onto the model. Only the current zone's are rendered,
              same as before; the model has anchors for every zone, but showing
              them all at once would put side-zone dots on the front view. */}
          {LOC_ZONES[visibleZone].hotspots.map((h) => renderHotspot(h))}
        </model-viewer>
        {/* Inside the stage, not under it: the loader now sits on the car's own
            optical centre, which is where the eye already is. Idle until the
            stage is armed, so its timers only ever run against a real load. */}
        <ModelLoader viewerRef={viewerRef} active={armed} onFailed={setModelFailed} />
        {/* After the loader in the tree, so they paint over the car rather than
            under it. aria-hidden: the zone ring above already names these two
            sides to a screen reader, and this is its visual echo, not a second
            piece of information. */}
        <div className="side-tag" data-side="right" data-show={sideTagOn ? "true" : "false"} aria-hidden="true">يمين</div>
        <div className="side-tag" data-side="left" data-show={sideTagOn ? "true" : "false"} aria-hidden="true">يسار</div>
      </div>
      {/* The hint's footer slot, under the stage. Inert (pointer-events: none
          in its rule): the pill says "drag", and a drag that starts on it is
          the surface's — it bubbles to .car-swipe and rotates the car. */}
      <div className="stage-footer">
        <div className="drag-hint" data-ready={hotspotsReady ? "true" : "false"}>
          <svg width="18" height="12" viewBox="0 0 20 14" fill="none">
            <path d="M2 7 L6 3 M2 7 L6 11 M2 7 L18 7 M18 7 L14 3 M18 7 L14 11" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
          </svg>
          <span>اسحب للدوران حول السيارة</span>
        </div>
      </div>
      </div>
    </div>
  );
}

/* Bottom sheet: zone title + chevron in peek; category-filter row + parts list when open.
   Category chip order is derived from parts insertion order (Set preserves order) — since
   parts are sorted by sales rank, the categories the customer is most likely to buy
   from surface first. */
function PartsSheet({ zone, mode, onToggle, cat, setCat, onAddPart, addedIds, activePartId, tapNonce, loading }) {
  // Chips are the parts' real app categories (umbrella labels), derived from
  // kind, not the old VS bucket. "أخرى" (uncategorized strays) sorts last.
  const cats = useMemo(() => {
    const seen = [];
    for (const p of zone.parts) { const c = partChipLabel(p); if (!seen.includes(c)) seen.push(c); }
    const rest = seen.filter((c) => c !== "أخرى");
    const other = seen.filter((c) => c === "أخرى");
    return ["الكل", ...rest, ...other];
  }, [zone]);
  // Lead with the part the user tapped on the diagram: filter to its category,
  // then hoist that exact part to the top so the tap's precision isn't lost in
  // the category list. If the active part isn't in the current filter (e.g. the
  // user switched chips), nothing is hoisted and order stays natural.
  const filtered = useMemo(() => {
    const base = cat === "الكل" ? zone.parts : zone.parts.filter((p) => partChipLabel(p) === cat);
    const idx = activePartId ? base.findIndex((p) => p.id === activePartId) : -1;
    if (idx < 0) return base;
    // Lead with the tapped part, then rank the rest by position match to where
    // it was tapped (sales order kept within a match tier).
    const lead = base[idx];
    const tapped = locPos(lead);
    const rest = base
      .filter((_, i) => i !== idx)
      .map((p, i) => ({ p, i, s: posMatchScore(locPos(p), tapped) }))
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map((x) => x.p);
    return [lead, ...rest];
  }, [zone, cat, activePartId]);

  // On each new pick (tapNonce bumps), snap the list back to the top so the
  // hoisted lead row is in view even if the list was scrolled.
  const listRef = useRef(null);
  useEffect(() => { if (listRef.current) listRef.current.scrollTop = 0; }, [tapNonce]);

  // Drag-to-toggle: pointer-down anywhere on the head/handle, pan vertically, release.
  // A short pointer trip (no real motion) is treated as a tap and toggles. A longer
  // drag commits if it crossed DRAG_THRESHOLD, otherwise snaps back.
  const [dragY, setDragY] = useState(0);
  const dragRef = useRef(null);
  const DRAG_THRESHOLD = 56;
  const TAP_TOLERANCE = 4;

  const beginDrag = (e) => {
    // Let the chevron button keep its own click semantics
    if (e.target.closest && e.target.closest(".ps-toggle")) return;
    const y = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : null);
    if (y == null) return;
    dragRef.current = { startY: y, startMode: mode, moved: false };
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  };
  const moveDrag = (e) => {
    if (!dragRef.current) return;
    const y = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : null);
    if (y == null) return;
    const dy = y - dragRef.current.startY;
    if (Math.abs(dy) > TAP_TOLERANCE) dragRef.current.moved = true;
    // From open, only downward drag matters. From peek, only upward.
    setDragY(dragRef.current.startMode === "open" ? Math.max(0, dy) : Math.min(0, dy));
  };
  const endDrag = () => {
    if (!dragRef.current) return;
    const { startMode, moved } = dragRef.current;
    dragRef.current = null;
    const dy = dragY;
    setDragY(0);
    if (!moved) { onToggle(); return; }
    if (startMode === "open" && dy > DRAG_THRESHOLD) onToggle();
    else if (startMode === "peek" && dy < -DRAG_THRESHOLD) onToggle();
  };

  // While dragging, override the transform with the live offset (and kill the
  // settle transition so finger-tracking is 1:1). On release we restore the
  // class-driven transform and the transition takes over for the snap.
  const liveStyle = dragY !== 0 ? {
    transform: mode === "open"
      ? "translateY(" + dragY + "px)"
      : "translateY(calc(100% - 76px + " + dragY + "px))",
    transition: "none",
  } : undefined;

  return (
    <>
      {/* Scrim — appears above the cube when the sheet is expanded. Tap anywhere
          outside the sheet to dismiss back to peek. Lightly tinted so the user
          gets a visual cue that the cube area isn't the active surface anymore. */}
      {mode === "open" && <div className="ps-scrim" onClick={onToggle} />}
    <div className="parts-sheet" data-mode={mode} style={liveStyle}>
      <div
        className="ps-drag-zone"
        onPointerDown={beginDrag}
        onPointerMove={moveDrag}
        onPointerUp={endDrag}
        onPointerCancel={endDrag}
      >
        <div className="ps-handle" />
        <div className="ps-head">
          {/* The head text is the ONLY part of the sheet visible while the model
              loads: peek shows 76px of chrome and the filter row and list are
              display:none. So this is where the skeleton has to live — shimmer
              only the list and the whole thing would be invisible.
              Bar heights are matched to the MEASURED real block, not to the font
              sizes: title+desc render 42.7px tall, so 20 + 2 (the wrapper's gap)
              + 4 + 16 = 42 keeps the swap from nudging the head. (On a very
              narrow screen the real .ps-desc can wrap to two lines while this
              stays one; peek height is fixed by the transform, so that shifts
              nothing — it only leaves a little more air.) */}
          <div className="ps-head-text">
            {loading ? (
              <>
                <div className="sk-line sk-shimmer" style={{ width: 104, height: 20 }} />
                <div className="sk-line sk-shimmer" style={{ width: 172, height: 16, marginTop: 4 }} />
              </>
            ) : (
              <>
                <div className="ps-title">{zone.label}</div>
                <div className="ps-desc">{zone.desc}</div>
              </>
            )}
          </div>
          <button
            className="ps-toggle"
            onClick={(e) => { e.stopPropagation(); onToggle(); }}
            aria-label="تبديل القائمة"
          >
            <IconChevron />
          </button>
        </div>
      </div>

      {/* Chips and list only show in `open`, so these two branches are for the
          case where the user pulls the sheet up while the model is still
          downloading. 29px is .sfilter's rendered height (6px padding top and
          bottom + 12.5px text + 1px border each side). */}
      <div className="ps-filter-row">
        {loading
          ? [64, 80, 56, 92].map((w, i) => (
              <div key={i} className="sk-shimmer" style={{ width: w, height: 29, borderRadius: 999, flexShrink: 0 }} />
            ))
          : cats.map((c) => (
              <button
                key={c}
                className={"sfilter" + (c === cat ? " active" : "")}
                onClick={() => setCat(c)}
              >{c}</button>
            ))}
      </div>

      <div className="ps-list" ref={listRef}>
        {loading && [0, 1, 2, 3, 4, 5].map((i) => <SkeletonRow key={i} variant="part" />)}
        {!loading && filtered.map((p) => {
          const isTapped = p.id === activePartId;
          return (
            <SearchResultRow
              // Re-key the lead row per pick so its entrance flash replays even
              // when the same part is tapped again.
              key={isTapped ? p.id + "-" + tapNonce : p.id}
              p={locPartToRow(p)}
              added={addedIds && addedIds.has(p.id)}
              highlight={isTapped}
              onAddToCart={onAddPart ? () => onAddPart(p) : undefined}
              /* No PDP route in this standalone build — a navigate() here would
                 push a hash entry that renders nothing and silently swallows
                 the user's next back press. */
            />
          );
        })}
      </div>
    </div>
    </>
  );
}

/* ---------------------------------------------------------------------------
   Parts-sheet back level
   ---------------------------------------------------------------------------
   As far as the user is concerned the expanded sheet IS the screen they are
   on — it covers the car and it's what they're reading. So on Android the
   hardware back button has to collapse it back to peek, not close the whole
   visual-search screen. It only can if expanding pushed a history entry of
   its own: without one the single entry on the stack is the screen's, back
   popped that, and the user got thrown all the way out to the home card with
   the parts list still in front of them.

   Expanding pushes a nested entry (same `vss`, depth + 1). Collapsing — by
   chevron, scrim tap, drag-down, or a physical back press — always resolves
   through history.back(), so every route to "collapsed" leaves the stack in
   the same shape and the two can't drift apart. App.closeScreen() reads
   `depth` to unwind both levels in one go when the screen itself is dismissed.
   --------------------------------------------------------------------------- */
function useSheetBackLevel(isOpen, setSheetMode) {
  const pushedRef = useRef(false);

  useEffect(() => {
    // Landing on any entry that isn't our sheet entry means the sheet level is
    // gone (back press, or the screen being dismissed over it) → collapse.
    const onPop = () => {
      if (window.history.state && window.history.state.sheet) return;
      pushedRef.current = false;
      setSheetMode("peek");
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [setSheetMode]);

  // Screen closed by any path → its entries (ours included) are off the stack.
  useEffect(() => { if (!isOpen) pushedRef.current = false; }, [isOpen]);

  const expandSheet = () => {
    const st = window.history.state;
    if (!pushedRef.current && st && st.vss) {
      window.history.pushState({ vss: st.vss, sheet: true, depth: (st.depth || 1) + 1 }, "");
      pushedRef.current = true;
    }
    setSheetMode("open");
  };
  const collapseSheet = () => {
    // popstate (above) is what actually flips the mode back to peek.
    if (pushedRef.current) window.history.back();
    else setSheetMode("peek");
  };

  return { expandSheet, collapseSheet };
}

function LocateScreen({ car, isOpen, onClose, onCart, cartCount = 0, drawerOpen = false, cart = [], onAddToCart, onRemoveFromCart }) {
  const [activeZone, setActiveZone] = useState("front");
  const [sheetMode, setSheetMode] = useState("peek");
  // Sheet's category filter lives here so a hotspot tap can preset it. Drag-to-new-zone
  // resets to "الكل" so a stale filter doesn't yield an empty list in the new zone.
  const [cat, setCat] = useState("الكل");
  // The exact part the user tapped on the diagram, so the sheet can lead with
  // it (hoist to top + highlight). tapNonce bumps on every pick so the same
  // part re-tapped still replays the highlight flash and re-snaps the scroll.
  const [activePartId, setActivePartId] = useState(null);
  const [tapNonce, setTapNonce] = useState(0);
  const zone = LOC_ZONES[activeZone];
  // Expanding the sheet is its own back level — see useSheetBackLevel.
  const { expandSheet, collapseSheet } = useSheetBackLevel(isOpen, setSheetMode);

  // Every open lands on the front zone. The screen is always mounted, so without
  // this the last zone would persist. CarOrbit snaps to the front face on open
  // (no entrance spin, see doc/DECISIONS.md); this keeps the zone STATE + sheet in
  // sync and clears any stale filter / lead-part highlight from the last session.
  useEffect(() => {
    if (!isOpen) return;
    setActiveZone("front");
    setCat("الكل");
    setActivePartId(null);
    setSheetMode("peek");
  }, [isOpen]);

  // The check-mark "added" state derives from the REAL cart, not local
  // state. So a part added from /locate shows ✓ here, the cart icon
  // increments, AND the matching cat-page PDP / Discover card see qty>0
  // for the same canonical key. resolveLocPartKey() maps each loc-part
  // to its PRODUCTS or CATALOG twin so the cart line is the canonical
  // version, not a 3D-screen-specific duplicate.
  const addedIds = useMemo(() => {
    const ids = new Set();
    const liveCartKeys = new Set(cart.filter((it) => !it.pending).map((it) => it.key));
    for (const zid of LOC_ZONE_ORDER) {
      for (const p of LOC_ZONES[zid].parts) {
        if (liveCartKeys.has(resolveLocPartKey(p))) ids.add(p.id);
      }
    }
    return ids;
  }, [cart]);

  // Drag-to-new-zone resets the filter AND the lead part: a stale highlight
  // from another zone would point at a row that isn't here.
  const onZoneChange = (zid) => { setActiveZone(zid); setCat("الكل"); setActivePartId(null); };
  const onPickHotspot = (zoneId, hotspotId) => {
    const part = LOC_ZONES[zoneId].parts.find((p) => p.id === hotspotId);
    setActiveZone(zoneId);
    setCat(part ? partChipLabel(part) : "الكل");
    setActivePartId(part ? part.id : null);
    setTapNonce((n) => n + 1);
    expandSheet();
  };
  /* Toggle semantics: tap adds the canonical key to cart; tap again on
     an item already in cart removes it entirely (hard delete, no qty
     fiddling). Matches the user's mental model on a quick-add row,
     "I added the wrong thing, let me undo." Removal here is destructive
     by design, qty=3 from another surface gets fully cleared if the
     buyer taps ✓ here. That is the intended behavior, the cart drawer
     is where you fine-tune qty. */
  const onAddPart = (p) => {
    const key = resolveLocPartKey(p);
    const liveItem = cart.find((it) => it.key === key && !it.pending);
    if (liveItem) {
      if (onRemoveFromCart) onRemoveFromCart(key);
    } else if (onAddToCart) {
      onAddToCart(key);
    }
  };

  // Drag-to-close from the header. Two states: `dragging` (finger down,
  // 1:1 follow with transition:none) and the release animation phase
  // (transition restored so the slide back / slide down animates
  // smoothly). Cart + close buttons are excluded so their taps stay
  // sensitive (a captured pointer on this div otherwise swallows their click).
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);
  const CLOSE_THRESHOLD = 0.28; // fraction of viewport height
  const CLOSE_ANIM_MS = 300;
  const onHeaderPointerDown = (e) => {
    if (e.target.closest && e.target.closest(".loc-cart, .loc-back")) return;
    dragRef.current = { startY: e.clientY };
    setDragging(true);
    if (e.currentTarget.setPointerCapture) {
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    }
  };
  const onHeaderPointerMove = (e) => {
    if (!dragRef.current) return;
    const dy = Math.max(0, e.clientY - dragRef.current.startY);
    setDragY(dy);
  };
  const onHeaderPointerUp = () => {
    if (!dragRef.current) return;
    dragRef.current = null;
    setDragging(false);
    const threshold = window.innerHeight * CLOSE_THRESHOLD;
    if (dragY > threshold) {
      // Animate inline transform from current dragY down past the
      // viewport, then call onClose so the route + class drop happen
      // at the moment the sheet is fully off-screen.
      setDragY(window.innerHeight);
      setTimeout(() => {
        setDragY(0);
        onClose();
      }, CLOSE_ANIM_MS);
    } else {
      // Snap back — inline transform animates to 0 with the snap curve.
      setDragY(0);
    }
  };

  // Inline style for the three phases:
  // - dragging: 1:1 with finger, no transition (jitter-free follow)
  // - releasing (snap-back or close-animation): explicit transition curve
  // - at rest (dragY === 0): no inline style, CSS rules take over
  const screenStyle = (() => {
    if (dragging) return { transform: "translateY(" + dragY + "px)", transition: "none" };
    if (dragY > 0) return { transform: "translateY(" + dragY + "px)", transition: "transform " + CLOSE_ANIM_MS + "ms cubic-bezier(.22, 1, .36, 1)" };
    return undefined;
  })();

  return (
    <div
      className={"locate-screen" + (isOpen ? " is-open" : "")}
      aria-hidden={!isOpen}
      style={screenStyle}
    >
      <div
        className="car-bar loc-carbar"
        onPointerDown={onHeaderPointerDown}
        onPointerMove={onHeaderPointerMove}
        onPointerUp={onHeaderPointerUp}
        onPointerCancel={onHeaderPointerUp}
      >
        {/* Hide the locate sheet's X while a drawer (cart/menu) is on top —
            the drawer's own close affordance owns the foreground and two
            X's competing in the same visual field is ambiguous. Reappears
            the moment the drawer closes. visibility: hidden (not display:
            none / conditional render) so the slot reserves its space — the
            car name doesn't jitter sideways when the X comes and goes. */}
        <button
          className={"loc-back" + (drawerOpen ? " is-hidden" : "")}
          onClick={onClose}
          aria-label="إغلاق"
        ><IconClose /></button>
        <div className="car-bar-body">
          <div className="car-bar-name">{car.name}</div>
        </div>
        <button className="loc-cart" onClick={onCart} aria-label="السلة">
          <IconCart />
          {cartCount > 0 && <span className="loc-cart-badge">{cartCount}</span>}
        </button>
      </div>

      <div className="loc-head">
        <p className="loc-hint">اضغط على النقاط التفاعليه لعرض القطع</p>
      </div>

      <CarOrbit
        activeZone={activeZone}
        isOpen={isOpen}
        onPickZone={onZoneChange}
        onPickHotspot={onPickHotspot}
      />

      <PartsSheet
        zone={zone}
        mode={sheetMode}
        cat={cat}
        setCat={setCat}
        onAddPart={onAddPart}
        addedIds={addedIds}
        activePartId={activePartId}
        tapNonce={tapNonce}
        onToggle={() => (sheetMode === "open" ? collapseSheet() : expandSheet())}
      />
    </div>
  );
}

/* ============================================================================
   Advanced Visual Search (3D) — #/locate-3d
   ----------------------------------------------------------------------------
   Same shell as LocateScreen (header, hint, bottom parts sheet) and the same
   zone/hotspot/parts-sheet wiring, but the car body is the real 3D model
   (CarStage3D) instead of the image cube — swiping left/right steps through
   CAR3D_VIEW_ZONES instead of dragging the cube. Tapping a hotspot opens the
   parts sheet exactly like LocateScreen's onPickHotspot.
   ============================================================================ */
function Locate3DScreen({ car, isOpen, onClose, onCart, cartCount = 0, drawerOpen = false, cart = [], onAddToCart, onRemoveFromCart }) {
  const [activeZone, setActiveZone] = useState("front");
  const [sheetMode, setSheetMode] = useState("peek");
  const [cat, setCat] = useState("الكل");
  const [activePartId, setActivePartId] = useState(null);
  const [tapNonce, setTapNonce] = useState(0);
  /* "loading" | "ready" | "failed", reported up from CarStage3D — everything
     this screen needs to know about the stage. Deliberately NOT reset by the
     per-open effect below, for the same reason the stage never resets
     modelLoaded: the GLB stays loaded, so a reopened screen should show its
     content straight away rather than replay the reveal over a visible car.
     It DOES reset on a car switch, but through the stage's remount
     (key={car.id} at the call site): the fresh stage's notify effect reports
     "loading" on mount (and downloads nothing until that car is opened), so
     nothing here has to know about cars.
     setStageState is a stable useState setter, so passing it straight down does
     not re-fire the stage's notify effect on every render.

     The two derived flags differ ONLY on failure, and deliberately so:
       - stageReady gates the header hint and the zone ring. Both point at a car,
         so if none arrives they stay hidden and the loader's retry button is
         left as the one useful control.
       - sheetLoading gates the parts sheet's skeleton, which is staging over
         real local data. It must clear on failure too, or the sheet would
         shimmer for ever and bury parts the user can actually still browse. */
  const [stageState, setStageState] = useState("loading");
  const stageReady = stageState === "ready";
  const sheetLoading = stageState === "loading";
  // Whether this car has any 3D anchors at all -- a new GLB starts without them.
  const hasAnchors = !!car.model && Object.keys(car.model.hotspots || {}).length > 0;
  const zone = LOC_ZONES[activeZone];
  // Expanding the sheet is its own back level — see useSheetBackLevel.
  const { expandSheet, collapseSheet } = useSheetBackLevel(isOpen, setSheetMode);

  // Every open lands on the front zone, same as LocateScreen — the screen is
  // always mounted, so without this the last zone/filter would persist.
  // car.id is a guard for a future in-screen car switch: today the switch
  // always happens from the home screen with this screen closed, but the
  // stage under it remounts per car (key={car.id}) and lands on front, so
  // this must follow it if that ever changes.
  useEffect(() => {
    if (!isOpen) return;
    setActiveZone("front");
    setCat("الكل");
    setActivePartId(null);
    setSheetMode("peek");
  }, [isOpen, car.id]);

  const addedIds = useMemo(() => {
    const ids = new Set();
    const liveCartKeys = new Set(cart.filter((it) => !it.pending).map((it) => it.key));
    for (const zid of LOC_ORBIT_ZONES) {
      for (const p of LOC_ZONES[zid].parts) {
        if (liveCartKeys.has(resolveLocPartKey(p))) ids.add(p.id);
      }
    }
    return ids;
  }, [cart]);

  // Swiping to a new face resets the filter AND the lead part, same as the
  // 2D screen's onZoneChange — a stale highlight from another zone would
  // point at a row that isn't here.
  const onZoneChange = (zid) => { setActiveZone(zid); setCat("الكل"); setActivePartId(null); };
  const onPickHotspot = (zoneId, hotspotId) => {
    const part = LOC_ZONES[zoneId].parts.find((p) => p.id === hotspotId);
    setActiveZone(zoneId);
    setCat(part ? partChipLabel(part) : "الكل");
    setActivePartId(part ? part.id : null);
    setTapNonce((n) => n + 1);
    expandSheet();
  };

  const onAddPart = (p) => {
    const key = resolveLocPartKey(p);
    const liveItem = cart.find((it) => it.key === key && !it.pending);
    if (liveItem) {
      if (onRemoveFromCart) onRemoveFromCart(key);
    } else if (onAddToCart) {
      onAddToCart(key);
    }
  };

  // Same drag-to-close header behavior as LocateScreen.
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);
  const CLOSE_THRESHOLD = 0.28;
  const CLOSE_ANIM_MS = 300;
  const onHeaderPointerDown = (e) => {
    if (e.target.closest && e.target.closest(".loc-cart, .loc-back")) return;
    dragRef.current = { startY: e.clientY };
    setDragging(true);
    if (e.currentTarget.setPointerCapture) {
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    }
  };
  const onHeaderPointerMove = (e) => {
    if (!dragRef.current) return;
    const dy = Math.max(0, e.clientY - dragRef.current.startY);
    setDragY(dy);
  };
  const onHeaderPointerUp = () => {
    if (!dragRef.current) return;
    dragRef.current = null;
    setDragging(false);
    const threshold = window.innerHeight * CLOSE_THRESHOLD;
    if (dragY > threshold) {
      setDragY(window.innerHeight);
      setTimeout(() => {
        setDragY(0);
        onClose();
      }, CLOSE_ANIM_MS);
    } else {
      setDragY(0);
    }
  };
  const screenStyle = (() => {
    if (dragging) return { transform: "translateY(" + dragY + "px)", transition: "none" };
    if (dragY > 0) return { transform: "translateY(" + dragY + "px)", transition: "transform " + CLOSE_ANIM_MS + "ms cubic-bezier(.22, 1, .36, 1)" };
    return undefined;
  })();

  return (
    <div
      className={"locate-screen" + (isOpen ? " is-open" : "")}
      aria-hidden={!isOpen}
      style={screenStyle}
    >
      <div
        className="car-bar loc-carbar"
        onPointerDown={onHeaderPointerDown}
        onPointerMove={onHeaderPointerMove}
        onPointerUp={onHeaderPointerUp}
        onPointerCancel={onHeaderPointerUp}
      >
        <button
          className={"loc-back" + (drawerOpen ? " is-hidden" : "")}
          onClick={onClose}
          aria-label="إغلاق"
        ><IconClose /></button>
        <div className="car-bar-body">
          <div className="car-bar-name">{car.name}</div>
        </div>
        <button className="loc-cart" onClick={onCart} aria-label="السلة">
          <IconCart />
          {cartCount > 0 && <span className="loc-cart-badge">{cartCount}</span>}
        </button>
      </div>

      {/* key={car.id}: a car switch is a new GLB, and everything inside the
          stage — `armed` (a switched-to car waits for its own tap), the loader
          with its progress/stall/dead timers, the captured base FOV and camera
          target, zoom, viewIndex, ringAngle, modelLoaded — was captured for
          the old one. Swapping `src` in place left all of it
          stale: no loader for the second car, old hotspots floating at old
          anchors until the new model landed. Remounting is cheap because the
          switch can only happen from the home screen with this screen closed,
          so the ring's remount snap is never seen. */}
      <CarStage3D
        key={car.id}
        car={car}
        isOpen={isOpen}
        onPickZone={onZoneChange}
        onPickHotspot={onPickHotspot}
        onStageState={setStageState}
      >
        {/* The hint block goes INSIDE the stage's swipe surface (.car-swipe),
            so a swipe that starts on this line rotates the car like one that
            starts on the car — it is rendered right above .orbit-stage, in
            the same flex column, so nothing about its height or spacing
            changes. It stays authored here because what it says depends on
            this screen's state.
            data-ready, not a conditional render — this block's height
            positions the ring and the car below it, so it has to keep its
            space while it waits. See the .loc-head rules. */}
        <div className="loc-head" data-ready={stageReady ? "true" : "false"}>
          {/* Only a car with hotspot anchors is told to tap the dots. A car
              whose table is still empty (see the registry recipe) keeps the
              ring and the parts list, and this block keeps its height; just
              the sentence goes. */}
          {hasAnchors && <p className="loc-hint">اضغط على النقاط التفاعليه لعرض القطع</p>}
        </div>
      </CarStage3D>

      <PartsSheet
        zone={zone}
        mode={sheetMode}
        cat={cat}
        setCat={setCat}
        onAddPart={onAddPart}
        addedIds={addedIds}
        activePartId={activePartId}
        tapNonce={tapNonce}
        onToggle={() => (sheetMode === "open" ? collapseSheet() : expandSheet())}
        /* Only this screen passes it — LocateScreen's sheet has no model to
           wait for, and the prop defaults to false there. */
        loading={sheetLoading}
      />
    </div>
  );
}

/* ============================================================================
   Product Detail Screen (PDP) — #/p/{key}
   ============================================================================
   The atomic unit of the prod architecture. Lands from search, 3D sheet,
   recommended cards, recently-viewed, etc. Top-to-bottom hierarchy:

     gallery → fitment confirm → title/oem/make/rating → price → CTA →
     expanded fitment → details → alt offers → reviews → trust → related

   The single most important answer for an auto-parts buyer is "does it fit
   my car?" — so the green fitment strip sits above title and price.
   ============================================================================ */

function PdpStars({ value, size = 14 }) {
  const filled = Math.round(value);
  return (
    <span className="pdp-stars" style={{ fontSize: size }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span key={n} className={"pdp-star" + (n <= filled ? " on" : "")}>★</span>
      ))}
    </span>
  );
}

function PdpGallery({ p, onShowPhotoInfo }) {
  // For now: a single placeholder hero built from the existing ProductImage glyph
  // on a soft canvas. Dots row hints at multi-image even though we only have one.
  // Position badge belongs ON the image — even when supplier photo quality is
  // weak, the glyph confirms where on the car this part lives (front-left,
  // rear, etc.). The OEM number takes the inline-end accent slot in the
  // title card; the two signals serve different roles on different surfaces.
  // The bottom caption is the cross-link to the "why illustrative" sheet —
  // pre-empts the "is this really the part?" reaction by acknowledging the
  // photo limitation honestly and offering the explanation on demand.
  return (
    <div className="pdp-gallery">
      <div className="pdp-hero">
        <ProductImage kind={p.kind} />
      </div>
      <PdpPosBadgeReveal pos={p.pos} />
      <div className="pdp-dots" aria-hidden="true">
        <span className="on" /><span /><span /><span />
      </div>
      <div className="pdp-photo-note">
        <span>الصورة للتوضيح فقط</span>
        <button
          type="button"
          className="pdp-photo-note-link"
          onClick={onShowPhotoInfo}
        >
          اعرف السبب
        </button>
      </div>
    </div>
  );
}

/* Make-type explainer — bottom sheet that surfaces the OEM vs Aftermarket
   distinction in plain Arabic. Triggered from the (i) button next to the
   make tag in the PDP hero. The Saudi market has wide variance in how
   buyers understand "أصلي وكالة" vs "بديل"; the sheet gives them the same
   reference a counter-staff person would. */
function PdpMakeInfoSheet({ open, onClose }) {
  return (
    <BottomSheet open={open} onClose={onClose} title="أصلي أم بديل؟">
      <div className="pdp-makeinfo">
        <div className="pdp-makeinfo-section">
          <h3 className="pdp-makeinfo-title">أصلي وكالة</h3>
          <p className="pdp-makeinfo-desc">
            تُصنع لدى شركة السيارة المصنعة أو خصيصاً لها بنفس مواصفاتها.
          </p>
          <ul className="pdp-makeinfo-points">
            <li>مطابقة لمواصفات السيارة</li>
            <li>ضمان وكالة</li>
            <li>أعلى سعراً</li>
          </ul>
        </div>

        <div className="pdp-makeinfo-section">
          <h3 className="pdp-makeinfo-title">بديل</h3>
          <p className="pdp-makeinfo-desc">
            مصنع مختلف ينتج قطعا متوافقة مع سيارتك.
          </p>
          <ul className="pdp-makeinfo-points">
            <li>سعر أقل</li>
            <li>الجودة تتفاوت بحسب المصنّع</li>
            <li>بعض العلامات (الماركات) ضمانها أطول من الأصلي</li>
            <li>سبيرو ينتقي الموثوقين فقط</li>

/* Fitment + match-guarantee block — per backlog #8(a) and the decisions
   locked in #/meter-demo:
     - Palette F (نعناعي → فيروزي → غابي): #A7F3D0 / #0EA5A4 / #047857.
     - Single-active fill (position indicator, not progress bar). Only the
       active tier's segment carries its color; the others stay gray.
     - Tier labels منخفض / متوسط / مضمون. At low/med the active position
       renders a CTA in place of its tier name («أدخل رقم الهيكل»); the
       button is black underlined (no color emphasis — meter does that).
     - Inactive labels gray (passed + future treated identically).
     - At high active, «مضمون» reads in green bold with an inline green-
       check badge as the achievement marker.
     - 5th state: VIN check returned mismatch. Meter goes neutral (all
       gray), inline alternative-product card appears, primary CTA drives
       the swap. */
const FITGUARD_PALETTE = ["#A7F3D0", "#0EA5A4", "#047857"];
const FITGUARD_TIERS = [
  { inactive: "منخفض", active: "أدخل رقم الهيكل", activeIsCta: true },
  { inactive: "متوسط", active: "أدخل رقم الهيكل", activeIsCta: true },
  { inactive: "مضمون", active: "مضمون", activeIsCta: false },
];

function PdpFitGuarantee({ confidence, carShort, verifiedVin, mismatchAlt, onOpenVin, onSwitchAlt, onShowConfidenceInfo }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setMounted(true), 60);
    return () => clearTimeout(t);
  }, []);

  // Mismatch state — VIN confirmed this SKU doesn't fit, alt exists.
  if (mismatchAlt) {
    return (
      <div className="pdp-fitguard pdp-fitguard--mismatch">
        <div className="pdp-fitguard-meter-row">
          <span className="pdp-fitguard-meter-label">هل تركب على سيارتك؟</span>
          {onShowConfidenceInfo && (
            <button
              type="button"
              className="pdp-fitguard-info-link"
              onClick={onShowConfidenceInfo}
              aria-label="اعرف مستويات التأكيد"
            >
              <IconInfo />
            </button>
          )}
        </div>
        <div className="pdp-fitguard-meter" aria-label="غير متوافقة">
          {[0, 1, 2].map((i) => (
            <div key={i} className="pdp-fitguard-meter-seg" />
          ))}
        </div>
        <div className="pdp-fitguard-meter-labels">
          {[1, 2, 3].map((n) => (
            <span key={n} className="pdp-fitguard-meter-labels-item">
              {FITGUARD_TIERS[n - 1].inactive}
            </span>
          ))}
        </div>
        <div className="pdp-fitguard-mismatch-status">
          <span className="pdp-fitguard-mismatch-icon" aria-hidden="true">✕</span>
          <span>هذه القطعة لا تركب على سيارتك</span>
        </div>
        <p className="pdp-fitguard-body">
          تم التحقق وفقاً لرقم الهيكل. هذه القطعة لا تطابق {carShort}. وجدنا البديل المطابق:
        </p>
        <button type="button" className="pdp-fitguard-alt-card" onClick={onSwitchAlt}>
          <div className="pdp-fitguard-alt-thumb">
            <ProductImage kind={mismatchAlt.kind} />
          </div>
          <div className="pdp-fitguard-alt-body">
            <div className="pdp-fitguard-alt-title">{mismatchAlt.title}</div>
            <div className="pdp-fitguard-alt-price">
              <span className="mono">{mismatchAlt.price}</span><Riyal />
            </div>
            <div className="pdp-fitguard-alt-note">
              <span className="pdp-fitguard-vinmask-ico"><IconCheck /></span>
              <span>موثّق برقم هيكل سيارتك</span>
            </div>
          </div>
        </button>
        <button type="button" className="pdp-fitguard-action-primary" onClick={onSwitchAlt}>
          انتقل للبديل المطابق
        </button>
        {verifiedVin && (
          <div className="pdp-fitguard-vinmask">
            <span className="pdp-fitguard-vinmask-ico"><IconCheck /></span>
            <span>{carShort} · رقم هيكل <span className="mono">{verifiedVin}</span></span>
          </div>
        )}
      </div>
    );
  }

  let level, bodyText;
  // High-confidence parts render AS IF the customer's VIN was already
  // attached — testers see the "fully verified" state as the natural
  // baseline for high, instead of having to enter a VIN to reach it.
  // Until the operations side of the confidence feature is built
  // (BACKLOG #34), this prototype shortcut prevents the high default
  // from feeling like a half-finished state. Uses a stable mock VIN
  // suffix tied to the current car (M6Z15 reads as Mazda 6 2015).
  // Plausible 17-char VIN for the Mazda 6 2015 prototype car:
  // JM1 (Japan/Mazda WMI) + GJ1 (Mazda 6 GJ generation 2014-2018) + U66
  // (model attributes) + F (year code 2015) + 1 (assembly plant) +
  // serial. Lets the displayed VIN read as a real chassis number.
  const HIGH_DEFAULT_VIN_MASK = "JM1GJ1U66F1500015";
  if (verifiedVin) {
    level = 3;
    bodyText = "ضمان سبيرو: تم التحقق وفقاً لرقم الهيكل، وإرجاع خلال 14 يوماً إن لم تطابق.";
  } else if (confidence === "low") {
    level = 1;
    bodyText = "نؤكد التركيب لك عبر رقم الهيكل.";
  } else if (confidence === "medium") {
    level = 2;
    bodyText = "للتأكد التام، نراجع التركيب عبر رقم الهيكل.";
  } else {
    // 'high' (default) — auto-verified body text so the prototype reads
    // as "we already have your VIN on file" for this tier.
    level = 3;
    bodyText = "ضمان سبيرو: تم التحقق وفقاً لرقم الهيكل، وإرجاع خلال 14 يوماً إن لم تطابق.";
  }
  // displayVin = the user's actually-entered VIN if present; otherwise the
  // mock for high-default parts so the vinmask chip renders in both cases.
  const displayVin = verifiedVin || (confidence !== "low" && confidence !== "medium" ? HIGH_DEFAULT_VIN_MASK : null);

  const atFull = level === 3;

  return (
    <div className={"pdp-fitguard" + (atFull ? " is-full" : "")}>
      <div className="pdp-fitguard-meter-row">
        <span className="pdp-fitguard-meter-label">هل تركب على سيارتك؟</span>
        {onShowConfidenceInfo && (
          <button
            type="button"
            className="pdp-fitguard-info-link"
            onClick={onShowConfidenceInfo}
            aria-label="اعرف مستويات التأكيد"
          >
            <IconInfo />
          </button>
        )}
      </div>
      <div
        className="pdp-fitguard-meter"
        role="meter"
        aria-valuemin={1}
        aria-valuemax={3}
        aria-valuenow={level}
        aria-label="هل تركب على سيارتك؟"
      >
        {FITGUARD_PALETTE.map((c, i) => {
          // At full (level 3) the first segment (low) drops to a lighter
          // gray so the green active segment reads more prominently — the
          // eye doesn't get pulled left by an equal-weight grey neighbour.
          let bg = "#E5E7EB";
          if (mounted && i === level - 1) bg = c;
          else if (level === 3 && i === 0) bg = "#F3F4F6";
          return (
            <div key={i} className="pdp-fitguard-meter-seg" style={{ background: bg }} />
          );
        })}
      </div>
      <div className="pdp-fitguard-meter-labels">
        {[1, 2, 3].map((n) => {
          const isActive = n === level;
          const tier = FITGUARD_TIERS[n - 1];
          const isCta = isActive && tier.activeIsCta;
          const text = isActive ? tier.active : tier.inactive;
          if (isCta) {
            return (
              <button
                key={n}
                type="button"
                className="pdp-fitguard-meter-labels-item is-active is-cta"
                onClick={onOpenVin}
              >
                {text}
              </button>
            );
          }
          return (
            <span
              key={n}
              className={
                "pdp-fitguard-meter-labels-item" +
                (isActive ? " is-active" : "")
              }
            >
              {text}
              {isActive && n === 3 && (
                <span className="pdp-fitguard-meter-labels-badge" aria-hidden="true">
                  <IconCheck />
                </span>
              )}
            </span>
          );
        })}
      </div>
      <p className="pdp-fitguard-body">{bodyText}</p>
      {displayVin && (
        <div className="pdp-fitguard-vinmask">
          <span className="pdp-fitguard-vinmask-ico"><IconCheck /></span>
          <span>{carShort} · رقم هيكل <span className="mono">{displayVin}</span></span>
        </div>
      )}
    </div>
  );
}

/* VIN-capture sheet — backlog #8(b). Triggered from the medium/low fitguard
   states. Pure prototype: input accepts any reasonable VIN-shaped string
   (alphanumeric, up to 17 chars) and stubs success after a short delay so
   the flow feels real without backend. Production wires the value into the
   actual fitment check + flags the user for the #8(c) WhatsApp re-engagement
   path if they don't convert.
   The reference for "what's a VIN" was already established by the photo-info
   sheet's footnote — so opening this sheet doesn't feel out-of-nowhere. */
function PdpVinSheet({ open, onClose, onConfirm }) {
  const [vin, setVin] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const inputRef = useRef(null);

  // Reset on close so reopening always lands on the input view.
  useEffect(() => {
    if (!open) {
      setSubmitted(false);
      setVin("");
    }
  }, [open]);

  // Focus the input after the sheet animation settles. autoFocus alone is
  // unreliable on iOS Safari inside an animating sheet — explicit timeout
  // matches the sheet's transition window so the keyboard rises smoothly.
  useEffect(() => {
    if (open && !submitted) {
      const t = setTimeout(() => {
        inputRef.current && inputRef.current.focus();
      }, 350);
      return () => clearTimeout(t);
    }
  }, [open, submitted]);

  const trimmed = vin.replace(/\s/g, "");
  // VIN content rules (ISO 3779):
  //   - Exactly 17 characters
  //   - Every real VIN contains BOTH letters and digits (the WMI region
  //     is letter-heavy, the serial tail is digit-heavy). 17 of one type
  //     is impossible — block it explicitly so submit-disabled with
  //     "17/17" doesn't look broken.
  const hasLetter = /[A-Z]/.test(trimmed);
  const hasDigit = /[0-9]/.test(trimmed);
  const isLengthOk = trimmed.length === 17;
  const isMixed = hasLetter && hasDigit;
  const canSubmit = isLengthOk && isMixed;
  // Surface the "needs letters and digits" hint only after the user
  // already hit 17 chars — earlier, the rule isn't relevant yet (they're
  // still typing). Keeps premature error states out of the UI.
  const showMixError = isLengthOk && !isMixed;

  const handleSubmit = () => {
    if (!canSubmit) return;
    setSubmitted(true);
    setTimeout(() => {
      onConfirm(trimmed);
    }, 1100);
  };

  return (
    <BottomSheet open={open} onClose={onClose} title="أكّد التركيب">
      {submitted ? (
        <div className="pdp-vin-success">
          <div className="pdp-vin-success-ico"><IconCheck /></div>
          <div className="pdp-vin-success-title">تم تأكيد التركيب</div>
          <p className="pdp-vin-success-desc">
            تركب هذه القطعة على سيارتك بدقة وفقاً لرقم الهيكل.
          </p>
        </div>
      ) : (
        <div className="pdp-vin">
          <p className="pdp-vin-desc">
            للتأكد التام، يرجى تزويدنا برقم هيكل (شاصي) سيارتك.
          </p>
          <input
            ref={inputRef}
            className={"pdp-vin-input mono" + (trimmed.length > 0 && !canSubmit ? " is-incomplete" : "")}
            value={vin}
            // Allowed character set follows ISO 3779: A-Z and 0-9, excluding
            // I, O, Q (to prevent visual confusion with 1, 0, 0). The strip
            // happens on every keystroke so users see what's accepted live.
            onChange={(e) => setVin(e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, ""))}
            placeholder="1HGCM82633A123456"
            maxLength={17}
            inputMode="text"
            autoComplete="off"
            spellCheck={false}
            dir="ltr"
          />
          {trimmed.length > 0 && (
            <div className={"pdp-vin-count" + (canSubmit ? " is-complete" : "")}>
              <span className="mono">{trimmed.length}</span>
              <span className="pdp-vin-count-sep"> / </span>
              <span className="mono">17</span>
            </div>
          )}
          {showMixError && (
            <p className="pdp-vin-mix-error">
              رقم الهيكل لا بد أن يحتوي على حروف وأرقام معاً.
            </p>
          )}
          <p className="pdp-vin-hint">
            موقع رقم الهيكل: استمارة السيارة، أو عن طريق منصة أبشر. يتكوّن من <span className="mono">17</span> حرفاً ورقماً.
          </p>
          <button
            type="button"
            className="pdp-vin-submit"
            onClick={handleSubmit}
            disabled={!canSubmit}
          >
            تأكيد التركيب
          </button>
          <button type="button" className="pdp-vin-skip" onClick={onClose}>
            تجاوز الآن
          </button>
        </div>
      )}
    </BottomSheet>
  );
}

/* Installments — a quiet "pay in 4" line under the price. Tabby + Tamara both
   split the total into 4 interest-free payments, so we show the per-payment

   target for the explainer sheet. Hidden when there's no usable price. */
function PdpInstallments({ p, onLearnMore }) {
  const priceNum = Number(String(p.price).replace(/[^\d.]/g, ""));

  return (
    <button className="inst-line" type="button" onClick={onLearnMore}>

        <span className="inst-line-amt">
          <span className="inst-line-num mono">{per}</span>
          <Riyal />
          <span className="inst-line-per">/ شهر</span>
        </span>
      </span>
      <span className="inst-logos">
        {INSTALLMENT_PROVIDERS.map((k) => <img key={k} src={PAYMENT_FILES[k]} alt={k} />)}
      </span>
      <span className="inst-chev"><IconChevron /></span>
    </button>
  );
}

/* Explainer sheet for the installment line — leads with the "pay only today"
   hook + reassurance chips, names both providers, and pins an add-to-cart CTA
   in the footer so the intent the sheet builds converts without hunting for the
   button. Adding closes the sheet so the page toast confirms. */
function PdpInstallmentSheet({ open, onClose, priceStr, product, cartQty = 0, inStock = true, onAdd, onCart }) {
  const priceNum = Number(String(priceStr || "").replace(/[^\d.]/g, ""));
  const per = priceNum ? Math.ceil(priceNum / 4).toLocaleString("en-US") : null;
  // Footer CTA only — no price here. The headline already owns the number the
  // sheet is about ("تدفع اليوم فقط 613"); repeating the full price beside the
  // button read as two competing prices. Full price stays on the PDP behind it.
  const buyFooter = inStock && onAdd ? (
    <div className="pdp-installinfo-buy">
      <PdpCta
        qty={cartQty}
        inStock={inStock}
        reminderSet={false}

        onRemind={() => {}}
        onCart={() => { onClose && onClose(); onCart && onCart(); }}

  ) : null;
  return (
    <BottomSheet open={open} onClose={onClose} title="قسّطها بدون فوائد" footer={buyFooter}>
      <div className="pdp-installinfo">
        {/* Product row — ties the plan to THIS item (thumb + title + meta), so
            "تدفع اليوم فقط" reads as a plan for the thing, not a generic promo.
            Context-agnostic: a part passes its glyph + #number, a service its
            category glyph + vendor. */}

            <div className={"pdp-installinfo-product-thumb" + (product.thumbWide ? " is-wide" : "")}>{product.thumb}</div>
            <div className="pdp-installinfo-product-info">
              <span className="pdp-installinfo-product-title">{product.title}</span>
              {product.meta && (
                <span className={"pdp-installinfo-product-oem" + (product.metaMono ? " mono" : "")}>{product.meta}</span>
              )}
            </div>

        <div className="pdp-installinfo-unified">
          {per && (
            <div className="pdp-installinfo-headline">
              <span className="pdp-installinfo-hl-label">تدفع اليوم فقط</span>
              <span className="pdp-installinfo-hl-amt"><span className="mono">{per}</span> <Riyal /></span>
              <span className="pdp-installinfo-hl-sub">ثم <span className="mono">3</span> دفعات شهرية بنفس المبلغ</span>
            </div>
          )}
          <ul className="pdp-installinfo-perks">
            <li><IconCheckSmall /> بدون فوائد</li>
            <li><IconCheckSmall /> بدون رسوم تأخير</li>

            {INSTALLMENT_PROVIDERS.map((k) => <img key={k} src={PAYMENT_FILES[k]} alt={k} />)}
          </div>

    </BottomSheet>
  );
}

/* Marketplace seller — under the CTA: the merchant name as a heading, with its
   trust signals as badges below (تاجر نشط + the orders tier). The badges are a
   variable (a seller under the orders threshold shows name-only). No reviews by
   design — order volume stands in for stars (CATALOG_MODEL: vendor is
   offer-level). A verification badge is deferred until it's a defined program. */
function PdpSeller({ vendor }) {
  const name = typeof vendor === "string" ? vendor : (vendor && vendor.name);
  if (!name) return null;
  const orders = (typeof vendor === "object" && Number(vendor.orders)) || 0;
  // Production rule: only surface the orders signal once it's meaningful — more
  // than 10 orders. Below that it's too thin to build trust, so the row is
  // hidden and the seller shows name-only. Prod reads this count from the number
  // of Direct Order Parts created on that branch (see doc/PDP.md).
  const showOrders = orders > 10;
  // Shown as a "{tier}+" trust bucket — the largest tier at or below the count —
  // so it reads as a deliberate tier ("250+"), not a suspiciously exact "348",
  // and never churns per order (actual is always ≥ the shown tier).
  const ordersTier = ORDER_TIERS.find((t) => orders >= t) || ORDER_TIERS[ORDER_TIERS.length - 1];
  return (
    <div className="pdp-seller">
      <div className="pdp-seller-name">{name}</div>
      {showOrders && (
        <div className="pdp-seller-meta">
          <span className="pdp-seller-active"><span className="pdp-seller-dot" />تاجر نشط</span>
          <span className="pdp-seller-sep">·</span>
          <span>{ordersTier.toLocaleString("en-US")}+ طلب</span>
        </div>
      )}
    </div>
  );
}

function PdpCta({ qty, inStock, reminderSet, onAdd, onRemind, onCart }) {
  // Out of stock: charcoal outlined "أبلغني عند التوفّر." Different mode
  // from the red commit button so the user reads it as a softer intent
  // capture, not a purchase.
  if (!inStock) {
    return (
      <div className="pdp-cta-row">
        <button
          className={"pdp-add pdp-add--remind" + (reminderSet ? " is-set" : "")}
          onClick={onRemind}
        >
          {reminderSet ? (
            <><IconCheckSmall /> تم تسجيل اهتمامك</>
          ) : (
            "أبلغني عند التوفّر"
          )}
        </button>
      </div>
    );
  }
  // In-stock: single button, two states. qty=0 → red "أضف للسلة" commit
  // (tap adds 1 to cart). qty>0 → quiet outlined "في السلة ✓ (×N)" status
  // (tap OPENS THE CART, not increments qty). Reasoning: most spare parts
  // are 1-of-them in Saudi buyer model; tap-to-cart matches modern ecommerce
  // muscle memory and sidesteps the stepper-on-PDP ambiguity entirely. Cart
  // qty management lives in the cart line-item stepper. Multi-of-related
  // (front + rear, FR + FL) is the companion rail's job, not this button's.
  const isAdded = qty > 0;
  return (
    <div className="pdp-cta-row">
      <button
        className={"pdp-add" + (isAdded ? " added" : "")}
        onClick={isAdded ? onCart : onAdd}
        aria-live="polite"
        aria-label={isAdded ? "في السلة، اضغط لفتح السلة" : "أضف للسلة"}
      >
        {isAdded ? (
          <>في السلة <IconCheckSmall /></>
        ) : (
          "أضف للسلة"
        )}
      </button>
    </div>
  );
}
