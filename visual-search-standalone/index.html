<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="format-detection" content="telephone=no" />
<title>البحث المرئي · سبيرو</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<style>
  :root {
    --white: #FFFFFF;
    --canvas: #FAFAFA;
    --canvas-2: #F4F4F4;
    --hairline: #EAEAEA;
    --text: #2A2C31;
    --muted: #6B6B6B;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --green: #16A34A;
    --warn-bg: #FEF3C7;
    --warn-fg: #854D0E;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 -10px 30px rgba(0,0,0,0.08); /* bottom-sheet lift on the 3D locate screen */
    --anchor-t: 0.16s; /* car bar / search collapse speed — tune here */
    --trust-t: 0.32s;  /* trust badges collapse speed — tune here */
    --card-hover-t: 0.5s; /* card hover fade (border darken / accent) — slower, more considered than the 0.15s small-control standard. See MOTION §6. */
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: 'Readex Pro', system-ui, sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  /* html is the bg the browser shows during iOS rubber-band overscroll at
     the top/bottom of the page. White matches the cluster's white surface
     (and most surfaces) so a pull-to-refresh stretch doesn't reveal a
     gray strip above the content. Body keeps the gray --canvas-2 for the
     side-gutter surround on wide-screen viewports (>480px). */
  html { background: var(--white); }

  /* THE DOCUMENT ITSELF NEVER SCROLLS. Every screen here is a fixed
     full-viewport overlay, so document scroll is always a bug — and it was one:
     `min-height: 100vh` made the page taller than the visible area (on mobile
     `100vh` is the LARGE viewport, i.e. URL bar hidden), so the page picked up
     ~60-100px of phantom scroll, and scrolling into that strip exposed the top
     of a PARKED overlay screen (.locate-screen sits at translateY(100%) just
     below the fold) — its .loc-carbar read as a duplicate of the header.
     `dvh` alone fixed iOS but not Android Chromium, whose URL-bar handling
     resolves the viewport units differently, so the height is now LOCKED and
     overflow hidden: no viewport-unit arithmetic can reintroduce the scroll on
     any engine. #root owns the only scrollport, so content that genuinely
     overflows (e.g. landscape) still scrolls — inside the 480px shell, where it
     can't drag the parked overlays into view. overscroll-behavior kills iOS
     rubber-band / pull-to-refresh on top of that. */
  html, body { overscroll-behavior: none; }
  /* Second layer of zoom blocking, independent of the viewport meta tag.
     `pan-x pan-y` omits `pinch-zoom`, so Chromium refuses pinch AND double-tap
     zoom for touches starting anywhere in the page. Panning is still allowed,
     so the parts list inside the sheet keeps scrolling; elements that own their
     gestures (.loc-carbar, .ps-drag-zone, .car-swipe) declare the stricter
     `touch-action: none` and are unaffected. NOTE: a browser-level override
     (Chrome's "Force enable zoom" accessibility setting, iOS Safari's ignoring
     of user-scalable=no) deliberately defeats both layers — that is by design
     and no page can opt out of it. */
  html, body { touch-action: pan-x pan-y; }
  html { height: 100%; }

  body {
    height: 100vh;   /* fallback for engines without dvh */
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    background: var(--canvas-2);
  }

  #root {
    width: 100%;
    max-width: 480px;
    background: var(--canvas);
    height: 100%;
    overflow-y: auto;
    position: relative;
    overflow-x: clip;
    display: flex;
    flex-direction: column;
  }
  /* Push the footer to the bottom of #root so short pages (or screens
     where the content doesn't fill the viewport) don't leave empty
     space below the footer. */
  #root .site-footer { margin-top: auto; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    padding: 0;
  }

  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum" 1; }

  /* ============== HEADER ============== */
  .header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--white);
    border-bottom: 1px solid var(--hairline);
    padding: 3px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-static { position: static; }
  .icon-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    transition: background 0.15s ease;
    position: relative;
    flex-shrink: 0;
  }
  .icon-btn:active { background: var(--canvas-2); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.cart-btn svg { width: 22px; height: 22px; }
  /* Cart is the critical-action button — bigger tap area than the menu /
     other icon-btns to avoid mis-taps. 44px is the Apple HIG minimum
     touch target; 36px (the other icon-btns) sits below it. */
  .icon-btn.cart-btn { width: 44px; height: 44px; }

  .brand {
    display: flex; align-items: center; gap: 4px;
    flex: 1;
    margin-inline-start: 4px;
    /* Small physical-right nudge so the logo cluster sits closer to the menu button
       instead of floating mid-row. translateX is direction-agnostic. */
    transform: translateX(8px);
  }
  .brand-logo {
    width: 26px; height: 26px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .brand-name {
    font-weight: 600; font-size: 20px; letter-spacing: -0.01em;
  }
  /* Signal that the brand wordmark is a click-to-home affordance on
     non-home routes. Home and home-car keep it as plain text — no
     point underlining a link to the page you're on. */
  .brand-name.is-link {
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }

  .cart-badge {
    position: absolute;
    top: 4px;
    inset-inline-end: 4px;
    background: var(--red);
    color: white;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 999px;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* ============== DRAWER ============== */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    /* 45 so the cart/menu scrim sits ABOVE the full-viewport Visual Search
       overlay (.locate-screen, z-index 40) and dims it like every other
       screen, while staying below the drawers themselves (z-index 50). */
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease-out;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; bottom: 0;
    inset-inline-start: 0;
    width: min(86vw, 360px);
    background: var(--white);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.24s ease-out;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* RTL: drawer sits at the start (right) edge and slides in from the right */
  html[dir="rtl"] .drawer { transform: translateX(100%); }
  .drawer.open { transform: translateX(0) !important; }

  .drawer-head {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; gap: 12px;
    position: relative;
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: var(--canvas-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 18px; color: var(--text);
    flex-shrink: 0;
  }
  .greet {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
    flex: 1;
  }
  .greet-name {
    font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 6px;
  }
  .flag-sa {
    width: 20px; height: 14px; border-radius: 2px;
    display: inline-block;
    background: #006C35;
    flex-shrink: 0;
  }
  .greet-phone {
    color: var(--muted); font-size: 13px;
    letter-spacing: 0.02em;
  }
  .drawer-close {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .drawer-close:active { background: var(--canvas-2); }

  .drawer-section { padding: 14px 16px 6px; }
  .drawer-section-title {
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.04em; margin-bottom: 10px;
    text-transform: none;
  }

  /* Car row — full-row button. Tap picks the car, closes the drawer,
     and routes to the anchored home so the buyer sees the switch land
     immediately. Active row gets a white surface + dark outline + dot;
     inactive rows show a tap feedback only. */
  .car-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: transparent;
    border: 1px solid transparent;
    position: relative;
    width: 100%;
    text-align: start;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .car-row:active { background: var(--canvas-2); }
  .car-row.active {
    background: var(--white);
    border-color: var(--text);
    cursor: default;
  }
  .car-row.active:active { background: var(--white); }
  .car-row-photo {
    width: 60px; height: auto;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }
  .car-row-body { flex: 1; min-width: 0; }
  .car-row-name { font-size: 14px; font-weight: 500; }
  .car-row-sub { font-size: 12px; color: var(--muted); }
  .active-dot {
    width: 8px; height: 8px;
    border-radius: 999px;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18);
    flex-shrink: 0;
  }

  .add-car {
    width: 100%;
    padding: 9px 12px;
    border: 1px dashed #C9C9C9;
    border-radius: 999px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    margin-top: 4px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .add-car:active { background: var(--canvas-2); border-color: var(--text); color: var(--text); }

  .menu-list {
    list-style: none;
    padding: 4px 8px;
    margin: 0;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
    color: var(--text);
    transition: background 0.15s;
    cursor: pointer;
  }
  @media (hover: hover) {
    .menu-item:hover { background: var(--canvas-2); }
  }
  .menu-item:active { background: var(--canvas-2); }
  .menu-item .item-emoji {
    font-size: 16px;
    width: 22px; text-align: center;
    flex-shrink: 0;
  }
  .menu-item .item-label { flex: 1; }
  .badge-count {
    background: var(--canvas-2);
    color: var(--text);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11.5px;
    font-weight: 600;
    min-width: 22px;
    text-align: center;
  }
  .pill-soon {
    background: var(--warn-bg);
    color: #D97706;
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 10.5px;
    font-weight: 600;
  }
  .muted-right {
    font-size: 11.5px;
    color: var(--muted);
  }

  .menu-divider {
    height: 1px;
    background: var(--hairline);
    margin: 8px 16px;
  }
  .menu-list.quiet .menu-item {
    font-size: 13px;
    color: var(--muted);
    padding: 9px 12px;
  }
  @media (hover: hover) {
    .menu-list.quiet .menu-item.logout:hover { color: var(--red); background: var(--red-soft); }
  }
  .menu-list.quiet .menu-item.logout:active { color: var(--red); background: var(--red-soft); }

  /* Bottom toast for not-yet-built menu entries (BACKLOG #12). Rendered as a
     sibling of the drawer aside (not inside it) so position:fixed anchors to
     the viewport, not the transformed drawer. Non-interactive, auto-dismisses. */
  .menu-toast {
    position: fixed;
    inset-inline: 0;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    z-index: 60;
    display: flex; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .menu-toast.show { opacity: 1; transform: translateY(0); }
  .menu-toast > span {
    background: var(--text);
    color: var(--white);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }
  @media (prefers-reduced-motion: reduce) {
    .menu-toast { transition: opacity 0.2s ease; transform: none; }
    .menu-toast.show { transform: none; }
  }

  /* Add-to-cart confirmation toast. One global instance, fired by addToCart,
     so parts, services, and visual search all confirm identically. Sits above
     every layer (drawers/sheets/sticky buybar) and clears the bottom bars. */
  .cart-toast {
    position: fixed;
    inset-inline: 0;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    z-index: 200;
    display: flex; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  /* Lifts clear of the sticky buy bar when an add fires from it. */
  .cart-toast.raised { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .cart-toast.show { opacity: 1; transform: translateY(0); }
  .cart-toast > span {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--text);
    color: var(--white);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  }
  .cart-toast svg { width: 15px; height: 15px; color: var(--green); }
  .cart-toast svg path { stroke-width: 2.6; }
  @media (prefers-reduced-motion: reduce) {
    .cart-toast { transition: opacity 0.22s ease; transform: none; }
    .cart-toast.show { transform: none; }
  }

  /* ============== HERO ============== */
  .hero {
    padding: 22px 16px 16px;
  }
  .hero h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .hero-sub {
    margin: 22px 0 0;
    font-size: 14px;
    color: var(--muted);
  }
  .trust {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  .trust-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .trust-chip {
    width: 24px; height: 24px;
    border-radius: 7px;
    background: var(--canvas-2);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  .trust-chip svg { width: 13px; height: 13px; }
  .trust-item b { color: var(--text); font-weight: 600; }

  /* ============== SELECTOR CARD ============== */
  .card {
    margin: 1px 16px 20px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .card-head {
    background: var(--canvas-2);
    padding: 12px 22px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--hairline);
  }
  .card-title { font-size: 16px; font-weight: 600; }
  /* Cold-lander seeded selector: compact "your car so far" summary for the
     URL-locked dims (shown in place of their step rows). */
  .sel-locked { font-size: 13px; color: var(--muted); font-weight: 600; margin: 2px 0 14px; }
  .sel-locked b, .sel-locked span { color: var(--text); }

  .reset-btn {
    width: 30px; height: 30px;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .reset-btn:active { background: var(--white); color: var(--text); }
  .reset-btn svg { width: 16px; height: 16px; }

  .step-row {
    padding: 0 0 10px;
    border-bottom: 1px solid var(--hairline);
    transition: background 0.2s ease;
  }
  .step-row:last-of-type { border-bottom: 1px solid var(--hairline); }

  .step-head {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px 5px;
  }
  .step-num {
    width: 22px; height: 22px;
    border-radius: 999px;
    background: var(--canvas-2);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .step-row.is-active .step-num,
  .step-row.is-done .step-num {
    background: var(--text); color: white;
  }
  .step-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    flex: 1;
    transition: color 0.2s ease;
  }
  .step-row.is-active .step-label,
  .step-row.is-done .step-label { color: var(--text); }
  .step-picked {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  /* Chip rails */
  .chip-rail-wrap { position: relative; }
  .chip-rail {
    display: flex; gap: 8px;
    padding: 4px 16px 4px 16px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .chip-rail::-webkit-scrollbar { display: none; }

  .chip-rail-wrap::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    inset-inline-end: 0;
    width: 28px;
    background: linear-gradient(to left, var(--white), rgba(255,255,255,0));
    pointer-events: none;
  }
  html[dir="rtl"] .chip-rail-wrap::after {
    background: linear-gradient(to right, var(--white), rgba(255,255,255,0));
  }

  .chip {
    flex-shrink: 0;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    transition: border-color 0.15s, font-weight 0.15s;
    scroll-snap-align: start;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:active { border-color: var(--text); }
  .chip.selected {
    border-color: var(--text);
    font-weight: 600;
    border-width: 1px;
    box-shadow: inset 0 0 0 1px var(--text);
  }
  .chip-check {
    width: 14px; height: 14px;
    border-radius: 999px;
    background: var(--text);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    margin-inline-start: 2px;
  }
  .chip-check svg { width: 8px; height: 8px; }

  .chip.year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-width: 44px;
    padding: 8px 12px;
    justify-content: center;
  }

  /* Year grid: 2 rows, scrolls horizontally. Chip track widened to fit
     full 4-digit years (2013–2026) at 13px monospace without crowding. */
  .year-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: 1fr;
    grid-auto-columns: max-content;
    gap: 8px;
    padding: 4px 16px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .year-grid::-webkit-scrollbar { display: none; }
  .year-grid .chip { padding: 8px 14px; }

  /* Disabled */
  .rail-disabled {
    opacity: 0.5;
    pointer-events: none;
    user-select: none;
  }
  .empty-tap {
    min-height: 45px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  /* Hint pulse — chips inside the unfilled row briefly get a black ring
     when the user taps Start without picking. Drawing the eye to the
     actual targets (the chips) without touching the row's outer border
     or the step-number circle. */
  @keyframes chipHint {
    0%   { box-shadow: 0 0 0 0 transparent; }
    35%  { box-shadow: 0 0 0 1.5px var(--text); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .step-row.hinting .chip {
    animation: chipHint 0.9s ease-out;
  }

  /* Confirm bar */
  .confirm-bar {
    padding: 14px;
    background: var(--white);
    border-top: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .summary {
    display: flex; align-items: center; justify-content: flex-start;
    direction: rtl;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .summary-dot {
    width: 8px; height: 8px; border-radius: 999px; background: var(--green);
    flex-shrink: 0;

  .cta {
    width: 100%;

  /* Label swap (playful cart CTA): pure opacity fade on a single node. The JS
     drives the timing (fade out, swap text while fully hidden, fade in), so
     there's never an empty, doubled, or half-opacity frame between messages. */
  .cta-label {
    display: inline-block;
    transition: opacity 0.14s ease;
  }
  .cta-label.is-hidden { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .cta-label { transition: none; }

  .cta:disabled {
    opacity: 0.4;
    pointer-events: none;

  /* Chevron flips visually so it points "start" (left in RTL) */

  /* Saved cars */

  /* ============== SECTIONS (4-7) ============== */
  .section { padding: 0 16px; margin-bottom: 24px; }

    gap: 12px;

  /* Category quick-entry */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Home /car premium category tiles + VS card, ported from #/home-car-demo.
     Shared by /car (AnchoredHome) and the demo; base chrome inherited from
     .cat-card / .home-browse-all / .h3d-peek. */
  .cd-cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cd-cats .cat-card { flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 24px 12px 18px; border-radius: 14px; }
  .cd-cats .cat-icon { width: auto; height: auto; border-radius: 0; background: transparent; color: var(--text); }
  .cd-cats .cat-icon svg { width: 68px; height: 68px; }
  .cd-cats .cat-icon svg * { vector-effect: non-scaling-stroke; stroke-width: 2.9px; }
  .cd-cats .cat-label { font-size: 13.5px; font-weight: 600; }
  .cd-browse { transition: border-color var(--card-hover-t) ease; }
  .cd-browse .home-browse-all-title { flex: 1; font-weight: 500; }
  .cd-browse-icon { display: inline-flex; flex-shrink: 0; color: var(--text); }
  .cd-browse-icon svg { width: 20px; height: 20px; }
  @media (hover: hover) { .cd-browse:hover { border-color: var(--text); } }
  .cd-browse:active { border-color: var(--text); transform: none; box-shadow: none; }
  /* Compound .h3d-peek.cd-peek so these beat the .h3d-peek base (defined later
     in the sheet): white fill + taller 190px + wider gap are the intended look. */
  .h3d-peek.cd-peek { background: var(--white); min-height: 190px; gap: 20px; transition: border-color var(--card-hover-t) ease, border-inline-start-width var(--card-hover-t) ease, border-inline-end-width var(--card-hover-t) ease, border-inline-start-color var(--card-hover-t) ease, border-inline-end-color var(--card-hover-t) ease; }
  .cd-peek .h3d-peek-eyebrow svg { width: 13px; height: 13px; transform: translateY(-1px); }
  .cd-peek .h3d-peek-eyebrow { transition: color var(--card-hover-t) ease, border-bottom-color var(--card-hover-t) ease; }
  .cd-peek .h3dp-base *, .cd-peek .h3dp-face * { vector-effect: non-scaling-stroke; stroke-width: 1.4px; }
  .cd-peek .h3d-peek-stage { transform: scale(1.2); transform-origin: center center; }
  @media (hover: hover) {
    .cd-peek:hover { border-color: var(--text); border-inline-start: 1px solid var(--text); border-inline-end: 1px solid var(--text); }
    .cd-peek:hover .h3d-peek-eyebrow { color: var(--red); border-bottom-color: var(--red); }
  }
  .cd-peek:active { transform: none; box-shadow: none; border-color: var(--text); border-inline-start: 1px solid var(--text); border-inline-end: 1px solid var(--text); }
  .cd-peek:active .h3d-peek-eyebrow { color: var(--red); border-bottom-color: var(--red); }
  .cat-card {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px;
    display: flex; align-items: center; gap: 12px;
    text-align: start;
    transition: border-color var(--card-hover-t);
  }
  @media (hover: hover) {
    .cat-card:hover {
      border-color: var(--text);
    }
  }
  .cat-card:active {
    border-color: var(--text);
  }
  .cat-icon {
    width: 44px; height: 44px;
    background: var(--canvas-2);
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  .cat-icon svg { width: 22px; height: 22px; }
  .cat-label { font-size: 14px; font-weight: 600; color: var(--text); }

  /* 3D visual-search entry — a card that *is* a peek at the experience.
     Real car silhouette is the visual; pulsing hotspot dots overlaid
     hint at the interactive surface. The card is the demo, not a graphic
     about a demo. */
  .h3d-peek {
    position: relative;
    width: 100%;
    margin-top: 12px;
    min-height: 130px;
    background: var(--canvas-2);
    border: 1px solid var(--hairline);
    border-inline-start: 3px solid var(--red);
    border-inline-end: 3px solid var(--red);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.18s, border-color 0.15s;
    /* Vertical stack: tire on top, eyebrow caption below. Both centered
       horizontally. The group is centered vertically so the tire ends up
       slightly above the card's middle to make room for the caption. */
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
  }
  .h3d-peek:active {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
    border-color: var(--text);
  }
  .h3d-peek-eyebrow {
    font-size: 11px;
    /* Match the wheel stroke (#2A2C31 == --text) so the label + magnifier read
       as strong as the art. The muted gray made the card look decorative, not
       tappable, and testing showed users weren't clicking it. */
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    /* Hairline underline as a tap affordance (user testing surfaced the card
       isn't obviously clickable). A bottom border spans the whole row so the
       leading magnifier icon is underlined too. A/B test before production. */
    border-bottom: 1px solid var(--text);
    padding-bottom: 3px;
    /* Nudge right to align with the tire's visual center — the rotateY
       transform pushes the wheel face right of geometric center. */
    transform: translateX(4px);
  }
  .h3d-peek-eyebrow svg { width: 12px; height: 12px; transform: translateY(1.5px); }
  .h3d-peek-stage {
    position: relative;
    width: 140px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  /* 2D wireframe cube (front + back squares + 4 connectors), with a
     stroke-draw animation. Each edge animates its dashoffset so the
     cube "draws itself" then "erases itself" on loop — reads as a
     scan / mapping motion, no edge-on weirdness. Front edges draw
     first, connectors next, back edges last — builds depth visually. */
  .h3d-peek-art {
    height: 96px; width: auto;
    object-fit: contain;
    display: block;
    transform: perspective(500px) rotateY(-24deg) scaleX(1.18);
    transform-origin: center center;
  }
  /* Visual-search wheel: the original tire casing + tread stay static
     (.h3dp-base); the wheel face (.h3dp-face) is a circular wheel tilted in
     true 3D (rotateY) so its rotation tracks the tire's perspective. Rolls one
     "push and settle" turn each time the card scrolls into view (is-rolling
     toggled by an IntersectionObserver on the card). */
  .h3dp-base {
    position: absolute; top: 50%; left: 50%;
    height: 96px; width: auto;
    transform: translate(-50%, -50%);
  }
  .h3dp-face {
    position: absolute; top: 50%; left: 56%;
    height: 66px; width: 66px;
    transform: translate(-50%, -50%) perspective(520px) rotateY(52deg);
  }
  .h3d-peek.is-rolling .h3dp-face {
    animation: h3dpRoll 1.3s cubic-bezier(0.15, 0.7, 0.25, 1);
  }
  @keyframes h3dpRoll {
    from { transform: translate(-50%, -50%) perspective(520px) rotateY(52deg) rotate(0deg); }
    to   { transform: translate(-50%, -50%) perspective(520px) rotateY(52deg) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .h3d-peek.is-rolling .h3dp-face { animation: none; }
  }
  .h3d-cube-edge {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: h3dCubeDraw 5s ease-in-out infinite;
  }
  .h3d-cube-edge.front { animation-delay: 0s; }
  .h3d-cube-edge.conn  { animation-delay: 0.4s; }
  .h3d-cube-edge.back  { animation-delay: 0.8s; }
  @keyframes h3dCubeDraw {
    0%        { stroke-dashoffset: 100; }
    25%, 65%  { stroke-dashoffset: 0; }
    90%, 100% { stroke-dashoffset: -100; }
  }
  @media (prefers-reduced-motion: reduce) {
    .h3d-cube-edge { animation: none; stroke-dashoffset: 0; }
  }

  /* Browse-all CTA — full-width pill below the home category grid that
     promotes /spare-parts/all. Inverted (light bg, dark text) so it reads
     as a quiet entry point. */
  .home-browse-all {
    margin-top: 12px;
    width: 100%;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    color: var(--text);
    text-align: start;
    transition: border-color var(--card-hover-t);
    cursor: pointer;
  }
  @media (hover: hover) { .home-browse-all:hover { border-color: var(--text); } }
  .home-browse-all:active {
    border-color: var(--text);
  }
  .home-browse-all-title {
    font-size: 14.5px; font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .home-browse-all-arrow {
    width: 28px; height: 28px;
    background: var(--canvas-2);
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .home-browse-all-arrow svg {
    width: 12px; height: 12px;
    color: var(--text);
    transform: scaleX(-1);
  }

  /* Brands grid */
  .brand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .brand-tile {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 18px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  @media (hover: hover) {
    .brand-tile:hover {
      border-color: var(--text);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
  }
  .brand-tile:active {
    border-color: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .brand-mark {
    width: 44px; height: 44px;
    border-radius: 999px;

  .brand-name { font-size: 12.5px; font-weight: 500; color: var(--text); }

  /* How it works */
  .how-stack { display: flex; flex-direction: column; gap: 10px; }
  .how-card {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;

  .how-icon {
    width: 36px; height: 36px;

    color: var(--text);
    flex-shrink: 0;

  .how-icon svg { width: 20px; height: 20px; }
  .how-body { flex: 1; min-width: 0; }
  .how-num {
    font-size: 11px; font-weight: 500;

    letter-spacing: 0.06em;

  /* Trust strip */
  .trust-card {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 14px;
  }
  .trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .trust-cell { display: flex; align-items: center; gap: 10px; }
  .trust-cell-icon {
    width: 36px; height: 36px;
    background: var(--canvas-2);
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  .trust-cell-icon svg { width: 20px; height: 20px; }
  .trust-cell-title { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .trust-cell-sub { font-size: 11px; color: var(--muted); }

  /* ============== ANCHORED HOME ============== */
  .a-section { padding: 0 16px; margin-bottom: 22px; }
  .anchor-trust {
    display: grid;
    grid-template-rows: 1fr;
    /* Was --trust-t (320ms) but that runs 2x longer than the car-bar +
       search-wrap padding transitions (--anchor-t, 160ms). When the
       paddings finished first, the trust kept collapsing — pulling the
       search pill upward at a different rate after the padding stopped
       moving. The eye read that rate change as a "bounce." Syncing to
       --anchor-t so everything finishes together. */
    transition: grid-template-rows var(--anchor-t) ease, opacity var(--anchor-t) ease;
  }
  .anchor-trust-inner { overflow: hidden; min-height: 0; padding: 12px 16px 8px; }
  .anchor-trust .trust { margin-top: 0; }
  /* collapse the badges away when pinned — symmetric, animates true height */
  .stick-anchor.stuck .anchor-trust { grid-template-rows: 0fr; opacity: 0; }

  /* Car bar */
  .car-bar {
    background: var(--white);
    border-bottom: 1px solid var(--hairline);
    border-inline-start: 3px solid var(--red);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 14px;
    transition: padding var(--anchor-t) ease;
  }
  .car-bar-photo {
    width: 62px; height: auto; flex-shrink: 0; display: block; object-fit: contain;
    transition: width var(--anchor-t) ease;
  }
  /* Wraps the car-bar photo in a button so a tap opens the drawer — same
     menu surface the edit icon to the right opens. Lets the buyer poke
     the most recognizable element on the bar (their car) to switch it.
     Strips default button chrome so the image sits visually unchanged. */
  .car-bar-photo-btn {
    background: transparent; border: 0; padding: 0;
    flex-shrink: 0; cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .car-bar-photo-btn:active { background: var(--canvas-2); }
  /* Silver-cover fallback has a subtle gray "floor" shadow under the car
     that doesn't blend with the white surfaces it sits on (drawer car
     row, car bar, etc.). Mask-image fades the bottom ~25% of the image
     to transparent so the floor dissolves into the background. Scoped
     to this single src so other car photos (real silhouettes) aren't
     touched. Apply on every <img> rendering this src — catches the
     drawer .car-row-photo and the .car-bar-photo via one rule. */
  img[src$="car cover silver.jpg"] {
    -webkit-mask-image: linear-gradient(to bottom, black 75%, rgba(0,0,0,0.55) 90%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 75%, rgba(0,0,0,0.55) 90%, transparent 100%);
  }
  /* Corolla PNG carries a faint floor/edge line at the bottom that reads as a
     border on the white surfaces. Fade just the bottom strip to transparent so
     it dissolves, without touching the car body (kept solid until ~88%). */
  img[src$="corella 2020.png"],
  img[src$="hyundai azera 2018.png"] {
    -webkit-mask-image: linear-gradient(to bottom, black 82%, rgba(0,0,0,0.35) 91%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 82%, rgba(0,0,0,0.35) 91%, transparent 100%);
  }
  /* Tugella PNG: a stronger, taller bottom fade so the car dissolves further up
     from the bottom edge than the Corolla/Azera (which only soften a thin strip). */
  img[src$="geely tugella 2023.png"] {
    -webkit-mask-image: linear-gradient(to bottom, black 74%, rgba(0,0,0,0.45) 89%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 74%, rgba(0,0,0,0.45) 89%, transparent 100%);
  }
  /* Collapsed car bar — slim padding, no eyebrow gap. Reusable on PDP
     and any non-home screen that wants the persistent car-context band
     instead of the global Header. Hosts back + photo + name + cart in
     a single tight row. Pinning is the parent .pdp-stick's job (or
     equivalent host wrapper) so a search pill below the bar can pin
     together with it as one unit. */
  .car-bar-collapsed {
    padding: 10px 14px;
    gap: 10px;
  }

  /* PDP sticky header — wraps car-bar + search pill so they pin together
     as the gallery + body scroll underneath. Background + safe-area
     padding live here (not on the children) so notch-handling doesn't
     double-count. No box-shadow — the wrapper, the search pill area,
     and the PDP body are all white now, so the header reads as one
     continuous white surface flowing into the gallery. The car-bar's
     own bottom hairline carries the only divider we need. */
  .pdp-stick {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--white);
    padding-top: max(env(safe-area-inset-top), 0px);
  }
  /* Auto-hide for the SEARCH PILL only — car-bar (back/car/cart) stays
     visible at all times because cart access is non-negotiable. The pill's
     visibility is driven CONTINUOUSLY by a 0→1 CSS variable (--pill-hide)
     set from scrollY each frame — no CSS transition, the pill literally
     tracks the user's drag speed. 0 = fully visible, 1 = fully hidden.
     max-height + margins + padding + border-width interpolate so the
     wrapper shrinks and the gallery moves up smoothly with the pill,
     instead of leaving a stale white strip below the car-bar. */
  .pdp-stick .pdp-search {
    --hide: var(--pill-hide, 0);
    max-height: calc((1 - var(--hide)) * 80px);
    margin-top: calc((1 - var(--hide)) * 8px);
    margin-bottom: calc((1 - var(--hide)) * 20px);
    padding-top: calc((1 - var(--hide)) * 12px);
    padding-bottom: calc((1 - var(--hide)) * 12px);
    /* Border thickness interpolates too — at hide=1 the 1px hairline
       around the pill would otherwise contribute a 2px residual to the
       wrapper height below the car-bar. */
    border-top-width: calc((1 - var(--hide)) * 1px);
    border-bottom-width: calc((1 - var(--hide)) * 1px);
    opacity: calc(1 - var(--hide));
    overflow: hidden;
  }
  .car-bar-collapsed .car-bar-body { flex: 1 1 auto; min-width: 0; }
  .car-bar-collapsed .car-bar-name { margin-top: 0; }
  .car-bar-back, .car-bar-cart {
    width: 36px; height: 36px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--text);
    flex-shrink: 0;
  }
  .car-bar-back:active, .car-bar-cart:active { background: var(--canvas-2); }
  .car-bar-back svg, .car-bar-cart svg { width: 22px; height: 22px; }
  /* Wraps the photo + car name so tapping the car region opens the side
     menu (where the garage + car-change live). Button styling is invisible
     — no background, no tap feedback — so it reads as part of the header,
     not a button. flex: 0 1 auto hugs content (was 1 1 auto, which grew
     to fill the gap between back and cart, eating the cart's neighboring
     space and causing mis-taps). The dead-space between car-info and the
     auto-margined cart is intentionally non-clickable. */
  .car-bar-info {
    display: flex; align-items: center; gap: 10px;
    flex: 0 1 auto; min-width: 0;
    max-width: 60%;
    background: transparent; border: 0; padding: 0;
    text-align: start; cursor: pointer;
    font: inherit; color: inherit;
  }
  /* Cart click target is bigger than the back chevron — critical action.
     margin-inline-start: auto pushes the cart to the trailing edge so the
     space between car-info and cart is "dead" (no tap target), preventing
     mis-taps where the user aims for cart and hits car-info instead. */
  .car-bar-cart { position: relative; width: 44px; height: 44px; margin-inline-start: auto; }
  .car-bar-cart-badge {
    position: absolute;
    top: 2px; inset-inline-end: 2px;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--red);
    color: var(--white);
    font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .car-bar-body { flex: 1; min-width: 0; }
  .car-bar-eyebrow {
    font-size: 11px; color: var(--muted);
    max-height: 18px; overflow: hidden;
    transition: max-height var(--anchor-t) ease, opacity var(--anchor-t) ease;
  }
  .car-bar-name {
    font-size: 17px; font-weight: 600; color: var(--text); margin-top: 3px;
    transition: margin-top var(--anchor-t) ease;
  }
  /* Collapsed (pinned) car bar — drop the eyebrow, slim the padding */
  .stick-anchor.stuck .car-bar { padding-top: 10px; padding-bottom: 10px; }
  .stick-anchor.stuck .car-bar-eyebrow { max-height: 0; opacity: 0; }
  .stick-anchor.stuck .car-bar-name { margin-top: 0; }
  /* Home-anchored ONLY (not Discover): unify the stuck cluster as one
     continuous white surface, remove the car-bar's hairline separator,
     shrink the car-bar photo, and tighten paddings. Combined effect = the
     pinned cluster feels like one cohesive band instead of two stacked
     sections with a gray strip between them. Discover keeps its existing
     stuck treatment since the chips/breadcrumb below its car-bar benefit
     from the boundary. */
  .stick-anchor:not(.dsc-anchor).stuck { background: var(--white); }
  .stick-anchor:not(.dsc-anchor).stuck .car-bar-photo { width: 44px; }
  .stick-anchor:not(.dsc-anchor).stuck .car-bar {
    padding-top: 6px;
    padding-bottom: 4px;
    gap: 10px;
    border-bottom-color: transparent;
  }
  .stick-anchor:not(.dsc-anchor).stuck .search-wrap {
    padding-top: 4px;
    padding-bottom: 10px;
  }
  /* When the cluster is unified white (home stuck), the search pill sits
     on the same colour and reads as "barely there." Give it a subtle lift
     so it pops without being loud: small drop-shadow + slightly darker
     border. Keeps the icon/text as-is so it doesn't shout "click me." */
  .stick-anchor:not(.dsc-anchor).stuck .big-search {
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border-color: #DCDCDC;
    transition: box-shadow var(--anchor-t) ease, border-color var(--anchor-t) ease;
  }
  /* Shared slot sized to the larger (cart) — edit chip sits smaller, centered inside */
  .car-bar-actions { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .car-edit, .car-cart {
    position: absolute; top: 50%; left: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .car-edit { width: 34px; height: 34px; margin: -17px 0 0 -17px; }
  .car-cart { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
  /* Snap-back (unpinning): near-instant so it feels responsive */
  .car-edit { transition: opacity 0.05s linear, transform 0.05s linear, border-color 0.15s, background 0.15s; transform-origin: center; }
  .car-cart { transition: opacity 0.05s linear, transform 0.05s linear, border-color 0.15s, background 0.15s; transform-origin: center; }
  /* Pinning: staggered shrink/grow — edit collapses to a dot, cart pops up in its place */
  .stick-anchor.stuck .car-edit { transition: opacity 0.14s ease-out, transform 0.18s cubic-bezier(.4,0,.7,.2), border-color 0.15s, background 0.15s; }
  .stick-anchor.stuck .car-cart { transition: opacity 0.08s ease-out 0.06s, transform 0.2s cubic-bezier(.2,.7,.3,1.08) 0.06s, border-color 0.15s, background 0.15s; }
  .car-edit {
    border-radius: 999px;
    background: var(--canvas-2); border: 1px solid var(--hairline);
  }
  .car-edit svg { width: 15px; height: 15px; }
  @media (hover: hover) { .car-edit:hover { border-color: var(--text); } }
  .car-edit:active { border-color: var(--text); background: var(--white); }
  .car-cart svg { width: 24px; height: 24px; }
  /* At rest: edit shown full size, cart hidden + shrunk in the same spot */
  .car-cart { opacity: 0; pointer-events: none; transform: scale(0.5); }
  /* Pinned: edit shrinks away, cart grows in */
  .stick-anchor.stuck .car-edit { opacity: 0; pointer-events: none; transform: scale(0.5); }
  .stick-anchor.stuck .car-cart { opacity: 1; pointer-events: auto; transform: scale(1); }

  .search-top-row {
    position: relative;
    display: flex; align-items: stretch;
  }
  .search-top-row .search-bar { flex: 1; }
  /* 3D-search teaser pill — same look as the search-bar pill but contains the
     "3D" label. Inside the discovery screen it floats inline at the inline-end. */
  .threed-toggle {
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 16px;
    background: var(--white);
    color: var(--text);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    margin-inline-start: 8px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
  }
  @media (hover: hover) { .threed-toggle:hover { border-color: var(--text); } }
  .threed-toggle:active { background: var(--canvas-2); border-color: var(--text); }
  .threed-toggle .td-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
  }
  /* Sticky anchor — car bar + search stay pinned just below the header */
  .stick-anchor {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--canvas);
    transition: box-shadow var(--anchor-t) ease, border-radius var(--anchor-t) ease;
  }
  .stick-anchor.stuck {
    box-shadow: var(--shadow-md);
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
  }

  /* Big search bar */
  .search-wrap { padding: 0 16px 22px; transition: padding var(--anchor-t) ease; }
  /* When the cluster is pinned, tighten the search padding (app-like) */
  .stick-anchor.stuck .search-wrap { padding-top: 10px; padding-bottom: 12px; }
  .big-search {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px;
    text-align: start;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
  }
  @media (hover: hover) { .big-search:hover { border-color: var(--text); } }
  .big-search:active { border-color: var(--text); background: var(--canvas-2); }
  .big-search .bs-icon { color: var(--muted); flex-shrink: 0; display: flex; }
  .big-search .bs-icon svg { width: 18px; height: 18px; }
  .big-search .bs-text { font-size: 14px; color: var(--text); flex: 1; }
  .big-search .bs-hint { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  @media (max-width: 360px) { .big-search .bs-hint { display: none; } }
  /* Typing-style dots — only when search is pinned, to subtly invite searching */
  .bs-dots {
    display: inline-flex; gap: 3px; align-items: center;
    margin-inline-start: 6px; vertical-align: middle;
  }
  .bs-dots > span {
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--text); opacity: 0;
  }
  /* Crisp step-cycle: ".", "..", "...", reset — no fading */
  .stick-anchor.stuck .bs-dots > span:nth-child(1) { animation: bs-d1 1.4s step-end infinite; }
  .stick-anchor.stuck .bs-dots > span:nth-child(2) { animation: bs-d2 1.4s step-end infinite; }
  .stick-anchor.stuck .bs-dots > span:nth-child(3) { animation: bs-d3 1.4s step-end infinite; }
  /* On Discover the dots track the COLLAPSED cluster, not just the pin: they
     run only while the cluster is folded (scrolled-down) and stop the instant
     you scroll up and it expands again — even though it's still pinned. This
     mirrors the home hero, where "the section expands" means unstuck and the
     dots stop there. Without this, the dots would keep cycling in the
     expanded-but-pinned state that only Discover has. */
  .dsc-anchor.stuck:not(.scrolled-down) .bs-dots > span { animation: none; opacity: 0; }
  @keyframes bs-d1 {
    0%, 74%   { opacity: 1; }
    75%, 100% { opacity: 0; }
  }
  @keyframes bs-d2 {
    0%, 24%   { opacity: 0; }
    25%, 74%  { opacity: 1; }
    75%, 100% { opacity: 0; }
  }
  @keyframes bs-d3 {
    0%, 49%   { opacity: 0; }
    50%, 74%  { opacity: 1; }
    75%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stick-anchor.stuck .bs-dots > span { animation: none; opacity: 0.55; }
  }

  /* Product cards */
  .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .prod-card {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
    text-align: start;
    display: flex; flex-direction: column;
  }
  .prod-img {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--canvas-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .prod-img > svg { width: 58%; height: 58%; }
  .pos-badge {
    position: absolute;
    top: 8px; inset-inline-end: 8px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 3px;
    display: flex; line-height: 0;
  }
  .prod-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .prod-title {
    font-size: 14.5px; font-weight: 500; color: var(--text);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .prod-oem { font-size: 11.5px; color: var(--muted); }
  .prod-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 11.5px; border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .tag.oem { background: var(--white); border: 1px solid var(--hairline); color: var(--text); }
  .tag.alt { background: var(--canvas-2); color: var(--muted); }

  /* Delivery promise badge — Speero Express (brand-red pill) vs standard
     delivery (quiet hairline pill). Same component, two variants per
     state. Card variant is small (sits inside .prod-body); PDP variant is
     bigger and bolder (sits in .pdp-delivery). */
  .deliv-tag {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 999px;
    white-space: nowrap;
    line-height: 1.2;
  }
  .deliv-tag .deliv-icon { display: inline-flex; line-height: 0; }
  /* Card variant — sits opposite the price in .prod-foot. Kept compact so
     it doesn't fight for width when the price is 4+ digits (e.g. 1,470). */
  .deliv-card {
    font-size: 10.5px;
    padding: 2px 6px;
    gap: 3px;
    flex-shrink: 0;
  }
  .deliv-card .deliv-icon svg { width: 9px; height: 9px; }
  /* Row view (SearchResultRow): the badge is a direct child of .sresult-body
     which is a flex column. Flex columns default to align-items: stretch, so
     the badge balloons to the row's full width and the pill loses its shape.
     Pin it to flex-start so it sizes to content. Scoped here — in grid view
     the badge sits inside .prod-price-row (a row flex) and needs align: center
     to vertically pair with the price, so a global rule would break that. */
  .sresult-body > .deliv-card { align-self: flex-start; }
  /* PDP variant — inline text, no pill. Colour still differentiates
     Express (red) from Standard (muted). Combined selectors below give
     these rules enough specificity to beat .deliv-express / .deliv-standard
     which come later in the file but only have single-class specificity. */
  .deliv-pdp {
    font-size: 13px;
    font-weight: 500;
  }
  .deliv-pdp.deliv-express,
  .deliv-pdp.deliv-standard {
    background: transparent;
    border-color: transparent;
    padding: 0;
    border-radius: 0;
  }
  .deliv-pdp .deliv-icon svg { width: 15px; height: 15px; }
  /* Express styling — outlined Speero-red pill (red border + red text on
     white) for a quieter brand presence than a filled red pill. Bold
     "إكسبرس" is the brand-recognizable term. */
  .deliv-express {
    background: var(--white);
    color: var(--red);
    border: 1px solid var(--red);
  }
  .deliv-express b { font-weight: 700; }
  /* Standard styling — quiet container but full-contrast text. Muted gray
     made the delivery promise read as sleepy / placeholder; black text on
     the hairline-bordered chip keeps the standard variant subordinate to
     express (no brand-red) while still feeling like a real commitment. */
  .deliv-standard {
    background: var(--white);
    color: var(--text);
    border: 1px solid var(--hairline);
  }
  .prod-foot { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  /* Price + delivery badge sit on the same row, vertically centered as a
     pair (not baseline — badge text is half the size of the price, so
     baseline alignment makes the badge visually drop below the price's
     vertical centre). Discount info sits in its own row below. */
  .prod-price-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; min-width: 0;
  }
  .prod-price { font-size: 18px; font-weight: 600; color: var(--text); }
  .prod-price .cur {
    font-family: 'Readex Pro', sans-serif;
    font-size: 12px; font-weight: 500; color: var(--muted);
    margin-inline-start: 3px;
  }
  .prod-disc { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .prod-disc .was { font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .prod-disc .off {
    font-size: 11px; font-weight: 600;
    color: #15803D; background: #DCFCE7;
    border-radius: 999px; padding: 1px 7px;
  }
  .fitment { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #14532D; }
  .fitment .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--green); flex-shrink: 0; }
  .prod-alt { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #14532D; font-weight: 500; }
  .prod-alt svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* Recently viewed rail */
  .prod-rail {
    display: flex; gap: 10px;
    padding: 0 14px 4px;
    overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .prod-rail::-webkit-scrollbar { display: none; }
  .prod-rail .prod-card { width: 180px; flex-shrink: 0; scroll-snap-align: start; }

  /* قد يهمك — one-card-at-a-time marketing rail */
  .you-rail {
    display: flex; gap: 10px;
    padding: 0 16px 4px;
    overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }
  .you-rail::-webkit-scrollbar { display: none; }
  .you-card {
    flex-shrink: 0;
    width: calc(100% - 64px);
    min-height: 144px;
    scroll-snap-align: center;
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    gap: 14px;
    text-align: start;
  }
  .you-card.promo { background: var(--red); color: var(--white); }
  .you-card.promo .you-promo-eyebrow { font-size: 12px; font-weight: 500; opacity: 0.92; }
  .you-card.promo .you-pct {
    font-size: 60px; font-weight: 700; line-height: 1; margin-top: 4px;
  }
  .you-card.promo .you-promo-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .you-card.promo .you-promo-sub { font-size: 12px; opacity: 0.92; }
  .you-card.promo .code-pill {
    background: var(--white); color: var(--red);
    font-weight: 700; font-size: 13px;
    padding: 6px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .you-card.promo .code-pill.mono { letter-spacing: 0.08em; }
  .you-card.promo .code-pill svg { width: 16px; height: 16px; }
  @keyframes pillFade { from { opacity: 0; } to { opacity: 1; } }
  .you-card.promo .code-pill.just-copied { animation: pillFade 0.22s ease; }

  .you-card.neutral {
    background: var(--white);
    border: 1px solid var(--hairline);
    color: var(--text);
  }
  .you-card.neutral .you-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--canvas-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .you-card.neutral .you-icon svg { width: 20px; height: 20px; }
  .you-card.neutral .you-title { font-size: 16px; font-weight: 600; }
  .you-card.neutral .you-sub { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

  /* Maintenance card */
  .maint-card {
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .maint-chip {
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex-shrink: 0;
  }
  /* stroke-width 1.0 here (vs the icon-set default 1.6) so the rendered
     stroke matches the tire SVG's visual line thickness above it — the
     tire's viewBox is 240×270 so its strokes scale down to ~1.0-1.4px,
     and we want the oil icon to feel the same weight, not heavier. */
  .maint-chip svg { width: 32px; height: 32px; stroke-width: 1; }
  .maint-body { flex: 1; min-width: 0; }
  .maint-eyebrow {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
  }
  .maint-title { font-size: 15px; font-weight: 600; margin-top: 4px; line-height: 1.35; }
  .maint-sub { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .maint-sub .mono { color: var(--text); }
  .maint-action {
    align-self: center;
    font-size: 13px; font-weight: 600; color: var(--text);
    border-bottom: 2px solid var(--text);
    padding-bottom: 1px; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px;
    transition: color 0.15s, border-color 0.15s;
  }
  .maint-action svg { width: 13px; height: 13px; transform: scaleX(-1); }
  @media (hover: hover) { .maint-action:hover { color: var(--red); border-color: var(--red); } }
  .maint-action:active { color: var(--red); border-color: var(--red); }

  /* ============== CART DRAWER ============== */
  .cart-drawer {
    position: fixed;
    top: 0; bottom: 0;
    inset-inline-end: 0;
    width: min(90vw, 400px);
    background: var(--white);
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.26s ease-out;
    display: flex;
    flex-direction: column;
  }
  /* RTL: cart sits at the end (left) edge and slides in from the left */
  html[dir="rtl"] .cart-drawer { transform: translateX(-100%); }
  .cart-drawer.open { transform: translateX(0) !important; }

  .cart-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between;
  }
  .cart-title { font-size: 16px; font-weight: 600; }

  .cart-items { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 12px; }
  .cart-empty {
    flex: 1;
    /* Extra bottom padding biases the vertically-centered content upward a bit. */
    padding: 40px 20px 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }

  /* ---- Cart empty-state variants (demo: #/cart-empty-demo) ---- */
  .ced-frame {
    border: 1px solid var(--hairline);
    border-radius: 14px;
    background: var(--white);
    padding: 36px 20px 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .ced-icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--canvas-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .ced-icon svg { width: 26px; height: 26px; }
  .ced-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .ced-sub { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
  /* Sign-in promo. Uses the primary brand color (red fill) so it reads as the
     main action of the empty state. */
  .ced-signin {
    margin-top: 18px;
    width: 100%; max-width: 240px;
    background: var(--red); color: #fff;
    border: none; border-radius: 12px;
    padding: 13px 18px;
    font-size: 14.5px; font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  .ced-signin:active { transform: scale(0.99); opacity: 0.92; }
  .ced-browse { margin-top: 20px; font-size: 12.5px; color: var(--muted); }
  .ced-frame .cta { margin-top: 18px; }
  .ced-link {
    margin-top: 12px; font-size: 13px; font-weight: 600;
    color: var(--muted); background: none; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .ced-link svg { width: 14px; height: 14px; transform: scaleX(-1); }
  /* category quick-entry chips */
  .ced-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  /* Match the category-page chip (.dsc-cat-chip): white pill + hairline
     border so it reads as a tappable button, not a flat grey tag. */
  .ced-chip {
    padding: 7px 14px; border-radius: 999px;
    background: var(--white); color: var(--text);
    border: 1px solid var(--hairline);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .ced-chip:active { background: var(--canvas-2); }
  /* popular-parts peek mini rail */
  .ced-peek-eyebrow { font-size: 12.5px; color: var(--muted); margin-top: 16px; align-self: stretch; text-align: start; }
  .ced-peek { display: flex; gap: 10px; margin-top: 10px; align-self: stretch; overflow-x: auto; padding-bottom: 4px; }
  .ced-peek-tile { flex: 0 0 92px; cursor: pointer; }
  .ced-peek-img {
    width: 92px; height: 70px; border-radius: 10px;
    background: var(--canvas-2); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .ced-peek-img img { width: 100%; height: 100%; object-fit: cover; }
  .ced-peek-add {
    position: absolute; inset-block-end: 4px; inset-inline-end: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--red); color: #fff; border: none;
    font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .ced-peek-name { font-size: 11.5px; color: var(--text); margin-top: 5px; line-height: 1.4; text-align: start;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .cart-line {
    position: relative;
    display: grid; grid-template-rows: 1fr;
    border-bottom: 1px solid var(--hairline);
    transition: grid-template-rows 0.15s ease, opacity 0.15s ease;
  }
  .cart-line-inner { overflow: hidden; min-height: 0; }
  .cart-line:last-child { border-bottom: 0; }
  .cart-line.removing { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
  .cart-item.pending { opacity: 0.5; pointer-events: none; user-select: none; }
  .cart-item.pending .cart-item-price { text-decoration: line-through; color: var(--muted); }
  .cart-item.pending .cart-qty { display: none; }
  .cart-actions {
    display: flex; gap: 8px;
    padding: 0 6px 12px;
  }
  .cart-actions button {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text);
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 9px 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .cart-actions button svg { width: 18px; height: 18px; transition: fill 0.15s ease; }
  /* heart fills solid on hover (desktop) / press (mobile) */
  @media (hover: hover) { .cart-actions .act-fav:hover svg { fill: currentColor; } }
  .cart-actions .act-fav.faved svg { fill: currentColor; }
  /* revert icon spins in when the actions first appear */
  @keyframes revertSpinIn {
    from { transform: rotate(-360deg); opacity: 0; }
    to   { transform: rotate(0); opacity: 1; }
  }
  .cart-actions .act-revert svg { animation: revertSpinIn 0.35s ease-out; }
  @media (hover: hover) { .cart-actions button:hover { border-color: var(--text); } }
  .cart-actions button:active { background: var(--canvas-2); }
  .cart-item {
    display: flex; gap: 12px;
    padding: 12px 6px 10px;
    transition: opacity 0.2s ease;
  }
  /* Swap-suggest banner. Every green here derives from the single --green
     token (matching the footer "وفّرت" savings) so the cart speaks one green;
     the tints are color-mixes of it, not ad-hoc hexes. */
  .cart-suggest {
    margin: 0 6px 12px;
    background: color-mix(in srgb, var(--green) 7%, var(--white));
    border: 1px solid color-mix(in srgb, var(--green) 18%, var(--white));
    border-radius: 10px;
    padding: 9px 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .cart-suggest-icon { flex-shrink: 0; display: flex; color: var(--green); }
  .cart-suggest-icon svg { width: 16px; height: 16px; }
  .cart-suggest-text { flex: 1; font-size: 11.5px; color: var(--text); line-height: 1.4; }
  .cart-suggest-savings { display: block; margin-top: 2px; }
  .cart-suggest-save { color: var(--green); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .cart-suggest-diff { color: var(--text); font-weight: 600; white-space: nowrap; }
  .cart-suggest-cta {
    flex-shrink: 0;
    font-size: 12px; font-weight: 600; color: var(--green);
    background: var(--white);
    border: 1px solid color-mix(in srgb, var(--green) 28%, var(--white));
    border-radius: 999px;
    padding: 6px 13px;
    transition: background 0.15s;
  }
  @media (hover: hover) { .cart-suggest-cta:hover { background: color-mix(in srgb, var(--green) 10%, var(--white)); } }
  .cart-suggest-cta:active { background: color-mix(in srgb, var(--green) 10%, var(--white)); }
  /* Neutral 'revert to genuine' variant */
  .cart-suggest.back { background: var(--canvas-2); border-color: var(--hairline); }
  .cart-suggest.back .cart-suggest-icon { color: var(--muted); }
  .cart-suggest-cta.back { color: var(--text); border-color: var(--hairline); }
  @media (hover: hover) { .cart-suggest-cta.back:hover { background: var(--white); } }
  .cart-suggest-cta.back:active { background: var(--white); }
  .cart-thumb {
    width: 60px; height: 60px; border-radius: 10px;
    background: var(--canvas-2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--text);
  }
  .cart-thumb > svg { width: 60%; height: 60%; }
  .cart-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  /* thumb + body open the product's PDP (testers tapped the product expecting this) */
  .cart-thumb, .cart-item-body { cursor: pointer; }
  @media (hover: hover) { .cart-item-body:hover .cart-item-title { text-decoration: underline; text-underline-offset: 2px; } }
  .cart-item-title {
    font-size: 13.5px; font-weight: 500; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cart-item-oem { font-size: 11px; color: var(--muted); }
  /* Service line subtitle. Clamped to 2 lines so a long description never
     stretches the row; the rest is trimmed with an ellipsis. */
  .cart-item-desc {
    font-size: 12px; color: var(--muted); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cart-qty {
    display: inline-flex; align-items: center;
    border: 1px solid var(--hairline); border-radius: 999px; overflow: hidden;
  }
  .cart-qty button {
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text);
  }
  .cart-qty button:active { background: var(--canvas-2); }
  .cart-qty button svg { width: 14px; height: 14px; }
  .cart-qty .qty-del { color: var(--muted); }
  .cart-qty span {
    min-width: 22px; text-align: center; font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .cart-item-side {
    display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
    flex-shrink: 0;
  }
  .cart-item-price { font-size: 15px; font-weight: 600; }
  .cart-price-block { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

  .cart-foot {
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  /* Savings line — sits above the total, summing what the user saved by
     switching any items OEM→alt via the cart's "استبدل". Compact green
     line (no fill, no container) with a check icon for the success cue;
     visual weight comes from color + weight + the conditional hairline
     below it, not from a tinted card. Always rendered to reserve layout
     space (~20px); visibility: hidden when no savings so the buttons
     below don't shift as items get switched/reverted. The hairline below
     only appears when savings is actually present (via adjacent-sibling
     selector on .is-on) so no stray divider floats above the total when
     savings is zero. */
  .cart-savings {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    color: var(--green);
  }
  .cart-savings svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--green); }
  .cart-savings .cart-savings-label { flex: 1; }
  .cart-savings .mono { font-size: 13.5px; font-weight: 700; }
  .cart-savings:not(.is-on) { visibility: hidden; }
  .cart-subtotal {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
  }
  .cart-subtotal .mono { font-size: 17px; }
  /* Conditional separator — only when savings is actually present, the
     subtotal grows a top border so the discount and total are visually
     distinct. When savings is hidden, no border = no stray hairline. */
  .cart-savings.is-on + .cart-subtotal {
    padding-top: 10px;
    border-top: 1px solid var(--hairline);
  }
  .cart-trust {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; padding-top: 10px;
    border-top: 1px solid var(--hairline);
  }
  .cart-trust-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.3;
  }
  .cart-trust-item svg { width: 18px; height: 18px; }

  /* ===== Visual-search section explorations (#/visual-search-demo) ===== */
  .vsd-label {
    font-size: 11.5px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.03em; padding: 22px 16px 8px;
    border-top: 1px solid var(--hairline); margin-top: 8px;
  }
  .vsd-label.first { border-top: 0; margin-top: 0; }
  /* Neutral placeholder standing in for surrounding sections. */
  .vsd-ph { padding: 4px 16px 8px; }
  .vsd-ph-bar { width: 42%; height: 13px; border-radius: 7px; background: var(--canvas-2); margin-bottom: 12px; }
  .vsd-ph-row { display: flex; gap: 12px; }
  .vsd-ph-box { flex: 1; height: 84px; border-radius: 12px; background: var(--canvas-2); }
  @keyframes vsdPulse {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(3.4); opacity: 0; }
  }
  /* A — merged banner (title lives in the card, no section heading) */
  .vsd-a {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--white); border: 1px solid var(--hairline);
    border-radius: 16px; padding: 16px; text-align: start; cursor: pointer;
    transition: border-color 0.15s;
  }
  .vsd-a:active { border-color: var(--text); }
  .vsd-a-art { flex-shrink: 0; width: 70px; height: 70px; }
  .vsd-a-art svg { width: 100%; height: 100%; }
  .vsd-a-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .vsd-a-title { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .vsd-a-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--red); background: var(--red-soft); border-radius: 999px; padding: 4px 9px; }
  .vsd-a-tag svg { width: 12px; height: 12px; }
  .vsd-a-arrow { flex-shrink: 0; color: var(--muted); }
  .vsd-a-arrow svg { width: 18px; height: 18px; transform: scaleX(-1); }
  /* B — your actual car + pulsing red hotspots */
  .vsd-b {
    position: relative; width: 100%; padding: 0;
    border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden;
    background: var(--canvas-2); cursor: pointer; display: block;
  }
  .vsd-b-img { width: 100%; height: 184px; object-fit: cover; display: block; }
  .vsd-b-dot { position: absolute; width: 13px; height: 13px; transform: translate(-50%, -50%); }
  .vsd-b-dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px rgba(255,255,255,0.85); }
  .vsd-b-dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: var(--red); animation: vsdPulse 1.6s ease-out infinite; }
  .vsd-b-cap {
    position: absolute; inset-inline: 0; bottom: 0; padding: 14px 16px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
    text-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  }
  .vsd-b-cap-title { font-size: 15px; font-weight: 700; color: #fff; }
  .vsd-b-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.2); border-radius: 999px; padding: 3px 9px; }
  .vsd-b-tag svg { width: 12px; height: 12px; }
  /* C — full-bleed dark hero band, art bleeding off the end */
  .vsd-c {
    position: relative; width: 100%; min-height: 152px; overflow: hidden;
    background: linear-gradient(135deg, #23252A, #34373F);
    display: flex; align-items: center; padding: 22px; cursor: pointer; text-align: start;
  }
  .vsd-c-body { position: relative; z-index: 1; max-width: 62%; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .vsd-c-title { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.3; }
  .vsd-c-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 4px 10px; }
  .vsd-c-tag svg { width: 12px; height: 12px; }
  .vsd-c-wheel { position: absolute; inset-inline-end: -22px; bottom: -18px; width: 150px; height: 150px; opacity: 0.9; }
  .vsd-c-wheel g { stroke: #fff; }

  /* ============== SEARCH OVERLAY ============== */
  /* ============================================================================
     Discovery screen — unified surface for search + browse + category + brand
     ============================================================================
     Two presentations share the same body. Modal slides up over the previous
     screen; page renders inline as any other route. .is-open is added on the
     frame after mount so the CSS transition catches the open animation.

     iOS-style sheet feel: when search opens, three things animate together —
     (1) the modal slides up, (2) a scrim fades behind it, (3) the .app-stage
     underneath scales down + rounds its corners. All on the same timeline so
     it reads as a single coordinated motion. */
  .discovery-screen {
    position: fixed; inset: 0;
    max-width: 480px; margin: 0 auto;
    background: var(--canvas);
    display: flex; flex-direction: column;
    z-index: 60;
  }
  /* Modal: closed state sits below viewport. Opening uses a keyframe animation
     so the FROM is captured at the moment .is-open is added — that lets the
     sheet rise from the *tapped* search bar (via --sheet-start-y) without the
     transition system blending with the closed→open jump. Closing falls back
     to the plain transition → slides down to viewport bottom. */
  .discovery-modal {
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    /* Force a GPU compositing layer so subpixel rounding during the animation
       doesn't leave a thin gap at the top edge where the scrim peeks through. */
    will-change: transform;
    backface-visibility: hidden;
    /* Stop iOS rubber-band scroll from bouncing the modal at the top edge once
       it lands — `contain` prevents the touch from chaining to the parent. */
    overscroll-behavior: contain;
  }
  .discovery-modal.is-open {
    /* Animation handles the rise; no static transform: translateY(0) here so the
       browser doesn't re-apply it as a correction frame at animation end. */
    animation: sheetRise 0.32s ease-out both;
    pointer-events: auto;
  }
  @keyframes sheetRise {
    from { transform: translateY(var(--sheet-start-y, 100%)); }
    to   { transform: translateY(0); }
  }
  /* Page: no slide animation; just appears in place. No top rounding either
     since there's no underlying surface to peek over. */
  .discovery-page { transform: none; border-radius: 0; }
  /* Reduced motion: kill the slide entirely. */
  @media (prefers-reduced-motion: reduce) {
    .discovery-modal { transition: none; transform: translateY(0); }
  }

  /* Backdrop scrim — fades in/out on the same curve as the sheet. Tap to dismiss. */
  .discovery-scrim {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0);
    z-index: 55;
    pointer-events: none;
    transition: background 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .discovery-scrim.is-open {
    background: rgba(0, 0, 0, 0.32);
    pointer-events: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .discovery-scrim { transition: none; }
  }

  /* The whole app underneath the modal — scales + recedes when search is open
     to give the sheet a layered "iOS sheet" feel. */
  .app-stage {
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: 50% 0;
  }
  .app-stage.is-receded {
    transform: scale(0.94) translateY(8px);
    border-radius: 12px;
    overflow: hidden;
  }
  @media (prefers-reduced-motion: reduce) {
    .app-stage, .app-stage.is-receded {
      transition: none; transform: none; border-radius: 0;
    }
  }
  .search-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  /* All-in-one pill — cancel + divider + search + input + clear all live inside one
     floating rounded container. Reads as a single command surface, not a header + field.
     The container has no background — pill floats on the overlay's canvas, body flows below.
     overflow: hidden clips the 3D teaser at the screen edge (search-top spans edge-to-edge). */
