  .search-top {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px;
    overflow: hidden;
  }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding-block: 6px;
    padding-inline-start: 6px;  /* snug-to-edge for the cancel chip */
    padding-inline-end: 14px;   /* more breathing room around the clear chip */
    box-shadow: var(--shadow-sm);
  }
  /* Cancel — small "chip in chip" on the start side, marks it as the close action. */
  .search-cancel {
    font-family: inherit;
    font-size: 13px; font-weight: 500;
    color: var(--text);
    background: var(--canvas-2);
    border-radius: 999px;
    padding: 7px 14px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  @media (hover: hover) { .search-cancel:hover { background: var(--hairline); } }
  .search-cancel:active { background: var(--hairline); }
  /* Thin divider between the cancel chip and the search content */
  .search-bar-sep {
    width: 1px; height: 18px;
    background: var(--hairline);
    flex-shrink: 0;
  }
  .search-bar > svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
  .search-bar input {
    flex: 1; min-width: 0;
    border: none; background: none; outline: none;
    font-family: inherit; font-size: 15px; color: var(--text);
    padding: 8px 0;
  }
  .search-bar input::placeholder { color: var(--muted); }
  /* Clear-X chip — only when there's text. Standard filled "clear input" affordance. */
  .search-clear {
    width: 22px; height: 22px; border-radius: 999px;
    background: rgba(0,0,0,0.18); color: var(--white);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .search-clear svg { width: 12px; height: 12px; }
  @media (hover: hover) { .search-clear:hover { background: rgba(0,0,0,0.28); } }
  .search-clear:active { background: rgba(0,0,0,0.28); }
  /* Spinner sits where clear would; align by its own existing styling. */
  .search-bar .search-spin { margin-inline-end: 4px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .search-spin {
    width: 16px; height: 16px;
    border: 2px solid var(--hairline);
    border-top-color: var(--muted);
    border-radius: 999px;
    animation: spin 0.5s linear infinite;
    flex-shrink: 0;
  }

  /* Scope label — lives in the search-top tinted strip. Plain inline text + icon
     (no pill chrome) so it reads as a status note, not a tap target. */
  .search-carctx {
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
    padding: 0 4px;
    font-size: 12px; color: var(--muted);
  }
  .search-carctx svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
  .search-carctx b { color: var(--text); font-weight: 600; }

  .search-sec-title { font-size: 12px; font-weight: 600; color: var(--muted); padding: 16px 16px 8px; }
  .search-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
  .search-chip {
    background: var(--white); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--text);
    transition: border-color 0.15s;
  }
  @media (hover: hover) { .search-chip:hover { border-color: var(--text); } }
  .search-chip:active { border-color: var(--text); }

  /* Typeahead list — rendered when the input has ≥ 2 chars (substring-
     matched suggestions ranked recent > popular > catalog-keyword + a
     literal "ابحث عن «{q}»" row that's always tappable). RTL is inherited
     from <html>, so leading edge = right, trailing edge = left, and the
     flex children land in the visually correct order from source order. */
  .ta-list {
    display: flex; flex-direction: column;
    padding: 4px 0;
  }
  .ta-row {
    display: flex; align-items: center; gap: 12px;
    background: transparent; border: 0;
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    color: var(--text);
    text-align: start;
    cursor: pointer;
    transition: background 0.12s ease;
    border-bottom: 1px solid var(--hairline);
  }
  .ta-row:last-child { border-bottom: 0; }
  .ta-row:active { background: var(--canvas-2); }
  .ta-icon {
    display: inline-flex; align-items: center;
    color: var(--muted);
    flex-shrink: 0;
  }
  .ta-icon svg { width: 16px; height: 16px; }
  /* Literal row's icon stays at full text-color so it reads as the
     primary action on screen vs the muted suggestion icons. */
  .ta-literal .ta-icon { color: var(--text); }
  .ta-term {
    flex: 1; min-width: 0;
    font-size: 14px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Matched portion pops via color + weight against the muted body. Bold
     alone wasn't enough contrast; demoting the surrounding text is what
     makes the eye lock onto the match. */
  .ta-term b { color: var(--text); font-weight: 600; }
  /* English numerals throughout — Latin digits even inside Arabic copy
     (per project convention). Tabular alignment keeps the counts vertically
     aligned across rows; the canvas-2 pill makes the metric feel deliberate
     instead of fading into the row. */
  .ta-count {
    font-size: 11.5px;
    color: var(--muted);
    background: var(--canvas-2);
    border-radius: 999px;
    padding: 3px 9px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  /* Trailing corner-arrow — the typeahead-row indicator used by Amazon /
     iOS Safari / Google suggestions. Drawn pointing ↖ in the SVG; flipped
     here to ↗ so the arrow points in the reading-forward direction in RTL.
     The literal row's arrow goes full text color to match its full-color
     leading icon — primary-action emphasis. */
  .ta-arrow {
    display: inline-flex; align-items: center;
    color: var(--muted);
    flex-shrink: 0;
  }
  .ta-arrow svg {
    width: 15px; height: 15px;
    transform: scaleX(-1);
  }
  .ta-literal .ta-arrow { color: var(--text); }

  /* Live "did you mean" suggestion chips — horizontal scroll row above results */
  .search-sugg-wrap {
    padding: 12px 0 4px;
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
  }
  .search-sugg-label { font-size: 11.5px; color: var(--muted); padding: 0 16px 6px; }
  .search-sugg-chips {
    display: flex; gap: 6px; padding: 0 16px 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  .search-sugg-chips::-webkit-scrollbar { display: none; }
  .search-sugg-chip {
    flex-shrink: 0;
    background: var(--canvas-2); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 6px 12px; font-size: 12.5px; color: var(--text);
    white-space: nowrap;
    transition: border-color 0.15s, background 0.15s;
  }
  @media (hover: hover) { .search-sugg-chip:hover { border-color: var(--text); background: var(--white); } }
  .search-sugg-chip:active { border-color: var(--text); background: var(--white); }
  /* Active state — only used in term mode (chip is filtering the result list). */
  .search-sugg-chip.is-active {
    background: var(--text); color: var(--white); border-color: var(--text);
  }
  @media (hover: hover) { .search-sugg-chip.is-active:hover { background: var(--text); color: var(--white); } }
  .search-sugg-chip.is-active:active { background: var(--text); color: var(--white); }

  .search-filters {
    position: sticky; top: 0; z-index: 2;
    background: var(--canvas);
    display: flex; gap: 8px; padding: 12px 16px;
  }

  /* Sticky head above the results — make filter chips on the inline-start,
     list/grid view toggle on the inline-end. The empty span keeps the toggle
     anchored even when there are no filters to show. */
  .search-head {
    position: sticky; top: 0; z-index: 2;
    background: var(--canvas);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px;
  }
  .search-filters-row {
    display: flex; gap: 8px; flex: 1; min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .search-filters-row::-webkit-scrollbar { display: none; }
  .view-toggle {
    display: inline-flex;
    background: var(--canvas-2);
    border-radius: 8px;
    padding: 2px;
    flex-shrink: 0;
  }
  .view-toggle button {
    border: 0; background: transparent;
    padding: 5px 8px;
    border-radius: 6px;
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .view-toggle button svg { width: 18px; height: 18px; }
  .view-toggle button[data-active] {
    background: var(--white);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  .search-grid {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .sfilter {
    background: var(--white); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 6px 14px; font-size: 12.5px; color: var(--text);
    transition: background 0.15s, border-color 0.15s;
  }
  .sfilter.active { background: var(--text); color: var(--white); border-color: var(--text); }

  .search-results { padding: 4px 12px 32px; }
  .sresult {
    width: 100%; text-align: start;
    display: flex; gap: 12px; align-items: center;
    padding: 12px 6px;
    border-bottom: 1px solid var(--hairline);
    transition: background 0.15s;
  }
  .sresult:last-child { border-bottom: 0; }
  @media (hover: hover) { .sresult:hover { background: var(--white); } }
  .sresult:active { background: var(--white); }
  .sresult-thumb {
    width: 56px; height: 56px; border-radius: 10px; background: var(--canvas-2);
    display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0;
  }
  .sresult-thumb > svg { width: 60%; height: 60%; }
  .sresult-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .sresult-title {
    font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 1; line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sresult-oem { font-size: 11.5px; color: var(--muted); }
  .stock { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #14532D; font-weight: 500; }
  .stock .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--green); flex-shrink: 0; }
  .sresult-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
  .sresult-prices { display: flex; align-items: baseline; gap: 6px; }
  .sresult-meta { display: flex; align-items: center; gap: 8px; }
  .sresult-side .was { font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .sresult-side .off {
    font-size: 10.5px; font-weight: 600;
    color: #15803D; background: #DCFCE7;
    border-radius: 999px; padding: 1px 6px;
  }
  .sresult-price { font-size: 15px; font-weight: 600; }

  /* Compact "+" button on the inline-end of the row — only renders when the row
     is rendered with an onAddToCart handler (currently the 3D-locate sheet).
     Light-gray secondary look (dark icon on light disc) so the row's price
     reads as the primary signal. After tap, swaps to a brand-red disc with
     a white checkmark. */
  .sresult-add {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #F4F4F4; color: var(--text);
    border: 0;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-inline-start: 8px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.6,.2,.2,1), background 0.18s ease, color 0.18s ease;
  }
  .sresult-add svg { width: 18px; height: 18px; }
  .sresult-add:active { transform: scale(0.92); }
  .sresult-add[data-added] {
    background: var(--red);
    color: var(--white);
    animation: addedPop 0.28s cubic-bezier(.6,.2,.2,1);
  }
  @keyframes addedPop {
    0%   { transform: scale(0.85); }
    55%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .search-noresults { padding: 52px 24px; text-align: center; }
  .search-noresults .nr-title { font-size: 15px; font-weight: 600; }
  .search-noresults .nr-sub { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .search-noresults .nr-btn {
    margin-top: 18px;
    background: var(--white); border: 1px solid var(--hairline); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; color: var(--text);
  }
  .search-noresults .nr-btn:active { border-color: var(--text); background: var(--canvas-2); }

  /* =========================================================================
     Locate screen — "search parts by location" (3D interactive diagram).
     Fixed full-viewport overlay above the rest of the app. Owns its own
     header (back + car-context bar) rather than reusing the global Header,
     because the 3D cube + sheet need the whole viewport to themselves.
     ========================================================================= */
  .locate-screen {
    position: fixed; inset: 0;
    background: var(--canvas);
    /* Above the global Header (z-index 30) so loc-top owns the viewport top edge —
       the locate screen carries its own back + car-context bar and doesn't need
       the global menu/cart icons. */
    z-index: 40;
    display: flex; flex-direction: column;
    /* clip, NOT hidden. `hidden` still makes this a scroll container — it only
       hides the scrollbar — and this screen has real scrollable overflow: the
       peeking .parts-sheet is translateY'd ~404px past the bottom edge, and
       Chrome counts transformed descendants in the scrollable overflow region.
       Android Chromium will happily touch-scroll that (desktop Chrome won't,
       which is why it only showed on device). `clip` isn't a scroll container
       at all, so there is no scrollTop to move on any engine. The `hidden`
       line above is the fallback for browsers without overflow:clip. */
    overflow: hidden;
    overflow: clip;
    /* Always-mounted sheet — sits off-screen below by default, slides up
       when .is-open. Curve: Apple-style ease-out so the rise decelerates
       into place rather than snapping. */
    transform: translateY(100%);
    transition: transform 0.34s cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
    /* Belt-and-braces on top of the locked page height: translateY(100%) parks
       this exactly one viewport below the fold, which only stays off-screen
       while "one viewport" means the same thing for a position:fixed box and
       for the visible area — an assumption mobile URL bars break. Hiding it
       outright makes the peeking-header bug structurally impossible. The 0.34s
       visibility delay lets the slide-DOWN finish before it blinks out; on the
       way up visibility flips immediately (0s, no delay) so the rise is seen. */
    visibility: hidden;
    transition: transform 0.34s cubic-bezier(.22, 1, .36, 1),
                visibility 0s linear 0.34s;
  }
  .locate-screen.is-open {
    transform: translateY(0);
    visibility: visible;
    transition: transform 0.34s cubic-bezier(.22, 1, .36, 1),
                visibility 0s linear 0s;
  }
  @media (prefers-reduced-motion: reduce) {
    .locate-screen { transition: none; }
  }

  /* Car bar at the top of the locate screen — reuses the home's .car-bar styling
     (photo + eyebrow + name + red side stripe). Just adds a back button at the
     inline-start and respects the iOS notch. */
  .loc-carbar {
    padding-top: max(env(safe-area-inset-top), 14px);
    /* Drag-to-close gesture lives here — touch-action: none lets the
       browser hand all pointer events to JS without interfering. */
    touch-action: none;
  }
  /* Body grows + centers the car name between the back button (inline-start)
     and the cart button (inline-end). The 3px margin-top on .car-bar-name
     is meant for the anchored-home eyebrow, which doesn't exist here — reset
     it so the title sits vertically centered in the bar. */
  .loc-carbar .car-bar-body {
    flex: 1 1 auto;
    min-width: 0;
    text-align: center;
  }
  .loc-carbar .car-bar-name { margin-top: 0; }
  .loc-back, .loc-cart {
    width: 36px; height: 36px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--text);
    flex-shrink: 0;
  }
  .loc-back { margin-inline-end: -4px; color: var(--muted); }
  /* Visibility-hidden keeps the slot's width in the flex row so the car
     name doesn't slide sideways when the X comes and goes. */
  .loc-back.is-hidden { visibility: hidden; pointer-events: none; }
  .loc-back:active, .loc-cart:active { background: var(--canvas-2); }
  /* Match the cart drawer's close treatment — natural 18px IconClose
     size + muted gray (close is a secondary affordance, not primary). */
  .loc-back svg { width: 18px; height: 18px; }
  .loc-cart { position: relative; }
  .loc-cart svg { width: 22px; height: 22px; }
  .loc-cart-badge {
    position: absolute;
    top: 2px;
    inset-inline-end: 2px;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--red);
    color: var(--white);
    font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* Single muted instructional line above the cube. */
  /* padding-top sets the header->hint gap; it, the ring's `top` and the
     car lift (translateY on .car-stage-3d / .car-stage) are tuned TOGETHER:
     hint + ring + car moved up as one block until the visible car sits at
     the middle of the header-to-sheet container (measured on a 390x844
     viewport). gap-below-the-hint = 6px padding-bottom + ring top - ~4px
     label overhang. */
  /* top/bottom paddings trade against each other with a CONSTANT sum (62 /
     30 compact): that keeps this block's height — and everything below it
     (ring, car) — fixed, while sliding the hint text to sit with equal air
     above (to the header) and below (to the ring's back label). */
  .loc-head { padding: 53px 16px 9px; flex-shrink: 0; }
  /* Short viewports (the ring's compact breakpoint): the car needs a ~72px
     lift to reach center but the hint only has ~38px of headroom, so the
     hint rises to a 12px floor and the ring/car finish the trip without it
     (see the compact .zone-ring / car-stage rules). */
  @media (max-height: 700px) {
    .loc-head { padding-top: 20px; padding-bottom: 10px; }
  }
  /* ── Staged reveal ────────────────────────────────────────────────────────
     THE 3D screen's whole navigation layer waits for the model and fades in
     together on CarStage3D's hotspotsReady: the header hint here, the zone
     ring, and the drag hint under the car. One rule for all three so their
     timing cannot drift apart — change the duration once and the layer still
     arrives as a single beat. (The hotspot dots ride the same flag through
     .car-stage-3d[data-hotspots-hidden], which needs its own faster 0.15s
     because it also toggles mid-drag.)

     Why they wait at all: every one of them points at something that is not on
     screen yet. "اضغط على النقاط التفاعليه" instructs a tap on dots that do not
     exist; the ring offers four sides of a car that has not arrived, with live
     buttons; "drag to rotate" asks for a gesture with nothing to rotate.

     OPACITY, never a conditional render or display:none, for a different
     reason in each case — which is why they converged on one mechanism:
       - .loc-head: the paddings above are load-bearing, this block's height is
         what positions the ring and the car below it, so dropping it out of
         flow would slide the whole stage up and then jolt it back;
       - .zone-ring: its own docs say to mount it without a key because
         remounting destroys its transitions;
       - .drag-hint: shares the footer slot with the loader as a cross-fade.

     Keyed on [data-ready] rather than the class so the 2D cube screen's
     identical header and ring are untouched: they have no model to wait for
     and never set the attribute, and an absent attribute matches neither
     selector below. */
  .loc-head[data-ready],
  .zone-ring[data-ready],
  .stage-footer .drag-hint[data-ready] { transition: opacity 0.28s ease; }
  .loc-head[data-ready="false"],
  .zone-ring[data-ready="false"],
  .stage-footer .drag-hint[data-ready="false"] { opacity: 0; }
  /* Invisible must also mean inert. The ring is the only one of the three with
     real hit targets — its labels are buttons that opt back into
     pointer-events — and an unseen button that still takes clicks is worse
     than a visible one: it would pick a zone on a car that has not loaded.
     The two hints are already pointer-events: none in their own rules. */
  .zone-ring[data-ready="false"] .zr-item,
  .zone-ring[data-ready="false"] .zr-arrow { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .loc-head[data-ready],
    .zone-ring[data-ready],
    .stage-footer .drag-hint[data-ready] { transition: none; }
  }
  .loc-hint {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    margin: 0; text-align: center;
  }

  /* Zone chip rail (wraps to a second row on narrow screens) */
  .zone-rail {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px 16px 10px;
    flex-shrink: 0;
  }
  .zone-pill {
    flex-shrink: 0;
    background: var(--white);
    border: 1px solid var(--hairline);
    color: var(--text);
    font-size: 13px; font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
    line-height: 1.5;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .zone-pill.active {
    background: var(--text); color: var(--white); border-color: var(--text);
  }

  /* 3D stage — flex:1 so the sheet docks to the bottom of the locate-screen */
  .orbit-stage {
    position: relative; flex: 1;
    display: grid; place-items: center;
    overflow: hidden;
    min-height: 240px;
    padding-bottom: 96px; /* keep car centered above the peeking sheet */
  }
  /* Drag-to-rotate surface: a centered column (not the full width) that's tall
     enough to reach the hint label, so dragging low still rotates — while the
     screen edges stay free for the system back-swipe. */
  .car-drag {
    align-self: stretch; justify-self: center;
    width: 300px; max-width: 80%;
    display: flex; align-items: center; justify-content: center;
    touch-action: pan-y; cursor: grab;
  }
  /* ── Zone ring ──────────────────────────────────────────────────────────
     Replaces .view-label on both car screens. The car's turntable seen from
     above: four zone names + four chevrons ride a flattened ellipse. JS
     projects each item (dx = sinθ·Rx, dy = cosθ·Ry, depth = (1−cosθ)/2 →
     scale/opacity/z); CSS only transitions each item between projected
     snapshots, on the car's own settle cadence — same bezier as .car-cube,
     duration driven inline through --zr-ms (settleMs / 300ms). */
  .zone-ring {
    position: absolute;
    /* Sunk toward the car (the back label's 36px button box overhangs this
       ring box by ~4px). The ring's SCREEN position still hovers just off
       the roof — the drop that used to live entirely here (top: 100) is
       now split with .loc-head's 50px padding-top so the hint text ends up
       centered between header and ring instead of stranded at the top. */
    top: 48px;
    left: 50%;
    width: 280px;
    margin-left: -140px;      /* physical centering — immune to dir=rtl */
    height: 64px;
    z-index: 5;               /* same slot as the old .view-label */
    pointer-events: none;     /* only the buttons opt back in */
    font-family: 'Readex Pro', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    animation: zoneRingIn 0.22s ease-out;
  }
  /* Compact (≤700px-tall viewports — including desktop browser windows on
     small laptops): rides up with the centered car (see the media queries
     on .loc-head and .car-stage-3d) — it keeps its distance to the CAR;
     the hint above is the element that gives way. */
  .zone-ring[data-compact="true"] { top: 12px; height: 54px; }

  /* Subtle: just a soft fade on (re)mount, like the old label. */
  @keyframes zoneRingIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Persistent red "front of the turntable" marker — the active label
     always settles right above it. Replaces the old ::after bar. */
  .zr-marker {
    position: absolute;
    left: 50%;
    width: 24px; height: 2px;
    margin-left: -12px;
    background: var(--red);
    border-radius: 1px;
    pointer-events: none;
  }

  /* Opt-in (ZoneRing's `showTrack` prop) solid ellipse tracing the SAME
     path project() already places items on — BOTH hosts pass it now, so the
     stepper reads as the same dial/orbit control on the 2D and 3D screens
     alike. The line is continuous (dashes dropped), yet it never runs
     through a word: each label carries its own canvas-colored patch that
     masks the segment beneath it (see .zr-item > span), a gap that follows
     the label through drags and settles for free. Lives entirely inside
     .zone-ring's own 280x64 / 224x54 header strip, never reached by the 3D
     model or its shadow — sidesteps needing to draw a ring under the actual
     GLB car, where the four zone framings deliberately vary how much clear
     space surrounds the silhouette (the per-car camera.radius) and a stage-sized
     ring would flicker between visible and fully covered depending on zone.
     Values are 2*RX / 2*RY / (CY-RY) from ZoneRing's own `G` object (see
     its definition) — no shared source of truth, so a change to G's
     RX/RY/CY needs a matching update here. */
  .zr-track {
    position: absolute;
    left: 50%; top: 0;
    width: 236px; height: 44px;   /* 2*RX(118) x 2*RY(22) */
    margin-left: -118px;
    transform: translateY(2px);   /* CY(24) - RY(22) */
    border-radius: 50%;
    border: 1px solid var(--hairline);
    pointer-events: none;
  }
  .zone-ring[data-compact="true"] .zr-track {
    width: 224px; height: 32px;   /* 2*RX(112) x 2*RY(16) */
    margin-left: -112px;
    transform: translateY(3px);   /* CY(19) - RY(16) */
  }

  /* Ring stops. The button box is NEVER scaled (constant ≥36px hit
     target); only the inner span scales/fades with depth. */
  .zr-item, .zr-arrow {
    position: absolute;
    left: 50%; top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0;
    background: transparent;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    transition: transform var(--zr-ms, 300ms) cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
  }
  .zr-item  { height: 36px; min-width: 48px; padding: 0 6px; }
  .zr-arrow { width: 36px; height: 36px; }

  .zr-item > span {
    display: block;
    font-size: 15px;
    font-weight: 600;         /* constant weight: no width-jump when active flips */
    line-height: 1;
    white-space: nowrap;
    /* Canvas-colored patch behind each word: masks the solid .zr-track
       segment under the label so the continuous line reads as broken around
       the words. The padding is the breathing room between the glyphs and
       where the line resumes. Because the patch IS the label's own box, the
       gap tracks the word exactly through live drags AND the CSS-transition
       settles — no geometry to keep in sync. */
    padding: 2px 8px;
    background: var(--canvas);
    transition: transform var(--zr-ms, 300ms) cubic-bezier(.22, 1, .36, 1);
  }
  /* Depth fade lives on an inner span, NOT on the patch: at the far rim the
     text dims to 38%, but the patch must stay fully opaque or the track
     would ghost through the back label. */
  .zr-item > span > span {
    display: block;
    color: var(--muted);
    transition: opacity   var(--zr-ms, 300ms) cubic-bezier(.22, 1, .36, 1),
                color 0.15s ease;   /* hotspot-fade cadence */
  }
  .zr-item[data-active="true"] > span > span { color: var(--text); }

  /* ZoneRing step arrow: curved-arrow SVG inlined in the JSX (a ‹› glyph
     would be bidi-mirrored under dir=rtl; an inline path cannot be). This
     icon's combined (shaft + head) bbox is 77.15x32.19 (~2.4:1) — much closer
     to square than the earlier icons, since it points diagonally rather than
     sweeping mostly horizontally. Matching that aspect here keeps the
     viewBox from letterboxing so the glyph's rendered size is exactly what
     these dimensions say. */
  .zr-arrow svg {
    display: block;
    width: 28px; height: 12px;
    color: var(--muted);
    transition: transform var(--zr-ms, 300ms) cubic-bezier(.22, 1, .36, 1),
                opacity   var(--zr-ms, 300ms) cubic-bezier(.22, 1, .36, 1);
  }

  /* Live drag on the 2D screen: the ring re-projects from rot every frame
     along the TRUE ellipse — transitions off, exactly like
     .car-cube[data-dragging="true"]. */
  .zone-ring[data-dragging="true"] .zr-item,
  .zone-ring[data-dragging="true"] .zr-item > span,
  .zone-ring[data-dragging="true"] .zr-item > span > span,
  .zone-ring[data-dragging="true"] .zr-arrow,
  .zone-ring[data-dragging="true"] .zr-arrow svg { transition: none; }

  @media (prefers-reduced-motion: reduce) {
    .zr-item, .zr-item > span, .zr-item > span > span, .zr-arrow, .zr-arrow svg {
      transition-duration: 1ms !important;
    }
  }

  /* The cube. translateZ(-140) pulls back to fit, faces translateZ(140) push out.
     translateY is the pixel-measured car-centring lift — the visible car sits
     midway between the ring's marker and the drag-hint pill, the same tuning
     .car-stage-3d carries. (A floor circle used to ride along under the cube on
     the same offsets; it was dropped — the zone ring above is the one orbit
     line both car screens draw now.) */
  .car-stage {
    position: relative;
    width: 280px; height: 280px;
    transform: translateY(-18px);
    perspective: 1100px;
    perspective-origin: 50% 50%;
    touch-action: pan-y;
    cursor: grab;
  }
  @media (max-height: 700px) {
    .car-stage { transform: translateY(-42px); }
  }
  .car-stage:active { cursor: grabbing; }
  .car-stage.flat { perspective: none; }
  .car-cube {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    /* Duration overridden inline from JS so a 15° correction snaps fast and a
       90° fling takes its time. Curve is Apple's deceleration ease-out — gentler
       tail than the previous .6,.2,.2,1 so the cube settles instead of stopping. */
    transition: transform var(--settle, 550ms) cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
  }
  .car-cube[data-dragging="true"] { transition: none; }
  .car-cube-face {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .car-3d-img {
    width: 280px; height: 280px;
    object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.08)) contrast(1.15);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .car-special-slot {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    animation: locCarIn 0.35s ease-out both;
  }
  .car-special-slot svg { width: 260px; height: 260px; color: var(--text); }
  @keyframes locCarIn {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* Hotspots — anchored to % coords of the 280x280 stage. Fade out during rotation.
     z-index sits above the peek-to-open scrim (9) so tapping hotspot B right after
     hotspot A registers directly instead of the first tap just dismissing the
     scrim (see .ps-scrim) — but stays below the sheet itself (12) so once the
     sheet is actually covering this area, its content wins instead of a stray dot
     floating on top of the parts list. */
  .hotspots-overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 11;
  }
  .hotspots-overlay[data-hidden="true"] { opacity: 0; }
  /* While the screen is closed, keep the overlay snapped to hidden (no fade) so a
     reopen doesn't fade the previous zone's pulses out during the entrance spin.
     They fade back in (0.15s) only once the spin settles. */
  .locate-screen:not(.is-open) .hotspots-overlay { opacity: 0; transition: none; }
  .hotspots-overlay > * { pointer-events: auto; }

  /* ---- Native <model-viewer> hotspots (3D screen only) ----
     These are slotted into model-viewer, which positions each one by projecting
     its data-position. Two overrides of the base .hotspot rules are required:

     1. transform: none — the base .hotspot uses translate(-50%, -50%) because
        it is positioned by its top-left corner. model-viewer instead centres
        the slotted element on the anchor point already, so keeping the shift
        double-counts it and lands every dot 6px up and to the left (half the
        12px dot). Measured: removing it takes the offset to exactly zero.
     2. position: relative, NOT absolute. Absolute would take the button out of
        the flow model-viewer positions it in; it also needs to stay a
        containing block for the 40px .hotspot::before tap target.
     3. direction: rtl restores the Arabic label direction, which the
        `direction: ltr` on model-viewer (see .car-stage-3d) would otherwise
        flip. Safe: a hotspot's POSITION is decided by its parent's direction
        inside the shadow DOM, so setting it here only affects the label text
        — verified it does not move the dot.

     pointer-events mirrors the .hotspots-overlay pattern it replaces — see the
     model-viewer rule in .car-stage-3d for why the element itself is inert.

     touch-action: none because a rotate-drag may BEGIN on a dot: its pointerdown
     bubbles up to .car-swipe and arms the gesture (see the swipe-surface note in
     CarStage3D). Before .car-swipe declared none for the whole band, the body's
     pan-x pan-y was in force here and the browser turned such a drag into a pan
     after ~10px and fired pointercancel — which snapped the car straight back,
     so a swipe that happened to start on a dot "did nothing". The ancestor's
     none now covers the dots too; this stays as the dot's own declaration.
     A plain tap is unaffected: click is still synthesised for a touch that does
     not move.

     Selector is .hotspot.hotspot-3d, not .hotspot-3d: the base .hotspot rule
     below has equal single-class specificity and comes later in this sheet, so
     a single class would lose these overrides on source order alone. */
  .hotspot.hotspot-3d {
    position: relative;
    transform: none;
    direction: rtl;
    pointer-events: auto;
    touch-action: none;
  }
  /* Fade during rotation / drag / model load, ported from
     .hotspots-overlay[data-hidden] now that there is no overlay wrapper. */
  .car-stage-3d model-viewer > .hotspot-3d { transition: opacity 0.15s ease; }
  .car-stage-3d[data-hotspots-hidden="true"] model-viewer > .hotspot-3d { opacity: 0; }
  /* Closed screen: snap to hidden with no fade, so reopening doesn't play the
     previous zone's dots out during the entrance spin (mirrors the
     .locate-screen:not(.is-open) .hotspots-overlay rule above). */
  .locate-screen:not(.is-open) .car-stage-3d model-viewer > .hotspot-3d {
    opacity: 0; transition: none;
  }

  .hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    background: transparent; border: 0;
    color: var(--red);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
  }
  /* Invisible, larger tap target centered on the dot so imprecise taps still
     register (the 12px dot alone was too small to hit reliably). Doesn't change
     the dot's look or the label position — it's a transparent hit area. */
  .hotspot::before {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 40px; height: 40px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 1;
  }
  .hotspot-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--red);
    border: 2px solid var(--white);
    box-shadow: 0 2px 6px rgba(239,68,68,0.35);
    position: relative; z-index: 2;
  }
  .hotspot-pulse {
    position: absolute;
    left: 50%; top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0.35;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  /* Animate only while the screen is open. The locate sheet is always mounted
     but sits off-screen (translateY(100%)) when closed; a continuously-running
     infinite animation there gets throttled by Safari/WebKit and resumes janky
     on reveal — pulses flash aggressively + slowly until the first rotate
     repaints the overlay. Gating on .is-open starts it clean each open. */
  .locate-screen.is-open .hotspot-pulse {
    animation: hpulse 1.4s ease-out infinite;
  }
  @keyframes hpulse {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
  }
  .hotspot-label {
    position: absolute; top: 16px; left: 50%;
    background: var(--text); color: var(--white);
    font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 6px;
    white-space: nowrap;
    transform: translate(-50%, 2px);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .hotspot:hover .hotspot-label,
  .hotspot:focus-visible .hotspot-label { opacity: 1; transform: translate(-50%, 0); }

  /* 3D stage — capped at 440px and centered (like the 2D cube's fixed 280x280
     box) rather than stretched edge-to-edge. .locate-screen is position:fixed
     with inset:0, which escapes #root's max-width:480px cap — on a wide
     desktop viewport an edge-to-edge width would render the car much smaller
     relative to the box than on mobile, throwing off the hotspot % coords
     (tuned assuming the car roughly fills the box, same as the 2D cube's
     object-fit:contain framing). Capping width keeps that assumption true at
     every viewport width. Taller than the 2D cube's box so the model isn't
     cropped top/bottom. Navigation is drag-to-rotate, handled entirely in
     JS (see CarStage3D's pointer handlers). */
  .car-stage-3d {
    position: relative;
    /* Chrome above + below the stage that the square has to fit between:
       .loc-carbar (~65px) + .loc-head (~40px) + the in-flow .drag-hint (~39px)
       + the sheet's 76px peek, plus a small buffer. Safe-area insets are added
       on top since the carbar pads for the notch and the sheet sits on the home
       indicator. */
    --stage-chrome: calc(240px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
    /* Square, sized to whichever runs out first: the column's width, the 440px
       cap, or the height left between the chrome. Staying SQUARE is the point —
       the hotspot x/y are percentages of this box calibrated against a square
       render, so uniform scaling keeps them on the car while a stretched box
       would slide them off it. Previously a rigid 440px, which simply got
       clipped on any screen shorter than ~640px. */
    width: min(100%, 440px, calc(100dvh - var(--stage-chrome)));
    aspect-ratio: 1 / 1;
    height: auto;
    flex: 0 0 auto;
    margin: 0 auto;
    /* Car-centering: this transform places the VISIBLE car (measured from
       rendered pixels, not this box — the model has headroom inside it)
       exactly midway between the ring's red marker above and the drag-hint
       pill below. Re-measure if the ring offset, .loc-head paddings, or the
       hint move. */
    transform: translateY(38px);
    /* This box only frames the render. The drag surface, its pointerdown and
       its `touch-action: none` all live on .car-swipe, the ancestor that wraps
       the whole band from the car bar to the sheet — see the note there. */
  }
  @media (max-height: 700px) {
    .car-stage-3d { transform: translateY(-12px); }
  }
  /* Flank tags -- يمين to the viewer's left, يسار to the right, shown once per
     opening of the 3D screen (see CAR3D_SIDE_TAG_HOLD_MS and the effect that
     drives data-show).

     Hung off the CAR's outline rather than the edge of the box, so the gap
     stays the number it says at every stage size (--car-edge below).

     Set vertically with writing-mode rather than a rotate() on horizontal
     text: the layout box turns with the word, so it stays narrow and tall and
     `left`/`right` keep meaning what they say. text-orientation stays at its
     default (mixed), which turns the whole joined word a quarter turn --
     `upright` would stack the letters and break every Arabic connection. */
  .side-tag {
    position: absolute;
    /* Not 50%: the car does not sit centred in its box -- measured off the
       front-view render, its roof is at 30% of the box and its wheels at 86%,
       so this lines the tags up with the CAR's middle rather than the box's. */
    top: 57%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-size: 40px;
    font-weight: 700;
    /* The cross size of a vertical line -- i.e. the tag's WIDTH, 48px at this
       font size. Enough to clear the dots under ي; it also feeds the overflow
       guard in the two rules below, as 1.2em. */
    line-height: 1.2;
    /* Where the paintwork ends, as a share of the stage box: the widest of the
       four models reaches 20.3% of the box from either side on the front view
       (measured from the rendered pixels), so the car's outer edge sits at
       79.7% from the opposite side. Everything below is measured from there. */
    --car-edge: 79.7%;
    --car-gap: 32px;
    color: var(--muted); /* #6B6B6B */
    white-space: nowrap;
    /* Inert. A rotate-drag may begin anywhere over the stage, including on a
       tag, and it must reach .car-swipe's pointerdown like any other spot. */
    pointer-events: none;
    opacity: 0;
    /* The exit: slow enough not to compete with the car for attention. */
    transition: opacity 0.5s ease;
  }
  /* The entrance, quick -- keep in step with CAR3D_SIDE_TAG_IN_MS. */
  .side-tag[data-show="true"] { opacity: 1; transition-duration: 0.18s; }
  /* Physical left/right on purpose: the page is RTL, and these two name sides
     of a car, which must not swap with the text direction. The driver's RIGHT
     flank faces the viewer's left on the front view -- the same mapping the
     zone ring above the car uses. */
  /* Mirrored, like the two spines of a pair of books either side of the car:
     the left word runs upward, the right word downward. vertical-rl alone only
     gives the downward one, so the left is that box turned through 180deg --
     which reverses the reading direction without changing the box's shape or
     where it sits.

     Each tag is positioned by its INNER edge -- the one facing the car -- which
     is what makes --car-gap exact and independent of the type size: the left
     tag's right edge sits --car-gap short of where the paint starts, the right
     tag's left edge --car-gap past where it ends. The min() is a floor for
     narrow phones: below about a 394px stage there is not room for both the
     word and the full gap, and this spends the gap rather than letting the
     word run off the screen. */
  .side-tag[data-side="right"] {
    right: min(calc(var(--car-edge) + var(--car-gap)), calc(100% - 1.2em - 4px));
    transform: translateY(-50%) rotate(180deg);
  }
  .side-tag[data-side="left"] {
    left: min(calc(var(--car-edge) + var(--car-gap)), calc(100% - 1.2em - 4px));
  }
  /* Phones: a viewport no wider than #root's 480px cap. The overflow guard
     above is in em, so it follows the smaller type on its own. */
  @media (max-width: 480px) {
    .side-tag { font-size: 32px; }
  }
  /* The swipe surface of the 3D screen — where a rotate-drag may BEGIN, and
     the element CarStage3D binds its pointerdown to. It is the WHOLE band
     between the car bar and the parts sheet, edge to edge: the hint block
     above the ring (the screen passes it in as children), then .orbit-stage
     with the ring, the car and the hint pill under it. 3D only; the 2D
     screen's .car-drag column is untouched.

     It used to be a column overlaid on the car box alone, and every way it
     fell short of this band ended as a complaint:
       - a centred 300px column, on the theory that the screen edges had to
         stay free for the phone's back-swipe. Wrong: iOS Safari's edge
         swipe-back and Android's gesture navigation are recognised by the
         OS/browser chrome BEFORE the page sees the touch (the page just gets
         a pointercancel), so they only ever need ~20-24px at the very edge,
         and the 45px inset left a band where neither answered.
       - a column running from the top of the SQUARE car box: the ring, the
         gaps around it and the hint line above were dead — on a 390x844 phone
         ~130px of "swipe to rotate" that swiped nothing. The box's top edge is
         where the car is framed, not where the gesture should start; a rotate
         is what a swipe means anywhere in this band.
       - bottom: 0 on that column, which ended the zone at the foot of the car,
         ~220px short of the peeking sheet (the pill saying "اسحب للدوران" was
         the one spot where dragging did nothing).

     It is an ANCESTOR of everything it covers, never an overlay sibling: a
     pointerdown that begins on a hotspot dot targets the dot and bubbles up
     here, so a drag begun on a dot rotates the car — the overlay never saw
     those, and a press released outside it left a stale entry in pointersRef
     that made the very next swipe read as a pinch. The same bubbling brings
     the zone ring's label presses here too, so a swipe may begin on a label;
     onPointerDown recognises those and keeps a plain tap on one blink-free
     (see the note there).

     touch-action: none lives here: every touch that lands anywhere in this
     band belongs to the JS rotate/zoom handlers. An ancestor's none governs
     its descendants' touches, so the hint text, the ring gaps, the car box
     and the dots are all covered by this one declaration.

     Layering needs nothing from this element now — with no overlay left over
     the car, a tap on the bare model (model-viewer is pointer-events: none)
     targets .car-stage-3d, a z-index: auto box that .ps-scrim (z-index 9)
     paints over when the sheet is open, so that tap still collapses the sheet.

     The layout is exactly what .locate-screen gave .loc-head and .orbit-stage
     as direct children: the block keeps its flex-shrink: 0 height, the stage
     takes the rest. No min-height: 0 on purpose — the stage's own 240px floor
     should still win on a very short viewport, as it did before. */
  .car-swipe {
    flex: 1;
    display: flex; flex-direction: column;
    touch-action: none;
    cursor: grab;
    /* A mouse drag that starts on the hint text must not also drag out a
       selection of it. */
    user-select: none;
    -webkit-user-select: none;
  }
  .car-swipe:active { cursor: grabbing; }
  /* Model download bar — see the JSX note for why model-viewer's built-in one
     is suppressed in favour of this. Sits on the stage's bottom edge, above
     the model (z 12), and is inert.
     The fill is positioned with inset-inline-start + width rather than a
     transform so it grows from the correct side under dir=rtl for free. */
  /* model-viewer paints its own 5px bar across the TOP of the model box while
     the GLB downloads — the empty progress-bar slot alone does NOT stop it in
     this version (verified: a 4px band appears at the stage's top edge mid
     download). Hiding the part is the reliable way, and it matters more now
     that we deliberately show no bar at all: without this rule the only
     progress bar on screen would be model-viewer's own, in the one place it
     collides with the zone ring. */
  .car-stage-3d model-viewer::part(default-progress-bar) { display: none; }
  /* ---- Cube loader ------------------------------------------------------
     One indicator, not four. The bar, the percentage and the car still were
     each reporting the same fact in a different dialect; the cube and a line of
     text say it once. Centred on the stage, which is where the model itself
     will appear. */
  .mv-loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    /* No gap: the cube is the only in-flow child now, centred on the stage
       where the car will land. The label is taken out of the flow and pinned to
       the foot of the stage (see .mv-loader-line), so the two are positioned
       independently rather than as a stacked pair. */
    font-family: 'Readex Pro', sans-serif;
    pointer-events: none;
    opacity: 0;
    /* The ONE fade for the whole loader — see the note on .mv-cube's dissolve
       for why nothing inside may fade as well. 0.5s, not 0.3s: half a second
       reads as settling rather than snapping, and the exit is the moment the
       user has been waiting through.
       KEEP IN SYNC with MV_LOADER_FADE_MS, which unmounts this element. That
       constant must stay >= this duration or the fade is cut off mid-flight.

       LINEAR, deliberately. `ease` is cubic-bezier(.25,.1,.25,1) — it front-
       loads, which is what you want for an entrance and exactly wrong for an
       exit: measured on the frame trace it put the loader at 0.23 by the
       midpoint and half gone by 146ms, so lengthening the duration only
       stretched an invisible tail from 0.1 to 0 while the part you actually see
       stayed as abrupt as before. Linear spends the time where it is visible.

       This rule is the OUT direction only. A transition declared here governs
       the move toward this rule's value (opacity 0); the entrance is declared on
       the [data-show="true"] rule below and is deliberately much faster. The two
       are not the same job: appearing is feedback and wants to be prompt, while
       leaving is a handover and wants to be calm. Sharing one duration made the
       loader take half a second to show up on exactly the slow connections it
       exists for. */
    transition: opacity 0.5s linear;
    /* above model-viewer (z-index 11) so the cube reads as being in front of
       the stage the car is about to occupy */
    z-index: 13;
  }
  /* The IN direction: quick and front-loaded, the opposite of the exit above. */
  .mv-loader[data-show="true"] { opacity: 1; transition: opacity 0.22s ease-out; }
  /* Bare text, no chip: with nothing behind it on the stage there is nothing
     to lift it off, and a container would just be a fourth thing to look at. */
  .mv-loader-line {
    /* Low in the stage, but well off the floor. Landed by bracketing: stacked
       under the cube it crowded it, flush at bottom: 0 it read as falling out of
       the frame, and 32 then 56 each still read as too low. 76px leaves ~65px of
       air under the 80px cube on a 390px stage — about four fifths of the cube's
       own height, so the two still read as separate things rather than a
       stacked pair. The cube keeps the optical centre to itself; the caption
       belongs to the lower band, just not to its floor.
       Fixed px rather than a percentage: the stage height is a min() of three
       terms, so a percentage would drift the caption around between viewports
       for no reason — the gap to the bottom edge is what the eye reads here, and
       it should be the same everywhere.
       Absolute, so growing the cube never pushes the text around. */
    position: absolute;
    left: 0; right: 0; bottom: 76px;
    /* A row: the ellipsis trails the label as part of its text run, and the
       retry button sits beside it on error. */
    display: flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  /* Sit the ellipsis at the bottom of the descenders rather than on the baseline
     or, worse, floating at the line's middle.
     .bs-dots is inline-flex with no in-flow text, so its baseline IS its bottom
     margin edge; a plain `baseline` therefore rests the dots exactly ON the
     baseline, level with a full stop. Arabic drops below that, so against this
     script the dots still read as sitting high.
     -0.23em pushes them the rest of the way, and it is measured rather than
     eyeballed: canvas actualBoundingBoxDescent for "ر" in this font is 3px at
     the label's 13px, and 3/13 = 0.23. Expressed in em so it tracks font-size —
     glyph metrics scale linearly, so the alignment holds if the label is ever
     resized. ("ي" is the deepest in the string at 7px; ر is the one matched.)
     Scoped to .mv-loader: the search bar and discover screens keep the centred
     alignment their layouts were built around. */
  .mv-loader .bs-dots { vertical-align: -0.23em; }
  /* Primary ink, regular weight — not semibold: this is a status line, not a
     heading. It reads at the same strength as the cube above it, which also
     carries --text, so the two sit as one statement rather than one deferring
     to the other. (It spent a while on --muted while the pair were swapped;
     both primary is the current call.) */
  .mv-loader-text { font-size: 13px; font-weight: 400; color: var(--text); }
  /* The ellipsis belongs to the label and moves with it. This happens to match
     .bs-dots' own default, but it is stated rather than deleted: the rule is
     "match the label", and leaving it implicit would break silently the next
     time the label's colour changes. */
  .mv-loader .bs-dots > span { background: var(--text); }
  /* Looping ellipsis on the label — ".", "..", "...", none, repeat. With the
     progress bar and the percentage both gone (see above), the cube was the
     only thing on screen still moving; a label that never changes on a 4MB
     download over a slow link reads as stalled.

     Reuses .bs-dots for its markup, sizing and colour, but NOT its bs-d1/2/3
     keyframes: those are a CSS animation, and a CSS animation cannot be synced
     to the cube. Matching the durations would not be enough — an animation's
     start time and performance.now() are different origins, so the two would
     begin out of phase and drift apart from there. So the cycle is driven from
     JS instead, off the very clock that turns the cube (see mvCubeDots), and
     lands here as a data-dots count. A dot changes exactly as the cube squares
     up to a corner.
     .bs-dots > span is opacity 0 by default, so only the lit cases need saying.
     Nothing fades: the dots land as discrete characters, the way an ellipsis is
     typed. (The keyframes themselves stay put — the search bar and discover
     screens still animate their dots the old way.) */
  .mv-loader .bs-dots[data-dots="1"] > span:nth-child(1),
  .mv-loader .bs-dots[data-dots="2"] > span:nth-child(-n+2),
  .mv-loader .bs-dots[data-dots="3"] > span { opacity: 1; }
  /* The exit is a plain fade and nothing else — .mv-loader's opacity, applied to
     the whole group. There is deliberately NO rule for .mv-cube here.

     It used to scale(1.35) outward on a strong ease-out as it went, then a
     gentler scale(1.08); both were dropped. A cube that grows while vanishing
     reads as lunging at the viewer, and no amount of softening the curve made it
     read as a handover instead of an effect. The car arriving underneath is the
     event; the loader's job is to stop being there.

     One more trap this closes: whatever fades must fade ONCE. When .mv-cube also
     animated its own opacity, the two multiplied — the effective curve was
     (1-t)^2, sitting at 25% where a single fade is at 50%, so a nominal 300ms
     behaved like ~150ms. .mv-loader owns the fade; it has to, since it carries
     the label too. */
  .mv-loader-retry {
    pointer-events: auto;
    font: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--red); background: none; border: 0; padding: 0 2px; cursor: pointer;
  }
  /* Retry and reload side by side. Reload is offered in every failed state:
     after a lost WebGL context it is the only way back, and after a network
     failure it is what a user tries anyway. */
  .mv-loader-actions { display: inline-flex; gap: 12px; margin-inline-start: 6px; }
  .mv-loader-reload {
    pointer-events: auto;
    font: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--red); background: none; border: 0; padding: 0 2px; cursor: pointer;
  }
  /* An isometric wireframe cube that genuinely turns — and every line in it
     holds the SAME weight at every angle, which is the whole reason it is now
     drawn rather than built.

     Four earlier versions each failed differently, and each looked like the
     obvious fix for the one before it:
       - Three coloured panels flying in, one per third of the download. A
         build-in implies progress it was never measuring, and it only read as a
         cube once the final panel landed.
       - A flat isometric SVG spun with transform: rotate(). That is a pinwheel,
         not a rotation — the drawing turned as a unit, nothing foreshortened.
       - A real CSS 3D cube seen through `perspective`: correct rotation, wrong
         look. Perspective swells near edges and converges parallels, so it read
         as a photographed solid rather than a drawing.
       - The same cube with `perspective` removed. Geometry finally right —
         orthographic, so parallels stay parallel — but the LINES were wrong.
         Each edge was a 2px CSS border on a face, and a border is a surface:
         turn its face steeply away and you see that surface nearly edge-on, so
         the edge thickens into a dark bar; turn it flat-on and it thins. Weight
         swung with orientation, the exact opposite of a wireframe. (Its three
         inner edges were also drawn twice, once by each of the two visible faces
         sharing them.) Only three frames in eight read as a cube.

     So the edges are real strokes now: mvCubeWire() projects the eight vertices
     every frame and emits the visible ones as a single path, which gives one
     stroke-width and a true linejoin at every angle. Hidden-line removal is an
     explicit back-face test rather than backface-visibility. See the JS.

     Cost: eight vertex rotations and one string per frame. An earlier comment
     here argued that a rAF loop would burden the main thread during the Draco
     decode; at this size that was overstated, and it is the only way to hold the
     line weight constant. */
  .mv-cube {
    display: block; flex-shrink: 0;
    /* 80x80 comes from the width/height attributes, and the 0 0 48 48 viewBox
       makes one user unit render at 1.667px (so the 1.25 stroke lands at ~2.1px,
       close to the 2px it carried at 64). Sized up from 64 to close some of the
       gap to the car that replaces it — the handover is less of a jump when the
       thing that leaves is nearer the size of the thing that arrives.
       The drawing is centred on (24,24) and bounded analytically by
       mvCubeWire's scale, so it cannot reach the edges. Nothing below it can
       shift either way: the label is positioned off this box, not stacked
       under it. */
  }
  /* stroke-width is in USER units, so it scales with the box: the 1.5 that
     rendered 2px at 64px would render 3px at 96px and turn a wireframe into a
     heavy outline. 1.25 lands at 2.5px — a little more presence for a bigger
     icon, while staying proportionally lighter than before (2.6% of the icon's
     width against the old 3.1%).
     --text, the primary ink, swapped with the label: the cube IS the subject
     here and should carry the weight, while a transient status line has no
     business being the darkest thing on an otherwise empty stage. The pairing
     used to run the other way round. (Previously --muted, the same
     grey .loc-hint and .drag-hint use, which lands the icon a step lighter than
     the --text label beside it. (It was --hairline once — a BORDER token, ~1.2:1
     on this near-white stage — which only survived while coloured panels carried
     the drawing.) Round joins matter now that the three edges at the hexagon's
     centre genuinely meet at a single point. */
  .mv-cube-wire {
    fill: none;
    stroke: var(--text);
    stroke-width: 1.25;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  /* The footer slot under the stage that carries the drag hint. It keeps its
     own box so the hint's fade never shifts the layout, and it is
     pointer-events: none: nothing in it is interactive (the loader lives inside
     the stage now, and .drag-hint is inert in its own rule). This used to be
     load-bearing for the gesture — the swipe handler sat on .car-stage-3d, a
     SIBLING, so a press that targeted this wrapper never reached it and "drag
     to rotate" was the one spot where dragging did not rotate. The handler is
     on .car-swipe now, an ancestor of both, so a press here would bubble to it
     either way; the rule stays because the pill really is inert. */
  .car-stage-3d ~ .stage-footer {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    margin: 10px auto 0;
    flex-shrink: 0;
    pointer-events: none;
  }
  /* .drag-hint's own opacity/data-ready pair lives with the staged-reveal rule
     up by .loc-head — it fades in on the same beat as the header hint and the
     zone ring, so all three are declared together. */
  @media (prefers-reduced-motion: reduce) {
    .mv-loader { transition: none; }
    /* Dots resolve to a static, visibly-dimmed "..." rather than disappearing —
       the same landing .bs-dots uses at its other call site. The cube below
       still carries the "something is happening" signal. This is not just a
       preference here: under reduced motion the rAF loop never starts, so
       data-dots would sit frozen on whatever it was rendered with and the label
       would show a permanent single dot.
       [data-dots] in the selector is load-bearing, not decoration. Without it
       this is (0,3,1), exactly TYING the activation rules above, and would win
       only by being later in the file. That tie has already produced one live
       bug in this file — .bs-dots' own reduce rule loses to its own activation
       rules for precisely this reason — so it is spelled out to win on
       specificity (0,4,1) rather than on source order. */
    .mv-loader .bs-dots[data-dots] > span:nth-child(1),
    .mv-loader .bs-dots[data-dots] > span:nth-child(2),
    .mv-loader .bs-dots[data-dots] > span:nth-child(3) { animation: none; opacity: 0.55; }
    /* Reduce the motion, do not remove it. Killing the animation outright left
       a permanently frozen cube, which is indistinguishable from a hung app —
       worse for the very user the setting protects. A slow tumble is exactly the
       sustained rotation this setting exists to suppress, so it cannot simply
       carry on either; it becomes a breath, in opacity only: no rotation, no
       travel, no scaling, nothing that moves across the screen. (The same
       substitution the OS itself makes — Reduce Motion swaps slides for
       cross-fades.)
       The rotation itself is stopped in JS, not here: mvCubeWire is asked once
       for the isometric pose and no rAF loop starts, so the drawing is simply
       never redrawn. Holding that pose matters — it IS what makes the shape a
       cube, and this is the moving version paused rather than a different
       drawing.
       This composes with the handover rather than fighting it: the breath's
       opacity is on the path, the dissolve's is on .mv-cube, so the two
       multiply.
       (Historical note, since the trap is easy to walk back into: while this was
       a CSS 3D cube the breath could NOT live on the element carrying
       transform-style: preserve-3d — any opacity below 1 forces such an element
       to flatten, which collapsed all six faces onto one plane and rendered a
       plain tilted square, while the computed transform still read matrix3d. The
       drawing has no 3D context left, so the constraint is gone with it.) */
    /* The car appears rather than eases in, same as everything else here. */
    .car-stage-3d model-viewer { transition: none; }
    .mv-cube-wire { animation: mvCubeBreathe 1.8s ease-in-out infinite; }
    /* Floor at 0.55 rather than 0.45: the icon is nothing but hairlines now, and
       fading 2px of --muted much further leaves too little of it to read. */
    @keyframes mvCubeBreathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
  }
  /* Cross-fade the car in, rather than letting it snap to full strength the
     instant it loads while the loader is still on top of it. The element is
     already transparent before load (--poster-color: transparent, no poster), so
     starting at 0 costs nothing during the wait — it only softens the arrival.
     Keyed on modelLoaded, NOT hotspotsReady: the car should begin arriving as
     the loader leaves, not 300ms later when the dots stage in.
     0.32s against the loader's 0.5s, so the car is essentially there by the time
     the cube finishes going. */
  .car-stage-3d model-viewer { opacity: 0; transition: opacity 0.32s ease; }
  .car-stage-3d[data-model-ready="true"] model-viewer { opacity: 1; }
  .car-stage-3d model-viewer {
    width: 100%; height: 100%;
    --poster-color: transparent;
    /* Hotspots are slotted inside model-viewer now, so model-viewer itself has
       to clear the .ps-scrim (z-index 9) for a dot to stay tappable while the
       parts sheet is open — that's what lets you tap hotspot B straight after
       hotspot A instead of spending a tap dismissing the scrim.
       pointer-events: none keeps that from also making the CAR surface swallow
       taps: bare-model taps fall through to the scrim and collapse the sheet,
       exactly as before. The hotspots re-enable pointer-events on themselves
       (.hotspot-3d), the same trick .hotspots-overlay uses for the 2D screen.
       Do NOT move this z-index onto .car-stage-3d — that would lift the whole
       stage above the scrim and break sheet dismissal. */
    z-index: 11;
    pointer-events: none;
    /* The page is dir="rtl", and that inherits into model-viewer's shadow DOM,
       where each hotspot is laid out in normal flow inside a full-width box.
       Under RTL the inline-start edge is the RIGHT one, so every dot landed
       ~400px (stage width minus dot width) off to the side. Forcing LTR here
       makes that flow start from the left, putting each dot on its anchor.
       The Arabic label gets direction: rtl back on .hotspot.hotspot-3d. */
    direction: ltr;
    /* Never dim a hotspot. model-viewer's default fades one to 0.25 when its
       data-normal faces away from the camera; several of our normals came back
       pointing into the body (bumper-f is "0 0 -1"), which would fade dots that
       are plainly visible today. Zone gating already decides what shows. */
    --min-hotspot-opacity: 1;
  }

  /* Drag hint pill — sits above the peeking sheet (76px peek + 12px gap + safe margin) */
  .drag-hint {
    position: absolute;
    bottom: 116px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted);
    background: var(--white);
    border: 1px solid var(--hairline);
    padding: 5px 10px; border-radius: 999px;
    pointer-events: none;
    box-shadow: var(--shadow-sm);
    z-index: 5;
  }
  /* 3D screen only (the 2D screen's hint is inside .orbit-stage, which is
     flex:1 and so has a stable bottom edge). Here the hint is a sibling of the
     now dynamically-sized .car-stage-3d, so a fixed offset from the screen
     bottom drifts onto the car as the stage shrinks. Putting it in flow parks
     it just under the stage at every size. nowrap + fit-content also fixes the
     two-line wrap the absolute version had: `left: 50%` with no `right` left it
     only half the screen to lay out in. */
  .car-stage-3d ~ .stage-footer .drag-hint {
    position: static;
    transform: none;
    width: fit-content;
    white-space: nowrap;
    margin: 0;                     /* the .stage-footer wrapper carries it now */
    flex-shrink: 0;
  }
  /* Idle nudge on the swipe-hint icon — actively demonstrates "drag" instead
     of only stating it in text. 3D screen only, via the same sibling
     selector as the position override above. Gated on .is-open, same
     reason as .hotspot-pulse: an infinite animation left running on the
     always-mounted, off-screen sheet gets throttled by Safari and resumes
     janky on reveal. transform-only, small amplitude, symmetric (the glyph
     is already bidirectional, so no RTL mirroring concern). */
  .locate-screen.is-open .car-stage-3d ~ .stage-footer .drag-hint svg {
    animation: dragHintNudge 2.2s ease-in-out infinite;
  }
  @keyframes dragHintNudge {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-3px); }
    75%      { transform: translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .locate-screen.is-open .car-stage-3d ~ .stage-footer .drag-hint svg { animation: none; }
  }

  /* Scrim — covers the cube area while the sheet is expanded. Click anywhere on
     it to collapse the sheet back to peek. z-index sits under BOTH the hotspots
     (11) and the sheet (12): a direct tap on another hotspot must win over the
     scrim so picking hotspot B right after hotspot A works in one tap instead of
     needing a throwaway tap to dismiss the scrim first, but the scrim still sits
     above the sheet, keeping the sheet itself interactive on top of it. Fades in
     for a soft transition. */
  .ps-scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.18);
    z-index: 9;
    animation: psScrimIn 0.25s ease-out;
    cursor: pointer;
  }
  @keyframes psScrimIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Parts sheet — peek shows just the head, open expands to fill the viewport.
     Class names use `ps-` so they don't collide with anything else. */
  .parts-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--white);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    box-shadow: var(--shadow-lg);
    transition: transform 0.42s cubic-bezier(.6,.2,.2,1);
    z-index: 12;
    /* Fixed height so switching category chips doesn't grow/shrink the sheet —
       the parts list inside scrolls instead. Peek mode hides most of it via
       transform; the full height is still ~75% of the screen. */
    height: 75%;
    display: flex; flex-direction: column;
  }
  /* Peek: only the head is visible (~76px) — title + chevron act as a "pull up" affordance */
  .parts-sheet[data-mode="peek"] { transform: translateY(calc(100% - 76px)); }
  .parts-sheet[data-mode="open"] { transform: translateY(0); }
  /* Pointer-capture zone wrapping the handle + head. touch-action: none so iOS
     hands us the vertical gesture instead of trying to scroll the page. */
  .ps-drag-zone { touch-action: none; cursor: grab; user-select: none; }
  .ps-drag-zone:active { cursor: grabbing; }
  .ps-handle {
    width: 36px; height: 4px;
    background: var(--hairline);
    border-radius: 999px;
    margin: 10px auto 0;
  }
  .ps-head {
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    border-bottom: 1px solid var(--hairline);
  }
  .parts-sheet[data-mode="peek"] .ps-head { border-bottom-color: transparent; }
  .parts-sheet[data-mode="peek"] .ps-filter-row,
  .parts-sheet[data-mode="peek"] .ps-list { display: none; }
  .ps-head-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .ps-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .ps-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .ps-toggle {
    background: var(--canvas-2); border: 0; color: var(--text);
    width: 36px; height: 36px; border-radius: 8px;
    display: grid; place-items: center;
  }
  /* IconChevron points right by default. Peek = "tap to expand" → point up.
     Open = "tap to collapse" → point down. */
  .ps-toggle svg { width: 14px; height: 14px; transition: transform 0.35s; transform: rotate(-90deg); }
  .parts-sheet[data-mode="open"] .ps-toggle svg { transform: rotate(90deg); }
  /* Category filter chips reuse .sfilter from the search overlay (same look, same purpose) */
  .ps-filter-row {
    display: flex; gap: 6px;
    flex-shrink: 0;
    padding: 10px 16px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .ps-filter-row::-webkit-scrollbar { display: none; }
  /* Parts list — reuses the .sresult row from the search overlay. Identical look. */
  .ps-list {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 32px;
  }
  /* Lead row: the exact part tapped on the diagram, hoisted to the top by
     PartsSheet. No persistent mark, position already says "this is it". On
     each pick a thin ink ring eases in and out once, a brief, smooth flash
     that acknowledges the tap and then leaves nothing behind. */
  .ps-list .sresult.is-tapped {
    border-radius: 12px;
    animation: psTapFlash 0.85s ease-in-out 1;
  }
  @keyframes psTapFlash {
    0%   { box-shadow: inset 0 0 0 1px rgba(42, 44, 49, 0); }
    40%  { box-shadow: inset 0 0 0 1px rgba(42, 44, 49, 0.9); }
    100% { box-shadow: inset 0 0 0 1px rgba(42, 44, 49, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ps-list .sresult.is-tapped { animation: none; }
  }

  /* =========================================================================
     Product Detail Screen (PDP) — #/p/{key}
     ========================================================================= */
  /* Whole PDP is one continuous white sheet — sticky header, gallery, and
     all body sections sit on the same surface, with hairlines doing the
     section separation. Avoids the page-canvas (#FAFAFA) peeking through
     between the white pdp-stick and the body sections, which read as a
     noisy "gray strip" right under the search pill. */
  .pdp { padding-bottom: 84px; background: var(--white); }

  /* Shared sticky buy bar (parts + car-services PDPs). Hidden below the fold;
     slides up only when the inline CTA scrolls out of view (.is-visible). */
  .buybar {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    z-index: 40; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--white); border-top: 1px solid var(--hairline);
    box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.06);
    transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .buybar.is-visible { transform: translateY(0); }
  .buybar .pdp-cta-row { flex: 1; margin-top: 0; }
  .buybar-price { display: inline-flex; align-items: baseline; gap: 8px; flex-shrink: 0; }
  .buybar-now { font-size: 18px; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 2px; }
  .buybar-now svg { width: 13px; height: 14px; }
  .buybar-was { font-size: 13px; color: var(--muted); text-decoration: line-through; }

  /* PDP breadcrumb — sits inside .pdp-pad just above the title as quiet
     context, not as the page intro. Smaller font + no horizontal padding
     (it inherits the pad's 16px) keeps it ambient. Product name is
     dropped — title sits right below, no need to repeat it. */
  .pdp-crumb {
    margin: 0 0 10px;
    font-size: 10.5px;
    color: var(--muted);
    display: flex; align-items: center; gap: 5px;
    flex-wrap: wrap;
    line-height: 1.4;
  }
  .pdp-crumb-link {
    color: var(--muted);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .pdp-crumb-link:active { color: var(--text); }
  .pdp-crumb-sep { color: var(--muted); }

  /* Image gallery — single hero on soft canvas, swipe dots below.
     Height tightened (was 280px) so the image feels close to square at
     mobile widths and saves vertical real estate for the conversion
     funnel that follows. */
  .pdp-gallery { background: var(--canvas-2); position: relative; }
  .pdp-hero {
    height: 220px;
    display: grid; place-items: center;
    color: var(--text);
  }
  .pdp-hero svg { width: 50%; height: 70%; max-width: 220px; max-height: 160px; }
  /* Position glyph badge — same vocabulary as on cards, scaled up for the
     larger hero. TODO: pair with an inline explainer ("هذه القطعة ...")
     so first-time users can read the icon. */
  /* PDP position badge — top-inline-end of the hero image (visually top-LEFT
     in RTL because inset-inline-end resolves to physical left). Tap reveals
     the Arabic position name (e.g. "أمامي يمين") via a row-reverse slide-out:
     the icon stays pinned at its anchored edge and the name extends past it
     toward the image area, so the buyer's visual focal point (the glyph)
     doesn't drift mid-animation. Picked from /pos-glyph-demo variant 1 with
     direction reversed. List-card .pos-badge stays inert — limited width for
     the reveal, and the contextual question ("where on my car?") is less
     pressing on a list view than on a PDP. */
  .pdp-pos-badge {
    position: absolute;
    top: 12px; inset-inline-end: 12px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 8px;
    display: inline-flex; align-items: center; gap: 0;
    flex-direction: row-reverse;
    font: inherit; cursor: pointer; touch-action: manipulation;
  }
  .pdp-pos-badge svg { width: 34px; height: 44px; display: block; }
  /* Two-line reveal: "الجهة" eyebrow (small muted gray) sits above the
     position name. Both lines stack inside .pdp-pos-badge-name which is
     the animated container — flex column with cross-axis flex-start so
     each line hugs the inline-start edge (right side in RTL), keeping
     the eyebrow visually aligned with the bolder name beneath it. The
     short eyebrow text doesn't stretch to fill width; aligning to the
     inline-start makes both lines read together as a label, not as two
     separated tokens. */
  .pdp-pos-badge-name {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    white-space: nowrap;
    max-width: 0; opacity: 0;
    overflow: hidden;
    transform: translateX(-6px);
    transition: max-width 0.28s ease, opacity 0.18s ease 0.06s, transform 0.28s ease, margin-inline-end 0.28s ease;
    margin-inline-end: 0;
  }
  .pdp-pos-badge-eyebrow {
    font-size: 9px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 2px;
  }
  .pdp-pos-badge-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }
  .pdp-pos-badge.is-open .pdp-pos-badge-name {
    max-width: 140px; opacity: 1;
    transform: translateX(-2px);
