/* ==========================================================================
   INTERN: replace the CarModel body with your 3D model
   --------------------------------------------------------------------------
   CarModel renders the rotatable car BODY only. The DEFAULT body below is the
   existing 2D image cube: 4 flat PNGs on a CSS turntable, so this file runs
   identically to the current prototype out of the box.

   Props:
     rot      current Y rotation in degrees (drives the turntable / camera)
     view     the snapped visible face id ("front" | "sideLeft" | "rear" | "sideRight")
     dragging true while the finger is down (used to kill the CSS transition)
     settleMs snap-transition duration in ms (set by the drag/flick physics)

   To swap in a real 3D model, replace the returned markup below. A
   <model-viewer> starting point is commented out underneath; Three.js or
   Spline would mount in this SAME component, reading the `rot` prop to drive
   the camera orbit. Keep the .hotspots-overlay OUTSIDE this component — it
   stays layered on top inside CarOrbit (see below).
   ========================================================================== */
function CarModel({ rot, view, dragging, settleMs }) {
  // DEFAULT BODY = the existing 2D image cube.
  return (
    <div
      className="car-cube"
      data-dragging={dragging}
      style={{
        transform: "translateZ(-140px) rotateY(" + (-rot) + "deg)",
        "--settle": settleMs + "ms",
      }}
    >
      {LOC_CUBE_FACES.map((id, i) => (
        <div
          key={id}
          className="car-cube-face"
          style={{ transform: "rotateY(" + (i * 90) + "deg) translateZ(140px)" }}
        >
          <img className="car-3d-img" src={LOC_FACE_IMG[id]} alt="" draggable="false" />
        </div>
      ))}
    </div>
  );

  /* ---- INTERN: 3D model starting point (example — commented out) -------------
     1. Add the model-viewer library to <head> (a module <script> tag whose
        src is https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js)
     2. Drop your model file into assets/ (e.g. assets/car.glb).
     3. Replace the `return (...)` above with:

          return (
            <model-viewer
              src="assets/car.glb"
              camera-controls
              disable-zoom
              interaction-prompt="none"
              camera-orbit={rot + "deg 80deg auto"}   // drive the orbit from `rot`
              style={{ width: "100%", height: "100%" }}
            />
          );

     Three.js or Spline would live in this same component instead, using `rot`
     to rotate the camera/model. The hotspots stay in CarOrbit, layered on top.
  ------------------------------------------------------------------------------ */
}

/* The 3D cube — drag-to-rotate with snap-to-90°. Active zone is derived from
   the snapped face. Hotspots fade out during rotation and re-fade-in once settled. */
/* ── ZoneRing ────────────────────────────────────────────────────────────────
   Shared by CarOrbit (2D) and CarStage3D (3D): the four orbit zone labels,
   riding a flattened ellipse — the car's own turntable seen from above.
   `angle` follows CarOrbit's rot semantics: angle === LOC_ZONE_TARGET_ANGLE
   [zone] puts that zone front-and-center, and the number is CONTINUOUS
   (accumulated, never normalized), so the 270→0 wrap animates the short way
   for free. Mount it WITHOUT a key — remounting would destroy the
   transitions. (A remount of the HOST itself, as CarStage3D's key={car.id}
   does on a car switch, is fine: that only ever happens with the 3D screen
   closed, so the snap is never seen.)
   Two opt-in extras, each host picks independently: `showTrack` draws a
   solid ellipse through the same path the labels ride on — the words mask
   their own segment of it (see .zr-item > span's canvas patch), so the
   continuous line never runs through a label. `showArrows` (default true)
   renders a step-arrow between each pair of labels; BOTH hosts pass
   showTrack and showArrows={false} now, so the two screens present one
   identical dial — once the track makes the ring read as a dial, tapping a
   label already calls the same onPick(zid) an arrow would, and dragging
   the car covers stepping too. The arrow machinery stays for a host that
   wants it back. */
const ZR_ORDER = ["front", "sideLeft", "rear", "sideRight"]; // slot i = i*90deg

function ZoneRing({ angle, dragging, settleMs, onPick, flip, showTrack, showArrows = true, ready }) {
  // Geometry picked once per mount; short phones get a tighter ellipse so
  // the ring never reaches the top of the car box (~667px viewports leave
  // only ~22px under the old label position).
  const [compact] = useState(() => {
    try { return window.matchMedia("(max-height: 700px)").matches; }
    catch (e) { return false; }
  });
  const G = compact
    ? { CY: 19, RX: 112, RY: 16, ARX: 90,  ARY: 13, MARKER: 46 }
    : { CY: 24, RX: 118, RY: 22, ARX: 100, ARY: 18, MARKER: 58 };
  const sign = flip ? -1 : 1; // calibration escape hatch; both hosts omit it

  const frontIdx = ((Math.round(angle / 90) % 4) + 4) % 4;

  // Project a point at ring angle `deg` (0 = the front stop, near rim).
  const project = (deg, rx, ry) => {
    const t = (deg * Math.PI) / 180;
    const cos = Math.cos(t);
    const depth = (1 - cos) / 2;      // 0 nearest … 1 farthest
    return {
      dx: sign * Math.sin(t) * rx,    // + = physical right (RTL-proof)
      dy: cos * ry,                   // + = down = near rim of the disc
      depth: depth,
      scale: 1 - 0.38 * depth,        // 1.00 / 0.81 / 0.62  (15px → 9.3px min)
      opacity: 1 - 0.62 * depth,      // 1.00 / 0.69 / 0.38
    };
  };
  const place = (p) =>
    "translate(calc(-50% + " + p.dx.toFixed(2) + "px), " +
    (G.CY + p.dy - 18).toFixed(2) + "px)"; // -18 = half the 36px button box

  return (
    <div
      className="zone-ring"
      data-compact={compact ? "true" : "false"}
      data-dragging={dragging ? "true" : "false"}
      /* Staged-reveal flag, shared with .loc-head and .drag-hint — see the
         one rule that fades all three. Optional: a host that has nothing to
         wait for (CarOrbit, whose cube is always there) omits it, and React
         drops the attribute entirely for undefined, so the CSS never matches
         and that ring behaves exactly as it always has. */
      data-ready={ready === undefined ? undefined : (ready ? "true" : "false")}
      style={{ "--zr-ms": (settleMs == null ? 300 : settleMs) + "ms" }}
    >
      {showTrack && <div className="zr-track" />}
      <div className="zr-marker" style={{ top: G.MARKER + "px" }} />

      {showArrows && [0, 1, 2, 3].map((k) => {
        // Chevrons sit on the half-slot stops (45/135/225/315deg), on a
        // tighter ellipse so their hit boxes clear the side labels. An
        // arrow on the screen-right half steps the right label to front.
        const p = project(k * 90 + 45 - angle, G.ARX, G.ARY);
        const screenRight = p.dx > 0;
        const slotDir = screenRight ? sign : -sign;
        const targetZid = ZR_ORDER[(frontIdx + slotDir + 4) % 4];
        return (
          <button
            key={"arrow" + k}
            type="button"
            className="zr-arrow"
            aria-label={"عرض " + LOC_ZONES[targetZid].label}
            style={{ transform: place(p), zIndex: 19 - Math.round(p.depth * 10) }}
            onClick={() => onPick(targetZid)}
          >
            {/* Curved step arrow ("Arrow" by 4B Icons, Noun Project —
                attribution kept from the source file; the path is inlined,
                cropped to the art's bbox, so the file's baked-in credit
                <text> never renders). Two shapes: a curved shaft (<path>)
                and a separate triangular head (<polygon>) sitting at its end
                — unlike the earlier icons, this one draws the arrowhead as
                its own piece rather than baking it into one outline, which
                is exactly why it reads clearly even this small.
                As drawn the glyph ALREADY points up-and-right at roughly 45°
                — confirmed by sampling the shaft path near the head (tangent
                ≈-45°, y-down) and cross-checking the polygon's tip vertex —
                so no rotation is applied at all; a small rotation sweep
                rendered next to the ring's own zone words at production size
                confirmed 0deg reads as cleanly as any nearby angle, so the
                simplest choice (skip rotate()) is also the best one.
                scaleX flips it for the opposite-side positions: plain
                sign(dx)·sign(dy), UNNEGATED, is what actually points each
                copy outward (dx<0 → -1 → mirrored, pointing up-left; dx>0 →
                +1 → native, pointing up-right, since the glyph's native
                pose already points up-right). A negated version of this was
                shipped briefly based on a scratch two-word test rendered at
                normal size — that test (and a same-size in-app screenshot
                used to "confirm" it) was too small to reliably tell which
                end of the curve has the arrowhead; zooming into a single
                live arrow at 4x device scale showed both copies pointing
                INWARD with the negated sign, which is what caught this. The
                "|| 1" guards the exact dx/dy=0 crossings where sign() is 0
                (scaleX(0) would blank the glyph). */}
            <svg
              viewBox="11 33 78 33"
              style={{
                transform:
                  /* translateY listed first so it lands OUTSIDE the scaleX
                     below — a fixed screen-space nudge down, not one that
                     rotates with the glyph (moot here with no rotation, but
                     kept for the same reason it was added: a screen-space
                     nudge should stay one regardless of what else changes). */
                  "translateY(4px) " +
                  "scaleX(" + ((Math.sign(p.dx) * Math.sign(p.dy)) || 1) + ") " +
                  "scale(" + (0.55 + 0.45 * p.scale).toFixed(3) + ")",
                opacity: p.dy < 0 ? 0 : p.opacity.toFixed(3),
              }}
            >
              <path d="M30.725,65.847c-6.999,0-13.448-1.355-18.885-3.891l0.846-1.813c18.684,8.712,49.881,2.836,73.356-25.256l1.535,1.282C70.223,56.938,48.668,65.847,30.725,65.847z" fill="currentColor" />
              <polygon points="87.067,44.543 84.679,44.306 85.433,36.73 77.656,38.473 77.131,36.131 88.149,33.662" fill="currentColor" />
            </svg>
          </button>
        );
      })}

      {ZR_ORDER.map((zid, i) => {
        const p = project(i * 90 - angle, G.RX, G.RY);
        const isFront = i === frontIdx;
        return (
          <button
            key={zid}
            type="button"
            className="zr-item"
            data-active={isFront ? "true" : "false"}
            aria-label={LOC_ZONES[zid].label}
            aria-current={isFront ? "true" : undefined}
            style={{ transform: place(p), zIndex: 20 - Math.round(p.depth * 10) }}
            onClick={() => { if (!isFront) onPick(zid); }}
          >
            {/* Outer span = the scaled canvas patch that masks the track
                line; inner span = the text alone, carrying the depth fade.
                Opacity must NOT sit on the patch — a 38%-opaque patch at the
                far rim would let the line ghost through the back word. */}
            <span style={{ transform: "scale(" + p.scale.toFixed(3) + ")" }}>
              <span style={{ opacity: p.opacity.toFixed(3) }}>
                {LOC_ZONES[zid].labelShort}
              </span>
            </span>
          </button>
        );
      })}
    </div>
  );
}

function CarOrbit({ activeZone, isOpen, onPickZone, onPickHotspot }) {
  const isOrbitZone = LOC_ORBIT_ZONES.includes(activeZone);

  const [rot, setRot] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [rotating, setRotating] = useState(false);
  const dragRef = useRef(null);
  const settleRef = useRef(null);

  // settleMs: how long the snap transition runs — scaled with how far we're snapping
  // so a 15° correction feels instant and a 90° fling takes its time. Hotspots stay
  // hidden for the same duration so they don't fade back in mid-rotation.
  const [settleMs, setSettleMs] = useState(300);
  const beginRotation = (ms = 300) => {
    setSettleMs(ms);
    setRotating(true);
    if (settleRef.current) clearTimeout(settleRef.current);
    settleRef.current = setTimeout(() => setRotating(false), ms);
  };

  // Open facing front, no entrance spin. (A rear->front spin was used as a
  // "this rotates" affordance but read as disorienting; removed. See DECISIONS.)
  // entranceRef is retained (stays false) so the zone-change guard below is a
  // harmless no-op.
  const entranceRef = useRef(false);
  // useLayoutEffect so the snap applies BEFORE first paint — no angle flash.
  useLayoutEffect(() => {
    if (!isOpen) return;
    setSettleMs(0);                                // no transition
    setRotating(false);                            // hotspots visible immediately
    setRot(LOC_ZONE_TARGET_ANGLE.front);           // always open on the front face
  }, [isOpen]);

  // When a chip switches the active zone, animate the cube to that face's angle
  // along the shortest arc — without this we'd take the long way around.
  useEffect(() => {
    if (!isOrbitZone) return;
    if (entranceRef.current) return;   // the entrance spin owns the open cycle
    const target = LOC_ZONE_TARGET_ANGLE[activeZone];
    setRot((prev) => {
      const current = ((prev % 360) + 360) % 360;
      let delta = target - current;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      if (delta !== 0) beginRotation();
      return prev + delta;
    });
  }, [activeZone, isOrbitZone]);

  const notifyParent = (snappedRot) => {
    const idx = (((Math.round(snappedRot / 90)) % 4) + 4) % 4;
    const id = LOC_CUBE_FACES[idx];
    if (id !== activeZone) onPickZone(id);
  };

  const onPointerDown = (e) => {
    if (!isOrbitZone) return;
    const startX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : null);
    if (startX == null) return;
    dragRef.current = {
      startX,
      startRot: rot,
      lastX: startX,
      lastRot: rot,
      lastT: performance.now(),
      // Rolling velocity in deg/ms — exponential smoothing instead of a full sample
      // buffer so a single laggy frame doesn't tank the projection.
      vel: 0,
    };
    setDragging(true);
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const x = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : null);
    if (x == null) return;
    // Drag-to-rotation gain: how many degrees of rotation per pixel of finger travel.
    // Lower = finger pulls the cube more 1:1 (feels heavier / more in-hand).
    const newRot = dragRef.current.startRot - (x - dragRef.current.startX) * 0.55;
    const now = performance.now();
    const dt = Math.max(1, now - dragRef.current.lastT);
    // Instantaneous deg/ms for this frame, blended with the existing rolling value.
    // 0.35 = how reactive vs. how smooth; higher tracks flicks better but jitters more.
    const inst = (newRot - dragRef.current.lastRot) / dt;
    dragRef.current.vel = dragRef.current.vel * 0.65 + inst * 0.35;
    dragRef.current.lastX = x;
    dragRef.current.lastRot = newRot;
    dragRef.current.lastT = now;
    setRot(newRot);
  };
  const onPointerUp = () => {
    if (!dragRef.current) return;
    // Project momentum forward: a quick flick (high |vel|) carries past the finger
    // to the next face; a gentle release just snaps to the nearest. PROJECT_MS is
    // how far ahead we look (effectively a virtual coast time). Capped so a wild
    // flick can't spin you 270° away.
    const PROJECT_MS = 70;
    const MAX_PROJECTION = 80; // deg — keeps momentum modest, never carries past one face
    const projection = Math.max(-MAX_PROJECTION, Math.min(MAX_PROJECTION, dragRef.current.vel * PROJECT_MS));
    const target = rot + projection;
    const snapped = Math.round(target / 90) * 90;
    const delta = Math.abs(snapped - rot);
    // Duration scaled to distance so feel is uniform: ~280ms for tiny corrections,
    // ~620ms for a full 90° fling. Clamped on both ends.
    const ms = Math.max(260, Math.min(620, 260 + (delta / 90) * 360));
    if (snapped !== rot) beginRotation(ms);
    setRot(snapped);
    dragRef.current = null;
    setDragging(false);
    notifyParent(snapped);
  };

  // The visible face during a drag is the rounded-to-nearest-90 cube face
  const visibleIdx = (((Math.round(rot / 90)) % 4) + 4) % 4;
  const visibleZoneId = LOC_CUBE_FACES[visibleIdx];

  const renderHotspot = (h, zoneId) => (
    <button
      key={h.id}
      className="hotspot"
      style={{ left: h.x + "%", top: h.y + "%" }}
      onClick={(e) => { e.stopPropagation(); onPickHotspot(zoneId, h.id); }}
      aria-label={h.label}
    >
      <span className="hotspot-pulse" />
      <span className="hotspot-dot" />
      <span className="hotspot-label">{h.label}</span>
    </button>
  );

  const SpecialDiagram = activeZone === "engine" ? EngineDiagram
                       : activeZone === "interior" ? InteriorDiagram
                       : null;

  return (
    <div className="orbit-stage">
      {/* Zone ring — turntable selector, replaces the keyed .view-label.
          NO key: the ring must transition, not remount. Follows rot live
          during drags; settles on the same settleMs the cube gets.
          Engine/interior still skip it (isOrbitZone). showTrack /
          showArrows={false} match CarStage3D's ring exactly (solid track,
          no step arrows) so the two screens present one identical dial —
          and the arrows were redundant here for the same reason: label taps
          and the drag itself already cover stepping. */}
      {isOrbitZone && (
        <ZoneRing
          angle={rot}
          dragging={dragging}
          settleMs={settleMs}
          onPick={(zid) => { if (zid !== activeZone) onPickZone(zid); }}
          showTrack
          showArrows={false}
        />
      )}

      {isOrbitZone && (
        <div
          className="car-drag"
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
        >
        <div className="car-stage">
          {/* The car body. Swap this component's internals for a 3D model
              (see the INTERN banner above CarModel). */}
          <CarModel rot={rot} view={visibleZoneId} dragging={dragging} settleMs={settleMs} />

          {/* Hotspots stay OUTSIDE CarModel, layered on top of the body.
              INTERN NOTE: each hotspot is positioned by x/y PERCENT of this
              overlay box (see renderHotspot's left/top). When you drop in the
              3D model these will need re-anchoring to the model's surface
              (e.g. project 3D anchor points to screen space per frame). */}
          <div className="hotspots-overlay" data-hidden={rotating || dragging}>
            {LOC_ZONES[visibleZoneId].hotspots.map((h) => renderHotspot(h, visibleZoneId))}
          </div>
        </div>
        </div>
      )}

      {SpecialDiagram && (
        <div className="car-stage flat">
          <div className="car-special-slot"><SpecialDiagram /></div>
          <div className="hotspots-overlay">
            {LOC_ZONES[activeZone].hotspots.map((h) => renderHotspot(h, activeZone))}
          </div>
        </div>
      )}

      {isOrbitZone && (
        <div className="drag-hint">
          <svg width="18" height="12" viewBox="0 0 20 14" fill="none">
            <path d="M2 7 L6 3 M2 7 L6 11 M2 7 L18 7 M18 7 L14 3 M18 7 L14 11" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
          </svg>
          <span>اسحب للدوران حول السيارة</span>
        </div>
      )}
    </div>
  );
}

/* Camera framing every car starts from — the same four stops as the top-level
   3D-model project's prev/next buttons (index.js PRESET_ANGLES), ported here
   instead of free-drag orbit. A car's model.camera (see the CARS registry)
   names only what differs; the two are shallow-merged in CarStage3D, so a car
   that overrides `radius` gives all four zones (checkCarRegistry, below CARS,
   enforces it).

   The angle numbers don't line up 1:1 with the 2D cube's rotateY convention,
   so this stays its own explicit map rather than reusing LOC_ZONE_TARGET_ANGLE.
   Every angle INSIDE the stage is car-relative — front = 0, one ring slot per
   90 (see CAR3D_VIEW_ZONES) — and only car3dOrbitAt, the one place an orbit
   string is written, turns that into a model-viewer theta.

     frontAzimuthDeg  camera-orbit theta at which THIS GLB's nose faces the
                      camera: its yaw as exported. A GLB exported nose-to-+X
                      says 90 here and nothing else changes — viewIndex,
                      ringAngle, the free-drag accumulator and the release snap
                      never learn about it.
     polarDeg         the rig's elevation, the "80deg" every preset used to
                      spell out.
     radius           per zone. "100%" is model-viewer's own framed distance —
                      untuned, never crops — so a car that omits it renders
                      whole, just not tightly. A real car overrides it with
                      radii measured on its silhouette: a body is narrow
                      front/rear but wide in profile, so one radius either crops
                      the side view or leaves front/rear tiny. Front/rear zoom
                      in, the two side views zoom back out (the Camry's 80/110).
   Deliberately NOT the Camry's numbers: defaults that happen to equal one
   car's tuning would let an edit to "the Camry" silently re-frame every car
   that left `radius` out. */
const CAR3D_CAMERA_DEFAULTS = {
  frontAzimuthDeg: 0,
  polarDeg: 80,
  radius: { front: "100%", sideLeft: "100%", rear: "100%", sideRight: "100%" },
};
/* ── Look profile: the Camry's exterior and interior, for every car ────
   The Camry's look was hand-built into its file: the "bake" step of commit
   48fafb2 gave the exterior paint (Paint_Color) a light cool silver, non-
   metallic, soft satin finish, and e326e7b plus the follow-up split three
   cabin parts out of the textured body and coloured them flat -- a near-black
   satin steering wheel, a near-black matte dashboard with a faint emissive
   lift so it does not vanish, and one red driver's seat as the accent. The
   rest of the cabin stayed textured. Panel split, hidden outline meshes and
   deleted animations are that model's own and are NOT part of the profile.

   Each slot below is one of those materials' numbers (linear RGB as glTF
   stores them; the silver is about #CFD1D3 on screen). Applied at load
   through model-viewer's material API to the materials a car names per slot
   in model.look, so the GLB files stay untouched and every car in the picker
   reads as one set. On a TEXTURED material the base colour multiplies the
   texture, so a cream leather cabin becomes near-black leather with its
   stitching still faintly there -- the footprint, not a copy. A car whose
   export separates its seat or wheel fills those slots; one that does not
   (every Sketchfab export so far) puts the whole cabin in `interior` and the
   red accent simply does not apply. The Camry's own file already carries
   exactly these numbers, so for it the profile is a no-op that documents the
   source.

   The colours are not the whole look: SHADING is the other half, and it
   lives in the files rather than here. The Camry is the benchmark for body
   gaps, and what makes them read is its paint's baked OCCLUSION MAP
   (measured 2026-09-16; lighting and colour are identical for every car, and
   its panels have real 2-3 mm gaps like the Nissans'): the map is on, which
   greys the silver against the white page, and it draws each seam as a thin
   dark line. Its numbers, at page size with the car about 400 px wide, are
   the target for every car:
     panel luminance 185 | door-seam contrast 18 | the line breaks on about
     21% of rows | 1 px wide at 55 below the panel in a fov-5deg close-up |
     about 3.1 isolated dark specks per 1000 panel pixels
   Two ways to get there, by what the export has (build steps 6 and 7 hold
   the commands, the guards and the measuring harness):
     a map, or a metallicRoughness texture with AO in its R  ->
       tools/occlusion-patch.mjs, in place on the compressed file: switches
       the map on, lifts a deleted plate's pocket, draws the seam curve.
     no map and no single UV layout  ->  tools/vertex-shading.mjs on the
       uncompressed intermediate, before `draco`: ray-traced occlusion and
       the seam curve baked into COLOR_0, which three.js multiplies into the
       base colour under this profile's silver.
   Both keep everything else byte for byte, and both refuse to run twice.
   Done: Camry (its own bake), Altima and Sentra (map, ?v=2), Maxima (vertex
   colours, ?v=3 -- its first attempt doubled every seam, see step 7). A new
   car needs its paint material name, its parts list for --seams, mm per model
   unit, and a pocket box if a plate was deleted. Judge each candidate beside
   the Camry at BOTH densities: the page's own size and a phone's (device
   pixel ratio 3), where a band wide enough to survive can split in two. */
/* dropBaseTexture: the Camry's cabin parts are FLAT colours. A leather texture
   left in place multiplies the colour and keeps its own hue -- the Sentra's tan
   cabin came out brown -- so the cabin and seat slots discard the base colour
   texture and render the plain shade. The metallic-roughness texture stays. */
const CAR_LOOK_PROFILE = {
  paint:    { baseColorFactor: [0.62, 0.63, 0.65, 1], metallicFactor: 0, roughnessFactor: 0.75 },
  interior: { baseColorFactor: [0.065, 0.065, 0.069, 1], metallicFactor: 0, roughnessFactor: 0.8, emissiveFactor: [0.0078, 0.0078, 0.0085], dropBaseTexture: true },
  wheel:    { baseColorFactor: [0.045, 0.045, 0.049, 1], metallicFactor: 0, roughnessFactor: 0.45 },
  // The one slot that departs from the Camry's baked numbers ([0.863, 0.058,
  // 0.058], roughness 0.8): that read as shallow, so the red is deeper, a
  // touch glossier and lifted a little more. Runtime, so the Camry's own seat
  // changes with it.
  seat:     { baseColorFactor: [0.92, 0.04, 0.045, 1], metallicFactor: 0, roughnessFactor: 0.6, emissiveFactor: [0.05, 0.003, 0.003], dropBaseTexture: true },
  /* Tail-light lens: deep red glass you can see into, with a sharp highlight.
     A car lists it only if its export has the lens as its own material and
     that material is already alphaMode BLEND -- the alpha here does nothing on
     an OPAQUE one. The Maxima's red_glass came out flat and dark (95% opaque,
     46% metallic, roughness 0.28), which hid the lamp bodies behind it. */
  taillight: { baseColorFactor: [0.2, 0.01, 0.015, 0.72], metallicFactor: 0, roughnessFactor: 0.07 },
  /* Windows, for an export that left them OPAQUE. Every Sketchfab car so far
     ships its glass as its own see-through material and lists nothing here;
     the Sonata's `midsize_glass` is a game asset whose transparency lived in
     a channel glTF has no use for, so its greenhouse rendered as flat pale
     panels with the cabin -- and the red driver's seat -- sealed behind them.
     This is the one slot that changes alphaMode as well as colour (BLEND, and
     dropping the base texture, which on that file is a grey sheet with a
     defroster pattern baked in). Alpha 0.3: at 0.5 the cabin barely showed,
     and below about 0.2 the glass stopped reading as glass at all. */
  glass:    { baseColorFactor: [0.045, 0.05, 0.055, 0.3], metallicFactor: 0, roughnessFactor: 0.05, alphaMode: "BLEND", dropBaseTexture: true },
};
// Applied in this order, so a material a car lists under two slots ends up
// with the more specific one (wheel or seat over interior).
const CAR_LOOK_SLOTS = ["paint", "interior", "wheel", "seat", "taillight", "glass"];
/* Recolours a loaded model's materials to the profile, slot by slot.
   Idempotent: a cached reopen or a remount simply re-applies the same values.
   A name the file does not have is reported with the list it does have, since
   Sketchfab exports name their materials anything (PAINT, Paint, body,
   neimat, phong4...). */
function applyLookProfile(mv, car) {
  const look = (car.model && car.model.look) || null;
  if (!mv.model || !look) return;
  for (const slot of CAR_LOOK_SLOTS) {
    const recipe = CAR_LOOK_PROFILE[slot];
    for (const name of look[slot] || []) {
      const mat = mv.model.materials.find((m) => m.name === name);
      if (!mat) {

    if (/^[a-z]{1,3}$/.test(t)) { out.push(t.split("").map((ch) => CAR_LETTERS_AR[ch]).join(" ")); continue; }
    if (!carWarnedWords.has(t)) {
      carWarnedWords.add(t);
      console.warn("[CARS] no Arabic for \"" + t + "\" in CAR_MODELS_AR -- add it there; showing it as written.");
    }
    out.push(t);
  }
  return out;
}
/* id, name and short for a .glb path. The make (one word, or a two-word make
   phrase, which also collapses to one slot in `words`) is dropped from `short`
   when something is left after it, matching the hand-written "كامري 2020". */
function carNameFromFile(src) {
  const tokens = carTokensFromFile(src);
  // A leading year ("2019_nissan_altima") moves to the end, where the names
  // already put it ("نيسان ألتيما 2019") and where the make check below
  // expects the make to be first.
  if (tokens.length > 1 && /^(19|20)\d\d$/.test(tokens[0])) tokens.push(tokens.shift());
  const words = carWordsToArabic(tokens);
  const name = words.join(" ");
  const leadsWithMake = tokens.length > 1 && (!!CAR_MAKES_AR[tokens[0]] || CAR_MAKE_PHRASES.has(tokens[0] + " " + tokens[1]));
  const short = leadsWithMake && words.length > 1 ? words.slice(1).join(" ") : name;
  return { id: tokens.join("-"), name, short };
}
/* Registry normaliser: fills id/name/short from the file name when the entry
   leaves them out. Explicit fields win; an explicit name without a short must
   not inherit a short derived from a different name. */
function carFromEntry(entry) {
  const src = entry.model && entry.model.src;
  const derived = src ? carNameFromFile(src) : null;
  if (!derived && !entry.id) console.warn("[CARS] an entry has neither model.src nor id: it cannot be named or selected.");
  return Object.assign({}, derived || {}, entry, {
    short: entry.short || entry.name || (derived ? derived.short : undefined),
  });
}

/* ── Car registry ──────────────────────────────────────────────────
   Everything that differs from car to car lives in one entry here, so adding a
   car is a data change plus its asset files -- no component edits.

     model     the 3D half, or null for a car we have no GLB for yet.
       src     the .glb url. The car's id, name and short name are DERIVED
               from this file name (carNameFromFile above), so a file called
               toyota-camry-2020.glb needs nothing else. Nothing is fetched
               until the user opens the 3D screen -- see `armed` in CarStage3D.
       hotspots  3D anchor points, keyed zone -> part id (metres, model space).
                 Produced by raycasting the real render, not authored by eye --
                 see CAR3D_HOTSPOT_3D above, and the ?anchors=1 helper
                 (CAR3D_ANCHOR_DEV) for making a new car's.
       camera    framing for THIS GLB -- see CAR3D_CAMERA_DEFAULTS for each
                 field; only what differs from the defaults needs listing.
       look      slot -> material name(s) in the file, recoloured at load to
                 CAR_LOOK_PROFILE: paint (exterior body), interior (cabin:
                 dash, panels, and seats when they share a material), wheel
                 (the steering wheel, if the file separates it), seat (the
                 red accent, if the file has a seat material of its own) and
                 taillight (the rear lens, if it is its own BLEND material).
                 paint is required; the others hold whatever the file
                 separates. List a file's materials from the console with
                 mv.model.materials.map(m => m.name) or from the GLB's JSON;
                 leave black trim/roof materials out of paint.
     name/short  optional overrides of the derived Arabic name (name is what
               every screen header shows). Required only for a car with no
               model, which has no file name to derive from.
     id        optional override of the derived id; likewise required without a
               model. The id is what localStorage remembers, so renaming a file
               changes it and a browser holding the old one falls back to
               CARS[0].

   The 2D screen is deliberately NOT per-car: its four faces (LOC_FACE_IMG) are
   generic sedan line art shared by every car, which is exactly why a car with
   model: null still works there and only the 3D card goes inert.

   Adding a car that has a GLB:
     1. Name the file after the car -- make-model-year, e.g.
        hyundai-santa-fe-2021.glb -- and drop it in assets/ (Draco-compressed
        like toyota-camry-2020.glb). When you later REPLACE a file, add or bump
        a ?v=N query on its src here so cached copies are not picked up.
     2. Add { model: { src: "assets/<file>.glb" } } below and reload: the
        picker shows the Arabic name. A word the tables do not know is shown as
        written and named in a console warning -- add it to CAR_MODELS_AR.
     3. Framing and hotspots: camera.frontAzimuthDeg (0 if the nose faces
        theta 0 -- verify the sideLeft slot shows the car's LEFT side against
        car-side-clean.png, as the CAR3D_VIEW_ZONES comment describes),
        camera.radius per zone, and hotspots: {} to start.
     4. Open the page with ?anchors=1, select the car, open the 3D screen and
        click each part in each zone; paste the logged lines into that car's
        hotspot table. Part ids must be the ones in LOC_ZONES[zone].hotspots --
        a dot only renders once its id has an anchor.
     5. The look: with ?anchors=1 open, tap the body and the cabin -- each
        logged line names the material under the tap -- and list them under
        look.paint and look.interior. The red driver's seat is a MANUAL step
        per car: if a tap on the seat names the same material as the dash, the
        seat has to be carved out of the file first (that is how the Camry's
        Driver_Seat_Red was made). Run
          node tools/seat-split.mjs <original.glb> --report --source <cabin>
        for the model's bounds, choose a box around the driver's seat (the
        Camry's sits at 56-80% of the width from the right-hand side, 30-86%
        of the height, 40-56% of the length from the rear), check what it
        catches with --report --box, then split and compress:
          node tools/seat-split.mjs <original.glb> <tmp.glb> --source <cabin> --box x0,y0,z0,x1,y1,z1
        (or --mesh <name> when the export has a seat mesh of its own; list
        every material the seat uses in --source so its back shell comes
        too). The tool selects whole connected SHELLS, not loose triangles:
        a shell (seat, headrest, each post) moves when more than half of
        its triangles sit in the box, so the box only has to contain most
        of the seat -- take its top to ~94% of the height so the headrest
        shell counts, and its outer side past the seat bolster. Cutting
        triangle by triangle (--mode tris) was how the Camry, the Sentra
        and the Altima first got a red B-pillar and headliner strip: that
        trim shares the cabin material and overlaps the headrest in height,
        so no box separates it, but it is a separate shell that is mostly
        outside the box and the shell rule rejects it. --exclude is now only
        for small hardware fully inside the box (the Sentra's seat-belt
        guide on the pillar: 0.90,1.65,-0.9,1.4,2.3,0.7). The report lists
        every shell touching the box with its inside percentage; expect
        seat + headrest + posts SELECTED and nothing else. Judge with the
        harness's cabin, cabinRear, roof and pillar close-ups: red must show
        only where the seat is. Then run the usual compression on <tmp.glb>
        and add seat: ["Driver_Seat"].
     6. Licence plates. A demo car should not carry a model's branding, and
        every export keeps its plates as their own meshes, so they are
        deleted from the file rather than painted over:
          node tools/mesh-strip.mjs <glb> --report --match plate
          node tools/mesh-strip.mjs <in.glb> <out.glb> --remove <mesh>[,<mesh>]
        run after the seat split, before the compression. Done so far: Camry
        Object_2 (front only, material metal_white, texture plate_noRed);
        Altima _111_pasted__polySurface973_MANUF_0 and
        _112_Object018_MANUF_0; Sentra _101_..._plate_0, _102_text_
        houbeixiang_plate_0 and the black backing panel behind the front one,
        _080_..._rub_mat_0, whose removal lets the honeycomb grille show
        through. The Maxima has no plate.
        Then check what is left in the gap. A plate in the GRILLE (Camry,
        and the Sentra once its backing is gone) simply reveals the grille.
        A plate in a BODY pocket (both Nissans at the rear) leaves a black
        rectangle: the pocket's shadow is baked into the body material's
        occlusion map. Never clear that map (step 7); lift only the pocket
        with tools/occlusion-patch.mjs --pocket, rather than cutting more
        geometry -- the pocket floor is part of the boot lid and cutting it
        opens a hole into the car.
     7. Body gaps, with the Camry as the benchmark. At page size (car about
        400 px wide) the Camry's panels read at luminance 185 and a door seam
        is a thin line: contrast 18, broken on about 21% of rows, and 1 px
        wide at 55 below the panel in a door close-up. Its lighting and
        colour are the same as every car's and its panels have real 2-3 mm
        gaps like the Nissans' -- the difference is its paint's occlusion
        map, which is switched on and carries the seam lines. The Altima's
        and Sentra's maps were switched off (204-207) and have no lines, so
        tools/occlusion-patch.mjs, in place on the compressed file (only the
        map image and the paint material change), switches each map on,
        lifts the plate pocket and darkens the map along every gap between
        body, doors and boot lid (x0.45 within 3 mm of the neighbouring
        panel, back to 1 by 6 mm):
          node tools/occlusion-patch.mjs <glb> <out.glb> --material PAINT --from-metal-roughness
            --pocket -0.0084,0.0144,-0.0955,0.0084,0.0203,-0.0930
            --seams _010_carpaint_PAINT,door,houbeixiang --mm-per-unit 26440 --seam-behind
          node tools/occlusion-patch.mjs <glb> <out.glb> --material Paint --from-metal-roughness
            --pocket -0.60,1.17,-3.38,0.60,1.49,-3.30
            --seams door,trunk,_030_carpaint --mm-per-unit 666 --reset-specular
        Result: panel 191 / 189, door-seam contrast 20-22, 4-7% of rows
        broken, a 3 px line at 41-43 close up. --reset-specular also drops the
        Sentra paint's 13% specular so it reflects like the Camry's. The tool
        refuses a map that is already on, so it cannot darken twice.
        Always pass --seam-behind (Altima v=3, 2026-09-17). Without it the band
        also traces any other part within reach UNDER the skin: on the Altima
        the body's flange behind each front door's leading edge, which drew a
        wavy second line down the door that hooked into a smudge at the sill,
        and a doubled band on each rear door's back edge. The flag weighs each
        neighbour by where it lies along the surface's outward normal, so a gap
        wall keeps its line and a panel tucked behind is ignored; the real seams
        measured the same (door seam contrast 22 before and after). The Sentra
        above still ships without it -- it shows only a faint doubling on the
        front door edge -- and would be rebuilt the same way from its
        pre-step-7 file.
        An export with NO map, and no single UV layout to add one (the
        Maxima: every body part carries its own overlapping 0-1 UVs), can have
        the same two halves baked into vertex colours instead, with
        tools/vertex-shading.mjs: ray-traced occlusion for the tone and the
        same kind of seam curve for the lines. three.js multiplies COLOR_0
        into the base colour, so the profile's silver still lands on top.
        A vertex colour cannot be added under Draco, so this one runs on the
        recipe's uncompressed dedup intermediate, before `draco`:
          node tools/vertex-shading.mjs m3.glb m4.glb --material body --mm-per-unit 1025
            --ao-distance 2050 --ao-rays 128 --ao-ground --ao-strength 1.0 --ao-hidden-below 0.25
            --seams all --curve 0:0.45,4:0.45,8:1 --seam-coarse 20 --seam-behind
        Result (?v=3): panel 188, contrast 16, 19% of rows broken against the
        Camry's 21%; the bake takes about 2.5 min and adds about 280 KB.
        The first attempt shipped wrong and was reverted the same day: every
        seam showed as TWO parallel lines. A vertex colour is not prefiltered
        the way a map is, so its band must be wider (at the map's 3 mm /
        x0.45 more than half the rows broke into dots) -- and the guard that
        was meant to spare a panel tucked behind another was unsigned, so it
        also lit the faces INSIDE each gap. A wide band darkening both skins
        with a lit strip between them is two lines as soon as pixels resolve
        it, which a phone does. The fix was to sign the guard against the
        outward side (--seam-behind, below), so a gap's own walls stay dark
        and only a neighbour behind the surface is spared, and to narrow the
        curve to x0.45 to 4 mm. Check both densities, always. --ao-hidden-below keeps surfaces that are enclosed on both
        sides at panel level, so they do not show as dotted lines through the
        hairline cracks between patches of a panel; --seam-coarse and
        --seam-sideways stop the wider line painting a dent-like blob where
        the rear bumper tucks under the quarter panel. It also refuses a file
        that already has COLOR_0.
        Calibrating a new car: always on the RENDERED line, next to the
        Camry, never by copying numbers between the two tools -- fitting the
        Camry map's AVERAGE shade by distance gave a 7 px soft band instead of
        its 1 px line. The scratchpad harness renders a grid of cars with the
        page's own viewer settings (side view 90deg 80deg 110% fov 30, door
        close-up 90deg 85deg 100% fov 5) and measures: panel tone and seam
        contrast, line depth and width close up, how many rows the line breaks
        on, and isolated dark specks. Aim for the Camry's numbers above.
        Known limit, accepted: switching a Sketchfab bake on, or baking one,
        adds some specks (4.6-5.1 per 1000 panel px against 3.1 on the Camry).
        They are fine dark detail in the bake showing through the model's own
        hairline cracks; the seams, the specular reset, the handle panels and
        inward-facing paint were each tested and ruled out.
     8. Exports that do not fit the recipe as written. Everything above assumes
        a Sketchfab-style export: metallic-roughness materials, geometry where
        the node transforms say it is, and one material per part. The six cars
        added on 2026-09-20 each broke one of those, and each fix runs BEFORE
        the seat split, on the original in repo-root assets/:
          a. KHR_materials_pbrSpecularGlossiness (both game rips -- the Kia
             Optima and the Hyundai Accent). model-viewer still renders it, so
             the car looks fine and the look profile silently does NOTHING:
             CAR_LOOK_PROFILE writes pbrMetallicRoughness, which such a
             material does not use. Convert first and the profile lands:
               npx -y @gltf-transform/cli@4 metalrough <in.glb> <out.glb>
          b. A skin that is the identity (the Elantra: 136 joints, no
             animation). three.js renders each vertex at its raw POSITION and
             ignores the mesh node's transform, so every position-based tool
             here -- seat-split's boxes, vertex-shading's seams -- reads the
             car lying on its side in a space nothing renders in. Drop the
             skin and give the node the world matrix the renderer was using
             (identity), checking first that jointWorld * inverseBind is the
             identity for every joint a vertex is actually weighted to; the
             rig's _rootJoint and its "_end_" tips are scaled by 100 and carry
             no weights, so check the USED joints, not all of them.
          c. `dedup` merges materials that differ only by name, and these
             exports are full of them: the Sonata collapsed from 35 materials
             to 21, folding its whole cabin into `sonata2015_chrome`, which
             makes look.interior unaddressable. Pass --materials false. The
             cost is a few hundred bytes of JSON.
          d. `prune` is now part of every build, not just the Maxima's: it
             drops unused nodes and accessors, and it folds a single-colour
             texture into the material's factor, which is what saves the
             Sonata's paint (a flat 128px grey swatch that multiplied the
             profile's silver down to a dark grey). Run it after any step that
             clears a vertex attribute, or the orphaned accessor stays in the
             buffer -- dropping COLOR_0 from the Elantra without it left 2.7MB
             behind.
        Also worth a look before shipping: geometry far outside the car
        stretches the bounding box the page frames on. Four 60-triangle gauge
        meshes a metre above the Corolla 2017's roof made it render 35% small
        at every zone stop. */
/* Every file in assets/ is built from an export kept in the repo-root assets/
   folder, by the recipe above. The three Nissans, first:
   copies of the Sketchfab exports kept in the repo-root
   assets/ folder with the geometry Draco-compressed and the textures
   byte-for-byte the originals, except the Altima's and the Sentra's paint
   maps, whose occlusion channel carries step 7's pocket lift and seam lines;
   the Maxima carries step 7's shading as vertex colours.
   Altima and Sentra: gltf-transform `dedup`,
   `weld`, then `draco --quantize-normal 12`. The Maxima exported with 1.3M
   triangles and EIGHT UV sets, seven of them read by no material (most of
   its 86MB), so it is `prune`d first -- which drops those sets losslessly --
   then `dedup`, the vertex-colour shading of step 7, and the same `draco`,
   with NO simplify and no weld: a gentle
   simplify (error 0.0001) visibly scuffed its panels, and weld inflated the
   file. All 1.33M triangles are kept; the page's immediate loader,
   context-loss recovery and watchdog are what make that safe to ship. Lossy
   WebP textures and any simplify were tried first and visibly degraded paint,
   roughness maps and panels -- do not re-add them; the tool is a last resort
   here. All four files also go through tools/mesh-strip.mjs to delete their
   licence plates (step 6 above); the Camry, which has no original to rebuild
   from, was stripped in place and re-encoded, which is why it is the one file
   Draco has touched twice.
   Camera radii are the Camry's -- all four are sedans -- and each was checked
   at the four zone stops. Their exported paint (grey-blue, orange, black) and
   cabins (cream, tan and white leather) are recoloured at load to
   CAR_LOOK_PROFILE through model.look, so the files keep their colours and the
   page shows one silver set with dark cabins. No hotspot anchors
   yet: the 3D screen shows the car, the ring and the parts list, and the dots
   arrive once the ?anchors=1 recipe has been run for that car.

   The six added on 2026-09-20 follow the same build, with step 8's fix for
   whatever each export broke first, then: seat split, plate strip (where the
   export has plates), prune -> dedup --materials false -> weld -> step 7's
   vertex shading -> draco --quantize-normal 12. None of the six has a paint
   occlusion map or a metallicRoughness texture with AO in it, so all six take
   the vertex-colour branch. Two of them -- the Kia and the Accent -- keep
   their whole body in ONE node, so --seams has no second part to measure
   against and they carry the ray-traced tone without drawn lines; their real
   panel gaps still shade themselves through the AO. Measured beside the
   Camry at page size, the six read 195 / 198 / 199 / 199 / 203 / 203 against
   its 199, where unshaded they were 205-212.
   Two are HEAVY: the Corolla 2014 at 14.7MB and the Sonata at 12.5MB, both
   almost entirely 1024px PNG textures that belong to cabin materials the
   profile paints flat (9.5MB of the Corolla's). The geometry is already as
   small as Draco makes it; shrinking these further means touching textures,
   which the recipe above deliberately does not do. */
const SEDAN_RADIUS = { front: "80%", sideLeft: "110%", rear: "80%", sideRight: "110%" };
const CARS = [
  {
    // Named from the file: id "toyota-camry-2020", "تويوتا كامري 2020" / "كامري 2020".

      hotspots: CAR3D_HOTSPOT_3D,

  // layout, so it carries the same shading as vertex colours (step 7); v=3,
  // since v=2 was the attempt whose seams doubled. They belong in
  // the file, not the material API here: changing a map at load cost a
  // recompile that held the loading overlay up about six seconds on a

  { model: { src: "assets/nissan-altima-2019.glb?v=3", camera: { radius: SEDAN_RADIUS }, look: { paint: ["PAINT"], interior: ["neimat"], seat: ["Driver_Seat"] } } },

  { model: { src: "assets/toyota-corolla-2017.glb?v=2", camera: { radius: SEDAN_RADIUS }, look: { paint: ["e180body"], interior: ["e180_interior", "e180_int", "e180_gray"], seat: ["Driver_Seat"] } } },

/* All twelve edges of the cube — the whole wireframe, drawn every frame.

  [0, 4], [1, 5], [2, 6], [3, 7],   // struts joining them

/* atan(1/√2) — the one tilt at which all three axes foreshorten equally, so the
   silhouette is a REGULAR hexagon and the three visible faces are identical

   tilting the other way would show the underside.
   It earns its keep twice. The second property is subtler and is why the corner
   poses look properly centred: at this tilt, and ONLY at this tilt, the near
   corner projects exactly onto the cube's centre (-cos φ + √2 sin φ = 0). Tilt
   differently and the Y-junction sits off-centre inside its own silhouette. */
const MV_CUBE_TILT = -35.264 * Math.PI / 180;
const MV_CUBE_C = 24;      // centre of the 0 0 48 48 viewBox
/* Half-edge in user units, applied to BOTH axes — one uniform scale, which is

   the drawing never exceeds √2·13 ≈ 18.4 wide or 1.633·13 ≈ 21.2 tall from
   centre, so with a 0.75 half-stroke it cannot reach the 24-unit edge.

   perfect square. It works arithmetically and looks wrong — an anisotropic scale

   regular hexagon are the same choice from opposite ends and cannot both hold;
   the hexagon is the one that matches IconCube on the entry card. */

/* One full turn. 4s, not the 3s this ran at: a steady 90°/s, calm enough to read

   peaked around 182°/s, so this is a little over half its fastest moment.) */

   Driven from absolute time, not from a start timestamp, so the effect below can
   be torn down and restarted on a phase change without the cube jumping back to

   the in-between poses were genuinely ugly. Edges are projected strokes now and
   hold constant weight at every angle (measured spread 1.05x across a turn), so
   there is nothing left to hurry past.

   projection's screen-x is `a = x·cosθ + z·sinθ` and nothing else — the X tilt

   face centre is (0,0,1), i.e. a = sin θ, which GROWS with θ. Increasing yaw

/* Projects the cube at `yawDeg` and returns the path data for all twelve of its

   near.

   parallel edges parallel and makes each frame read as a flat drawing. Both axes
   take the SAME scale, which is what makes this a rotation rather than a morph:
   a uniform scale commutes with the rotation, so the cube stays rigid through
   the turn.

   ever double-struck and none is heavier than its neighbours.

   obvious: the near and far corners both project onto the centre, and their two
   Y-junctions land 60° apart, so the drawing is the hexagon outline plus SIX

   cube. It can also read as flipping inside-out (a Necker cube) — inherent to
   drawing a transparent solid, and the price of being hollow. */

  const th = yawDeg * Math.PI / 180;

  const rot = (p) => {

}

/* Loading state for the 3D stage: the wireframe cube above and a label.

   the progress number, and CarStage3D (which owns model-viewer, the camera and
   the hotspots) must not re-render along with it. It listens to the same
   element through the shared ref. Idle -- phase "waiting", nothing rendered,
   no timers, no listeners -- until `active`, which is CarStage3D's `armed`.

  /* waiting -> downloading -> preparing -> done -> idle, or error from
     anywhere, or lost (WebGL context gone) from anywhere including idle.
     `preparing` is the phase the first version missed: totalProgress reaches 1
     when the last byte lands, but Draco decode and texture upload still take a
     visible beat on a mid-range phone -- a bar sitting full while nothing
     happens is exactly where a load feels broken. */

  const [slow, setSlow] = useState(false);
  const [hard, setHard] = useState(false);     // the hard-stall error, worded differently
  const [attempt, setAttempt] = useState(0);   // bumped by retry() to re-arm the effect
  const targetRef = useRef(0);                 // monotonic, what was reported
  const shownAtRef = useRef(0);                // when it actually became visible
  const stallRef = useRef(0);
  const hardRef = useRef(0);

  useEffect(() => {
    /* Nothing to watch until the stage sets src. Returning here keeps the phase
       at "waiting", so a stage parked under the home screen can never run the
       dead timer below and report a failure for a download nobody asked for. */
    if (!active) return;
    const mv = viewerRef.current;
    if (!mv) return;
    let alive = true;
    if (mv.loaded) { setPhase("done"); return; }   // already there: never show

    // Not already there: show the loader now, in the commit that armed the
    // stage. A retry re-runs this effect with the phase already "downloading".
    setPhase((p) => (p === "waiting" ? "downloading" : p));

    /* Has the GLB response completed, according to Resource Timing? On a fast
       link the whole download lands before these listeners attach, so the
       progress events are simply never seen; this is how "no bytes seen" is
       told apart from "no bytes at all". Compared on the full src (query
       included) so a retry's fresh url is not satisfied by the failed one. */
    const fetched = () => {
      const src = mv.getAttribute("src") || "";
      return !!src && performance.getEntriesByType("resource").some((e) => decodeURIComponent(e.name).endsWith(src));
    };
    // Terminal phases nothing below may overwrite.
    const settled = (p) => p === "done" || p === "idle" || p === "lost";

    const armStall = () => {
      clearTimeout(stallRef.current);
      clearTimeout(hardRef.current);
      setSlow(false);
      const started = targetRef.current > 0;
      stallRef.current = setTimeout(() => {
        if (!alive) return;
        /* Bytes were flowing and stopped -> say the link is slow, keep waiting.
           Nothing seen -> either the response already completed before the
           listeners attached (then the model is decoding: "preparing", and the
           stall clock restarts) or nothing ever arrived (a failure to start,
           offered a retry). The dead timer is the only signal for a load that
           produces no DOM event at all (see CarStage3D's modelFailed comment).
           It does not have to cover an `error` that beat these listeners: src
           is set in the commit this effect re-runs for, model-viewer reacts in
           a microtask after it, and a failure needs the network round-trip
           first, so the listeners are in place by then. The one event that can
           land earlier is the totalProgress 0 that marks the request starting,
           which onProgress ignores. */
        if (started) { setSlow(true); return; }
        if (fetched()) {
          targetRef.current = 1;
          setPhase((p) => (settled(p) || p === "error" ? p : "preparing"));
          armStall();
          return;

         with an error rather than a caption that never changes. */
      hardRef.current = setTimeout(() => {
        if (!alive) return;

        setPhase((p) => (settled(p) ? p : "error"));

    };

      const raw = e && e.detail && typeof e.detail.totalProgress === "number" ? e.detail.totalProgress : 0;
      /* Monotonic. model-viewer can report a lower total when a second request
         begins, and a bar that walks backwards reads as an error. */
      if (raw > targetRef.current) { targetRef.current = raw; armStall(); }
      if (targetRef.current >= 1) setPhase((p) => (settled(p) || p === "error" ? p : "preparing"));
    };

    // A lost WebGL context also arrives as `error`; the effect below owns it.
    const onError = (e) => {

     this component is idle and the car is on screen. The GPU process is gone
     with it, so a fresh src cannot help; the only way back is a page reload,
     which the "lost" state offers. Its own effect so it outlives the load
     listeners above (which are re-armed per attempt). */
  useEffect(() => {
    if (!active) return;

    if (!mv) return;

     like "waiting"; "lost" fades in from idle like any other appearance. */
  useEffect(() => {

     up that long. If it was never visible at all (the fast path) both timers
     are zero, so nothing is ever painted. Idle rather than unmounted: the
     context-loss listener above has to keep living here. */
  useEffect(() => {
    if (phase !== "done") return;
    const held = shownAtRef.current
      ? Math.max(0, MV_LOADER_MIN_SHOW_MS - (performance.now() - shownAtRef.current))
      : 0;
    const t1 = setTimeout(() => setShown(false), held);
    const t2 = setTimeout(() => setPhase("idle"), held + MV_LOADER_FADE_MS);
    return () => { clearTimeout(t1); clearTimeout(t2); };

  /* Hand the failure verdict to CarStage3D, which cannot work it out for itself
     — see its modelFailed comment. `phase` already folds together the error
     event, the stall timers, the dead timer and a lost context, and retry()
     puts it back to "downloading", so this reports recovery as well as
     failure. */
  useEffect(() => {
    if (onFailed) onFailed(phase === "error" || phase === "lost");
  }, [phase, onFailed]);

  /* Drives the wireframe AND the label's ellipsis, from one clock — that shared
     `now` is what actually syncs them. Both are written straight through refs
     rather than through state, so they animate without re-rendering React 60
     times a second, which is the reason this component was split out at all.
     Each ref is re-read every frame, so the dots mounting and unmounting with
     `phase` needs no special handling.
     Under reduced motion no loop starts: the path stays at the opening isometric
     pose it was rendered with, and CSS takes over (it breathes the cube's opacity
     and pins all three dots on).
     Depending on [phase] because the <svg> does not exist before the stage is
     armed or while idle; both helpers read absolute time, so the restart that
     causes does not make either jump. */
  const wireRef = useRef(null);
  const dotsRef = useRef(null);
  useEffect(() => {
    if (!wireRef.current) return;
    let reduce = false;
    try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    if (reduce) return;
    let raf = 0;
    const frame = () => {
      const now = performance.now();
      const el = wireRef.current;
      if (el) el.setAttribute("d", mvCubeWire(mvCubeYaw(now)));
      const dots = dotsRef.current;
      if (dots) dots.setAttribute("data-dots", mvCubeDots(now));
      raf = requestAnimationFrame(frame);
    };
    frame();
    return () => cancelAnimationFrame(raf);
  }, [phase]);

  const retry = () => {
    const mv = viewerRef.current;
    if (!mv) return;
    targetRef.current = 0;
    setSlow(false); setHard(false); setPhase("downloading");
    /* A failed load is remembered under its url -- model-viewer's in-memory
       GLTF cache keeps the empty result, and the HTTP cache may hold a partial
       body -- so the retry asks under a fresh one. */
    const src = (mv.getAttribute("src") || "").split("#")[0].replace(/([?&])retry=\d+&?/, "$1");
    mv.setAttribute("src", src + (src.includes("?") ? "&" : "?") + "retry=" + Date.now());
    // Re-run the load effect: fresh listeners and a fresh dead timer for the
    // new request, so a retry that also gets nothing is not stuck for ever.
    setAttempt((a) => a + 1);
  };

  const label = phase === "lost" ? "توقف عرض النموذج ثلاثي الأبعاد"
    : phase === "error" ? (hard ? "تعذّر عرض النموذج" : targetRef.current > 0 ? "تعذّر تحميل النموذج" : "تعذّر بدء التحميل")
    /* No trailing "…" on the loading labels — the animated .bs-dots below
       supply it, and a literal ellipsis next to them reads as six dots. */
    : phase === "preparing" ? "جاري التجهيز"
    : slow ? "الاتصال بطيء… التحميل مستمر"
    : "جاري عرض السيارة";

  return (
    <div
      className="mv-loader"
      data-show={shown ? "true" : "false"}
      data-phase={phase}
      role="status"
      aria-live="polite"
      aria-label={label}
    >
        {/* One path holding all the cube's visible edges, re-projected each frame
            by the effect above. Rendered with the opening isometric pose already in
            place so the first paint is the finished drawing rather than an empty
            box — and so reduced motion, which never starts the loop, still gets a
            cube. */}
        <svg className="mv-cube" viewBox="0 0 48 48" width="80" height="80" aria-hidden="true">
          <path className="mv-cube-wire" ref={wireRef} d={mvCubeWire(45)} />
        </svg>
      <div className="mv-loader-line">
        {/* Dots live INSIDE the text span, trailing the label as part of its
            RTL run, so .bs-dots' own margin-inline-start sets the spacing. They
            render only while something is genuinely loading: an error is not,
            and at "done" the label still reads "downloading" through the
            fade-out. aria-hidden keeps a chattering ellipsis out of the
            aria-live region (the whole loader already announces itself via
            aria-label).
            data-dots is written every frame by the effect above, from the same
            clock as the cube. The initial "1" matches what mvCubeDots returns at
            the top of a cycle, so the first paint is already a valid state
            rather than an empty gap. */}
        <span className="mv-loader-text">
          {label}
          {(phase === "downloading" || phase === "preparing") && (
            <span className="bs-dots" ref={dotsRef} data-dots="1" aria-hidden="true"><span></span><span></span><span></span></span>
          )}
        </span>
        {/* Reload is offered in every failed state: after a lost context it is
            the only way back, and after a network failure it is what a user
            reaches for anyway. Retry only where a fresh request can help. */}
        {(phase === "error" || phase === "lost") && (
          <span className="mv-loader-actions">
            {phase === "error" && <button className="mv-loader-retry" onClick={retry}>إعادة المحاولة</button>}
            <button className="mv-loader-reload" onClick={reload}>إعادة تحميل الصفحة</button>
          </span>
        )}
      </div>
    </div>
  );
}

     model: it renders an empty stage instead of throwing. */

     dispatches no DOM error event at all, so a listener here sat silent while
     the screen was visibly broken. ModelLoader already resolves this properly —
     the error event, a stall timer, and a dead timer for the case where nothing

  const onPointerDown = (e) => {

      // release; the eventual pointerup for the remaining finger falls
