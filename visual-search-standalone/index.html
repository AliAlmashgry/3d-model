/* ---------- Selector card ---------- */
// Default starter make for the SelectorCard — pre-selected so the user
// reads "chips are pickable, here's an example." Reset goes to fully
// empty, not back to this default.
const DEFAULT_MAKE = "تويوتا";

function SelectorCard({ onAddCar, dest, seedMake, seedModel, seedYear, lockedCols, hideSaved, title, ctaLabel }) {
  // Toyota pre-selected as a teaching default — the first-time user sees
  // a chip already in its "selected" visual state, which signals "these
  // are tappable, you pick from here." The model row becomes active so
  // the next step is obvious. Reset clears all back to empty.
  // Cold landers (BACKLOG #35) reuse this seeded from the URL: dims already
  // known are passed via seed* and named in lockedCols, which hides their rows
  // and shows a compact "سيارتك: …" summary instead; hideSaved drops the saved
  // bar. All props default to undefined so the home renders exactly as before.
  const locked = new Set(lockedCols || []);
  // On a seeded lander (brand page) surface the landed make first in the rail;
  // the rest keep their order. Home (no seedMake) is unchanged.
  const makeOrder = seedMake ? [seedMake, ...MAKES.filter((m) => m !== seedMake)] : MAKES;
  const [make, setMake] = useState(seedMake !== undefined ? seedMake : DEFAULT_MAKE);
  const [model, setModel] = useState(seedModel !== undefined ? seedModel : null);
  const [year, setYear] = useState(seedYear !== undefined ? seedYear : null);
  // Mirror makeOrder for the model rail: surface the seeded model first (rest keep
  // order) so a scoped lander shows the landed model up front. Uses seedModel
  // (stable) not the live pick, so tapping a model doesn't reshuffle the rail.
  const modelList = MODELS[make] || [];
  const modelOrder = (seedModel && modelList.includes(seedModel))
    ? [seedModel, ...modelList.filter((m) => m !== seedModel)]
    : modelList;
  const [activeCol, setActiveCol] = useState(locked.has("model") ? "year" : "model");
  const [hintCol, setHintCol] = useState(null);

  const hintTimer = useRef(null);
  const teach = (target) => {
    setHintCol(target);
    if (hintTimer.current) clearTimeout(hintTimer.current);
    hintTimer.current = setTimeout(() => setHintCol(null), 900);
  };

  const pickMake = (m) => {
    setMake(m);
    setModel(null);
    setYear(null);
    setActiveCol("model");
  };
  const pickModel = (m) => {
    setModel(m);
    setYear(null);
    setActiveCol("year");
  };
  const pickYear = (y) => {
    setYear(y);
    setActiveCol("year");
  };
  const reset = () => {
    setMake(null); setModel(null); setYear(null);
    setActiveCol("make");
  };
  const setAll = (mk, md, yr) => {
    setMake(mk); setModel(md); setYear(yr);
    setActiveCol("year");
  };

  const ready = make && model && year;

  const rowClass = (col) => {
    const isDone =
      (col === "make" && make) ||
      (col === "model" && model) ||
      (col === "year" && year);
    const isActive = activeCol === col;
    const isHinting = hintCol === col;
    return [
      "step-row",
      isActive ? "is-active" : "",
      isDone ? "is-done" : "",
      isHinting ? "hinting" : "",
    ].filter(Boolean).join(" ");
  };

  // Visible step numbers (locked cols are hidden, so they're excluded).
  const stepNo = (col) => ["make", "model", "year"].filter((c) => !locked.has(c)).indexOf(col) + 1;
  const modelDisabled = !make;
  const yearDisabled = !model;
  // Hide the reset button on the teaching default (only DEFAULT_MAKE is
  // selected, nothing else) so the first-time user isn't prompted to undo
  // a selection they didn't make. Once they pick a model/year OR switch
  // the make away from default, reset appears. Reset itself goes to fully
  // empty — never back to default.
  const isDefaultState = make === DEFAULT_MAKE && !model && !year;
  const showReset = !!(make || model || year) && !isDefaultState && locked.size === 0;

  return (
    <section className="card" aria-label="حدد سيارتك">
      <div className="card-head">
        <div className="card-title">{title || "حدد سيارتك"}</div>
        <button
          className="reset-btn"
          aria-label="إعادة التعيين"
          onClick={reset}
          style={{ visibility: showReset ? "visible" : "hidden" }}
        >
          <IconReset />
        </button>
      </div>

        <div className="sel-locked">
          سيارتك: {["make", "model", "year"].filter((c) => locked.has(c)).map((c) => (c === "make" ? make : c === "model" ? model : 2000 + year)).join(" ")}
        </div>
      )}

      {/* Row 1 — make */}
      {!locked.has("make") && (
      <div className={rowClass("make")}>
        <div className="step-head">
          <span className="step-num">{stepNo("make")}</span>
          <span className="step-label">الشركة</span>

            {makeOrder.map((m) => {

                <button
                  key={m}

                </button>
              );
            })}
          </div>
        </div>
      </div>
      )}

      {/* Row 2 — model */}
      {!locked.has("model") && (
      <div
        className={rowClass("model")}
        onClick={() => { if (modelDisabled) teach("make"); }}
      >
        <div className="step-head">
          <span className="step-num">{stepNo("model")}</span>
          <span className="step-label">السيارة</span>
          {model && <span className="step-picked">{model}</span>}
        </div>
        {modelDisabled ? (
          <div className="empty-tap">اختر الشركة أولاً</div>
        ) : (
          <div className="chip-rail-wrap">
            <div className="chip-rail">
              {modelOrder.map((m) => {
                const sel = model === m;
                return (
                  <button
                    key={m}
                    className={"chip " + (sel ? "selected" : "")}
                    onClick={() => pickModel(m)}
                  >
                    {m}
                    {sel && <span className="chip-check"><IconCheck /></span>}
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>
      )}

      {/* Row 3 — year */}
      {!locked.has("year") && (
      <div
        className={rowClass("year")}
        onClick={() => { if (yearDisabled) teach(make ? "model" : "make"); }}
      >
        <div className="step-head">
          <span className="step-num">{stepNo("year")}</span>
          <span className="step-label">الموديل</span>
          {year && <span className="step-picked mono">{2000 + year}</span>}
        </div>
        {yearDisabled ? (
          <div className="empty-tap">اختر السيارة أولاً</div>
        ) : (
          <div className="year-grid">
            {YEARS.map((y) => {
              const sel = year === y;
              const full = 2000 + y;
              return (
                <button
                  key={y}
                  className={"chip year " + (sel ? "selected" : "")}
                  aria-label={`سنة ${full}`}
                  onClick={() => pickYear(y)}
                >
                  {full}
                  {sel && <span className="chip-check"><IconCheck /></span>}
                </button>
              );
            })}
          </div>
        )}
      </div>
      )}

      {/* Confirm */}
      <div className="confirm-bar">
        <div className="summary" style={{ visibility: ready ? "visible" : "hidden" }} aria-hidden={!ready}>
          <span className="summary-dot" />
          <span>{ready ? <>{carName(make, model)} <b className="mono">{2000 + year}</b></> : " "}</span>
        </div>
        <button
          className="cta"
          onClick={() => {
            // Always-active CTA. If the user hasn't filled all 3 fields,
            // tap pulses the first unfilled field's border (black fade
            // in/out) so they see exactly what's missing — no greyed-out
            // dead-end button. Active button = energetic first impression;
            // missing-field hint covers the UX risk.
            if (!make) return teach("make");
            if (!model) return teach("model");
            if (!year) return teach("year");
            // Compose the full car name and hand off to onAddCar, which
            // dedups against the persisted garage, activates the car
            // (mutating CURRENT_CAR + setting selectedCarIndex), and
            // saves the new state to localStorage so the car shows up
            // in the drawer's "سياراتي" list on next visit. Year stays
            // in the name (rational since fitment can differ year to
            // year), but the image resolver ignores it.
            const fullName = `${carName(make, model)} ${2000 + year}`;
            if (onAddCar) onAddCar(fullName);
            navigate(dest || "/car");
          }}
        >
          <span>{ctaLabel || "ابدأ التسوق"}</span>
          <IconChevron />
        </button>
      </div>

      {/* Saved cars */}
      {!hideSaved && (
      <div className="saved-bar">
        <span className="saved-label">سيارات محفوظة:</span>
        <button className="saved-pill" onClick={() => setAll("تويوتا", "لاندكروزر", 22)}>

        </button>
        <button className="saved-pill" onClick={() => setAll("تويوتا", "كامري", 19)}>
          كامري <span className="yr">2019</span>
        </button>
      </div>
      )}
    </section>
  );
}

/* ---------- Hash router ---------- */
/* Route shape: { path, params } where params is a URLSearchParams. The hash can
   carry a query string after a "?", e.g. "#/search?q=brake" → { path: "/search",
   params: URLSearchParams({ q: "brake" }) }. Code reading the route should use
   route.path and route.params explicitly. */
function useHashRoute() {
  const read = () => {
    const raw = window.location.hash.replace(/^#/, "") || "/";
    const qi = raw.indexOf("?");
    const path = qi >= 0 ? raw.slice(0, qi) : raw;
    const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : "");
    return { path: path || "/", params };
  };
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const onHash = () => setRoute(read());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}
/* Per-route scroll cache + forward/back nav flag.
   - SCROLL_CACHE: scrollY per route, updated continuously by a scroll listener
     so the latest position is always saved.
   - _isForwardNav: set by navigate() before each hash change. Tells the
     restore effect "this is a fresh forward navigation — go to top, ignore
     cache." Backward nav (history.back / browser back / swipe-back) bypasses
     navigate(), so the flag stays false → restore from cache.
   This is what gives the intuitive behaviour: tapping a link to "open" a
   screen always starts at top; pressing back/chevron returns to where you were. */
const SCROLL_CACHE = new Map();
/* FILTER_CACHE: per-Discover-route filter + sort state. Same model as
   SCROLL_CACHE — keyed by route path, restored on back nav (PDP → back to
   Discover keeps the applied filters), ignored on fresh forward navs
   (which seed from URL + defaults so a new cat-page entry starts clean). */
const FILTER_CACHE = new Map();
let _isForwardNav = false;
/* Set when the user activates a car (home selector / garage pick). AnchoredHome
   consumes it on mount to force entry at the very top with the cluster expanded,
   regardless of the scroll-restore path — selecting a car must never drop the
   user into a collapsed home-anchored view that hides the trust signals. */
let _enterCarAtTop = false;
/* True when the route is a sheet-style overlay rendered on top of the
   previous screen. #/search splits: bare #/search is the suggestions overlay
   (modal); #/search?q=... is the full Discover-in-search-mode page (not
   modal). */
const isModalRoute = (route) =>
  route.path === "/locate" ||
  (route.path === "/search" && !route.params.get("q"));

const currentHashPath = () => {
  const raw = (window.location.hash || "").replace(/^#/, "") || "/";
  const qi = raw.indexOf("?");
  return qi >= 0 ? raw.slice(0, qi) : raw;
};

/* Like currentHashPath but includes the query string. Used as FILTER_CACHE
   key so /search?q=brake and /search?q=fender don't collide. */
const currentHashKey = () => (window.location.hash || "").replace(/^#/, "") || "/";

const navigate = (path) => {
  const curr = currentHashPath();
  if (curr && document.body.dataset.scrollY == null) {
    SCROLL_CACHE.set(curr, window.scrollY);
  }
  // Only flag as forward when the hash will actually change — otherwise a
  // navigate-to-same-route would leave _isForwardNav set, hijacking the
  // next legitimate hashchange (which might be a browser back).
  if (curr !== path) _isForwardNav = true;
  window.location.hash = path;
};

/* Like navigate() but replaces the current history entry instead of pushing
   a new one. Used by commit-from-overlay so back from Discover skips the
   overlay and returns to whatever the user was on before tapping search
   (per the explicit no-loop rule: Discover ↛ overlay on back). */
const navigateReplace = (path) => {
  const curr = currentHashPath();
  if (curr && document.body.dataset.scrollY == null) {
    SCROLL_CACHE.set(curr, window.scrollY);
  }
  if (curr !== path) _isForwardNav = true;
  window.history.replaceState(null, "", "#" + path);
  window.dispatchEvent(new Event("hashchange"));
  // Always fire a synthetic nav-pulse too. The classic case it catches:
  // a recognized search that lands on the cat URL the user is already on
  // (overlay was over /spare-parts/brakes → commit "فرامل" → recognized to
  // brakes → navigateReplace targets the SAME path). hashchange + same
  // urlParams.toString() means any useEffect keyed on that dep won't fire,
  // so search-commit flags would never get consumed. Deferred to next
  // tick so the pulse arrives after React has finished re-rendering and
  // listeners have re-bound with fresh urlParams closures.
  setTimeout(() => window.dispatchEvent(new Event("speero:nav-pulse")), 0);
};

function PositionGlyph({ pos }) {
  // Naming convention:
  //   FR / FL / BR / BL — single CORNER (one dot)
  //   FP / BP            — PAIR set, both ends of one edge (two dots)
  //   F / B / L / R      — entire SIDE of the car FILLED red
  // The car is a top-down silhouette: top of svg = front, bottom = back.
  // F fills the front portion (hood/engine bay), B fills the back, L/R
  // fill the entire half. Engine parts and bumpers can both legitimately
  // use F since they're both "in the front of the car."
  const dots = (
    pos === "FR" ? ["fr"] :
    pos === "FL" ? ["fl"] :
    pos === "BR" ? ["br"] :
    pos === "BL" ? ["bl"] :
    pos === "FP" ? ["fr", "fl"] :
    pos === "BP" ? ["br", "bl"] :
    []
  );
  const fill = (
    pos === "F" ? "front" :
    pos === "B" ? "back"  :
    pos === "L" ? "left"  :
    pos === "R" ? "right" :
    null
  );
  return (
    <svg viewBox="0 0 22 28" width="22" height="28" fill="none">
      {/* Fill paths — drawn first so the outline + windows sit on top.
          Paths trace the rounded body so the fill respects the corner
          curves of the rect. */}

      {fill === "right" && <path d="M11 3 L13.5 3 Q17 3 17 6.5 L17 21.5 Q17 25 13.5 25 L11 25 Z" fill="var(--red)" />}

      <rect x="5" y="3" width="12" height="22" rx="3.5" stroke="var(--text)" strokeWidth="1.4" />

/* PDP position badge with tap-reveal — wraps PositionGlyph and reveals the
   Arabic position name on tap (slide-out, name extends inline-start of the
   icon while the icon stays pinned at its inline-end anchor). Reveal
   pattern picked from /pos-glyph-demo variant 1, reversed direction.
   Behavior:
   - Tap → name slides out (max-width 0→140px + opacity 0→1)
   - Tap again → name slides back
   - aria-expanded so screen readers announce the state
   - aria-label always carries the resolved Arabic name so SR users get the
     info even if they don't trigger the expand. */
function PdpPosBadgeReveal({ pos }) {
  const [open, setOpen] = useState(false);
  if (!pos) return null;
  const label = POSITION_LABELS[pos] || "";
  return (
    <button
      type="button"
      className={"pdp-pos-badge" + (open ? " is-open" : "")}
      onClick={() => setOpen((o) => !o)}
      aria-expanded={open}
      aria-label={label}
    >
      <PositionGlyph pos={pos} />
      <span className="pdp-pos-badge-name">
        <span className="pdp-pos-badge-eyebrow">الجهة</span>
        <span className="pdp-pos-badge-text">{label}</span>
      </span>
    </button>
  );
}

/* Delivery promise badges — Speero Express ("خلال 3 ساعات") for the ~35% of
   products that ship express, vs a quieter standard label ("خلال 2-4
   أيام") for the rest. Two variants per state ("card" / "pdp") so the same
   semantic component scales between the product-card and the PDP price
   block without ad-hoc tweaks at the call site. */
function DeliveryBadge({ p, variant = "card" }) {
  const express = isTwoDay(p);
  const cls = "deliv-tag " + (express ? "deliv-express" : "deliv-standard") + " deliv-" + variant;
  if (express) {

      <span className={cls}>

    <span className={cls}>

/* City picker for the PDP delivery estimate — the buyer sets which city the
   "خلال 2-4 أيام" estimate is for. Search on top, a "detect my location" option,
   then the filterable city list. Reuses the app BottomSheet. */
function PdpCitySheet({ open, city, onSelect, onClose }) {
  const [q, setQ] = useState("");
  // Clear the query whenever the sheet closes, so it reopens fresh.
  useEffect(() => { if (!open) setQ(""); }, [open]);
  const query = q.trim();
  const list = query ? CITIES.filter((c) => c.includes(query)) : CITIES;
  const pick = (c) => { onSelect(c); onClose(); };
  return (
    <BottomSheet open={open} onClose={onClose} title="اختر مدينة التوصيل">
      <div className="pdp-city-search">
        <IconSearch />
        <input
          type="text"
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="ابحث عن مدينة"
        />
      </div>
      {/* Detect-my-location — prototype stand-in resolves to the default city. */}
      <button type="button" className="pdp-city-locate" onClick={() => pick("الرياض")}>
        <IconLocate />
        <span>حدد موقعي</span>
      </button>
      <div className="pdp-city-list">
        {list.length === 0 ? (
          <div className="pdp-city-empty">لا توجد نتائج</div>
        ) : list.map((c) => (
          <button key={c} type="button"
            className={"pdp-city-item" + (city === c ? " is-active" : "")}
            onClick={() => pick(c)}>
            <span>{c}</span>
            {city === c && <IconCheck />}
          </button>
        ))}
      </div>
    </BottomSheet>
  );
}

/* ---------- express delivery promise ----------
   A Speero-branded "خلال 3 ساعات" badge surfaces on ~15% of the catalog as a
   delivery commitment to the buyer. Distribution is deterministic via a key
   hash so the same products always carry the badge across reloads / filters.
   An explicit `express: true` on a product short-circuits the hash so we can
   force-on a demo-anchor part (e.g. bumperR) without touching the hash logic
   or affecting the broader distribution.
   PRODUCTION: replace isTwoDay() with a server-driven fulfillment flag on
   the Stock Part (offer-level) — the 15% number should come from real
   warehouse capability data, not a hash. This is a customer-facing PROMISE,
   not just a visual flourish. */
function isTwoDay(p) {
  if (!p) return false;
  if (p.express === true) return true;
  const id = p.key || p.title || "";
  let h = 0;
  for (let i = 0; i < id.length; i++) {
    h = (h * 31 + id.charCodeAt(i)) >>> 0;
  }
  return (h % 100) < 15;
}

/* Resolve any part key (PRODUCTS, CATALOG "tp*", or LOC "loc-*") into a uniform
   shape the PDP can render. Missing fields are filled deterministically from the
   key so reloads stay stable. */
function findProduct(key) {
  if (!key) return null;
  if (PRODUCTS[key]) return { key, ...PRODUCTS[key] };
  // Car-services coupons (app-services.jsx) resolve to a cart line so a services
  // add-to-cart renders + counts like a part.
  if (typeof window !== "undefined" && window.CL && window.CL.svcOffer) {
    const svc = window.CL.svcOffer(key);
    if (svc) return svc;
  }
  if (key.startsWith("loc-")) {
    const partId = key.slice(4);
    for (const zid of LOC_ZONE_ORDER) {
      const p = LOC_ZONES[zid].parts.find((x) => x.id === partId);
      if (p) return { key, title: p.name, kind: partKind(p.name), inStock: p.stock > 0, category: p.category };
    }
  }
  // Synthesized competing-offer alt — PdpAlternatives + the cart upsell both
  // generate a "<base>_alt2" key for any OEM part (PRODUCTS or CATALOG).
  // Lets us fire the alt-suggest on browse-derived (tp*) items without
  // hand-maintaining ~200 pairs in the data. Source-of-base falls through:
  // PRODUCTS first, then CATALOG. oemKey on the synth points back to the
  // base so the cart can offer the round-trip revert.
  if (key.endsWith("_alt2")) {
    const baseKey = key.slice(0, -5);
    const base = PRODUCTS[baseKey] || CATALOG.find((c) => c.key === baseKey);
    if (base && base.cat === "part" && base.make !== "alt") {
      return {
        key,
        kind: base.kind,
        cat: "part",
        title: base.title,
        make: "alt",
        origin: "صيني",
        price: fmtPrice(Math.round(priceNum(base.price) * 0.62)),
        oemKey: baseKey,
      };
    }
  }
  const cat = CATALOG.find((c) => c.key === key);
  if (cat) return { ...cat };
  return null;
}

/* Position-mate fallback — for catalog (tp*) items that don't carry a
   curated `companionsExtra`, derive their side-pair mate by scanning the
   catalog for a same-kind, opposite-side sibling. Covers FR↔FL and BR↔BL
   pairs like مساعد أمامي يمين ↔ مساعد أمامي يسار. Curated products with
   their own companionsExtra take precedence (enrichProduct only falls back
   here when companionsExtra is unset). */
function findPositionMate(p) {
  if (!p || !p.pos || !p.kind) return null;
  const mateMap = { FR: "FL", FL: "FR", BR: "BL", BL: "BR" };
  const matePos = mateMap[p.pos];
  if (!matePos) return null;
  const mate = CATALOG.find((c) =>
    c.kind === p.kind &&
    c.pos === matePos &&
    c.key !== p.key &&
    c.cat === "part"
  );
  return mate ? mate.key : null;
}

/* Marketplace sellers. Vendor is an offer-level (stock-part) attribute in
   production (CATALOG_MODEL §1) but isn't modeled in the prototype yet, so we
   assign one deterministically per part (by key seed) to demo the seller card
   on the PDP. Each trust signal (orders, verified) is a VARIABLE that may be
   absent per seller — enrichProduct seeds the best case (both present) for now,
   and the card renders each signal only when it exists (see PdpPrice), so the
   no-data cases already degrade gracefully. Drop the fallback once the real
   feed carries `vendor`. */
const VENDORS = [
  "متجر الخليج لقطع الغيار",
  "مؤسسة السرعة للسيارات",
  "قطع غيار النخبة",
  "مركز الوكيل للقطع",
  "بيت القطع الأصلية",
];

// Seller orders-volume trust buckets (descending). The shown figure is the
// largest tier at or below the real count, rendered "{tier}+" — a deliberate
// tier, not an exact number. Gate is > 10, so 10 is the smallest bucket.
const ORDER_TIERS = [10000, 5000, 2500, 1000, 500, 250, 100, 50, 10];

function enrichProduct(p) {
  if (!p) return null;
  const seed = (p.key || p.title || "").split("").reduce((s, c) => s + c.charCodeAt(0), 0);
  const kindDetails = KIND_DETAILS[p.kind] || KIND_DETAILS._default;
  const fallbackDescription = kindDetails.description
    || ("قطعة " + p.title + " بمواصفات السيارة الأصلية، فحصت في سبيرو قبل الشحن.");
  // The رقم القطعة (OEM number) is prepended as the lead spec when present —
  // anchors the details to *this specific part*. The "when to replace" cue is
  // already carried by the description prose, so the kind specs don't repeat it;
  // they start at العمر التقريبي. Parts with no OEM number (rare catalog/loc-*
  // items) just omit the lead line.
  let baseSpecs = p.specs || kindDetails.specs;
  // Derive effective "extra" mates to prepend to the kind's companions:
  // 1) Curated `companionsExtra` on the product wins (specific intent —
  //    e.g. shockR.companionsExtra = ["bumperL"]).
  // 2) Falls back to a position-derived mate (FR↔FL, BR↔BL) when no
  //    curated extra is set. This covers catalog (tp*) items like the
  //    /p/tp8 ↔ /p/tp9 shock pair that don't have curated fields.
  // Side-pair mates always render FIRST in the rail — see
  // [[speero-companion-side-pair-first]].
  let effectiveExtra = (p.companionsExtra && p.companionsExtra.length > 0)
    ? p.companionsExtra
    : (() => { const m = findPositionMate(p); return m ? [m] : []; })();
  if (effectiveExtra.length > 0) {
    baseSpecs = baseSpecs.map((s) =>
      s.companions
        // Dedupe via Set so a key appearing in both extras AND the kind's
        // companions only renders once (extra wins position via prepend).
        ? { ...s, companions: [...new Set([...effectiveExtra, ...s.companions])] }
        : s
    );
  }
  const finalSpecs = p.oem
    ? [{ label: "رقم القطعة", value: p.oem, mono: true }, ...baseSpecs]
    : [...baseSpecs];
  // الصنع (OEM/aftermarket make) as a spec directly under the part number.
  // Rendered specially in PdpDetails (a MakeTag, plus a "اعرف أكثر" explainer
  // when the make is aftermarket) via the makeTag flag.
  if (p.make) {
    const oemIdx = finalSpecs.findIndex((s) => s && s.label === "رقم القطعة");
    finalSpecs.splice(oemIdx + 1, 0, { label: "الصنع", makeTag: true });
  }
  return {
    ...p,
    inStock: p.inStock !== false,
    stockCount: 6 + (seed % 18),                       // 6–23 in stock
    rating: ((seed % 7) + 38) / 10,                    // 3.8–4.4
    reviewCount: 8 + (seed % 60),                      // 8–67 reviews
    description: p.description || fallbackDescription,
    specs: finalSpecs,
    fitment: p.fitment || STUB_FITMENT,
    reviews: p.reviews || STUB_REVIEWS,
    // Seller (offer-level; mock until the feed carries it). Orders volume is
    // the shown signal, gated to > 10 in PdpSeller (prod rule). The seed varies
    // it so ~1 in 7 parts lands at/below 10 and hides the row (name-only),
    // exercising both states. Verification badge deferred — see doc/PDP.md.
    vendor: p.vendor || {
      name: VENDORS[seed % VENDORS.length],
      orders: (seed % 7 === 0) ? (seed % 11) : (30 + (seed % 140) * 7),
    },
  };
}

  filter: 95, mirror: 640, engine: 850, electrical: 320, bracket: 180,

  part: 380,

/* Order matters: more specific phrases come before broader substrings.
   "مكينة زجاج" (window motor — electrical) must beat "مكينة" (engine);
   "بطانة مكينة" (engine gasket — engine) must beat the broader "بطانة"
   default so fender liners ("بطانة رفرف") don't get bucketed as engine. */
const partKind = (t) =>
  t.includes("فحمات") || t.includes("فرامل") ? "pads" :
  t.includes("فلتر") ? "filter" :
  t.includes("شبك") ? "grille" :
  // Corner/marker lamps and plate light — "اسطب" is Saudi colloquial for
  // a corner/marker light (NOT a mount). Must come BEFORE bumper, fender,
  // and bracket since "اسطب صدام", "اسطب رفرف", "اسطب ركن" all match
  // their broader rules but are actually corner lights.
  t.includes("اسطب") ? "headlight" :
  // Spark plugs — own bucket so they can chip in the maintenance collection.
  // Must come BEFORE electrical (which catches "بواجي"). Wires (اسلاك بواجي)
  // bundled in since they're part of the ignition system.
  t.includes("بواجي") || t.includes("بوجي") ? "sparkplug" :
  // Belts — own bucket so they can chip in maintenance. Must come BEFORE
  // engine (which catches "سير"). Includes tensioners + tensioner pulleys.
  t.includes("سير") || t.includes("شداد سير") ? "belt" :
  // Bracket / mount parts. "عظمة صدام" is the steel reinforcement beam
  // behind the plastic bumper — bracket, not bumper. Same for "جسر صدام",
  // "ركن صدام", "مفصلة" (hinges), "صاجة واجهة" (fascia plate).
  t.includes("عظمة") || t.includes("جسر صدام") || t.includes("مفصلة") ||
  t.includes("ركن صدام") || t.includes("صاجة واجهة") ? "bracket" :
  // Fenders + fender liners + fender mouldings. Must come AFTER اسطب
  // (which catches "اسطب رفرف") and AFTER bracket (none of those include رفرف).
  t.includes("رفرف") ? "fender" :
  t.includes("صدام") ? "bumper" :
  t.includes("مساعد") || t.includes("مقص") || t.includes("عمود توازن") ? "shock" :
  t.includes("شمعة") || t.includes("كشاف") ? "headlight" :
  t.includes("كمبروسر") || t.includes("مكيف") || t.includes("رديتر") || t.includes("ثلاجة") ? "ac" :
  // Ignition coils — own bucket so بواجي + كويلات form one coherent category.
  // Must come BEFORE electrical (which also catches "كويل").
  t.includes("كويل") ? "coil" :
  // electrical — window motors (مكينة زجاج) sit here before the engine "مكينة"
  t.includes("مكينة زجاج") || t.includes("دينمو زجاج") || t.includes("بطارية") ||
  t.includes("حساس") || t.includes("لمبة") || t.includes("اسلاك") ||
  t.includes("سنترلوك") || t.includes("مجموعة اشارة") || t.includes("مجموعة تحكم") ||
  t.includes("زر تحكم") || t.includes("ايرباق") || t.includes("سلف") ||
  t.includes("دينمو") ? "electrical" :
  // engine + transmission — grouped because the home tile is "المحرك والقير"
  t.includes("قير") || t.includes("كلتش") ||
  t.includes("بطانة مكينة") || t.includes("كرسي مكينة") || t.includes("كرتير") ||
  t.includes("بلف") || t.includes("طرمبة") ||
  t.includes("بكرة") || t.includes("جنزير") || t.includes("شنابر") ||
  t.includes("بخاخ") || t.includes("شخال") ||
  t.includes("صرة زيت") || t.includes("مكينة") ? "engine" :
  t.includes("مراية") ? "mirror" :
  // Door panels only — the molding (زيق باب), lock (قفل باب), window motor,
  // and trunk lid (باب شنطة) keep their own kinds, so guard on a leading "باب".
  t.startsWith("باب") && !t.includes("شنطة") ? "door" :
  // Hood panel only — the strut (مساعد كبوت), lock (قفل كبوت), and molding
  // (زيق كبوت) start with other words, so a leading "كبوت" is the panel.
  t.startsWith("كبوت") ? "hood" :
  // Steering: tie rods (ذراع دركسون), worm (دودة دركسون), the horn strip.
  t.includes("دركسون") || t.includes("شريط بوري") ? "steering" :
  // Axle & differential: axles (عكس, note عاكس=reflector does NOT contain عكس),
  // wheel cap (جنط), hub bearing (رمان كفر).
  t.includes("عكس") || t.includes("جنط") || t.includes("رمان كفر") ? "axle" :
  // Wiper blades (accessory).
  t.includes("مساحة") ? "wiper" : "part";

/* Arabic labels for each position code — used by the position filter picker
   in Discover and by any future "explain this glyph" surface. Single source
   of truth so glyph and label stay in sync. */
const POSITION_LABELS = {
  FR: "أمامي يمين",
  FL: "أمامي يسار",
  BR: "خلفي يمين",
  BL: "خلفي يسار",
  FP: "طقم أمامي",
  BP: "طقم خلفي",
  F:  "الأمام",
  B:  "الخلف",
  L:  "الجانب الأيسر",
  R:  "الجانب الأيمن",
};
/* Display order for the picker — corners first (most specific), then pairs,
   then whole-side fills. Keeps the visual vocabulary grouped from precise →
   broad as the user scans down. */
const POSITION_ORDER = ["FR", "FL", "BR", "BL", "FP", "BP", "F", "B", "L", "R"];

/* Derive a position code from the Arabic title via keyword matching.
   Returns one of: FR, FL, BR, BL, FP, BP, F, B, L, R, or null.
   Order of resolution:
   1. POS_OVERRIDES (manual override wins for known edge cases)
   2. Title keywords (direction + side)
   3. Kind-based fallback: parts intrinsically in the engine bay (engine,
      belt, sparkplug) get F when no other position derives — works because
      F now fills the front of the car visually, so it correctly says
      "this part is under the hood." */
const derivePos = (t, kind) => {
  if (t in POS_OVERRIDES) return POS_OVERRIDES[t];
  const hasFront = t.includes("أمامي") || t.includes("امامي") || t.includes("أمامية") || t.includes("امامية");
  const hasBack  = t.includes("خلفي") || t.includes("خلفية");
  const hasRight = t.includes("يمين");
  const hasLeft  = t.includes("يسار");
  const isKit    = t.includes("طقم");
  // Specific corner — direction + side
  if (hasFront && hasRight) return "FR";
  if (hasFront && hasLeft)  return "FL";
  if (hasBack  && hasRight) return "BR";
  if (hasBack  && hasLeft)  return "BL";
  // Pair set — kit + direction (no specific side)
  if (hasFront && isKit) return "FP";
  if (hasBack  && isKit) return "BP";
  // Whole side — direction only
  if (hasFront) return "F";
  if (hasBack)  return "B";
  // Side only — no direction
  if (hasRight) return "R";
  if (hasLeft)  return "L";
  // Kind-based fallback for engine-bay parts
  if (kind === "engine" || kind === "belt" || kind === "sparkplug" || kind === "coil") return "F";
  return null;
};

/* Short umbrella chip label per category, for tight UIs like the Visual Search
   sheet. The long DISCOVER_CATEGORIES label is the page title; this is its chip
   form (an umbrella that reads right for any part in the category, not a
   narrowed first-noun). See doc/Strategy/TAXONOMY_MODEL_WIP.md. */
const CATEGORY_CHIP = {
  "bumpers-grilles": "هيكل",
  "suspension": "تعليق",
  "brakes": "فرامل",
  "ac": "تكييف",
  "lighting": "إضاءة",

  "electrical-battery": "كهرباء",
  "steering": "دركسون",
  "axle-diff": "عكوس",
  "accessories": "اكسسوارات",
};
/* kind -> category id, derived from DISCOVER_CATEGORIES so VS speaks the same
   taxonomy as Discover/search (one taxonomy, not the old VS bucket). */
const KIND_TO_CATEGORY = (() => {
  const m = {};
  for (const c of DISCOVER_CATEGORIES) for (const k of c.kinds) m[k] = c.id;
  return m;
})();
/* The VS sheet chip for a loc part: its category's umbrella label, derived from
   the part's kind. "أخرى" for parts not yet categorized (the deferred strays). */
const partChipLabel = (p) => {
  const cid = KIND_TO_CATEGORY[partKind(p.name)];
  return cid ? CATEGORY_CHIP[cid] : "أخرى";
};

/* Position-aware ordering for the VS sheet. A pulse encodes a position (the
   tapped part's pos), so after the lead row the rest of the list is ranked by
   how well each part's position matches where you tapped: same front/rear AND
   side first, then a shared axis, then the rest. Within a tier, sales order
   (the array order) is preserved. This is what keeps a rear bumper from sitting
   under a front-left tap. See doc/VISUAL_SEARCH.md §6. */
const locPos = (p) => derivePos(p.name, partKind(p.name));
const posAxes = (code) => ({
  fb: code && code.includes("F") ? "F" : code && code.includes("B") ? "B" : null,
  lr: code && code.includes("L") ? "L" : code && code.includes("R") ? "R" : null,
});
const posMatchScore = (partCode, tappedCode) => {
  if (!tappedCode) return 0;
  const a = posAxes(partCode), b = posAxes(tappedCode);
  return (a.fb && a.fb === b.fb ? 2 : 0) + (a.lr && a.lr === b.lr ? 1 : 0);
};

/* Arabic text normalizer — strips diacritics and unifies common letter
   variants (alef/yaa/taa-marbouta) so user input matches our keyword tables.
   Prod: server-side, baked into Typesense's Arabic analyzer. */
const normalizeArabic = (s) => (s || "")
  .toString()
  .replace(/[ً-ْٰ]/g, "")
  .replace(/[أإآ]/g, "ا")
  .replace(/ى/g, "ي")
  .replace(/ة/g, "ه")
  .toLowerCase()
  .trim();

const SEARCH_TERM_TO_CATEGORY_NORMALIZED = Object.fromEntries(
  Object.entries(SEARCH_TERM_TO_CATEGORY).map(([k, v]) => [normalizeArabic(k), v])
);

/* Term-level recognizer map — derived from DISCOVER_CATEGORIES.terms so
   the labels stay in sync with the actual term-rail vocabulary. Key is
   the normalized label, value is { cat, term } so the commit can route
   directly to /spare-parts/{cat}?term={termId} instead of stopping at
   the cat level. This is what lets "فحمات أمامية" land the user on the
   front-pads term-chip already active in the picker — same destination
   the user would get to by tapping the chip manually, just preempted. */
const SEARCH_TERM_TO_CATEGORY_TERM = (() => {
  const out = {};
  DISCOVER_CATEGORIES.forEach((c) => {
    (c.terms || []).forEach((t) => {
      out[normalizeArabic(t.label)] = { cat: c.id, term: t.id };
    });
  });
  return out;
})();

/* Recognizes a query at the most specific level possible:
   - Exact term-label match → { cat, term } so the commit auto-selects
     that term-chip on the destination page
   - Exact cat-keyword match → category id string
   - Multi-word query (e.g. "طقم فحمات أمامية") → tries term-level on the
     full string, then cat-level on the full string, then either level on
     each token (term first since it's more specific)
   - Else → null (free-text)
   Returning a string vs an object lets commit() do a cheap typeof check
   to decide the URL shape. */
const recognizeTermAsCategory = (q) => {
  const norm = normalizeArabic(q);
  if (!norm) return null;
  // Whole-string matches first — term wins over cat (more specific).
  if (SEARCH_TERM_TO_CATEGORY_TERM[norm]) return SEARCH_TERM_TO_CATEGORY_TERM[norm];
  if (SEARCH_TERM_TO_CATEGORY_NORMALIZED[norm]) return SEARCH_TERM_TO_CATEGORY_NORMALIZED[norm];
  // Token-level: try term-label-on-substring (any 2-word window of the query
  // matching a term label like "فحمات أمامية" inside "طقم فحمات أمامية").
  const tokens = norm.split(/\s+/).filter(Boolean);
  for (let i = 0; i < tokens.length; i++) {
    for (let j = i + 2; j <= tokens.length; j++) {
      const window = tokens.slice(i, j).join(" ");
      if (SEARCH_TERM_TO_CATEGORY_TERM[window]) return SEARCH_TERM_TO_CATEGORY_TERM[window];
    }
  }
  // Single-token fallbacks — term first, then cat.
  for (const t of tokens) {
    if (SEARCH_TERM_TO_CATEGORY_TERM[t]) return SEARCH_TERM_TO_CATEGORY_TERM[t];
  }
  for (const t of tokens) {
    if (SEARCH_TERM_TO_CATEGORY_NORMALIZED[t]) return SEARCH_TERM_TO_CATEGORY_NORMALIZED[t];
  }
  return null;
};

/* Shape a 3D-zone part (rank/name/price/category/stock) into the CATALOG-row shape.
   Uses the same rank-as-seed heuristics CATALOG does so the rendered rows carry
   the same enriched fields the search results have — OEM/alt make tag, optional
   origin chip, and an occasional strike-through old price + discount badge. */
/* Title → canonical catalog key map, built once at module load. PRODUCTS
   keys win over CATALOG keys when both exist for the same title, because
   PRODUCTS entries are the curated Core Parts (OEM number, fitment, full
   metadata). CATALOG fallback covers the long tail of auto-gen `tp*`
   items where no curated Core Part exists. This map powers locate-screen
   add-to-cart so adding from /locate syncs with cat-page PDPs and rails
   for the same product. */
const TITLE_TO_CANONICAL_KEY = (() => {
  const map = new Map();
  for (const [key, p] of Object.entries(PRODUCTS)) {
    if (p && p.title && !map.has(p.title)) map.set(p.title, key);
  }
  for (const c of CATALOG) {
    if (c && c.title && !map.has(c.title)) map.set(c.title, c.key);
  }
  return map;
})();

/* Resolve a locate-screen part to the canonical catalog key for cart
   addition. Falls back to "loc-${id}" if no catalog twin exists, which
   keeps findProduct()'s loc-branch working for 3D-only parts. */
const resolveLocPartKey = (p) => TITLE_TO_CANONICAL_KEY.get(p.name) || ("loc-" + p.id);

/* VS rows reference the ONE canonical part, never a VS-local copy. The part
   title resolves to its catalog/PRODUCTS key (resolveLocPartKey), and
   findProduct returns the uniform row, so price, oem, make, origin, and stock
   are identical to what the category, the PDP, and the cart show. VS no longer
   carries its own price (that duplication is gone). Every VS part has a twin
   today; the fallback is a thin safety net only. */
const locPartToRow = (p) => {
  const canonical = findProduct(resolveLocPartKey(p));
  if (canonical) return canonical;
  return { key: "loc-" + p.id, title: p.name, kind: partKind(p.name), inStock: p.stock > 0 };
};

/* Car-image resolver. Maps an Arabic car name (any year) to a known
   image in assets/. Year is intentionally ignored — we match by
   make+model only since the image set doesn't cover every year. When
   nothing matches, falls back to "car no cover.jpg" so cars still
   render with a placeholder rather than a broken image. The map is
   ordered by specificity: longer / more distinctive substrings before
   shorter ones to avoid greedy matches. */
const CAR_NO_COVER = "assets/car cover silver.jpg";
const CAR_IMAGE_MAP = [
  { match: /لاندكروزر|لاند\s*كروزر/, image: "assets/landcruiser.jpg" },
  { match: /تشالنجر/, image: "assets/dodge-challenger-2020.jpg" },
  { match: /سيراتو/, image: "assets/kia cerato 2014.jpg" },
  { match: /إلنترا|النترا/, image: "assets/elantra 2020.jpg" },
  { match: /سوناتا/, image: "assets/sonata 2020.jpg" },
  { match: /أزيرا|ازيرا/, image: "assets/hyundai azera 2018.png" },
  { match: /كورولا|كورلا|كورللا/, image: "assets/corella 2020.png" },
  { match: /توجيلا/, image: "assets/geely tugella 2023.png" },
  { match: /كامري/, image: "assets/camry-2020.jpg" },
  { match: /يارس|يارص/, image: "assets/yaris2020.jpg" },
  { match: /مازدا\s*6(?!\d)/, image: "assets/mazda6.jpeg" },
];
function resolveCarImage(name) {
  if (!name) return CAR_NO_COVER;
  for (const entry of CAR_IMAGE_MAP) {
    if (entry.match.test(name)) return entry.image;
  }
  return CAR_NO_COVER;
}

/* The user's saved cars (the garage shown in the menu). The active car
   is tracked via App-level state (selectedCarIndex), not on this list,
   so switching mutates CURRENT_CAR fields + reorders the drawer
   rendering without touching the source data. Image is resolved at
   render time via resolveCarImage(name) so adding a new car requires
   just a name — no per-entry image wiring.
   This is the seed list; the live garage is App-level state
   (loadGarage/saveGarage) so cars added via the home selector persist
   across reloads. DEFAULT_GARAGE_SEED[0] must match CURRENT_CAR's
   initial values so the menu's selected-car highlight and the rest
   of the app stay aligned on first paint when no persisted garage
   exists yet. */
const DEFAULT_GARAGE_SEED = [
  { name: "تويوتا لاندكروزر 2022" },
  { name: "تويوتا كامري 2020" },
];

/* Garage + selected-car persistence. Saved cars survive reloads so the
   home-selector flow ("pick make/model/year + ابدأ التسوق") feels like
   actual cart-of-cars management rather than ephemeral state. Wrapped
   in try/catch since localStorage can throw on Safari private mode or
   when storage is full. */
const STORAGE_KEY_GARAGE = "speero_garage_v1";
const STORAGE_KEY_SELECTED = "speero_selected_car_v1";
/* Cap garage size so it doesn't grow ugly across many sessions of picking
   different cars. Most people own 1 to 2 cars; 4 still covers the family
   case while keeping the drawer trim. When a 5th car is picked the oldest
   non-selected entry is evicted, the active car is preserved. */
const GARAGE_CAP = 4;
function loadGarage() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_GARAGE));
    if (!Array.isArray(saved) || !saved.length || !saved.every((c) => c && typeof c.name === "string")) {
      return DEFAULT_GARAGE_SEED.slice();
    }
    if (saved.length <= GARAGE_CAP) return saved;
    // Cap exceeded (existing tester with a long stale garage). Silently trim
    // to the most-recent GARAGE_CAP cars; preserve the currently-selected
    // car by keeping it in the trimmed set and rewriting its stored index.
    const selRaw = localStorage.getItem(STORAGE_KEY_SELECTED);
    const sel = parseInt(selRaw, 10);
    const selCar = (Number.isInteger(sel) && sel >= 0 && sel < saved.length) ? saved[sel] : null;
    let trimmed = saved.slice(-GARAGE_CAP);
    if (selCar && !trimmed.some((c) => c.name === selCar.name)) {
      // Selected would be dropped; shift it in by replacing the oldest tail entry.
      trimmed = [selCar, ...trimmed.slice(1)];
    }
    try { localStorage.setItem(STORAGE_KEY_GARAGE, JSON.stringify(trimmed)); } catch (e) {}
    if (selCar) {
      const newSel = Math.max(0, trimmed.findIndex((c) => c.name === selCar.name));
      try { localStorage.setItem(STORAGE_KEY_SELECTED, String(newSel)); } catch (e) {}
    }
    return trimmed;
  } catch (e) {}
  return DEFAULT_GARAGE_SEED.slice();
}
function saveGarage(g) {
  try { localStorage.setItem(STORAGE_KEY_GARAGE, JSON.stringify(g)); } catch (e) {}
}
function loadSelectedIndex(garage) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_SELECTED);
    const i = parseInt(raw, 10);
    if (Number.isInteger(i) && i >= 0 && i < garage.length) return i;
  } catch (e) {}
  return 0;
}
function saveSelectedIndex(i) {
  try { localStorage.setItem(STORAGE_KEY_SELECTED, String(i)); } catch (e) {}
}

/* Cart persistence. The buyer's cart survives reloads (localStorage) so a
   refresh or a return visit never drops what they added. The first-ever open
   is empty (nothing saved yet); it fills only once they add something. Same
   try/catch guard as the garage (Safari private mode or full storage throws).
   What we DON'T persist: the transient `pending` flag (the mid-delete undo
   state) is dropped, so a line that was awaiting an undo comes back as a
   normal active line, a refresh is not a delete-confirm. Stale keys that no
   longer resolve to a product are filtered out so a catalog change between
   sessions can't rehydrate a broken cart line. `switchedFromOem` (the
   OEM-revert offer flag) is kept since it's real per-line state. */
const STORAGE_KEY_CART = "speero_cart_v1";
function slimCartItem(it) {
  return it.switchedFromOem ? { key: it.key, qty: it.qty, switchedFromOem: true } : { key: it.key, qty: it.qty };
}
function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_CART));
    if (!Array.isArray(saved)) return [];
    return saved
      .filter((it) => it && typeof it.key === "string" && typeof it.qty === "number" && it.qty > 0 && findProduct(it.key))
      .map(slimCartItem);
  } catch (e) {}
  return [];
}
function saveCart(c) {
  try {
    localStorage.setItem(STORAGE_KEY_CART, JSON.stringify(c.filter((it) => it.qty > 0).map(slimCartItem)));
  } catch (e) {}
}

function AnchoredHome({ onMenu, onCart, cartCount, onSearch }) {
  // Fade in the cluster's shadow once it pins (header has scrolled away).
  // Initialize from the SCROLL_CACHE so a back-nav that's about to restore
  // mid-page renders the cluster in its stuck state on FIRST paint — without
  // this, paint 1 is un-stuck (full height), paint 2 is stuck (after the IO
  // fires), and the layout shift between them is visible as a bounce. Skip
  // when _isForwardNav is set (fresh nav lands at top → not stuck).
  const [stuck, setStuck] = useState(() => !_isForwardNav && (SCROLL_CACHE.get("/car") || 0) > 0);
  // Brief skeleton on a FRESH entry so the personalized rails read as
  // "fetched for your car", same as Discover. Triggers on a forward nav
  // (_isForwardNav) AND on a car change (_enterCarAtTop) — switching cars
  // counts as a refreshed page even though the route stays /car. A back-nav
  // restore hits neither, so content swaps in instantly with scroll intact.
  const [loading, setLoading] = useState(() => _isForwardNav || _enterCarAtTop);
  useEffect(() => {
    if (!loading) return;
    const t = setTimeout(() => setLoading(false), 360);
    return () => clearTimeout(t);
  }, []);
  const sentinelRef = useRef(null);
  const [copied, setCopied] = useState(false);
  const copyPromo = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText("SPEERO26").catch(() => {});
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  const stuckLockedUntilRef = useRef(0);
  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => {
      // Skip updates while body is locked (modal route active). The
      // position:fixed body layout in Chromium can fire spurious
      // intersection events that flip the stuck state and crossfade
      // the car-bar icons — preserve the last meaningful state instead.
      if (document.body.dataset.scrollY != null) return;
      // Skip during rubber-band overscroll (iOS Safari).
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (y < 0 || y > max) return;
      // Hysteresis: lock stuck for 400ms after any flip. Heavy overscroll
      // can still trip the sentinel a few times past the guard above;
      // the lock collapses those into a single transition so the car-bar
      // icons don't flicker.
      const now = performance.now();
      if (now < stuckLockedUntilRef.current) return;
      const next = !e.isIntersecting;
      setStuck((prev) => {
        if (prev === next) return prev;
        stuckLockedUntilRef.current = now + 400;
        return next;
      });
    }, { threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  // Car just activated → force entry at the top with the cluster expanded,
  // overriding whatever the scroll-restore path did. Runs immediately and on
  // the next frame (after layout) so a late restore can't leave us scrolled
  // down / collapsed. setStuck(false) bypasses the IO hysteresis directly.
  useEffect(() => {
    if (!_enterCarAtTop) return;
    _enterCarAtTop = false;
    const toTop = () => { window.scrollTo(0, 0); setStuck(false); };
    toTop();
    const raf = requestAnimationFrame(toTop);
    return () => cancelAnimationFrame(raf);
  }, []);

  // Visual-search card: roll the wheel each time the card scrolls into view as
  // a "tap me" cue. Toggling on isIntersecting resets the one-shot animation
  // when it leaves, so it replays on the next entry (not just the first).
  const peekRef = useRef(null);
  const [peekRolling, setPeekRolling] = useState(false);
  useEffect(() => {
    const el = peekRef.current;
    if (!el || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => setPeekRolling(e.isIntersecting), { threshold: 0.6 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  // Services fold-in: the home stacks parts then services with a pinned
  // parts/services toggle that doubles as a scroll-spy. Content comes from the
  // services feature (window.CL.ServicesHomeSection); parts-only if it's absent.
  const ServicesHomeSection = (window.CL && window.CL.ServicesHomeSection) || null;
  const [activeVertical, setActiveVertical] = useState("parts");
  const chromeRef = useRef(null);
  const servicesRef = useRef(null);
  const spyLock = useRef(false);
  const spyTimer = useRef(null);
  // Flip the toggle to "services" once that section clears the pinned chrome.
  useEffect(() => {
    const el = servicesRef.current;
    if (!el || !("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(([e]) => {
      if (spyLock.current) return;
      setActiveVertical(e.isIntersecting ? "services" : "parts");
    }, { rootMargin: "-150px 0px -55% 0px", threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, [ServicesHomeSection]);
  useEffect(() => () => clearTimeout(spyTimer.current), []);
  // Tap-scroll to a section; freeze the spy while it animates so it doesn't
  // fight the programmatic scroll. Offset by the live chrome height so the

      window.scrollTo({ top: Math.max(0, absTop - chromeH - STACK_GAP), behavior: "smooth" });

  // keyed so each card can open its PDP (#/p/{key})

  return (
    <>
      <div ref={sentinelRef} aria-hidden="true" style={{ height: 1 }} />

/* Suggestion pool for live "did you mean" chips (in production this comes from Typesense). */
const SEARCH_SUGGESTIONS = Array.from(new Set([
  ...POPULAR_SEARCHES,
  ...CATALOG.map((p) => p.title),
]));

/* Typeahead candidate pool — curated standardised keywords + category term
   labels + a hand-picked extension using catalog vocabulary (singular
   Arabic forms that hit `title.includes` against real product titles).
   Excludes raw product titles (too specific, too long for a typeahead row).
   Production source: a Typesense suggestion endpoint with the same ranking
   semantics; this stitched pool is the prototype stand-in. */
const SEARCH_KEYWORDS = Array.from(new Set([
  ...POPULAR_SEARCHES,
  ...DISCOVER_CATEGORIES.flatMap((c) => (c.terms || []).map((t) => t.label)),
  // Catalog-vocab keywords — short forms that match real titles via
  // includes(). Ordered roughly by likely user intent.
  "حساس", "لمبة", "كشاف", "ثلاجة", "طرمبة",
  "مقص", "ذراع", "جلبة", "ركبة", "بكرة",
  "سير", "شداد", "كلتش", "بلف", "زيت",
  "ماء", "زجاج", "مراية", "مساحة", "سلف",
  "دينمو", "قير", "كرسي مكينة", "كرسي قير", "كرسي مساعد",
  "بطانة مكينة", "صدام أمامي", "صدام خلفي", "شبك أمامي", "مساعد أمامي",
  "مساعد خلفي", "فلتر هواء", "فلتر زيت", "فلتر مكيف", "فلتر قير",
  "كشاف ضباب", "اسطب ركن", "رديتر ماء", "كمبروسر مكيف", "طقم بواجي",
  "حساس فرامل", "حساس مكينة", "حساس زيت", "عمود توازن",
]));

/* label → match-fn for the category terms — DISCOVER_CATEGORIES.terms each
   carry a `match(p)` predicate that handles plural / variant forms ("صدامات
   أمامية" matches "صدام أمامي"). When the typeahead asks for a count, we
   look up the matcher here; falling back to title.includes for keywords
   that don't have one. */
const TERM_MATCH_FN = {};
DISCOVER_CATEGORIES.forEach((c) => {
  (c.terms || []).forEach((t) => {
    TERM_MATCH_FN[t.label] = t.match;
  });
});

/* ============================================================================
   Unified Discovery Screen
   ============================================================================
   One component, two presentations:
   - "modal": opened from a search-bar tap; slides up over the previous screen,
              has a cancel chip inside the search-bar pill, exits via history.back
   - "page":  a routed entry (brand/category/year-combo, or deep-linked search);
              no slide animation, no cancel chip, browser back handles exit

   Body is identical in both: input + recent/popular chips OR results (rows/grid).

   State that should survive a tap-to-PDP-then-back round trip lives in
   DISCOVERY_CACHE (module-level). The typed q is also synced to the URL via
   replaceState so deep-links + browser-restored URLs keep the typed value
   without spamming history entries per keystroke.
   ============================================================================ */
const DISCOVERY_CACHE = {
  term: "",
  activeChip: "",
  filter: "all",
  viewMode: "row",
  suggestionsHidden: false,
  scrollY: 0,
};

function DiscoveryScreen({ presentation, isOpen, initialQuery = "", onClose, onOpen3D, inputRef: inputRefProp }) {
  const [q, setQ] = useState(initialQuery);
  const [filter, setFilter] = useState(DISCOVERY_CACHE.filter);
  const [loading, setLoading] = useState(false);
  // `term` is the user-known name they entered via a popular-search chip (e.g. "صدام") —
  // a short keyword they recognise the part by. While set, the chip row acts as facets
  // of that term, and `activeChip` (one of those siblings) further narrows the results.
  // Typing in the input or clearing exits term mode.
  const [term, setTerm] = useState(DISCOVERY_CACHE.term);
  const [activeChip, setActiveChip] = useState(DISCOVERY_CACHE.activeChip);
  // In typing mode, once the user taps a suggestion the chip row hides — the tapped term
  // is treated as the "exact" thing they meant. Typing again or clearing brings chips back.
  const [suggestionsHidden, setSuggestionsHidden] = useState(DISCOVERY_CACHE.suggestionsHidden);
  // View mode for results — list (default, easier scanning) vs. grid (visual browsing).
  const [viewMode, setViewMode] = useState(DISCOVERY_CACHE.viewMode);
  // Accept an external input ref so the App can focus the input *synchronously*
  // inside a tap gesture (iOS only opens the keyboard if focus happens in the
  // gesture, and route-driven mounts can't satisfy that).
  const localInputRef = useRef(null);
  const inputRef = inputRefProp || localInputRef;
  const scrollRef = useRef(null);

  // Persist state to the module-level cache as it changes so a round trip through
  // the PDP (search → tap product → back) lands the user where they left off.
  useEffect(() => { DISCOVERY_CACHE.term = term; }, [term]);
  useEffect(() => { DISCOVERY_CACHE.activeChip = activeChip; }, [activeChip]);
  useEffect(() => { DISCOVERY_CACHE.filter = filter; }, [filter]);
  useEffect(() => { DISCOVERY_CACHE.viewMode = viewMode; }, [viewMode]);
  useEffect(() => { DISCOVERY_CACHE.suggestionsHidden = suggestionsHidden; }, [suggestionsHidden]);

  // Commit handler — the only path out of the overlay into results.
  // Every commit routes to Discover, never directly to PDP.
  //   - Recognized term (matches a category keyword) → /spare-parts/{cat}.
  //     That's the canonical, indexable landing — better for SEO and gives
  //     the user the category's full chip/term/facet surface.
  //   - Free-text (unrecognized) → /search?q=... — DiscoverScreen still
  //     renders, just without a category scope. This route is noindexed
  //     (Google discourages indexing internal search results).
  // No more per-keystroke replaceState — typing stays local until commit.
  //
  // Car gate: every commit requires a selected car to scope fitment-correct
  // results. In the prototype CURRENT_CAR is a module constant so the gate
  // never fires; production wires hasCarSelected() to real user state and
  // sends the user to the car-select sheet when false (term held as
  // PENDING_SEARCH_QUERY, replayed on success; on abort the term stays in
  // the overlay input — "not now," not "abandoned").
  const commit = (rawTerm, source) => {
    const term = (rawTerm || "").trim();
    if (!term) return;
    if (!hasCarSelected()) {
      PENDING_SEARCH_QUERY = term;
      analytics.track("search_committed_gated", { term, source });
      navigate("/select-car");
      return;
    }
    const recognized = recognizeTermAsCategory(term);
    // Normalize the analytics shape so prod gets the same { cat, term? }
    // object regardless of whether the recognizer matched at cat-level
    // (string) or term-level (object).
    const recognizedShape = !recognized ? null
      : typeof recognized === "string" ? { cat: recognized }
      : recognized;
    analytics.track("search_committed", { term, source, recognized: recognizedShape });
    // Replace the /search overlay entry so back from Discover returns to
    // wherever the user was before opening search, not back into the overlay.
    // Flag the destination Discover to RESET filters — search is fresh
    // intent, drops cat AND user-applied facets. Cat-chip / term-chip nav
    // still smart-prunes (only invalid values drop, valid stay).
    // Also stash the typed term so the destination Discover can label
    // results with "نتائج البحث عن «{term}»" even on canonical cat URLs
    // where filters.q has been dropped.
    _searchCommitReset = true;
    _lastSearchQuery = term;
    if (!recognized) {
      navigateReplace("/search?q=" + encodeURIComponent(term));
    } else {
      // Recognized at cat OR term level — route to the canonical cat URL,
      // never the pre-selected term. Search ALWAYS lands on الكل so the
      // user sees the unified relevance-sorted result set first; chips
      // reorder by per-chip match-count against `searchedAs` so the most
      // relevant chip sits closest to الكل without forcing a filter.
      // Reasoning: pre-selecting a chip mid-rail (the old model) hides the
      // adjacent matches and makes the rail's anchor unpredictable.
      const cat = typeof recognized === "string" ? recognized : recognized.cat;
      navigateReplace("/spare-parts/" + cat);
    }
  };

  // Whenever the screen opens, focus the input + restore scroll. (For taps from
  // the home search bar, the App also focuses the input *during the gesture* so
  // iOS opens the keyboard — this useEffect is for the deep-link / programmatic
  // open paths.)
  // Also sync state to the URL: fresh entry (no ?q=) → reset cache + state. URL
  // carrying a query → it's either a back-from-PDP or a deep link → keep state.
  const wasOpenRef = useRef(false);
  useEffect(() => {
    if (isOpen && !wasOpenRef.current) {
      if (!initialQuery) {
        DISCOVERY_CACHE.term = "";
        DISCOVERY_CACHE.activeChip = "";
        DISCOVERY_CACHE.filter = "all";
        DISCOVERY_CACHE.viewMode = "row";
        DISCOVERY_CACHE.suggestionsHidden = false;
        DISCOVERY_CACHE.scrollY = 0;
        setQ("");
        setTerm("");
        setActiveChip("");
        setFilter("all");
        setViewMode("row");
        setSuggestionsHidden(false);
      } else if (initialQuery !== q) {
        setQ(initialQuery);
      }
      // preventScroll: true stops Chrome/Safari from scrolling the document to
      // make the focused input visible mid-animation (Brave defaults differently,
      // which is why it didn't show the bug). The modal animation already brings
      // the input into view; the browser's "helpful" scroll fights it.
      if (inputRef.current) inputRef.current.focus({ preventScroll: true });
      if (scrollRef.current) scrollRef.current.scrollTop = DISCOVERY_CACHE.scrollY;
    }
    wasOpenRef.current = isOpen;
  }, [isOpen, initialQuery]);

  // Caret-color trick: hide the text cursor while the modal is rising/falling.
  // Chrome/Safari render the caret on a separate compositing layer that doesn't
  // perfectly track the parent's animated transform, so the user sees the caret
  // "fly" across the screen. Brave keeps the caret on the same layer so it isn't
  // an issue there. Hiding the caret during animation makes all three feel equal.
  const [caretReady, setCaretReady] = useState(false);
  useEffect(() => {
    if (!isOpen) { setCaretReady(false); return; }
    setCaretReady(false);
    const t = setTimeout(() => setCaretReady(true), 340);
    return () => clearTimeout(t);
  }, [isOpen]);

  // Dismiss keyboard on scroll so the results aren't obscured.
  useEffect(() => {
    const node = scrollRef.current;
    if (!node) return;
    const onScroll = () => { if (inputRef.current) inputRef.current.blur(); };
    const t = setTimeout(() => node.addEventListener("scroll", onScroll, { passive: true }), 500);
    return () => { clearTimeout(t); node.removeEventListener("scroll", onScroll); };
  }, []);

  const query = q.trim().toLowerCase();
  const searching = query.length >= 2; // only search once there are 2+ characters
  // Results filter: activeChip (most specific) → term → typed query.
  const resultQuery = (activeChip || term || q).trim().toLowerCase();
  const matches = searching
    ? CATALOG.filter((p) => p.title.toLowerCase().includes(resultQuery))
    : [];
  // Chips: in term mode they're siblings of `term` (the broader keyword). In typing mode
  // they're typeahead off the current query. Order matches SEARCH_SUGGESTIONS so chips
  // and the result list stay aligned.
  const chipSeed = (term || q).trim().toLowerCase();
  const suggestions = searching && chipSeed
    ? SEARCH_SUGGESTIONS
        .filter((s) => {
          const sl = s.toLowerCase();
          return sl.includes(chipSeed) && sl !== chipSeed;
        })
        .slice(0, 6)
    : [];
  // Show make filters only for the makes actually present, and only when there's a real choice
  const makesPresent = ["oem", "alt"].filter((m) => matches.some((p) => p.make === m));
  const showFilters = makesPresent.length > 1;
  const results = matches.filter((p) => !showFilters || filter === "all" || p.make === filter);

  // Simulate a quick fetch so results show a brief spinner (as they would in production).
  // Fires only when the *base* search target changes — typing a new query or tapping a
  // popular term. Toggling the active chip within a term is treated as a client-side
  // facet (like the OEM/aftermarket filter): no re-fetch, no spinner, instant swap.
  useEffect(() => {
    if (!searching) { setLoading(false); return; }
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 300);
    return () => clearTimeout(t);
  }, [term, q, searching]);

  /* Normalized query — strips diacritics + unifies alef/yaa/taa so the
     typeahead matches "أمامي" against "امامي" etc. */
  const queryNorm = useMemo(() => normalizeArabic(q.trim()), [q]);

  /* Typeahead row builder. Branches off `searching` (q.trim() length >= 2).
     Pools (in order): matched recents > popular > catalog-keyword pool.
     Substring match on normalized text; within each source bucket, prefix
     matches rank above substring matches. Counts come from CATALOG title
     matches (a proxy for "how many products you'll see"). Zero-count items
     are dropped — tapping into a dead end is worse UX than a quietly-missing
     row. Cap at 5 total to keep the list comfortably above the keyboard. */
  const taSuggestions = useMemo(() => {
    if (!searching) return [];
    const out = [];
    const seen = new Set();
    /* Count helper. For category terms (e.g., "صدامات أمامية") we use the
       term's own match predicate from TERM_MATCH_FN — it handles plural /
       variant forms that title.includes alone would miss. For everything
       else (POPULAR_SEARCHES, curated extensions, recents), fall back to
       a substring match against the normalized title. */
    const countForTerm = (term, tn) => {
      const matchFn = TERM_MATCH_FN[term];
      if (matchFn) {
        return CATALOG.filter((p) => p.cat === "part" && matchFn(p)).length;
      }
      return CATALOG.filter((p) =>
        p.cat === "part" && normalizeArabic(p.title).includes(tn)
      ).length;
    };
    const rankedPool = (pool) =>
      pool
        .map((t) => ({ t, n: normalizeArabic(t) }))
        .filter((x) => x.n && x.n.includes(queryNorm))
        .sort((a, b) => {
          const aP = a.n.startsWith(queryNorm) ? 0 : 1;
          const bP = b.n.startsWith(queryNorm) ? 0 : 1;
          return aP - bP;
        })
        .map((x) => x.t);
    const tryAdd = (term, source) => {
      if (out.length >= 5) return;
      const tn = normalizeArabic(term);
      if (!tn || seen.has(tn)) return;
      const count = countForTerm(term, tn);
      if (count === 0) return;
      seen.add(tn);
      out.push({ term, source, count });
    };
    rankedPool(RECENT_SEARCHES).forEach((t) => tryAdd(t, "recent"));
    rankedPool(POPULAR_SEARCHES).forEach((t) => tryAdd(t, "popular"));
    rankedPool(SEARCH_KEYWORDS).forEach((t) => tryAdd(t, "catalog"));
    return out;
  }, [searching, queryNorm]);

  /* Drop the literal-search row when an exact-match suggestion is already
     in the list — two rows saying the same thing is just noise. */
  const hasExactSuggestion = useMemo(
    () => taSuggestions.some((s) => normalizeArabic(s.term) === queryNorm),
    [taSuggestions, queryNorm]
  );

  /* Bold the matched substring inside a term. Skip for 1-char queries
     (bolding every "ا" reads as visual noise). Our normalizeArabic
     preserves length (alef/yaa/taa collapses are 1-to-1), so the normalized
     index maps directly to the original string. If a deeper analyzer ever
     changes length, the bolded slice goes off — verify before extending. */
  const renderHighlight = (text, qN) => {
    if (!qN || qN.length < 2) return text;
    const tN = normalizeArabic(text);
    const idx = tN.indexOf(qN);
    if (idx < 0) return text;
    return (
      <>
        {text.slice(0, idx)}
        <b>{text.slice(idx, idx + qN.length)}</b>
        {text.slice(idx + qN.length)}
      </>
    );
  };

  return (
    <div
      className={"discovery-screen discovery-" + presentation + (isOpen ? " is-open" : "")}
      role={presentation === "modal" ? "dialog" : undefined}
      aria-modal={presentation === "modal" || undefined}
    >
      <div className="search-top">
        <div className="search-carctx">
          <span>البحث في قطع <b>{CURRENT_CAR.short}</b></span>
        </div>
        <div className="search-top-row">
          {/* role="search" + a single text input is the unambiguous WAI-ARIA
              pattern for a search box. Chrome respects this and won't try to
              autofill credentials. Honeypot fake password input is a fallback
              if Chrome still misbehaves on some builds. */}
          <form className="search-bar" role="search" onSubmit={(e) => e.preventDefault()} autoComplete="off">
            <button type="button" className="search-cancel" onClick={onClose}>إلغاء</button>
            <span className="search-bar-sep" aria-hidden="true"></span>
            <IconSearch />
            <input
              ref={inputRef}
              type="search"
              role="searchbox"
              name="q"
              autoComplete="off"
              autoCorrect="off"
              autoCapitalize="off"
              spellCheck="false"
              data-form-type="other"
              data-lpignore="true"
              data-1p-ignore="true"
              value={q}
              enterKeyHint="search"
              onChange={(e) => { setTerm(""); setActiveChip(""); setSuggestionsHidden(false); setFilter("all"); setQ(e.target.value); }}
              onKeyDown={(e) => {
                if (e.key !== "Enter") return;
                e.preventDefault();
                if (inputRef.current) inputRef.current.blur();
                commit(q, "typed");
              }}
              placeholder="ابحث باسم القطعة أو رقمها"
              aria-label="بحث"
              style={{ caretColor: caretReady ? undefined : "transparent" }}
            />
            {loading ? (
              <span className="search-spin" aria-label="جاري البحث" />
            ) : q ? (
              <button
                type="button"
                className="search-clear"
                onMouseDown={(e) => e.preventDefault()}
                onClick={() => {
                  setTerm(""); setActiveChip(""); setSuggestionsHidden(false); setFilter("all"); setQ("");
                  if (inputRef.current) inputRef.current.focus();
                }}
                aria-label="مسح"
              ><IconClose /></button>
            ) : null}
          </form>
        </div>
      </div>

      <div className="search-body" ref={scrollRef}>
        {!searching ? (
          /* Under 2 chars — show the static landing: recents + popular as
             chip rails. Same surface the overlay opens to from any entry. */
          <div className="search-pre">
            <div className="search-sec-title">آخر عمليات البحث</div>
            <div className="search-chips">
              {RECENT_SEARCHES.map((t) => (
                <button
                  key={t}
                  className="search-chip"
                  onClick={() => {
                    analytics.track("search_chip_clicked", { chip: t, source: "recent" });
                    commit(t, "recent");
                  }}
                >{t}</button>
              ))}
            </div>
            <div className="search-sec-title">الأكثر بحثاً</div>
            <div className="search-chips">
              {POPULAR_SEARCHES.map((t) => (
                <button
                  key={t}
                  className="search-chip"
                  onClick={() => {
                    analytics.track("search_chip_clicked", { chip: t, source: "popular" });
                    commit(t, "popular");
                  }}
                >{t}</button>
              ))}
            </div>
          </div>
        ) : (
          /* 2+ chars — live typeahead. Literal "ابحث عن «{q}»" row at top
             so any query has a visible commit path (zero-suggestion case
             rides on it too). Suggestion rows ranked recent > popular >
             catalog-keywords, prefix-matches above substring within each
             bucket, zero-count rows dropped, cap 5. */
          <div className="ta-list">
            {!hasExactSuggestion && q.trim() && (
              <button
                className="ta-row ta-literal"
                onClick={() => commit(q, "typed")}
              >
                <span className="ta-icon"><IconSearch /></span>
                <span className="ta-term">ابحث عن «<b>{q.trim()}</b>»</span>
                <span className="ta-arrow"><IconCornerArrow /></span>
              </button>
            )}
            {taSuggestions.map((s) => (
              <button
                key={s.source + ":" + s.term}
                className={"ta-row ta-row--" + s.source}
                onClick={() => {
                  analytics.track("search_chip_clicked", { chip: s.term, source: s.source });
                  commit(s.term, s.source);
                }}
              >
                <span className="ta-icon">
                  {s.source === "recent" ? <IconClock /> : <IconSearch />}
                </span>
                <span className="ta-term">{renderHighlight(s.term, queryNorm)}</span>
                <span className="ta-count">{s.count} قطعة</span>
                <span className="ta-arrow"><IconCornerArrow /></span>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
