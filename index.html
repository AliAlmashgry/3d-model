<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Camry 3D Viewer</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="index.css?v=2" />
  </head>
  <body>
    <div class="model-container">
      <div class="view-controls">
        <button id="prevViewBtn" aria-label="Previous View">&#10094;</button>
        <button id="nextViewBtn" aria-label="Next View">&#10095;</button>
      </div>

      <model-viewer
        id="carViewer"
        alt="Toyota Camry 3D model"
        src="assets/carnavigation.glb?v=15"
        autoplay
        camera-controls
        camera-orbit="0deg 75deg 70%"
        min-camera-orbit="-Infinity 10deg auto"
        max-camera-orbit="Infinity 90deg 140%"
        interpolation-decay="200"
        interaction-prompt="none"
        shadow-intensity="1"
        shadow-softness="0.75"
        exposure="0.75"
      ></model-viewer>

      <div class="parts-panel" id="partsPanel"></div>
    </div>

    <script type="module" src="index.js?v=4"></script>
  </body>
</html>
