<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Model Viewer Navigation</title>

    <!-- 1. Load the model-viewer component in head -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* prevents scrollbars/page-scroll while orbiting the model */
      }

      body {
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      }

      .model-container {
        height: 80vh;
        width: 80vw;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      model-viewer {
        height: 80%;
        width: 100%;
        border-radius: 12px;
        background-color: #ffffff;
        touch-action: none; /* hand drag gestures to model-viewer instead of the page */
      }

      .controls-panel {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid #000;
        background-color: #e0dddd;
        color: #000;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn:hover {
        background-color: #000;
        color: #fff;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn:disabled:hover {
        background-color: #e0dddd;
        color: #000;
      }

      .view-indicator {
        margin-top: 8px;
        font-size: 14px;
        color: #222;
      }

      /* --- MOBILE BREAKPOINT (up to 767px) --- */
      @media (max-width: 767px) {
        .model-container {
          height: 92vh;
          width: 96vw;
        }

        model-viewer {
          height: 62%;
        }

        .controls-panel {
          gap: 8px;
        }

        .btn {
          padding: 12px 14px;
          font-size: 13px;
          min-height: 48px; /* comfortable touch target */
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="model-container">
      <model-viewer
        id="carViewer"
        alt="3d model"
        src="assets/carnavigation.glb"
        autoplay
        camera-controls
        camera-orbit="0deg 75deg 105%"
        interpolation-decay="200"
        interaction-prompt="none"
        shadow-intensity="1"
        shadow-softness="0.3">
      </model-viewer>

      <div class="view-indicator" id="viewLabel">Current View: Front View</div>

      <!-- Navigation Buttons -->
      <div class="controls-panel">
        <button class="btn" id="prevBtn">← Previous View</button>
        <button class="btn" id="frontBtn">Front</button>
        <button class="btn" id="sideBtn">Side Profile</button>
        <button class="btn" id="topBtn">Top View</button>
        <button class="btn" id="nextBtn">Next View →</button>
        <button class="btn" onclick="playAnim('Hood_Open')">Open Hood</button>
        <button class="btn" onclick="playAnim('Driver_Door_Open')">Open Driver Door</button>
        <button class="btn" onclick="playAnim('Rear_Driver_Door_Open.001')">Rear Driver</button>
        <button class="btn" onclick="playAnim('Front_Passenger_Door_Open')">Passenger Door</button>
        <button class="btn" onclick="playAnim('Right_Rear_Door_Open')">Rear Passenger</button>
        <button class="btn" onclick="playAnim('Trunk_Open')">Trunk</button>
        <button class="btn" id="clayBtn" onclick="toggleClayMode()" disabled>Loading…</button>
      </div>
    </div>

    <script src="index.js">
    </script>
  </body>
</html>
